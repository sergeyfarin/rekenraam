services:
  postgres:
    restart: unless-stopped
    ports: !reset []
    environment: !override
      POSTGRES_DB: ${POSTGRES_DB:-rekenraam}
      POSTGRES_USER: ${POSTGRES_USER:-rekenraam}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

  api:
    restart: unless-stopped
    ports: !reset []
    environment: !override
      APP_HOST: 0.0.0.0
      APP_PORT: ${API_PORT:-8080}
      POSTGRES_DB: ${POSTGRES_DB:-rekenraam}
      POSTGRES_USER: ${POSTGRES_USER:-rekenraam}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-}
      FIRST_ADMIN_PASSWORD_FILE: /run/secrets/first_admin_password
      FIRST_ADMIN_DISPLAY_NAME: ${FIRST_ADMIN_DISPLAY_NAME:-Admin}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set the public origin}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      MFA_ENFORCED: ${MFA_ENFORCED:-false}
      MFA_SECRET_KEY: ${MFA_SECRET_KEY:?set a long random MFA secret key}
    secrets:
      - postgres_password
      - first_admin_password

  frontend:
    restart: unless-stopped
    ports: !override
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-3000}:80"

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
    environment:
      REKENRAAM_PUBLIC_HOST: ${REKENRAAM_PUBLIC_HOST:?set the public HTTPS host}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-rekenraam}
      PGUSER: ${POSTGRES_USER:-rekenraam}
      PGPASSWORD_FILE: /run/secrets/postgres_password
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    secrets:
      - postgres_password
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/backup_postgres.sh"]

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./secrets/postgres_password.txt}
  first_admin_password:
    file: ${FIRST_ADMIN_PASSWORD_FILE:-./secrets/first_admin_password.txt}

volumes:
  caddy_data:
  caddy_config:
