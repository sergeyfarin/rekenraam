services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - rekenraam_data:/data
    restart: unless-stopped

volumes:
  rekenraam_data:
