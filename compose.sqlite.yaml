services:
  postgres:
    profiles: ["postgres"]

  api:
    depends_on: !reset []
    environment: !override
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      DATABASE_URL: sqlite+aiosqlite:////data/rekenraam.sqlite3
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-}
      FIRST_ADMIN_DISPLAY_NAME: ${FIRST_ADMIN_DISPLAY_NAME:-Admin}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      MFA_ENFORCED: ${MFA_ENFORCED:-false}
      MFA_SECRET_KEY: ${MFA_SECRET_KEY:-dev-only-change-me}
    volumes:
      - sqlite_data:/data

volumes:
  sqlite_data:
