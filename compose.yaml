services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 16888
      SQLITE_PATH: /data/rekenraam.sqlite3
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:16888,http://127.0.0.1:16888}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      MFA_ENFORCED: ${MFA_ENFORCED:-false}
      MFA_SECRET_KEY: ${MFA_SECRET_KEY:-dev-only-change-me}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-}
      FIRST_ADMIN_PASSWORD_FILE: ${FIRST_ADMIN_PASSWORD_FILE:+/app-secrets/first_admin_password.txt}
      FIRST_ADMIN_DISPLAY_NAME: ${FIRST_ADMIN_DISPLAY_NAME:-Admin}
    ports:
      - "${APP_PORT:-16888}:16888"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:16888/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - rekenraam_data:/data
      - ./backups:/backups
      - ./secrets:/app-secrets:ro
    restart: unless-stopped

volumes:
  rekenraam_data:
