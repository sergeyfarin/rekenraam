root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/rekenraam ./cmd/rekenraam"
entrypoint = ["./tmp/rekenraam", "serve"]
full_bin = "APP_ENV=development TRUST_PROXY_HEADERS=1 TRUSTED_PROXY_CIDRS=127.0.0.0/8,::1/128 ./tmp/rekenraam serve"
include_ext = ["go", "sql", "tpl", "tmpl", "html"]
exclude_dir = ["tmp", "vendor", "node_modules", "var", "internal/web/dist"]
delay = 1000
stop_on_error = true
send_interrupt = true
kill_delay = "500ms"

[log]
time = true
