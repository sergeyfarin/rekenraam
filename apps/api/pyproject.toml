[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rekenraam-api"
version = "0.1.0"
description = "Rekenraam self-hosted API"
requires-python = ">=3.14"
dependencies = [
  "alembic==1.18.4",
  "aiosqlite==0.22.1",
  "argon2-cffi==25.1.0",
  "fastapi==0.136.1",
  "httpx==0.28.1",
  "pydantic==2.13.3",
  "pydantic-settings==2.14.0",
  "python-calamine>=0.6.2",
  "sqlalchemy[asyncio]==2.0.49",
  "uvicorn[standard]==0.47.0",
]

[project.optional-dependencies]
dev = [
  "pytest-cov==7.0.0",
  "pyright==1.1.409",
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.12",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "RUF"]
ignore = [
  # FastAPI dependency declarations intentionally call Depends at definition time.
  "B008",
  # The existing API, migration, and test codebase has not had a line-wrap migration.
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  # Tests use broad exception assertions for frozen model mutation guards.
  "B017",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
cache_dir = ".pytest_cache_local"

[tool.coverage.run]
branch = true
source = ["rekenraam_api"]
omit = [
  "src/rekenraam_api.egg-info/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.coverage.html]
directory = ".coverage_html"
