services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      REKENRAAM_PUBLIC_HOST: ${REKENRAAM_PUBLIC_HOST:?set the public HTTPS host}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
