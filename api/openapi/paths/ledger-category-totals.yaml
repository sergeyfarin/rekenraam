get:
  security:
    - CookieSession: []
    - PersonalAccessToken: []
  x-personal-access-token-scope: "reports:read"
  summary: Read category totals
  parameters:
    - in: query
      name: after_date
      schema:
        type: string
        format: date
    - in: query
      name: before_date
      description: Defaults to today in the authenticated owner's saved time zone when omitted.
      schema:
        type: string
        format: date
    - in: query
      name: status
      schema:
        $ref: "../openapi.yaml#/components/schemas/LedgerStatus"
    - in: query
      name: category_type
      schema:
        $ref: "../openapi.yaml#/components/schemas/CategoryType"
  responses:
    "403":
      description: Personal-access token does not grant this scope
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "200":
      description: Category totals grouped by commodity
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/CategoryTotalsResponse"
    "400":
      description: Invalid query
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
