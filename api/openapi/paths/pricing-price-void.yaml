post:
  summary: Void a price observation
  description: >-
    Retires a price observation so it stops being used for valuations, without
    deleting or overwriting it. A price is corrected by superseding or voiding,
    never edited in place. The void cascades to every still-active observation
    triangulated from this one, because a derived rate carries the same
    poisoned number under a different id. If the cascade cannot reach the end
    of the derivation graph within the traversal bound, the whole void is
    refused with 409 and nothing is voided: a partial cascade would leave
    derived valuations active after their source was retired. Voiding is not
    idempotent: a second void would overwrite the first reason and returns 409.
  parameters:
    - in: path
      name: price_id
      required: true
      schema:
        type: integer
        format: int64
    - in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
      description: Session-bound CSRF token for authenticated mutating requests.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/PriceObservationVoidRequest"
  responses:
    "200":
      description: >-
        Every observation the void retired: the requested one first, then
        anything derived from it.
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/PriceObservationVoidResponse"
    "400":
      description: Invalid price id or missing void reason
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: CSRF validation failed
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Price observation not found
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: >-
        Price observation is already voided, or its derived observations go
        deeper than the maximum cascade depth and nothing was voided
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "500":
      description: Internal server error
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
