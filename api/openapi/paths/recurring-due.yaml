get:
  summary: List recurring drafts and blocked occurrences
  description: >
    One composed page ordered by occurrence_date and id. Generated items use current draft amounts, blocked items use the current template; positive debits and signed negative credits are separate exact totals by commodity, never a converted total. Posted, voided, deleted and skipped items are excluded. Disabled and archived templates do not hide outstanding review items.
  parameters:
    - in: query
      name: cursor
      schema:
        type: string
    - in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    "200":
      description: Success
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/RecurringDueResponse'
    "400":
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    "401":
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    "404":
      description: Not found
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    "409":
      description: State changed or action not allowed
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    "422":
      description: Exact quantity overflow
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    "503":
      description: Database temporarily busy
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
