post:
  summary: Start account reconciliation
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/AccountID"
    - in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/StartReconciliationRequest"
  responses:
    "201":
      description: Reconciliation session started
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ReconciliationSessionResponse"
    "400":
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
