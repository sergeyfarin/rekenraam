get:
  summary: Read a transaction
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/TransactionID"
  responses:
    "200":
      description: Transaction
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/TransactionResponse"
    "401":
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Transaction not found
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
patch:
  summary: Update a transaction
  description: PATCH on a draft appends a new draft version. PATCH on a posted transaction appends a new posted version.
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/TransactionID"
    - in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/TransactionRequest"
  responses:
    "200":
      description: Transaction updated
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/TransactionResponse"
    "400":
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Transaction not found
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
delete:
  summary: Delete a never-posted draft transaction
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/TransactionID"
    - in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
  responses:
    "204":
      description: Draft deleted
    "401":
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Transaction not found
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: Posted or voided transaction cannot be deleted
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
