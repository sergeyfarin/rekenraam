post:
  summary: Correct a posted spin-off
  description: >-
    Posts the exact inverse of the spin-off journal and a replacement spin-off
    with corrected terms (date, ratio, basis fraction, new instrument,
    receiving holding or evidence) for the same parent holding and instrument,
    in one audited database transaction (#183). The replacement takes the
    replaced spin-off's correction-root same-day slot and entitles every lot
    open there; the parent and every new holding replay, so later decisions
    are revised or named. Unchanged terms are refused. A non-empty
    gain change set requires the preview's exact gain_impact_acknowledgement.
  parameters:
    - in: path
      name: transaction_id
      required: true
      schema: { type: integer, format: int64 }
    - in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/SpinOffReplacementRequest"
  responses:
    "201":
      description: Spin-off replaced and holdings replayed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/SpinOffReplacementResponse"
    "400":
      description: Invalid request, unchanged terms or missing reason
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Posted spin-off not found
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: Already corrected (INVESTMENT_SPIN_OFF_ALREADY_CORRECTED), changed (INVESTMENT_SPIN_OFF_CHANGED), no holdings at the corrected slot (INVESTMENT_SPIN_OFF_NO_HOLDINGS), INVESTMENT_TRANSFER_DEPENDENCY names a later operation the correction would make impossible, position side conflict, reconciliation override required, or gain changes not acknowledged
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "422":
      description: Corrected ratio not representable at the new instrument's scale (INVESTMENT_SPIN_OFF_FRACTION_UNREPRESENTABLE)
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
