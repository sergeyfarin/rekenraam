post:
  summary: Transfer an investment holding between holding accounts
  description: >-
    Moves selected long lots with their own basis (individual-lot source) or a
    quantity at the dated average-cost pool rate (average-cost source), without
    cash or gain. Destination lots keep source lineage and original dates.
  parameters:
    - in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/InternalTransferRequest"
  responses:
    "201":
      description: Balanced transfer and linked destination lots recorded atomically
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/InternalTransferResponse"
    "400":
      description: Invalid transfer facts
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: >-
        Reconciliation override or gain acknowledgement required, the allocation
        does not match the source method (INVESTMENT_TRANSFER_POOL_REQUIRED /
        INVESTMENT_TRANSFER_POOL_UNAVAILABLE), or a dated lot dependency conflicts
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
