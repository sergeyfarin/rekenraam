post:
  summary: Transfer selected investment lots between holding accounts
  description: Moves positive explicit long-lot quantities with their carried basis, without cash or gain.
  parameters:
    - in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/InternalTransferRequest"
  responses:
    "201":
      description: Balanced transfer and linked destination lots recorded atomically
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/InternalTransferResponse"
    "400":
      description: Invalid transfer facts
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: Reconciliation override required or dated lot dependency conflicts
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
