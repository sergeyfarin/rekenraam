post:
  summary: Preview a cash-and-stock merger
  description: >
    Runs the complete merger writer in a rolled-back transaction. Returns every
    link (old and new quantity, realized and carried basis, cash share and
    original date), the per-currency totals and result, and every active
    checkpoint the writer would invalidate. No durable change or temporary ID
    escapes; commit rechecks everything.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/CashStockMergerRequest"
  responses:
    "413":
      $ref: "../openapi.yaml#/components/responses/JSONBodyTooLarge"
    "200":
      description: Merger preview computed (no mutation)
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/CashStockMergerPreviewResponse"
    "400":
      description: Invalid merger facts
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: INVESTMENT_EXCHANGE_NO_HOLDINGS, INVESTMENT_EVENT_OUT_OF_ORDER or INVESTMENT_POSITION_SIDE_CONFLICT
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "422":
      description: INVESTMENT_EXCHANGE_FRACTION_UNREPRESENTABLE
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
