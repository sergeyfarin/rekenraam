get:
  security:
    - CookieSession: []
    - PersonalAccessToken: []
  x-personal-access-token-scope: "ledger:read"
  summary: List transactions
  parameters:
    - in: query
      name: account_id
      schema:
        type: integer
        format: int64
    - in: query
      name: category_id
      description: Filter to transactions that have a posting to this income or expense account. Returns VALIDATION_FAILED if the account is not income or expense class.
      schema:
        type: integer
        format: int64
    - in: query
      name: commodity_id
      description: Filter to transactions with a posting in this commodity or a cash-dividend operation fact naming it as the paying instrument. Includes linked correction journals, gross income and withholding.
      schema:
        type: integer
        format: int64
    - in: query
      name: payee_id
      schema:
        type: integer
        format: int64
    - in: query
      name: q
      description: Literal free-text phrase; FTS operators are not interpreted. NUL (U+0000) is rejected with HTTP 400 VALIDATION_FAILED.
      schema:
        type: string
    - in: query
      name: status
      schema:
        $ref: "../openapi.yaml#/components/schemas/TransactionStatus"
    - in: query
      name: kind
      schema:
        $ref: "../openapi.yaml#/components/schemas/TransactionKind"
    - in: query
      name: needs_review
      schema:
        type: boolean
    - in: query
      name: after_date
      schema:
        type: string
        format: date
    - in: query
      name: before_date
      schema:
        type: string
        format: date
    - in: query
      name: category_type
      description: >
        Filter to transactions with a posting to an income or expense category,
        matching the direction a spending report was run in. The class is read
        from the account version in effect on the posting's entry date.
      schema:
        type: string
        enum: [income, expense]
    - in: query
      name: date_basis
      description: >
        Which date after_date/before_date apply to. `transaction` (the default)
        uses the transaction's own date. `entry` uses journal-entry dates, the
        basis the reports sum on, and requires one entry to satisfy the range
        together with category_id, category_type, account_id (some posting of
        that entry is on the account) and commodity_id — so a drill-down from
        a spending row lists exactly that row's transactions.
      schema:
        type: string
        enum: [transaction, entry]
        default: transaction
    - in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 500
    - in: query
      name: cursor
      schema:
        type: string
  responses:
    "403":
      description: Personal-access token does not grant this scope
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "200":
      description: Transactions
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/TransactionsResponse"
    "400":
      description: Invalid query
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
post:
  summary: Create a transaction
  description: Manual creation saves directly as posted. A draft status is rejected with TRANSACTION_DRAFT_NOT_USER_CREATABLE; persisted drafts belong to system producers and their review workflows.
  parameters:
    - in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/TransactionRequest"
  responses:
    "201":
      description: Transaction created
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/TransactionResponse"
    "400":
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
