post:
  summary: Replace a posted payment in lieu of a dividend
  description: >-
    Posts the inverse and the corrected payment — amount owed, expense
    account and recovery — under one audit event (#255). The replacement
    keeps the short holding, instrument, ex-date, payment date, cash account
    and currency (omitted holding, instrument or ex-date are taken from the
    original), and re-checks the short entitlement inside the write.
  parameters:
    - in: path
      name: transaction_id
      required: true
      schema: { type: integer, format: int64 }
    - in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/InvestmentPaymentInLieuReplacementRequest"
  responses:
    "413":
      $ref: "../openapi.yaml#/components/responses/JSONBodyTooLarge"
    "201":
      description: Payment in lieu replaced
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/InvestmentDividendReplacementResponse"
    "400":
      description: Invalid request or missing reason
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Posted payment in lieu not found
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: Already corrected (INVESTMENT_PAYMENT_IN_LIEU_ALREADY_CORRECTED), changed (INVESTMENT_PAYMENT_IN_LIEU_CHANGED), or reconciliation override required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "422":
      description: The holding is no longer short at the close before the ex-date (INVESTMENT_PAYMENT_IN_LIEU_NOT_SHORT)
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
