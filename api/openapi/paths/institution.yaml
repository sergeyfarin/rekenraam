get:
  security:
    - CookieSession: []
    - PersonalAccessToken: []
  x-personal-access-token-scope: "ledger:read"
  summary: Read an institution
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/InstitutionID"
  responses:
    "403":
      description: Personal-access token does not grant this scope
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "200":
      description: Institution
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/InstitutionResponse"
    "400":
      description: Invalid request
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Institution not found
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "500":
      description: Internal server error
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
delete:
  summary: Delete an unused institution
  description: Institutions referenced by any account history cannot be hard deleted.
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/InstitutionID"
    - in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
      description: Session-bound CSRF token for authenticated mutating requests.
  responses:
    "204":
      description: Institution deleted
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
    "400":
      description: Invalid institution id
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Institution not found
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: Institution has account references
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
patch:
  summary: Update an institution by creating a new version
  description: "Partial update: omitted fields keep the values of the version in effect on effective_from. Institution fields are descriptive, so any date on or after the first version is accepted; a correction dated before the latest version governs only until the next version and keeps the lifecycle in effect on its date. The response is the institution as it stands today, which for such a correction is not the version just written; the versions endpoint lists it."
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/InstitutionID"
    - in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
      description: Session-bound CSRF token for authenticated mutating requests.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/InstitutionUpdateRequest"
  responses:
    "413":
      $ref: "../openapi.yaml#/components/responses/JSONBodyTooLarge"
    "200":
      description: Institution updated
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/InstitutionResponse"
    "400":
      description: Invalid request body or validation failure
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Institution not found
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "500":
      description: Internal server error
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      $ref: "../openapi.yaml#/components/responses/ReferenceVersionConflict"
      description: REFERENCE_VERSION_BEFORE_FIRST before the first version; CONFLICT for a stale edit.
