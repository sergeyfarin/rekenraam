post:
  summary: Record cash in lieu of a fraction
  description: >-
    Disposes the fractional share (quantity below one) that a split, share
    exchange, cash-and-stock merger or spin-off left, for cash (T-147, #181):
    an ordinary long disposal under the holding's election, with the cash as
    proceeds. The security legs post on disposal_on and the cash on
    payment_on, as separate dated journal entries of one transaction. The
    disposal is linked to the operation it settles, which must be effective
    and dated on or before disposal_on. A split's fraction is in its own
    holding; the other actions' fraction is the new instrument in their
    destination holding (INVESTMENT_CASH_IN_LIEU_SPLIT_UNAVAILABLE
    otherwise). That operation cannot then be corrected until the cash in
    lieu is. The realized result comes from replay at the disposal slot; it is
    never a dividend.
  parameters:
    - in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/CashInLieuRequest"
  responses:
    "413":
      $ref: "../openapi.yaml#/components/responses/JSONBodyTooLarge"
    "201":
      description: Disposal, both dated journal entries, settlement link and audit recorded atomically
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/InvestmentTradeResponse"
    "400":
      description: Invalid facts
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: Reconciliation override or gain acknowledgement required, settled operation unavailable, insufficient lots or out of order
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
