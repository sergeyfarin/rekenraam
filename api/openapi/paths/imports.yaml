get:
  summary: List import batches
  parameters:
    - in: query
      name: limit
      schema:
        type: integer
        minimum: 1
    - in: query
      name: cursor
      schema:
        type: string
  responses:
    "200":
      description: Import batches
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ListImportBatchesResponse"
    "401":
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
post:
  summary: Start import batch
  description: >-
    Content-negotiated by request body. multipart/form-data starts the
    existing file-upload pipeline synchronously (201). application/json
    `{ source, connection_id }` enqueues a durable online fetch on the named
    connection and returns immediately (202); poll GET /imports/{batch_id}
    until source_meta's fetch_status is "ready".
    Multipart files are limited to 50 MiB (52,428,800 bytes), inclusive;
    the entire multipart request is limited to 51 MiB (53,477,376 bytes).
    Excessive multipart fields, parts or headers are also rejected.
    Oversized uploads are rejected before parsing or creating a batch.
  parameters:
    - in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required:
            - file
          properties:
            file:
              type: string
              format: binary
              description: At most 50 MiB (52,428,800 bytes), inclusive. Oversized files are never truncated.
            profile_id:
              type: integer
              format: int64
              description: Required for bank CSV; selects a saved column-mapping profile.
            format:
              type: string
              enum: [crypto_csv]
              description: Explicit crypto CSV mode. Requires existing holding and currency settlement accounts; no profile. UTF-8 comma CSV columns date,side,quantity,amount,external_ref,memo; unsigned dot decimals, BUY/SELL only, ISO dates. Each reference is unique within the chosen holding/cash pair. Preview writes no instruments, lots or journals.
            holding_account_id:
              type: integer
              format: int64
              description: Required for crypto_csv; an active crypto holding.
            cash_account_id:
              type: integer
              format: int64
              description: Required for crypto_csv; an active currency asset account.
            text_encoding:
              type: string
              default: auto
              description: QIF or CSV text encoding. Use auto for confidence-gated detection, or the same named encoding used during CSV analysis.
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/StartOnlineImportRequest"
  responses:
    "201":
      description: Import batch staged for preview (multipart file upload)
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/StartImportResponse"
    "202":
      description: Online fetch enqueued; batch created in "fetching" state
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/StartOnlineImportResponse"
    "400":
      description: Invalid multipart form, missing file, or unsupported file/source
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Import connection not found (online branch only)
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: An import fetch is already in progress for this connection
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "413":
      description: >-
        REQUEST_TOO_LARGE for a JSON request body exceeding 1 MiB (1,048,576 bytes),
        including trailing whitespace. IMPORT_UPLOAD_TOO_LARGE for multipart
        files exceeding 50 MiB (52,428,800 bytes), entire multipart requests
        exceeding 51 MiB (53,477,376 bytes), or excessive multipart resources.
        Neither refusal creates a batch.
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "503":
      description: REKENRAAM_SECRET_KEY is not configured (online branch only)
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
