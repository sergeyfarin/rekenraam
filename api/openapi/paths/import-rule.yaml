parameters:
  - in: path
    name: rule_id
    required: true
    schema:
      type: integer
      format: int64
patch:
  summary: Update a preview-time import rule
  parameters:
    - in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/UpdateImportRuleRequest"
  responses:
    "200":
      description: Rule updated
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ImportRuleResponse"
    "400":
      description: Invalid rule or target
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Rule not found
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
delete:
  summary: Delete a preview-time import rule
  parameters:
    - in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
  responses:
    "204":
      description: Rule deleted
    "401":
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Rule not found
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
