post:
  summary: Replace a posted long buy, including a source-linked imported fill, and replay dependent sales
  description: >-
    Posts an inverse and corrected buy, replays later long disposals using
    their recorded basis methods, retires the original trade price, and updates
    reconciliation under one audit event. The original journal and lot facts
    remain audit history. The replacement may change the trade date, holding
    account, instrument or cost currency (T-116): the inverse keeps every
    original journal date, and the source and new positions replay in the same
    transaction. A dependency the move breaks — a later disposal, a
    specific-lot election, or a transfer of the acquisition — is named with
    INVESTMENT_BUY_DEPENDENCY and nothing is written. An imported buy needs an immutable committed
    source identity effect pointing to that operation; the original source row
    and dedupe fingerprint remain unchanged.
    A non-empty gain change set requires the preview's exact gain_impact_acknowledgement: INVESTMENT_GAIN_IMPACT_ACKNOWLEDGEMENT_REQUIRED or _STALE (409) otherwise, with nothing written (T-126).
  parameters:
    - in: path
      name: transaction_id
      required: true
      schema: { type: integer, format: int64 }
    - in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/InvestmentBuyReplacementRequest"
  responses:
    "201":
      description: Buy replaced and dependent long position replayed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/InvestmentBuyReplacementResponse"
    "400":
      description: Invalid replacement or missing reason
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Posted long buy not found
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: Buy already corrected, imported without source identity, changed, dependent sale impossible, or reconciliation override required; or committed-disposal gain changes not acknowledged (INVESTMENT_GAIN_IMPACT_ACKNOWLEDGEMENT_REQUIRED / _STALE)
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
