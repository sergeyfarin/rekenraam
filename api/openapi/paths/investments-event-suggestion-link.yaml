post:
  summary: Link a provider dividend suggestion to an owner-recorded payment (posts nothing)
  description: >-
    For a dividend suggestion the transaction must be an effective posted cash dividend of the suggestion's
    instrument dated from the ex-date up to 90 days after it. For a payment-in-lieu suggestion (#258) it must be
    an effective posted payment in lieu of the suggestion's instrument, for one of the proposal's
    holding_account_ids, with the event's ex-date; a cash dividend is never linked to it, nor a payment in lieu
    to a dividend suggestion. Either way it must not already be admitted by another provider event. The link
    and the event status commit atomically; later fetches of the same event stay duplicates.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/LinkEventSuggestionRequest"
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/SuggestionID"
    - in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
      description: Session-bound CSRF token for authenticated mutating requests.
  responses:
    "413":
      $ref: "../openapi.yaml#/components/responses/JSONBodyTooLarge"
    "200":
      description: Suggestion ignored
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/InvestmentEventSuggestionResponse"
    "400":
      description: Not a linkable dividend or payment in lieu for this event
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Suggestion not found
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "500":
      description: Internal server error
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
