post:
  summary: Atomically retire reviewed dependencies and append a manual same-pair/date replacement
  responses:
    "413":
      $ref: "../openapi.yaml#/components/responses/JSONBodyTooLarge"
    '201':
      description: Atomically retire reviewed dependencies and append a manual same-pair/date replacement
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/CorrectPriceResponse
      headers:
        X-Request-ID:
          $ref: ../openapi.yaml#/components/headers/XRequestID
    '400':
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      headers:
        X-Request-ID:
          $ref: ../openapi.yaml#/components/headers/XRequestID
    '401':
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      headers:
        X-Request-ID:
          $ref: ../openapi.yaml#/components/headers/XRequestID
    '403':
      description: CSRF or same-origin validation failed
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      headers:
        X-Request-ID:
          $ref: ../openapi.yaml#/components/headers/XRequestID
    '404':
      description: Observation not found
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      headers:
        X-Request-ID:
          $ref: ../openapi.yaml#/components/headers/XRequestID
    '409':
      description: Observation retired, dependency graph changed or cascade exceeds depth bound
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      headers:
        X-Request-ID:
          $ref: ../openapi.yaml#/components/headers/XRequestID
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      headers:
        X-Request-ID:
          $ref: ../openapi.yaml#/components/headers/XRequestID
    '422':
      description: Coefficient exceeds stored price range
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      headers:
        X-Request-ID:
          $ref: ../openapi.yaml#/components/headers/XRequestID
  parameters:
    - in: path
      name: price_id
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    - in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../openapi.yaml#/components/schemas/CorrectPriceRequest
