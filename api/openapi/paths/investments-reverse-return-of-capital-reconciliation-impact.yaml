post:
  summary: Preview reconciliation and gain impact of a return of capital reversal
  description: >-
    Runs the reversal writer and its replay of the holding in a rolled-back
    transaction and returns the reconciliation checkpoints it would invalidate
    and the gain_impact of later disposals whose basis it restores; pass its
    acknowledgement to the command.
  parameters:
    - in: path
      name: transaction_id
      required: true
      schema: { type: integer, format: int64 }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/InvestmentBuyReversalRequest"
  responses:
    "200":
      description: Reconciliation impact computed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ReconciliationImpactResponse"
    "400":
      description: Invalid request or missing reason
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Posted cash return of capital not found
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: Already corrected, imported without its committed source, or changed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
