post:
  summary: Preview which reconciliation checkpoints a reinvested dividend would invalidate
  description: >
    Executes the proposed reinvested dividend and dependent replay through the actual
    writer in a rolled-back transaction. Returns every active checkpoint the
    writer would invalidate, including later checkpoints. Impossible dependent
    disposals or changed carried-basis transfers return INVESTMENT_BUY_DEPENDENCY.
    No durable changes or temporary operation/lot IDs escape. Review the named
    checkpoints before committing with reconciliation_override=true; commit
    rechecks dependencies and reconciliation. Revised gains are not yet disclosed.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/ReinvestedDividendRequest"
  responses:
    "200":
      description: Reconciliation impact computed (no mutation)
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ReconciliationImpactResponse"
    "400":
      description: Invalid request body or validation failure
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: Dependent replay cannot complete (INVESTMENT_BUY_DEPENDENCY or INVESTMENT_EVENT_OUT_OF_ORDER)
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "500":
      description: Internal server error
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
