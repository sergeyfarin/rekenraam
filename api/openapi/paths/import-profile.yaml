parameters:
  - in: path
    name: profile_id
    required: true
    schema:
      type: integer
      format: int64
patch:
  summary: Update a saved CSV mapping profile
  parameters:
    - in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/UpdateImportProfileRequest"
  responses:
    "200":
      description: Profile updated
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ImportProfileResponse"
    "400":
      description: Invalid mapping
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Profile not found
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
delete:
  summary: Delete a saved CSV mapping profile
  parameters:
    - in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
  responses:
    "204":
      description: Profile deleted; historical import batches are retained
    "401":
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Profile not found
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
