post:
  summary: Finish reconciliation session
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ReconciliationID"
    - in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/TransactionLifecycleRequest"
  responses:
    "413":
      $ref: "../openapi.yaml#/components/responses/JSONBodyTooLarge"
    "200":
      description: Reconciliation finished
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ReconciliationSessionResponse"
    "400":
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: >-
        Reconciliation is closed, unbalanced, or posting selection is invalid
        (CONFLICT); or its starting checkpoint is no longer the account's
        latest active checkpoint because it was invalidated or voided, or
        another session finished from it (RECONCILIATION_START_STALE). A
        stale session is voided and a new reconciliation started.
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
