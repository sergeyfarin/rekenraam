post:
  summary: Archive a template without changing its occurrences or drafts
  parameters:
    - in: path
      name: template_id
      required: true
      schema:
        type: integer
        minimum: 1
    - in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
  responses:
    "200":
      description: Success
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/RecurringTemplateResponse'
    "400":
      description: Invalid request or template
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    "401":
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    "403":
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    "404":
      description: Template not found
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    "409":
      description: Archived template or concurrent modification
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    "422":
      description: Exact quantity overflow
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    "503":
      description: Database temporarily busy
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
