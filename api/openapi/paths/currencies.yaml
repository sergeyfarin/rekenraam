get:
  summary: List current currency commodities
  responses:
    "200":
      description: Current currencies
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/CurrenciesResponse"
    "401":
      description: Authentication is required
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "500":
      description: Internal server error
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
post:
  summary: Add a catalog currency to the current book
  parameters:
    - in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
      description: Session-bound CSRF token for authenticated mutating requests.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/CreateCurrencyRequest"
  responses:
    "201":
      description: Currency created
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/CurrencyResponse"
    "400":
      description: Invalid request body or validation failure
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Catalog currency not found
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: Currency already exists
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "500":
      description: Internal server error
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
