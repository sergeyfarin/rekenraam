get:
  summary: Read spending or income totals ranked by category or payee
  description: >
    Ranks posted income/expense (category) postings over an inclusive date range
    by one dimension. Transfers need no explicit exclusion: an asset-to-asset
    transfer has no category posting, so it cannot enter this basis. Drafts,
    voided transactions, and soft-deleted transactions are never included.
    Repeated ID parameters are an OR-set within that dimension and combine with
    AND across dimensions.
  parameters:
    - in: query
      name: start_date
      required: true
      schema:
        type: string
        format: date
    - in: query
      name: end_date
      required: true
      schema:
        type: string
        format: date
    - in: query
      name: group_by
      required: true
      schema:
        type: string
        enum: [category, payee]
    - in: query
      name: mode
      description: >
        Defaults to spending. Income is a distinct, explicitly selected mode and
        is labelled as income, never folded into a spending number.
      schema:
        type: string
        enum: [spending, income]
        default: spending
    - in: query
      name: category_id
      description: >
        Repeatable. Restricts the report to these category accounts. A category
        is an income or expense account, so an id naming any other account is
        VALIDATION_FAILED rather than an empty report.
      schema:
        type: array
        items:
          type: integer
          format: int64
      style: form
      explode: true
    - in: query
      name: payee_id
      description: Repeatable. Restricts the report to these payees.
      schema:
        type: array
        items:
          type: integer
          format: int64
      style: form
      explode: true
    - in: query
      name: account_id
      description: >
        Repeatable counterpart filter. Keeps category postings whose *journal
        entry* also touches one of these accounts — "what did I spend from
        here" — without inferring a bank-statement classification. Matching per
        entry rather than per transaction means a multi-entry transaction whose
        category posting and filtered account sit in different entries does not
        count, which is also what keeps this in step with the cashflow report.
        Asset and liability accounts only, like every report's account filter;
        anything else is VALIDATION_FAILED.
      schema:
        type: array
        items:
          type: integer
          format: int64
      style: form
      explode: true
    - in: query
      name: include_descendants
      description: >
        Expands each account_id to itself plus every descendant, using the
        account versions in effect on the reporting date.
      schema:
        type: boolean
        default: false
    - in: query
      name: commodity_id
      description: Repeatable. Restricts the report to postings in these commodities.
      schema:
        type: array
        items:
          type: integer
          format: int64
      style: form
      explode: true
  # Group order: one commodity ranks the report — the one present in the most
  # groups, ties broken by the lowest commodity id — and groups are ordered by
  # their total in that commodity. A group with no total in it sorts after those
  # that have one, by a stable identity. Unlike commodities are never compared,
  # so the order is not a valuation claim; that waits on a reporting currency.
  responses:
    "200":
      description: Exact per-commodity totals per group, ranked, with the effective query
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/SpendingReportResponse"
    "400":
      description: Invalid report query
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "422":
      description: Report arithmetic exceeded exact quantity limits
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
