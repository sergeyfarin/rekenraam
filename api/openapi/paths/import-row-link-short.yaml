post:
  summary: Link a pending unsupported Trading 212 row to a recorded short sale or cover
  description: >
    The owner asserts that the row is the source of an existing short
    operation. The row's dedupe identity is admitted with that operation as its
    only effect and the row is marked committed, under one audit event; no
    journal, lot or disposal is written, and a retry or re-fetch of the same
    fill is a duplicate. The operation must be effective, of the row's side and
    security, not already linked (directly or through a correction), and agree
    with every known source date, quantity, signed net cash and currency,
    mapped holding account and connection cash account. The row and operation
    are rechecked inside the write.
  parameters:
    - in: path
      name: batch_id
      required: true
      schema: { type: integer, format: int64 }
    - in: path
      name: row_id
      required: true
      schema: { type: integer, format: int64 }
    - in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/ImportLinkShortRequest"
  responses:
    "413":
      $ref: "../openapi.yaml#/components/responses/JSONBodyTooLarge"
    "204":
      description: Row linked to the recorded short operation
    "400":
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Import batch not found
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: >
        IMPORT_SHORT_LINK_UNAVAILABLE — the row or operation can no longer be linked;
        IMPORT_SHORT_LINK_CHANGED — the operation was corrected after review;
        IMPORT_SHORT_LINK_MISMATCH — a known source fact disagrees with the operation
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
