post:
  summary: Preview an unsaved recurring schedule
  description: Read-only enumeration of the next five configured dates at or after owner-local today and starts_on. Uses only scheduling fields of the patch; creates no template, draft, audit or occurrence. Ignores persisted skipped dates because the schedule has not been saved.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../openapi.yaml#/components/schemas/RecurringTemplatePatch'
  responses:
    "200":
      description: Success
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/RecurringPreviewResponse"
    "400":
      description: Request failed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Request failed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "503":
      description: Request failed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
