get:
  security:
    - CookieSession: []
    - PersonalAccessToken: []
  x-personal-access-token-scope: "ledger:read"
  summary: Read a payee
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/PayeeID"
  responses:
    "403":
      description: Personal-access token does not grant this scope
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "200":
      description: Payee
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/PayeeResponse"
    "401":
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Payee not found
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
patch:
  summary: Update a payee
  description: "Partial update: omitted fields keep the values of the version in effect on effective_from. Payee fields are descriptive, so any date on or after the first version is accepted; a correction dated before the latest version governs only until the next version and keeps the lifecycle in effect on its date. The response is the payee as it stands today, which for such a correction is not the version just written."
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/PayeeID"
    - in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/PayeeRequest"
  responses:
    "413":
      $ref: "../openapi.yaml#/components/responses/JSONBodyTooLarge"
    "200":
      description: Payee updated
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/PayeeResponse"
    "400":
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Payee not found
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      $ref: "../openapi.yaml#/components/responses/ReferenceVersionConflict"
      description: REFERENCE_DATED_CONFLICT when an active payee holds the name on a date the new version governs; REFERENCE_VERSION_BEFORE_FIRST before the first version; CONFLICT for a stale edit.
