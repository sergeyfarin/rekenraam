parameters:
  - $ref: "../openapi.yaml#/components/parameters/ImportBatchID"
get:
  summary: Get import batch
  parameters:
    - in: query
      name: limit
      schema:
        type: integer
        minimum: 1
    - in: query
      name: cursor
      schema:
        type: string
  responses:
    "200":
      description: Import batch with staged rows
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/GetImportBatchResponse"
    "400":
      description: Invalid batch id or query
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Import batch not found
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
patch:
  summary: Update import row resolutions
  description: >-
    Replaces the review state of pending or failed rows of a previewing,
    partially_committed or failed batch. A re-resolved failed row becomes
    pending again, so the owner can fix the remaining rows and commit the
    same batch again (#301). Committed and skipped rows are immutable.
  parameters:
    - in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/PatchImportBatchRequest"
  responses:
    "413":
      $ref: "../openapi.yaml#/components/responses/JSONBodyTooLarge"
    "204":
      description: Import row resolutions updated
    "400":
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Import batch not found
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: Import batch is not open, or a patched row is already committed or skipped
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
