post:
  summary: Mark a transaction as reviewed (clear needs_review flag)
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/TransactionID"
    - in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/TransactionLifecycleRequest"
  responses:
    "200":
      description: Transaction approved
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/TransactionResponse"
    "400":
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Transaction not found
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
