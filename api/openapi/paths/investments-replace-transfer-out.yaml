post:
  summary: Replace a posted outbound transfer
  description: >-
    Posts the exact inverse of an outbound transfer (its security legs and its
    net bridge, adjustments included) and a corrected outbound transfer
    (T-144) under one audit event and one database transaction. The
    replacement depletes its source at the replaced transfer's correction-root
    same-day slot and bridges the basis that depletion carries; every source
    either transfer depleted then replays under recorded elections. Date,
    source holding and lots or pooled quantity may change; the security and
    basis currency stay the transfer's. A later decision the correction makes
    impossible is refused by name (INVESTMENT_TRANSFER_DEPENDENCY). Other
    transfer kinds use replace-transfer or replace-transfer-in (404 here).
    A non-empty gain change set requires the preview's exact gain_impact_acknowledgement: INVESTMENT_GAIN_IMPACT_ACKNOWLEDGEMENT_REQUIRED or _STALE (409) otherwise, with nothing written.
  parameters:
    - in: path
      name: transaction_id
      required: true
      schema: { type: integer, format: int64 }
      description: Posted outbound transfer transaction ID.
    - in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/InvestmentTransferOutReplacementRequest"
  responses:
    "201":
      description: Transfer replaced and every moved position replayed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/InvestmentTransferOutReplacementResponse"
    "400":
      description: Invalid request, missing reason, or a changed security or basis currency
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Posted internal transfer not found
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: Transfer already corrected (INVESTMENT_TRANSFER_ALREADY_CORRECTED), changed (INVESTMENT_TRANSFER_CHANGED), a dependent operation cannot be satisfied (INVESTMENT_TRANSFER_DEPENDENCY), the source cannot supply the replacement (CONFLICT for insufficient lots, INVESTMENT_TRANSFER_POOL_REQUIRED / _UNAVAILABLE), or reconciliation override required; or committed-disposal gain changes not acknowledged (INVESTMENT_GAIN_IMPACT_ACKNOWLEDGEMENT_REQUIRED / _STALE)
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
