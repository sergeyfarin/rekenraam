get:
  summary: List price observations
  parameters:
    - in: query
      name: base_commodity_id
      schema:
        type: integer
        format: int64
      description: Filter observations by priced/base commodity.
    - in: query
      name: quote_commodity_id
      schema:
        type: integer
        format: int64
      description: Filter observations by quote commodity.
    - in: query
      name: include_voided
      schema:
        type: boolean
        default: false
      description: >-
        Include voided observations. Voided observations are excluded from
        every valuation and from this listing by default; set this to inspect
        what was retired and why.
    - in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
      description: Maximum number of observations to return.
  responses:
    "200":
      description: Price observations, newest valuation date first
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/PriceObservationsResponse"
    "400":
      description: Invalid query parameter
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "500":
      description: Internal server error
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"

post:
  summary: Record an observation through the legacy numeric entry contract
  description: Browser manual entry uses /pricing/manual. This route cannot supersede an observation;
    correction requires a fresh dependency review.
  parameters:
    - in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../openapi.yaml#/components/schemas/PriceObservationRequest
  responses:
    "413":
      $ref: "../openapi.yaml#/components/responses/JSONBodyTooLarge"
    '201':
      description: Observation recorded
      headers:
        X-Request-ID:
          $ref: ../openapi.yaml#/components/headers/XRequestID
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/PriceObservationResponse
    '400':
      description: Invalid observation or non-null supersession ID
      headers:
        X-Request-ID:
          $ref: ../openapi.yaml#/components/headers/XRequestID
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ErrorResponse
    '401':
      description: Authentication required
      headers:
        X-Request-ID:
          $ref: ../openapi.yaml#/components/headers/XRequestID
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ErrorResponse
    '403':
      description: CSRF or same-origin validation failed
      headers:
        X-Request-ID:
          $ref: ../openapi.yaml#/components/headers/XRequestID
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ErrorResponse
    '500':
      description: Internal server error
      headers:
        X-Request-ID:
          $ref: ../openapi.yaml#/components/headers/XRequestID
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ErrorResponse
