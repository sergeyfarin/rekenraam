post:
  summary: Move a transaction earlier or later within its same-day sequence
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/TransactionID"
    - in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/MoveRequest"
  responses:
    "200":
      description: Transaction moved; new versions written for both swapped transactions
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/TransactionResponse"
    "400":
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Transaction or adjacent transaction not found
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
