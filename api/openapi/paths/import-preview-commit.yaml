post:
  summary: Preview import commit
  description: >-
    Read-only commit preview. gain_impacts runs each pending imported
    acquisition with an existing instrument and holding through the rolled-back
    buy writer against the current ledger (T-126). Also open for a
    partially_committed batch so held rows can be reviewed again.
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ImportBatchID"
  responses:
    "200":
      description: Import commit preview
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/PreviewCommitResponse"
    "400":
      description: Invalid batch id
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Import batch not found
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: Import batch is not open
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
