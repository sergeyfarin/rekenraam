post:
  summary: Preview a share exchange replacement
  description: >-
    Returns the corrected exchange's links and journal totals, computed at the
    replaced exchange's slot without it, plus the checkpoints and gain changes
    the replacement writer would cause, from a rolled-back run (#179).
  parameters:
    - in: path
      name: transaction_id
      required: true
      schema: { type: integer, format: int64 }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/ShareExchangeReplacementRequest"
  responses:
    "200":
      description: Plan and impact computed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ShareExchangePreviewResponse"
    "400":
      description: Invalid request, unchanged terms or missing reason
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Posted share exchange not found
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: Already corrected, changed, no holdings at the corrected slot, or a later operation impossible
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "422":
      description: Corrected ratio not representable
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
