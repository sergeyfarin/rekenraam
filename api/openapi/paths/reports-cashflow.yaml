get:
  summary: Read cash movement classified as inflow, outflow, transfers, and net movement
  description: >
    What changed the selected liquid cash, without treating a transfer as
    spending. Classification is exact rather than heuristic: journal entries
    balance per commodity, so a cash posting's counterparts inside the same
    entry account for precisely the movement it represents. Each counterpart is
    classified on its own account class, so a transaction with several
    counterparts needs no allocation rule. In every commodity of every bucket,
    net_movement equals operating_net plus transfer_net, and net_movement
    reconciles to the selected cash balance change across the bucket boundaries.
  parameters:
    - in: query
      name: start_date
      required: true
      schema:
        type: string
        format: date
    - in: query
      name: end_date
      required: true
      schema:
        type: string
        format: date
    - in: query
      name: bucket
      required: true
      schema:
        type: string
        enum: [day, week, month, quarter, year]
    - in: query
      name: account_id
      description: >
        Repeatable. Selects the cash scope. Omitted, the report uses the named
        liquid-cash default — active, non-system accounts of the kinds echoed in
        query.default_cash_account_kinds — and echoes what that resolved to.
        An explicit selection may name any asset or liability account, including
        ones outside the default kinds such as a credit card, because
        net_movement reconciles to the balance change of whatever stable set is
        selected. A system account or a non-balance account class (income,
        expense, equity) is VALIDATION_FAILED: the response reports
        excluded_system_roles ["all"], and an accepted system account would make
        it contradict itself.
      schema:
        type: array
        items:
          type: integer
          format: int64
      style: form
      explode: true
    - in: query
      name: include_descendants
      description: >
        Expands each account_id to itself plus every descendant. The scope is
        resolved once, as of end_date, and applied to the whole range so
        net_movement keeps reconciling to one stable set of accounts.
      schema:
        type: boolean
        default: false
    - in: query
      name: commodity_id
      description: Repeatable. Restricts the report to postings in these commodities.
      schema:
        type: array
        items:
          type: integer
          format: int64
      style: form
      explode: true
    - in: query
      name: reporting_currency_id
      description: >
        Optional. Denominate the report in this currency *in addition to* the
        exact per-commodity figures, which are unchanged. A stock converts at
        the date it is measured on; a flow converts at the date it happened.
        Figures that cannot be converted are omitted rather than shown short,
        and named in the valuation block.
      schema:
        type: integer
        format: int64
    - in: query
      name: max_staleness_days
      description: >
        Optional, default 7. How far back to look for the nearest earlier
        observation before treating a commodity as unconvertible. A week covers
        weekends and holidays without letting a month-old rate pass as today's.
      schema:
        type: integer
        minimum: 0
        maximum: 365
  responses:
    "200":
      description: Exact per-commodity cash movement for each calendar bucket
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/CashflowReportResponse"
    "400":
      description: Invalid report query
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "422":
      description: Report arithmetic exceeded exact quantity limits
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
