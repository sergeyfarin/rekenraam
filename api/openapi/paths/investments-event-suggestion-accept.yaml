post:
  summary: Accept an investment event suggestion (posts the proposed transaction)
  description: >-
    A complete proposal is accepted with no body. An incomplete provider dividend (proposed_transaction.complete
    = false, #111) requires `completion` with the facts a per-share announcement cannot state; a missing or
    refused completion returns an error and the suggestion stays pending. Informational events cannot be accepted.
    The posted dividend, the suggestion and the provider event status commit atomically.
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/AcceptEventSuggestionRequest"
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/SuggestionID"
    - in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
      description: Session-bound CSRF token for authenticated mutating requests.
  responses:
    "413":
      $ref: "../openapi.yaml#/components/responses/JSONBodyTooLarge"
    "200":
      description: Suggestion accepted and transaction posted
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/InvestmentEventSuggestionResponse"
    "400":
      description: Completion missing or invalid, or the event is informational; the suggestion stays pending
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Suggestion not found
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: Suggestion is no longer pending, or the completed dividend needs a reconciliation override
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "500":
      description: Internal server error
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
