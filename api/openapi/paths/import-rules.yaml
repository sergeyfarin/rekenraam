get:
  summary: List ordered preview-time import rules
  responses:
    "200":
      description: Rules in application order
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ListImportRulesResponse"
    "401":
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
post:
  summary: Create a preview-time import rule
  parameters:
    - in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/CreateImportRuleRequest"
  responses:
    "201":
      description: Rule created
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ImportRuleResponse"
    "400":
      description: Invalid rule or target
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
