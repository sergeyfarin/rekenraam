post:
  summary: Reverse a short cover — preview reconciliation and gain impact (#175)
  description: >-
    Runs the complete writer in a rolled-back transaction and returns the checkpoints it would invalidate and its gain changes. Posts an exact inverse of a short cover, restoring the short lots it closed, and replays the short position under one audit event.
  parameters:
    - in: path
      name: transaction_id
      required: true
      schema: { type: integer, format: int64 }
      description: Posted sale transaction ID.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/InvestmentSaleReversalRequest"
  responses:
    "200":
      description: Reconciliation impact computed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ReconciliationImpactResponse"
    "400":
      description: Invalid request or missing reason
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Posted long sale not found
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: Sale already corrected, unlinked import, or changed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
