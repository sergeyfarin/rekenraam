post:
  summary: Replace a posted reinvested dividend
  description: >-
    Posts the inverse and a corrected reinvestment — quantity, amount and income
    account — opens a new lot, replays later long disposals, retires the
    original trade price and updates reconciliation under one audit event
    (T-115). The replacement keeps the date, holding account, instrument and
    currency. A non-empty gain change set requires the preview's exact
    gain_impact_acknowledgement.
  parameters:
    - in: path
      name: transaction_id
      required: true
      schema: { type: integer, format: int64 }
    - in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/InvestmentReinvestmentReplacementRequest"
  responses:
    "201":
      description: Reinvested dividend replaced and dependent position replayed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/InvestmentBuyReplacementResponse"
    "400":
      description: Invalid request or missing reason
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Posted reinvested dividend not found
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: Already corrected (INVESTMENT_REINVESTMENT_ALREADY_CORRECTED), changed (INVESTMENT_REINVESTMENT_CHANGED), a later disposal impossible (INVESTMENT_BUY_DEPENDENCY), or reconciliation override required; or committed-disposal gain changes not acknowledged (INVESTMENT_GAIN_IMPACT_ACKNOWLEDGEMENT_REQUIRED / _STALE)
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
