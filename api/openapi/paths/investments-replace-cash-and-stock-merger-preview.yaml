post:
  summary: Preview a cash-and-stock merger replacement
  description: >-
    Returns the corrected merger's links, realizations, cash and totals, computed at the
    replaced merger's slot without it, plus the checkpoints and gain changes
    the replacement writer would cause, from a rolled-back run (#184).
  parameters:
    - in: path
      name: transaction_id
      required: true
      schema: { type: integer, format: int64 }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/CashStockMergerReplacementRequest"
  responses:
    "413":
      $ref: "../openapi.yaml#/components/responses/JSONBodyTooLarge"
    "200":
      description: Plan and impact computed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/CashStockMergerPreviewResponse"
    "400":
      description: Invalid request, unchanged terms or missing reason
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Posted cash-and-stock merger not found
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: Already corrected, changed, no holdings at the corrected slot, or a later operation impossible
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "422":
      description: Corrected ratio not representable
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
