post:
  summary: Preview an outbound investment transfer
  description: >-
    Authenticated read-only preview; no CSRF token or write occurs. Runs the
    complete transfer writer and rolls back, returning the basis carried out
    per source lot and in total, plus checkpoint and gain impact.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/ExternalTransferOutRequest"
  responses:
    "200":
      description: Carried allocation plan and its reconciliation/gain impact
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ExternalTransferOutPreviewResponse"
    "400":
      description: Invalid transfer facts
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: Allocation does not match the source method or a dated lot dependency conflicts
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
