get:
  security:
    - CookieSession: []
    - PersonalAccessToken: []
  x-personal-access-token-scope: "reports:read"
  summary: Read net worth totals
  parameters:
    - in: query
      name: as_of
      description: Defaults to today in the authenticated owner's saved time zone when omitted.
      schema:
        type: string
        format: date
    - in: query
      name: status
      schema:
        $ref: "../openapi.yaml#/components/schemas/LedgerStatus"
  responses:
    "403":
      description: Personal-access token does not grant this scope
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "200":
      description: Net worth totals grouped by commodity
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/NetWorthResponse"
    "400":
      description: Invalid query
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
