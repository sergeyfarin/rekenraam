get:
  security:
    - CookieSession: []
    - PersonalAccessToken: []
  x-personal-access-token-scope: "ledger:read"
  summary: Read an account register
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/AccountID"
    - in: query
      name: status
      schema:
        $ref: "../openapi.yaml#/components/schemas/TransactionStatus"
    - in: query
      name: after_date
      schema:
        type: string
        format: date
    - in: query
      name: before_date
      schema:
        type: string
        format: date
    - in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 500
    - in: query
      name: cursor
      schema:
        type: string
  responses:
    "403":
      description: Personal-access token does not grant this scope
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "200":
      description: Account register entries
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/AccountRegisterResponse"
    "400":
      description: Invalid query
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
