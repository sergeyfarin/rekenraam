post:
  summary: Commit import batch
  description: >-
    Commits pending rows chronologically, each in its own transaction. An
    imported acquisition whose replay changes committed disposal gains commits
    only with that row's current preview-commit acknowledgement; otherwise it
    stays pending, is listed in gain_review_row_ids, and the batch stays
    partially_committed (T-126). CSV investment rows are validated with the named
    dividend writer before any row commits. Unresolved mappings or mismatched
    gross/tax/net amounts return 400; an unacknowledged reconciliation impact
    returns 409, leaving the batch reviewable. Trading 212 dividends require
    explicit owner gross/withholding declarations; missing accounts or required
    facts leave only those rows pending, listed in dividend_review_row_ids, while
    unrelated rows can commit. These dividends never fall back to ordinary cash.
    Accepted rows retain per-row atomicity. A row that would cross a
    reconciliation checkpoint without reconciliation_override stays pending
    with commit_error "reconciliation override required" and is listed in
    reconciliation_hold_row_ids. Failed rows are retried on every commit. The
    batch is committed only when no row is left pending or failed; otherwise
    it is partially_committed (failed when nothing committed and only failed
    rows remain), and both states accept PATCH, preview and commit again
    until it is (#301). Skipped duplicates and exclusions are final.
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ImportBatchID"
    - in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/CommitImportBatchRequest"
  responses:
    "413":
      $ref: "../openapi.yaml#/components/responses/JSONBodyTooLarge"
    "200":
      description: Import batch committed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/CommitImportBatchResponse"
    "400":
      description: Invalid request or CSV investment row requiring review
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Import batch not found
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: Import batch is not open, or reconciliation override required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
