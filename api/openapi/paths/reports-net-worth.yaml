get:
  summary: Read net worth over time
  description: >
    Assets less liabilities at each calendar bucket end, from posted ledger
    data. Repeated ID parameters are an OR-set within that dimension and
    combine with AND across dimensions. The response echoes the effective
    filters, including the descendant expansion actually used.
  parameters:
    - in: query
      name: start_date
      required: true
      schema:
        type: string
        format: date
    - in: query
      name: end_date
      required: true
      schema:
        type: string
        format: date
    - in: query
      name: bucket
      required: true
      schema:
        type: string
        enum: [day, week, month, quarter, year]
    - in: query
      name: account_id
      description: >
        Repeatable. Restricts the series to these asset and liability accounts,
        so the same endpoint powers full net worth, one account's history, or a
        selected group without changing the calculation. An account of any other
        class is VALIDATION_FAILED: the series sums assets and liabilities, so
        accepting one and skipping its balance would answer an empty report to a
        question the caller thought it had asked.
      schema:
        type: array
        items:
          type: integer
          format: int64
      style: form
      explode: true
    - in: query
      name: include_descendants
      description: >
        Expands each account_id to itself plus every descendant, using the
        account versions in effect on the reporting date.
      schema:
        type: boolean
        default: false
    - in: query
      name: commodity_id
      description: Repeatable. Restricts the series to balances in these commodities.
      schema:
        type: array
        items:
          type: integer
          format: int64
      style: form
      explode: true
    - in: query
      name: reporting_currency_id
      description: >
        Optional. Denominate the report in this currency *in addition to* the
        exact per-commodity figures, which are unchanged. A stock converts at
        the date it is measured on; a flow converts at the date it happened.
        Figures that cannot be converted are omitted rather than shown short,
        and named in the valuation block.
      schema:
        type: integer
        format: int64
    - in: query
      name: max_staleness_days
      description: >
        Optional, default 7. How far back to look for the nearest earlier
        observation before treating a commodity as unconvertible. A week covers
        weekends and holidays without letting a month-old rate pass as today's.
      schema:
        type: integer
        minimum: 0
        maximum: 365
  responses:
    "200":
      description: Exact net worth totals at each calendar bucket end, grouped by commodity
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/NetWorthSeriesResponse"
    "400":
      description: Invalid report query
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "422":
      description: Report arithmetic exceeded exact quantity limits
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
