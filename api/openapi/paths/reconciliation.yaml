get:
  summary: Read reconciliation session
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ReconciliationID"
  responses:
    "200":
      description: Reconciliation session
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ReconciliationSessionResponse"
    "401":
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Reconciliation not found
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
patch:
  summary: Update reconciliation selection
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ReconciliationID"
    - in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/ReconciliationSelectionRequest"
  responses:
    "200":
      description: Reconciliation selection updated
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ReconciliationSessionResponse"
    "400":
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: Reconciliation is closed or posting selection is invalid
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
