post:
  summary: Queue provider dividend or split event fetches
  description: Queues durable work for active Twelve Data dividend assignments or instruments explicitly assigned a Massive split ticker. Exact active duplicates coalesce. Fetching retains reviewable evidence and leaves posting to an owner decision. Failures appear in pricing failed work.
  parameters:
    - in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          properties:
            event_family:
              type: string
              enum: [dividend, split]
              default: dividend
  responses:
    "413":
      $ref: "../openapi.yaml#/components/responses/JSONBodyTooLarge"
    "202":
      description: Accepted (including already queued listings)
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/DividendEventFetchAccepted"
    "400":
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/ErrorResponse" }
    "401":
      description: Authentication required
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/ErrorResponse" }
    "403":
      description: Origin or CSRF rejected
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/ErrorResponse" }
    "500":
      description: Failed to queue
      content:
        application/json:
          schema: { $ref: "../openapi.yaml#/components/schemas/ErrorResponse" }
