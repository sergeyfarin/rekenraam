get:
  summary: Preview reconciliation impact of posting a saved draft
  description: >
    Validates the saved draft as posted and returns named affected checkpoints using its stored posting positions. Does not write or post. Posting always rechecks current state and still requires reconciliation_override when applicable. An already posted transaction returns an empty impact.
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/TransactionID"
  responses:
    "200":
      description: Success
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ReconciliationImpactResponse'
    "400":
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    "401":
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    "404":
      description: Not found
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    "409":
      description: State changed or action not allowed
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    "422":
      description: Exact quantity overflow
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
    "503":
      description: Database temporarily busy
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
