post:
  summary: Turn multi-factor authentication off
  description: >-
    Removes the enrollment and every recovery code with it. Password-confirmed.
  parameters:
    - in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
      description: Session-bound CSRF token for authenticated mutating requests.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/MFAPasswordRequest"
  responses:
    "413":
      $ref: "../openapi.yaml#/components/responses/JSONBodyTooLarge"
    "204":
      description: Multi-factor authentication disabled
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
    "400":
      description: Invalid request body or validation failure
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication required, or the password did not verify
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: CSRF or origin validation failed
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "429":
      description: >-
        This session spent its MFA-settings reauthentication budget (five
        wrong passwords or activation codes, shared across enrollment,
        activation, disable, and recovery-code regeneration). Refused before
        verification, even for correct input, until Retry-After elapses;
        signing in again starts a new session with its own budget.
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
        Retry-After:
          description: Seconds until this session may confirm again.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "500":
      description: Internal server error
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
