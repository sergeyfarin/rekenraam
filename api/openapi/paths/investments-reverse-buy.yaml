post:
  summary: Reverse a posted long buy
  description: >-
    Posts an exact inverse, retires the source trade price, and replays later
    long-position decisions in one audited database transaction. The original
    buy remains posted history. A dependent disposal that cannot be satisfied
    refuses the command without durable effects. Imported lineage requires a
    committed source identity, which remains attached to the original fill.
    A non-empty gain change set requires the preview's exact gain_impact_acknowledgement: INVESTMENT_GAIN_IMPACT_ACKNOWLEDGEMENT_REQUIRED or _STALE (409) otherwise, with nothing written (T-126).
  parameters:
    - in: path
      name: transaction_id
      required: true
      schema: { type: integer, format: int64 }
    - in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/InvestmentBuyReversalRequest"
  responses:
    "201":
      description: Buy reversed and dependent position replayed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/InvestmentBuyReversalResponse"
    "400":
      description: Invalid request or missing reason
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Posted long buy not found
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: Already corrected, unlinked import, changed, dependent operation impossible, or reconciliation override required; or committed-disposal gain changes not acknowledged (INVESTMENT_GAIN_IMPACT_ACKNOWLEDGEMENT_REQUIRED / _STALE)
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
