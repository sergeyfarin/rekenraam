post:
  summary: Create the single owner account during first-run setup
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/CreateOwnerRequest"
  responses:
    "201":
      description: Owner created and setup advanced to the next step
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
        Set-Cookie:
          schema:
            type: string
          description: Browser session cookie for the newly created owner.
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/CreateOwnerResponse"
    "400":
      description: Invalid request body or validation failure
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin validation failed
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: Owner setup is already complete
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "500":
      description: Internal server error
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
