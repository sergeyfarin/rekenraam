get:
  summary: List dividend defaults
  parameters:
    - in: query
      name: commodity_id
      schema:
        type: integer
        format: int64
      description: Filter by commodity (instrument currency).
  responses:
    "200":
      description: Dividend defaults
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/DividendDefaultsResponse"
    "400":
      description: Invalid query parameter
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "500":
      description: Internal server error
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
post:
  summary: Create a dividend default
  parameters:
    - in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
      description: Session-bound CSRF token for authenticated mutating requests.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/DividendDefaultRequest"
  responses:
    "201":
      description: Dividend default created
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/DividendDefaultResponse"
    "400":
      description: Invalid request body or validation failure
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "500":
      description: Internal server error
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
