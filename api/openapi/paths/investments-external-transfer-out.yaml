post:
  summary: Transfer an investment holding out of the book
  description: >-
    Moves selected long lots with their own basis (individual-lot source) or a
    quantity at the dated average-cost pool rate (average-cost source) to a
    destination outside the book, without cash or gain. Posts the security legs
    and a separate bridge journal (system_label transfer_bridge) carrying the
    depleted basis from commodity_trading to the external transfer equity
    account. A transfer dated behind a later depletion of the holding is
    admitted through replay at its own slot; a later decision it makes
    impossible is refused by name (INVESTMENT_SALE_DEPENDENCY), and changed
    later gains need the preview's gain_impact_acknowledgement.
  parameters:
    - in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/ExternalTransferOutRequest"
  responses:
    "201":
      description: Security journal, source depletions, links and bridge journal recorded atomically
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ExternalTransferOutResponse"
    "400":
      description: Invalid transfer facts
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: >-
        Reconciliation override or gain acknowledgement required, the allocation
        does not match the source method (INVESTMENT_TRANSFER_POOL_REQUIRED /
        INVESTMENT_TRANSFER_POOL_UNAVAILABLE), or a dated lot dependency conflicts
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
