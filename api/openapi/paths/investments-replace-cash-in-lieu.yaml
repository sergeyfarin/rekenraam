post:
  summary: Correct a cash in lieu
  description: >-
    Runs the native disposal replacement, retaining the same split link and
    correction-root slot. Fraction, proceeds, dates and election may change.
    Original facts remain evidence. Split linkage, replay, checkpoint impact
    and gain acknowledgement are validated atomically. The preview rolls back
    and returns the corrected allocation, disposed basis and realized result.
  parameters:
    - in: path
      name: transaction_id
      required: true
      schema: { type: integer, format: int64 }
    - in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/CashInLieuReplacementRequest"
  responses:
    "201":
      description: Sale replaced and long position rebuilt
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/InvestmentSaleReplacementResponse"
    "400":
      description: Invalid replacement or missing reason
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Posted long sale not found
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: Sale corrected, imported without source identity, changed, dependent operation impossible, or reconciliation override required; or committed-disposal gain changes not acknowledged (INVESTMENT_GAIN_IMPACT_ACKNOWLEDGEMENT_REQUIRED / _STALE)
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
