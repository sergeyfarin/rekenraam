post:
  summary: Replace a short sale — preview reconciliation and gain impact (#175)
  description: >-
    Runs the complete writer in a rolled-back transaction and returns the checkpoints it would invalidate and its gain changes. Posts an inverse and a corrected short sale, opens the corrected short lot and replays the affected short positions under one audit event. Changed cover results need the preview's acknowledgement.
  parameters:
    - in: path
      name: transaction_id
      required: true
      schema: { type: integer, format: int64 }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/InvestmentBuyReplacementRequest"
  responses:
    "200":
      description: Reconciliation impact computed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ReconciliationImpactResponse"
    "400":
      description: Invalid replacement or missing reason
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Posted long buy not found
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: Buy already corrected, imported without source identity, changed, or dependent disposal/transfer impossible
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
