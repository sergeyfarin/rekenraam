post:
  summary: Replace a posted cash dividend
  description: >-
    Posts the inverse and the corrected dividend — gross amount, withholding,
    income and withholding accounts — under one audit event (T-115). The
    replacement keeps the dividend date, cash account and currency. The original
    remains posted history; an imported dividend keeps its committed source
    identity on the original.
  parameters:
    - in: path
      name: transaction_id
      required: true
      schema: { type: integer, format: int64 }
    - in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/InvestmentDividendReplacementRequest"
  responses:
    "201":
      description: Dividend replaced
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/InvestmentDividendReplacementResponse"
    "400":
      description: Invalid request or missing reason
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Posted cash dividend not found
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: Already corrected (INVESTMENT_DIVIDEND_ALREADY_CORRECTED), imported without its committed source (INVESTMENT_IMPORTED_DIVIDEND), changed (INVESTMENT_DIVIDEND_CHANGED), or reconciliation override required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
