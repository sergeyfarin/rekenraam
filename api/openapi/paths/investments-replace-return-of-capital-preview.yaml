post:
  summary: Preview a return-of-capital replacement
  description: >-
    Runs the complete compound correction writer and rolls back. Returns exact
    per-lot reductions and excess, checkpoint impact and gain acknowledgement.
  parameters:
    - in: path
      name: transaction_id
      required: true
      schema: { type: integer, format: int64 }
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/CapitalReturnReplacementRequest"
  responses:
    "200":
      description: Plan and impact computed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/CapitalReturnPreviewResponse"
    "400":
      description: Invalid request or missing reason
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Posted return of capital not found
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      description: Already corrected, unlinked import, changed, no eligible holdings, or later disposal impossible
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "422":
      description: Invalid entitlement, unknown basis, or coefficient range exceeded
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
