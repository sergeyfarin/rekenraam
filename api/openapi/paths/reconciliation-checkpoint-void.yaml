post:
  summary: Void reconciliation checkpoint
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/ReconciliationCheckpointID"
    - in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/TransactionLifecycleRequest"
  responses:
    "200":
      description: Reconciliation checkpoint voided
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ReconciliationCheckpointResponse"
    "400":
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Checkpoint not found
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
