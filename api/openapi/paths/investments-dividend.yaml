post:
  summary: Record a cash dividend or separate withholding tax
  description: >-
    Gross dividend income may include withholding in the same transaction.
    withholding_only records tax paid separately for an instrument, with
    amount_value as tax magnitude and no income or security-unit posting.
    Both shapes retain their paying instrument as an immutable operation fact.
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/IdempotencyKey"
    - in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
      description: Session-bound CSRF token for authenticated mutating requests.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../openapi.yaml#/components/schemas/DividendRequest"
  responses:
    "413":
      $ref: "../openapi.yaml#/components/responses/JSONBodyTooLarge"
    "201":
      description: Dividend recorded
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/TransactionResponse"
    "400":
      description: Invalid request body or validation failure
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "401":
      description: Authentication is required
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "403":
      description: Origin or CSRF validation failed
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "409":
      $ref: "../openapi.yaml#/components/responses/IdempotencyKeyConflict"
      description: >-
        IDEMPOTENCY_KEY_REUSED or IDEMPOTENCY_KEY_RESULT_UNAVAILABLE, as for
        every keyed create; or DIVIDEND_DEFAULT_CHANGED when an account marked
        income_account_from_default or withholding_account_from_default is no
        longer the one the stored default applies on the dividend's date
        (changed, or its account archived today), checked again when the write
        commits (#664). None writes anything.
    "500":
      description: Internal server error
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
