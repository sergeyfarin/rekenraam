get:
  security:
    - CookieSession: []
    - PersonalAccessToken: []
  x-personal-access-token-scope: "ledger:read"
  summary: List account versions
  parameters:
    - $ref: "../openapi.yaml#/components/parameters/AccountID"
  responses:
    "403":
      description: Personal-access token does not grant this scope
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "200":
      description: Account versions, newest first
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/AccountsResponse"
    "401":
      description: Authentication is required
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
    "404":
      description: Account not found
      headers:
        X-Request-ID:
          $ref: "../openapi.yaml#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/ErrorResponse"
