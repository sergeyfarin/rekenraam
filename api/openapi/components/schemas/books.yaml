BookResponse:
  type: object
  required:
    - id
    - owner_user_id
    - code
    - name
    - created_at
    - updated_at
  properties:
    id:
      type: integer
      format: int64
      description: Current runtime always uses book id 1.
    owner_user_id:
      type: integer
      format: int64
    code:
      type: string
      description: Stable internal code for the single owner book.
      maxLength: 64
    name:
      type: string
      description: User-visible book name.
      maxLength: 200
    default_currency_commodity_id:
      type: integer
      format: int64
      nullable: true
      description: Default currency preference for new currency-sensitive UI and accounts. It is not a reporting/base currency.
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
CreateBookRequest:
  type: object
  required:
    - name
  properties:
    code:
      type: string
      description: Optional stable code. Defaults to personal. Lowercase letters, numbers, underscores, and hyphens only.
      maxLength: 64
    name:
      type: string
      description: User-visible book name.
      maxLength: 200
  additionalProperties: false
CreateBookResponse:
  type: object
  required:
    - book
    - setup
  properties:
    book:
      $ref: "../../openapi.yaml#/components/schemas/BookResponse"
    setup:
      $ref: "../../openapi.yaml#/components/schemas/SetupStatusResponse"
