AccountClass:
  type: string
  enum:
    - asset
    - liability
    - equity
    - income
    - expense
AccountKind:
  type: string
  enum:
    - cash
    - checking
    - savings
    - term_deposit
    - brokerage
    - brokerage_cash
    - security_holding
    - crypto_wallet
    - property
    - vehicle
    - rewards_balance
    - receivable
    - other_asset
    - credit_card
    - line_of_credit
    - loan
    - mortgage
    - tax_liability
    - payable
    - other_liability
    - equity
    - income
    - expense
AccountStatus:
  type: string
  enum:
    - active
    - closed
    - archived
SystemAccountRole:
  type: string
  enum:
    - opening_balance
    - import_imbalance
    - retained_earnings
    - unassigned_income
    - unassigned_expense
    - transfer_clearing
    - commodity_trading
AccountResponse:
  type: object
  required:
    - id
    - book_id
    - is_system
    - status
    - account_class
    - account_kind
    - allows_postings
    - comment_markdown
    - metadata
    - opened_on
    - effective_from
    - change_reason
    - created_at
    - updated_at
  properties:
    id:
      type: integer
      format: int64
    book_id:
      type: integer
      format: int64
      description: Current runtime always uses book id 1.
    is_system:
      type: boolean
      description: Derived from whether system_role is present. System accounts are hidden from ordinary account lists by default.
    system_role:
      $ref: "../../openapi.yaml#/components/schemas/SystemAccountRole"
    status:
      $ref: "../../openapi.yaml#/components/schemas/AccountStatus"
    code:
      type: string
      maxLength: 100
    name:
      type: string
      maxLength: 200
    account_class:
      $ref: "../../openapi.yaml#/components/schemas/AccountClass"
    account_kind:
      $ref: "../../openapi.yaml#/components/schemas/AccountKind"
    parent_account_id:
      type: integer
      format: int64
      description: Optional parent account. When set, institution_id is derived from the parent account.
    institution_id:
      type: integer
      format: int64
      description: Institution for root accounts. Ignored when parent_account_id is set; child accounts inherit the parent account's institution.
    country_code:
      type: string
      minLength: 2
      maxLength: 2
    default_commodity_id:
      type: integer
      format: int64
      description: Default entry commodity. Omitted for multi-commodity accounts such as transient receivable/payable accounts or containers.
    quantity_scale_override:
      type: integer
      minimum: 0
      maximum: 12
    allows_postings:
      type: boolean
    number_last4:
      type: string
      maxLength: 8
      description: Recognition hint only; full account numbers must not be stored.
    external_ref_hint:
      type: string
      maxLength: 200
    comment_markdown:
      type: string
      maxLength: 5000
    metadata:
      type: object
      additionalProperties: true
    opened_on:
      type: string
      format: date
      description: First date on which postings are valid for this account. System accounts use an internal conventional date.
    closed_on:
      type: string
      format: date
      description: First date after which ordinary new postings should not target this account. Present for closed and archived accounts.
    effective_from:
      type: string
      format: date
      description: Calendar date when this account attribute version became effective for as-of display and reporting.
    change_reason:
      type: string
      maxLength: 500
      description: Audit reason recorded for this account version.
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
AccountsResponse:
  type: object
  required:
    - accounts
  properties:
    accounts:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/AccountResponse"
AccountRequest:
  type: object
  required:
    - name
    - account_class
  properties:
    code:
      type: string
      maxLength: 100
    name:
      type: string
      maxLength: 200
    account_class:
      $ref: "../../openapi.yaml#/components/schemas/AccountClass"
    account_kind:
      $ref: "../../openapi.yaml#/components/schemas/AccountKind"
    parent_account_id:
      type: integer
      format: int64
      description: Optional parent account. When set, institution_id is derived from the parent account.
    institution_id:
      type: integer
      format: int64
      description: Institution for root accounts. Ignored when parent_account_id is set; child accounts inherit the parent account's institution.
    country_code:
      type: string
      minLength: 2
      maxLength: 2
    default_commodity_id:
      type: integer
      format: int64
      description: Default entry commodity. Required for single-commodity posting asset and liability accounts; omit for multi-commodity transient accounts such as receivable/payable.
    default_commodity_code:
      type: string
      minLength: 3
      maxLength: 3
      description: Embedded catalog currency code to create or reuse as the default commodity during account save. Use instead of default_commodity_id.
    quantity_scale_override:
      type: integer
      minimum: 0
      maximum: 12
    allows_postings:
      type: boolean
      description: Defaults to true when omitted.
    number_last4:
      type: string
      maxLength: 8
    external_ref_hint:
      type: string
      maxLength: 200
    comment_markdown:
      type: string
      maxLength: 5000
    metadata:
      type: object
      additionalProperties: true
    opened_on:
      type: string
      format: date
      description: Account opening date used for future transaction-date validation. Omit to default to the account version date.
    effective_from:
      type: string
      format: date
      description: Account attribute version date for as-of display and reporting. Omit to use today's date. Future dates are rejected.
    change_reason:
      type: string
      maxLength: 500
      description: Omit to use the default reason for the operation.
  additionalProperties: false
AccountLifecycleRequest:
  type: object
  properties:
    effective_from:
      type: string
      format: date
      description: Attribute version date for the lifecycle change. For close, omit to use closed_on. Future dates are rejected.
    closed_on:
      type: string
      format: date
      description: Account close date used for future transaction-date validation. Close defaults to this value when effective_from is omitted.
    change_reason:
      type: string
      maxLength: 500
      description: Omit to use the default reason for the lifecycle transition.
  additionalProperties: false
CompleteSystemAccountsSetupResponse:
  type: object
  required:
    - accounts
    - setup
  properties:
    accounts:
      type: array
      description: Required system accounts plus setup-created starter cash account for the default setup currency.
      items:
        $ref: "../../openapi.yaml#/components/schemas/AccountResponse"
    setup:
      $ref: "../../openapi.yaml#/components/schemas/SetupStatusResponse"
