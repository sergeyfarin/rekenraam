NetWorthSeriesBucket:
  type: object
  required:
    - start_date
    - end_date
    - totals
  properties:
    start_date:
      type: string
      format: date
    end_date:
      type: string
      format: date
    totals:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/BalanceQuantity"

NetWorthSeriesQuery:
  type: object
  required:
    - start_date
    - end_date
    - bucket
  properties:
    start_date:
      type: string
      format: date
    end_date:
      type: string
      format: date
    bucket:
      type: string
      enum: [day, week, month, quarter, year]

NetWorthSeriesResponse:
  type: object
  required:
    - start_date
    - end_date
    - bucket
    - query
    - buckets
    - excluded_system_roles
  properties:
    start_date:
      type: string
      format: date
    end_date:
      type: string
      format: date
    bucket:
      type: string
      enum: [day, week, month, quarter, year]
    query:
      $ref: "../../openapi.yaml#/components/schemas/NetWorthSeriesQuery"
    buckets:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/NetWorthSeriesBucket"
    excluded_system_roles:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/SystemAccountRole"

SpendingGroupTotal:
  type: object
  description: >-
    One commodity's exact total for one group. `normal_quantity_value` is the
    positive magnitude in the requested direction; a refund can legitimately
    leave it negative.
  required:
    - commodity_id
    - quantity_value
    - quantity_scale
    - normal_quantity_value
    - share_basis_points
  properties:
    commodity_id:
      type: integer
      format: int64
    quantity_value:
      type: string
    quantity_scale:
      type: integer
    normal_quantity_value:
      type: string
    share_basis_points:
      type: integer
      format: int64
      description: >-
        Share of the report-wide total for this same commodity, in hundredths
        of a percent (10000 = 100%). Presentational only; never a figure to act
        on. Zero when the report-wide total for the commodity is zero. Shares
        are never comparable across commodities.

SpendingGroup:
  type: object
  description: >-
    One row of the ranking. Exactly one of `category_account_id`, `payee_id`,
    or `unassigned` identifies the group.
  required:
    - unassigned
    - totals
  properties:
    category_account_id:
      type: integer
      format: int64
      description: >-
        Set when group_by=category. No label is returned: built-in categories
        carry a localized label, so the client resolves it against the
        categories read model.
    payee_id:
      type: integer
      format: int64
      description: Set when group_by=payee.
    payee_label:
      type: string
      description: >-
        The payee's current name. Returned by the server because payee names
        are canonical user data rather than localized built-ins.
    unassigned:
      type: boolean
      description: >-
        Activity with no linked payee, including transactions carrying only a
        free-text payee name. Reported rather than dropped so the group totals
        still reconcile to commodity_totals.
    totals:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/SpendingGroupTotal"

SpendingQuery:
  type: object
  required:
    - start_date
    - end_date
    - group_by
    - direction
  properties:
    start_date:
      type: string
      format: date
    end_date:
      type: string
      format: date
    group_by:
      type: string
      enum: [category, payee]
    direction:
      type: string
      enum: [expense, income]

SpendingResponse:
  type: object
  description: >-
    Income or expense totals for an inclusive date range, ranked by one
    dimension. Computed over category postings only, so transfers between the
    user's own accounts never appear. Posted, non-voided, non-soft-deleted
    records only.
  required:
    - start_date
    - end_date
    - group_by
    - direction
    - rank_commodity_id
    - query
    - commodity_totals
    - groups
    - excluded_system_roles
  properties:
    start_date:
      type: string
      format: date
    end_date:
      type: string
      format: date
    group_by:
      type: string
      enum: [category, payee]
    direction:
      type: string
      enum: [expense, income]
    rank_commodity_id:
      type: integer
      format: int64
      description: >-
        The commodity whose magnitudes determined the order of `groups`.
        Ranking uses a single commodity because comparing unlike commodities as
        one number is not meaningful; this field makes the ordering
        explainable. Zero when the report is empty.
    query:
      $ref: "../../openapi.yaml#/components/schemas/SpendingQuery"
    commodity_totals:
      type: array
      description: >-
        Report-wide total per commodity — the denominator each group's
        share_basis_points is taken against.
      items:
        $ref: "../../openapi.yaml#/components/schemas/BalanceQuantity"
    groups:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/SpendingGroup"
    excluded_system_roles:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/SystemAccountRole"

CashflowBucketTotal:
  type: object
  description: >-
    One commodity's classified cash movement for one bucket. All six figures
    share `quantity_scale` so they are directly comparable, and they reconcile
    exactly: `net_movement = inflow - outflow + transfer_in - transfer_out`,
    and `operating_net = inflow - outflow`. The identity holds by construction
    from double entry, not from a rounding adjustment.
  required:
    - commodity_id
    - quantity_scale
    - inflow
    - outflow
    - operating_net
    - transfer_in
    - transfer_out
    - net_movement
  properties:
    commodity_id:
      type: integer
      format: int64
    quantity_scale:
      type: integer
    inflow:
      type: string
      description: Money arriving from an income counterpart, as a positive magnitude.
    outflow:
      type: string
      description: Money leaving to an expense counterpart, as a positive magnitude.
    operating_net:
      type: string
      description: >-
        inflow - outflow. Deliberately excludes transfer and financing
        movement, so moving savings into checking never reads as income.
    transfer_in:
      type: string
      description: >-
        Movement into the cash scope from an unselected asset, liability, or
        equity account, as a positive magnitude. Never income.
    transfer_out:
      type: string
      description: >-
        Movement out of the cash scope to an unselected asset, liability, or
        equity account, as a positive magnitude. Never spending.
    net_movement:
      type: string
      description: >-
        Signed change in the selected cash total for the bucket. Reconciles
        exactly to the cash balance change across the bucket boundaries.

CashflowBucket:
  type: object
  required:
    - start_date
    - end_date
    - totals
  properties:
    start_date:
      type: string
      format: date
    end_date:
      type: string
      format: date
    totals:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/CashflowBucketTotal"

CashflowScopeAccount:
  type: object
  description: One account in the effective cash scope.
  required:
    - account_id
    - account_kind
  properties:
    account_id:
      type: integer
      format: int64
    name:
      type: string
    code:
      type: string
    account_kind:
      type: string

CashflowQuery:
  type: object
  required:
    - start_date
    - end_date
    - bucket
  properties:
    start_date:
      type: string
      format: date
    end_date:
      type: string
      format: date
    bucket:
      type: string
      enum: [day, week, month, quarter, year]

CashflowResponse:
  type: object
  description: >-
    Cash movement classified as inflow, outflow, transfer/financing, and net
    movement. Posted, non-voided, non-soft-deleted records only.
  required:
    - start_date
    - end_date
    - bucket
    - query
    - scope_kinds
    - scope_accounts
    - buckets
    - excluded_system_roles
  properties:
    start_date:
      type: string
      format: date
    end_date:
      type: string
      format: date
    bucket:
      type: string
      enum: [day, week, month, quarter, year]
    query:
      $ref: "../../openapi.yaml#/components/schemas/CashflowQuery"
    scope_kinds:
      type: array
      description: >-
        The named account-kind policy that selected the cash scope. Stated
        explicitly rather than left as an invisible "all assets" shortcut.
      items:
        type: string
    scope_accounts:
      type: array
      description: The accounts that policy resolved to, so the result can name what was measured.
      items:
        $ref: "../../openapi.yaml#/components/schemas/CashflowScopeAccount"
    buckets:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/CashflowBucket"
    excluded_system_roles:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/SystemAccountRole"
