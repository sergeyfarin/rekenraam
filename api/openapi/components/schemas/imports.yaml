ImportBatchStatus:
  type: string
  enum:
    - previewing
    - committed
    - partially_committed
    - discarded
    - failed
ImportDedupeStatus:
  type: string
  enum:
    - new
    - duplicate
    - needs_attention
    - excluded
ImportCommitStatus:
  type: string
  enum:
    - pending
    - committed
    - skipped
    - failed
ImportBatchResponse:
  type: object
  required:
    - id
    - book_id
    - source_kind
    - status
    - original_filename
    - source_meta
    - created_at
  properties:
    id:
      type: integer
      format: int64
    book_id:
      type: integer
      format: int64
    source_kind:
      type: string
      description: Source adapter kind selected for the uploaded file.
    profile_id:
      type: integer
      format: int64
    connection_id:
      type: integer
      format: int64
      description: The online connection that produced this batch, if any.
    status:
      $ref: "../../openapi.yaml#/components/schemas/ImportBatchStatus"
    original_filename:
      type: string
    source_meta:
      type: string
      description: JSON object string containing persisted source metadata.
    created_at:
      type: string
      format: date-time
ImportStagedSplit:
  type: object
  required:
    - category_hint
    - amount
    - memo
  properties:
    category_hint:
      type: string
    amount:
      type: string
    memo:
      type: string
ImportNormalizedRow:
  type: object
  required:
    - date
    - amount
    - commodity_hint
    - payee_hint
    - category_hint
    - account_hint
    - transfer_hint
    - memo
    - external_ref
    - splits
  properties:
    investment:
      type: object
      description: Explicit CSV investment source evidence, separate from owner-reviewed resolution.
      required: [kind, instrument_code, gross_amount, withholding_amount, cash_valid]
      properties:
        cash_valid: { type: boolean }
        kind: { type: string, enum: ['', dividend, withholding] }
        instrument_code: { type: string }
        gross_amount: { type: string }
        withholding_amount: { type: string }
    date:
      type: string
      description: ISO date, or the source text when the row's parse_errors include "date".
    amount:
      type: string
      description: Canonical dot-decimal amount, or the source text when the row's parse_errors include "amount".
    parse_errors:
      type: array
      description: >-
        Source values that failed under the file's resolved convention (the
        profile's declared date_layout or decimal_separator, or whole-file
        detection). Such a row is staged needs_attention and commit fails it
        with a commit_error; it is never re-read under another convention.
        Absent when every value parsed.
      items:
        $ref: "../../openapi.yaml#/components/schemas/ImportStagedParseError"
    commodity_hint:
      type: string
    payee_hint:
      type: string
    category_hint:
      type: string
    account_hint:
      type: string
    transfer_hint:
      type: string
    memo:
      type: string
    external_ref:
      type: string
    splits:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/ImportStagedSplit"
ImportResolution:
  type: object
  properties:
    instrument_commodity_id:
      type: integer
      format: int64
      description: Existing paying instrument, distinct from commodity_id (cash currency).
    investment_kind: { type: string, enum: [dividend, withholding] }
    gross_amount:
      type: string
      description: Reviewed canonical dot-decimal gross amount; never inferred from signed cash.
    withholding_amount:
      type: string
      description: Reviewed canonical dot-decimal tax magnitude, including explicit zero.
    withholding_account_id: { type: integer, format: int64 }
    account_id:
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
    payee_id:
      type: integer
      format: int64
    payee_name:
      type: string
    category_id:
      type: integer
      format: int64
    transfer_account_id:
      type: integer
      format: int64
    tag_ids:
      type: array
      items:
        type: integer
        format: int64
    applied_rule_id:
      type: integer
      format: int64
    applied_rule_name:
      type: string
    exclude:
      type: boolean
ImportStagedRowResponse:
  type: object
  required:
    - id
    - batch_id
    - row_index
    - dedupe_fingerprint
    - normalized
    - raw
    - dedupe_status
    - source_changed
    - source_buy_operation
    - source_sale_operation
    - resolution
    - commit_status
    - commit_effects
  properties:
    id:
      type: integer
      format: int64
    batch_id:
      type: integer
      format: int64
    row_index:
      type: integer
    dedupe_fingerprint:
      type: string
    normalized:
      type: string
      description: JSON string matching ImportNormalizedRow.
    raw:
      type: string
      description: JSON string containing source-specific row data.
    dedupe_status:
      $ref: "../../openapi.yaml#/components/schemas/ImportDedupeStatus"
    source_changed:
      type: boolean
      description: A staged Trading 212 order fill differs from the latest accepted source snapshot for the same fill identity. Ordinary batch commit skips it pending correction review.
    source_buy_operation:
      type: boolean
      description: The original committed Trading 212 identity effect is a native investment buy operation.
    source_sale_operation:
      type: boolean
      description: The original committed Trading 212 identity effect is a native investment sale; cash fallback rows are false.
    source_transaction_id:
      type: integer
      format: int64
      description: Original posted transaction linked to the committed Trading 212 identity, when available.
    resolution:
      type: string
      description: JSON string matching ImportResolution.
    commit_status:
      $ref: "../../openapi.yaml#/components/schemas/ImportCommitStatus"
    committed_identity_id:
      type: integer
      format: int64
    committed_transaction_id:
      type: integer
      format: int64
      description: First linked transaction for older single-result consumers; commit_effects is authoritative.
    commit_effects:
      type: array
      items:
        type: object
        required:
          - effect_seq
        properties:
          effect_seq:
            type: integer
            format: int64
          operation_id:
            type: integer
            format: int64
          transaction_id:
            type: integer
            format: int64
    commit_error:
      type: string
ImportStagedParseError:
  type: object
  required: [field, value]
  properties:
    field:
      type: string
      enum: [date, amount, split_amount]
    value:
      type: string
      description: The rejected source text.
ParseWarning:
  type: object
  description: >-
    A non-fatal parse finding. The batch keeps it, so GET /imports/{batch_id}
    returns the same warnings as the upload response.
  required:
    - row_index
    - message
  properties:
    row_index:
      type: integer
      description: Zero-based staged row index, or -1 for a warning about the whole file.
    code:
      type: string
      description: >-
        Stable key for translation. Known codes: unrecognized_date,
        unrecognized_amount, unrecognized_split_amount (value is the source
        text), decimal_separator_conflict (value is the separator the file was
        read with, empty when each amount was read on its own),
        date_layout_conflict and date_layout_ambiguous (value is MDY, DMY or
        YMD). Clients fall back to message for an unknown or absent code.
    value:
      type: string
      description: The code's parameter, see code.
    message:
      type: string
      description: English fallback text.
ImportSourceMeta:
  type: object
  required:
    - account_hints
    - currency_hints
  properties:
    account_hints:
      type: array
      items:
        type: string
    currency_hints:
      type: array
      items:
        type: string
    date_from:
      type: string
      format: date
    date_to:
      type: string
      format: date
    text_encoding:
      type: string
      description: Canonical encoding used to decode the source text.
    encoding_source:
      type: string
      enum: [utf8, bom, detected, selected]
      description: How the text encoding was established.
    encoding_confidence:
      type: integer
      minimum: 0
      maximum: 100
      description: Detector confidence percentage, or 100 for deterministic and explicitly selected encodings.
AnalyzeCSVImportResponse:
  type: object
  required:
    - headers
    - delimiter
    - text_encoding
    - encoding_source
    - encoding_confidence
  properties:
    headers:
      type: array
      minItems: 2
      items:
        type: string
    delimiter:
      type: string
      enum: [comma, semicolon, tab]
    text_encoding:
      type: string
    encoding_source:
      type: string
      enum: [utf8, bom, detected, selected]
    encoding_confidence:
      type: integer
      minimum: 0
      maximum: 100
StartOnlineImportRequest:
  type: object
  required:
    - source
    - connection_id
  properties:
    source:
      type: string
      description: Online source kind. Only "trading212" is currently supported.
    connection_id:
      type: integer
      format: int64
      description: The import connection to fetch from.
StartOnlineImportResponse:
  type: object
  required:
    - batch
  properties:
    batch:
      $ref: "../../openapi.yaml#/components/schemas/ImportBatchResponse"
      description: >-
        The newly created batch, still fetching. Rows are not included; poll
        GET /imports/{batch_id} until source_meta's fetch_status is "ready".
StartImportResponse:
  type: object
  required:
    - batch
    - rows
    - warnings
    - meta
  properties:
    batch:
      $ref: "../../openapi.yaml#/components/schemas/ImportBatchResponse"
    rows:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/ImportStagedRowResponse"
    warnings:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/ParseWarning"
    meta:
      $ref: "../../openapi.yaml#/components/schemas/ImportSourceMeta"
GetImportBatchResponse:
  type: object
  required:
    - batch
    - rows
    - warnings
    - next_cursor
  properties:
    batch:
      $ref: "../../openapi.yaml#/components/schemas/ImportBatchResponse"
    rows:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/ImportStagedRowResponse"
    warnings:
      type: array
      description: The batch's stored parse warnings, on every page.
      items:
        $ref: "../../openapi.yaml#/components/schemas/ParseWarning"
    next_cursor:
      type: [string, 'null']
ListImportBatchesResponse:
  type: object
  required:
    - batches
    - next_cursor
  properties:
    batches:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/ImportBatchResponse"
    next_cursor:
      type: [string, 'null']
RowResolutionPatch:
  type: object
  required:
    - row_id
  properties:
    row_id:
      type: integer
      format: int64
    dedupe_status:
      description: >-
        Defaults to `new` when omitted. For a CSV or QIF bank row, `duplicate`
        with a resolution that names an account is re-decided against that
        account: it is stored as `duplicate` only if the row was already
        committed to that account, and otherwise as `new` (`needs_attention`
        when the row has parse errors).
      allOf:
        - $ref: "../../openapi.yaml#/components/schemas/ImportDedupeStatus"
    resolution:
      type: string
      description: >-
        JSON string matching ImportResolution. Defaults to `{}` when omitted;
        a patch replaces the row's whole review state.
PatchImportBatchRequest:
  description: >-
    Applied atomically. Every patch is validated before any row changes, and
    a row_id outside the batch rejects the whole request.
  type: object
  required:
    - row_resolutions
  properties:
    row_resolutions:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/RowResolutionPatch"
CommitImportBatchRequest:
  type: object
  properties:
    reconciliation_override:
      type: boolean
    reconciliation_override_checkpoint_ids:
      description: >-
        Required with reconciliation_override=true (#305): the ids of the
        preview-commit reconciliation_checkpoints the owner reviewed. Each
        row commits in its own transaction and only if the checkpoints it
        would invalidate are contained in this set; a row reaching any other
        checkpoint is held pending, invalidating nothing, and listed in
        reconciliation_stale_row_ids. An override without it is refused with
        400 VALIDATION_FAILED.
      type: array
      items:
        type: integer
        format: int64
    gain_impact_acknowledgements:
      type: array
      description: >-
        One preview-commit gain_impacts acknowledgement per imported
        acquisition the user accepted (T-126). A row whose current change set
        is missing or differs is held pending and listed in
        gain_review_row_ids; it is never skipped.
      items:
        $ref: "../../openapi.yaml#/components/schemas/ImportRowGainImpactAcknowledgement"
ImportRowGainImpactAcknowledgement:
  type: object
  required: [row_id, acknowledgement]
  properties:
    row_id:
      type: integer
      format: int64
    acknowledgement:
      type: string
CorrectTrading212BuyRequest:
  type: object
  required: [reason]
  properties:
    reason:
      type: string
      minLength: 1
    reconciliation_override:
      type: boolean
    reconciliation_override_checkpoint_ids:
      $ref: "../../openapi.yaml#/components/schemas/ReviewedCheckpointIds"
    gain_impact_acknowledgement:
      type: string
      description: >-
        The gain_impact.acknowledgement token from this command's
        reconciliation-impact preview, accepting the committed-disposal gain
        changes it disclosed (T-126). A non-empty change set without it is
        refused with INVESTMENT_GAIN_IMPACT_ACKNOWLEDGEMENT_REQUIRED, a token
        for any other set with INVESTMENT_GAIN_IMPACT_ACKNOWLEDGEMENT_STALE.

CommitImportBatchResponse:
  type: object
  required:
    - batch_id
    - status
    - total_rows
    - committed_count
    - skipped_count
    - failed_count
    - gain_review_row_ids
    - dividend_review_row_ids
    - reconciliation_hold_row_ids
    - reconciliation_stale_row_ids
  properties:
    batch_id:
      type: integer
      format: int64
    status:
      $ref: "../../openapi.yaml#/components/schemas/ImportBatchStatus"
    total_rows:
      type: integer
    committed_count:
      type: integer
    skipped_count:
      type: integer
    failed_count:
      type: integer
    dividend_review_row_ids:
      type: array
      description: Dividends held pending for owner economic/account review; other valid rows can commit.
      items: { type: integer, format: int64 }
    gain_review_row_ids:
      type: array
      description: >-
        Imported acquisitions held pending because their committed-disposal
        gain changes were not acknowledged as they stand now. The batch stays
        partially_committed; preview and commit again to review them.
      items:
        type: integer
        format: int64
    reconciliation_hold_row_ids:
      type: array
      description: >-
        Rows held pending because they would cross a reconciliation
        checkpoint and reconciliation_override was not set. The batch stays
        partially_committed; commit again with the override to post them
        (#301).
      items:
        type: integer
        format: int64
    reconciliation_stale_row_ids:
      type: array
      description: >-
        Rows held pending because they would invalidate a checkpoint that
        reconciliation_override_checkpoint_ids did not name, such as a
        statement finished after the preview (#305). Nothing was invalidated;
        preview and commit again to review the current set.
      items:
        type: integer
        format: int64
ImportReconciliationIssue:
  type: object
  required:
    - row_index
    - checkpoint_ids
  properties:
    row_index:
      type: integer
    checkpoint_ids:
      type: array
      items:
        type: integer
        format: int64
ImportProfileResponse:
  type: object
  required: [id, name, adapter_kind, config, created_at, updated_at]
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
    adapter_kind:
      type: string
      enum: [csv]
    config:
      type: string
      description: JSON object string containing the adapter mapping, including optional explicit investment mapping.
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
ListImportProfilesResponse:
  type: object
  required: [profiles]
  properties:
    profiles:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/ImportProfileResponse"
CreateImportProfileRequest:
  type: object
  required: [name, adapter_kind, config]
  properties:
    name:
      type: string
    adapter_kind:
      type: string
      enum: [csv]
    config:
      type: string
      description: >-
        JSON object string containing header mappings and locale/sign rules.
        Optional investment mapping has kind (dividend, withholding, column),
        instrument_column (exact existing commodity code), gross_column (required
        except withholding), withholding_column (omitted means zero), and optional
        cash_account_id, income_account_id, withholding_account_id defaults.
        Column kind also requires kind_column and distinct dividend_value and
        withholding_value source texts. Amount/debit/credit columns remain signed
        cash. All amounts use the file-level decimal separator.
UpdateImportProfileRequest:
  type: object
  minProperties: 1
  properties:
    name:
      type: string
    config:
      type: string
      description: JSON object string containing the same mappings as creation, matching hints, locale/sign rules, and optional investment mapping.
PreviewCommitResponse:
  type: object
  required:
    - includable_count
    - duplicate_count
    - reconciliation_issues
    - reconciliation_checkpoints
    - gain_impacts
  properties:
    gain_impacts:
      type: array
      description: >-
        Pending imported acquisitions whose rolled-back writer replay changes
        committed disposal gains against the current ledger (T-126). Rows
        commit chronologically, so an earlier row can change a later row's set;
        that row is then held for another review rather than committed.
      items:
        $ref: "../../openapi.yaml#/components/schemas/ImportRowGainImpact"
    includable_count:
      type: integer
    duplicate_count:
      type: integer
    reconciliation_issues:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/ImportReconciliationIssue"
    reconciliation_checkpoints:
      description: >-
        The union of the active checkpoints the pending rows would
        invalidate, once per checkpoint in id order (#305). A commit's
        reconciliation_override_checkpoint_ids names these ids. entry_date is
        one triggering row's date.
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/ReconciliationCheckpointImpact"
ImportRowGainImpact:
  type: object
  required: [row_id, row_index, gain_impact]
  properties:
    row_id:
      type: integer
      format: int64
    row_index:
      type: integer
    gain_impact:
      $ref: "../../openapi.yaml#/components/schemas/GainImpact"

ImportLinkSplitRequest:
  type: object
  additionalProperties: false
  required: [operation_id]
  properties:
    operation_id:
      type: integer
      format: int64
      description: The recorded split operation this provider row evidences.

ImportSplitCandidate:
  type: object
  required: [operation_id, transaction_id, holding_account_id, effective_on, ratio_numerator, ratio_denominator, linked]
  properties:
    operation_id:
      type: integer
      format: int64
    transaction_id:
      type: [integer, "null"]
      format: int64
      description: Null for an initially journal-free split; linking always uses operation_id.
    holding_account_id:
      type: integer
      format: int64
    effective_on:
      type: string
      format: date
    ratio_numerator:
      type: integer
      format: int64
    ratio_denominator:
      type: integer
      format: int64
    linked:
      type: boolean
      description: Already evidenced by another source row; it cannot be linked again.

ImportSplitCandidatesResponse:
  type: object
  required: [candidates]
  properties:
    candidates:
      type: array
      items:
        $ref: "../schemas/imports.yaml#/ImportSplitCandidate"

ImportLinkShortRequest:
  type: object
  additionalProperties: false
  required: [operation_id]
  properties:
    operation_id:
      type: integer
      format: int64
      description: The recorded short sale or cover the owner asserts this provider row evidences.

ImportShortSource:
  type: object
  description: >
    The staged row's provider evidence as received. A blank value is unknown
    and is not compared.
  required: [operation_kind, fill_type, side, ticker, isin, date, quantity, net_value, net_currency]
  properties:
    operation_kind:
      type: string
      enum: [short_sale, short_cover]
      description: The operation family the row's side can evidence (SELL → short_sale, BUY → short_cover).
    fill_type: { type: string }
    side: { type: string, enum: [BUY, SELL] }
    ticker: { type: string }
    isin: { type: string }
    date:
      type: string
      description: Source date (YYYY-MM-DD), or empty when unknown.
    quantity: { type: string }
    net_value:
      type: string
      description: Signed net wallet cash as the provider reported it.
    net_currency: { type: string }

ImportShortCandidate:
  type: object
  required: [operation_id, operation_kind, transaction_id, holding_account_id, cash_account_id, event_date, quantity, net_amount, cash_currency, linked, mismatches]
  properties:
    operation_id: { type: integer, format: int64 }
    operation_kind: { type: string, enum: [short_sale, short_cover] }
    transaction_id: { type: integer, format: int64 }
    holding_account_id: { type: integer, format: int64 }
    cash_account_id: { type: integer, format: int64 }
    event_date: { type: string, format: date }
    quantity:
      type: string
      description: Canonical dot-decimal units borrowed (short sale) or covered.
    net_amount:
      type: string
      description: Canonical signed dot-decimal net settlement; positive for a short sale, negative for a cover.
    cash_currency: { type: string }
    linked:
      type: boolean
      description: This operation or one it corrects already has source evidence; it cannot be linked again.
    mismatches:
      type: array
      description: Known source facts that disagree with this operation. Only a candidate with none can be linked.
      items:
        type: string
        enum: [date, quantity, cash_amount, cash_currency, holding_account, cash_account]

ImportShortCandidatesResponse:
  type: object
  required: [source, candidates]
  properties:
    source:
      $ref: "../../openapi.yaml#/components/schemas/ImportShortSource"
    candidates:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/ImportShortCandidate"
ImportDividendReview:
  type: object
  required: [row_id, batch_id, row_index, state, source_instrument, source_date, source_cash_amount, source_currency, resolution]
  properties:
    row_id: { type: integer, format: int64 }
    batch_id: { type: integer, format: int64 }
    row_index: { type: integer }
    state: { type: string, enum: [pending, repairable] }
    source_instrument: { type: string }
    source_date: { type: string, format: date }
    source_cash_amount: { type: string, description: 'Canonical source cash, not a declaration of gross income.' }
    source_currency: { type: string, description: 'Original source currency hint, independent of reviewed choices.' }
    transaction_id: { type: integer, format: int64 }
    expected_transaction_version_id: { type: integer, format: int64 }
    resolution: { $ref: '../../openapi.yaml#/components/schemas/ImportResolution' }
ImportDividendReviewsResponse:
  type: object
  required: [rows, next_cursor]
  properties:
    rows:
      type: array
      items: { $ref: '../../openapi.yaml#/components/schemas/ImportDividendReview' }
    next_cursor: { type: [string, 'null'] }
ReviewImportDividendRequest:
  type: object
  required: [resolution]
  properties:
    resolution: { $ref: '../../openapi.yaml#/components/schemas/ImportResolution' }
    expected_transaction_version_id:
      type: integer
      format: int64
      description: Required for repair; must match the current posted ordinary transaction.
    reason: { type: string, description: Required nonempty audit reason for historical repair. }
    reconciliation_override: { type: boolean, default: false }
    reconciliation_override_checkpoint_ids:
      $ref: "../../openapi.yaml#/components/schemas/ReviewedCheckpointIds"
