ImportBatchStatus:
  type: string
  enum:
    - previewing
    - committed
    - partially_committed
    - discarded
    - failed
ImportDedupeStatus:
  type: string
  enum:
    - new
    - duplicate
    - needs_attention
    - excluded
ImportCommitStatus:
  type: string
  enum:
    - pending
    - committed
    - skipped
    - failed
ImportBatchResponse:
  type: object
  required:
    - id
    - book_id
    - source_kind
    - status
    - original_filename
    - source_meta
    - created_at
  properties:
    id:
      type: integer
      format: int64
    book_id:
      type: integer
      format: int64
    source_kind:
      type: string
      description: Source adapter kind selected for the uploaded file.
    profile_id:
      type: integer
      format: int64
    status:
      $ref: "../../openapi.yaml#/components/schemas/ImportBatchStatus"
    original_filename:
      type: string
    source_meta:
      type: string
      description: JSON object string containing persisted source metadata.
    created_at:
      type: string
      format: date-time
ImportStagedSplit:
  type: object
  required:
    - category_hint
    - amount
    - memo
  properties:
    category_hint:
      type: string
    amount:
      type: string
    memo:
      type: string
ImportNormalizedRow:
  type: object
  required:
    - date
    - amount
    - commodity_hint
    - payee_hint
    - category_hint
    - account_hint
    - transfer_hint
    - memo
    - external_ref
    - splits
  properties:
    date:
      type: string
      format: date
    amount:
      type: string
    commodity_hint:
      type: string
    payee_hint:
      type: string
    category_hint:
      type: string
    account_hint:
      type: string
    transfer_hint:
      type: string
    memo:
      type: string
    external_ref:
      type: string
    splits:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/ImportStagedSplit"
ImportResolution:
  type: object
  properties:
    account_id:
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
    payee_id:
      type: integer
      format: int64
    payee_name:
      type: string
    category_id:
      type: integer
      format: int64
    transfer_account_id:
      type: integer
      format: int64
    exclude:
      type: boolean
ImportStagedRowResponse:
  type: object
  required:
    - id
    - batch_id
    - row_index
    - dedupe_fingerprint
    - normalized
    - raw
    - dedupe_status
    - resolution
    - commit_status
  properties:
    id:
      type: integer
      format: int64
    batch_id:
      type: integer
      format: int64
    row_index:
      type: integer
    dedupe_fingerprint:
      type: string
    normalized:
      type: string
      description: JSON string matching ImportNormalizedRow.
    raw:
      type: string
      description: JSON string containing source-specific row data.
    dedupe_status:
      $ref: "../../openapi.yaml#/components/schemas/ImportDedupeStatus"
    resolution:
      type: string
      description: JSON string matching ImportResolution.
    commit_status:
      $ref: "../../openapi.yaml#/components/schemas/ImportCommitStatus"
    committed_transaction_id:
      type: integer
      format: int64
    commit_error:
      type: string
ParseWarning:
  type: object
  required:
    - row_index
    - message
  properties:
    row_index:
      type: integer
    message:
      type: string
ImportSourceMeta:
  type: object
  required:
    - account_hints
    - currency_hints
  properties:
    account_hints:
      type: array
      items:
        type: string
    currency_hints:
      type: array
      items:
        type: string
    date_from:
      type: string
      format: date
    date_to:
      type: string
      format: date
StartImportResponse:
  type: object
  required:
    - batch
    - rows
    - warnings
    - meta
  properties:
    batch:
      $ref: "../../openapi.yaml#/components/schemas/ImportBatchResponse"
    rows:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/ImportStagedRowResponse"
    warnings:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/ParseWarning"
    meta:
      $ref: "../../openapi.yaml#/components/schemas/ImportSourceMeta"
GetImportBatchResponse:
  type: object
  required:
    - batch
    - rows
    - next_cursor
  properties:
    batch:
      $ref: "../../openapi.yaml#/components/schemas/ImportBatchResponse"
    rows:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/ImportStagedRowResponse"
    next_cursor:
      type: string
      nullable: true
ListImportBatchesResponse:
  type: object
  required:
    - batches
    - next_cursor
  properties:
    batches:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/ImportBatchResponse"
    next_cursor:
      type: string
      nullable: true
RowResolutionPatch:
  type: object
  required:
    - row_id
  properties:
    row_id:
      type: integer
      format: int64
    dedupe_status:
      $ref: "../../openapi.yaml#/components/schemas/ImportDedupeStatus"
    resolution:
      type: string
      description: JSON string matching ImportResolution.
PatchImportBatchRequest:
  type: object
  required:
    - row_resolutions
  properties:
    row_resolutions:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/RowResolutionPatch"
CommitImportBatchRequest:
  type: object
  properties:
    reconciliation_override:
      type: boolean
CommitImportBatchResponse:
  type: object
  required:
    - batch_id
    - status
    - total_rows
    - committed_count
    - skipped_count
    - failed_count
  properties:
    batch_id:
      type: integer
      format: int64
    status:
      $ref: "../../openapi.yaml#/components/schemas/ImportBatchStatus"
    total_rows:
      type: integer
    committed_count:
      type: integer
    skipped_count:
      type: integer
    failed_count:
      type: integer
ImportReconciliationIssue:
  type: object
  required:
    - row_index
    - checkpoint_ids
  properties:
    row_index:
      type: integer
    checkpoint_ids:
      type: array
      items:
        type: integer
        format: int64
PreviewCommitResponse:
  type: object
  required:
    - includable_count
    - duplicate_count
    - reconciliation_issues
  properties:
    includable_count:
      type: integer
    duplicate_count:
      type: integer
    reconciliation_issues:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/ImportReconciliationIssue"
