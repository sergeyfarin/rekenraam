ImportBatchStatus:
  type: string
  enum:
    - previewing
    - committed
    - partially_committed
    - discarded
    - failed
ImportDedupeStatus:
  type: string
  enum:
    - new
    - duplicate
    - needs_attention
    - excluded
ImportCommitStatus:
  type: string
  enum:
    - pending
    - committed
    - skipped
    - failed
ImportBatchResponse:
  type: object
  required:
    - id
    - book_id
    - source_kind
    - status
    - original_filename
    - source_meta
    - created_at
  properties:
    id:
      type: integer
      format: int64
    book_id:
      type: integer
      format: int64
    source_kind:
      type: string
      description: Source adapter kind selected for the uploaded file.
    profile_id:
      type: integer
      format: int64
    connection_id:
      type: integer
      format: int64
      description: The online connection that produced this batch, if any.
    status:
      $ref: "../../openapi.yaml#/components/schemas/ImportBatchStatus"
    original_filename:
      type: string
    source_meta:
      type: string
      description: JSON object string containing persisted source metadata.
    created_at:
      type: string
      format: date-time
ImportStagedSplit:
  type: object
  required:
    - category_hint
    - amount
    - memo
  properties:
    category_hint:
      type: string
    amount:
      type: string
    memo:
      type: string
ImportNormalizedRow:
  type: object
  required:
    - date
    - amount
    - commodity_hint
    - payee_hint
    - category_hint
    - account_hint
    - transfer_hint
    - memo
    - external_ref
    - splits
  properties:
    date:
      type: string
      format: date
    amount:
      type: string
    commodity_hint:
      type: string
    payee_hint:
      type: string
    category_hint:
      type: string
    account_hint:
      type: string
    transfer_hint:
      type: string
    memo:
      type: string
    external_ref:
      type: string
    splits:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/ImportStagedSplit"
ImportResolution:
  type: object
  properties:
    account_id:
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
    payee_id:
      type: integer
      format: int64
    payee_name:
      type: string
    category_id:
      type: integer
      format: int64
    transfer_account_id:
      type: integer
      format: int64
    tag_ids:
      type: array
      items:
        type: integer
        format: int64
    applied_rule_id:
      type: integer
      format: int64
    applied_rule_name:
      type: string
    exclude:
      type: boolean
ImportStagedRowResponse:
  type: object
  required:
    - id
    - batch_id
    - row_index
    - dedupe_fingerprint
    - normalized
    - raw
    - dedupe_status
    - source_changed
    - source_buy_operation
    - source_sale_operation
    - resolution
    - commit_status
    - commit_effects
  properties:
    id:
      type: integer
      format: int64
    batch_id:
      type: integer
      format: int64
    row_index:
      type: integer
    dedupe_fingerprint:
      type: string
    normalized:
      type: string
      description: JSON string matching ImportNormalizedRow.
    raw:
      type: string
      description: JSON string containing source-specific row data.
    dedupe_status:
      $ref: "../../openapi.yaml#/components/schemas/ImportDedupeStatus"
    source_changed:
      type: boolean
      description: A staged Trading 212 order fill differs from the latest accepted source snapshot for the same fill identity. Ordinary batch commit skips it pending correction review.
    source_buy_operation:
      type: boolean
      description: The original committed Trading 212 identity effect is a native investment buy operation.
    source_sale_operation:
      type: boolean
      description: The original committed Trading 212 identity effect is a native investment sale; cash fallback rows are false.
    source_transaction_id:
      type: integer
      format: int64
      description: Original posted transaction linked to the committed Trading 212 identity, when available.
    resolution:
      type: string
      description: JSON string matching ImportResolution.
    commit_status:
      $ref: "../../openapi.yaml#/components/schemas/ImportCommitStatus"
    committed_identity_id:
      type: integer
      format: int64
    committed_transaction_id:
      type: integer
      format: int64
      description: First linked transaction for older single-result consumers; commit_effects is authoritative.
    commit_effects:
      type: array
      items:
        type: object
        required:
          - effect_seq
        properties:
          effect_seq:
            type: integer
            format: int64
          operation_id:
            type: integer
            format: int64
          transaction_id:
            type: integer
            format: int64
    commit_error:
      type: string
ParseWarning:
  type: object
  required:
    - row_index
    - message
  properties:
    row_index:
      type: integer
    message:
      type: string
ImportSourceMeta:
  type: object
  required:
    - account_hints
    - currency_hints
  properties:
    account_hints:
      type: array
      items:
        type: string
    currency_hints:
      type: array
      items:
        type: string
    date_from:
      type: string
      format: date
    date_to:
      type: string
      format: date
    text_encoding:
      type: string
      description: Canonical encoding used to decode the source text.
    encoding_source:
      type: string
      enum: [utf8, bom, detected, selected]
      description: How the text encoding was established.
    encoding_confidence:
      type: integer
      minimum: 0
      maximum: 100
      description: Detector confidence percentage, or 100 for deterministic and explicitly selected encodings.
AnalyzeCSVImportResponse:
  type: object
  required:
    - headers
    - delimiter
    - text_encoding
    - encoding_source
    - encoding_confidence
  properties:
    headers:
      type: array
      minItems: 2
      items:
        type: string
    delimiter:
      type: string
      enum: [comma, semicolon, tab]
    text_encoding:
      type: string
    encoding_source:
      type: string
      enum: [utf8, bom, detected, selected]
    encoding_confidence:
      type: integer
      minimum: 0
      maximum: 100
StartOnlineImportRequest:
  type: object
  required:
    - source
    - connection_id
  properties:
    source:
      type: string
      description: Online source kind. Only "trading212" is currently supported.
    connection_id:
      type: integer
      format: int64
      description: The import connection to fetch from.
StartOnlineImportResponse:
  type: object
  required:
    - batch
  properties:
    batch:
      $ref: "../../openapi.yaml#/components/schemas/ImportBatchResponse"
      description: >-
        The newly created batch, still fetching. Rows are not included; poll
        GET /imports/{batch_id} until source_meta's fetch_status is "ready".
StartImportResponse:
  type: object
  required:
    - batch
    - rows
    - warnings
    - meta
  properties:
    batch:
      $ref: "../../openapi.yaml#/components/schemas/ImportBatchResponse"
    rows:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/ImportStagedRowResponse"
    warnings:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/ParseWarning"
    meta:
      $ref: "../../openapi.yaml#/components/schemas/ImportSourceMeta"
GetImportBatchResponse:
  type: object
  required:
    - batch
    - rows
    - next_cursor
  properties:
    batch:
      $ref: "../../openapi.yaml#/components/schemas/ImportBatchResponse"
    rows:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/ImportStagedRowResponse"
    next_cursor:
      type: string
      nullable: true
ListImportBatchesResponse:
  type: object
  required:
    - batches
    - next_cursor
  properties:
    batches:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/ImportBatchResponse"
    next_cursor:
      type: string
      nullable: true
RowResolutionPatch:
  type: object
  required:
    - row_id
  properties:
    row_id:
      type: integer
      format: int64
    dedupe_status:
      $ref: "../../openapi.yaml#/components/schemas/ImportDedupeStatus"
    resolution:
      type: string
      description: JSON string matching ImportResolution.
PatchImportBatchRequest:
  type: object
  required:
    - row_resolutions
  properties:
    row_resolutions:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/RowResolutionPatch"
CommitImportBatchRequest:
  type: object
  properties:
    reconciliation_override:
      type: boolean
    gain_impact_acknowledgements:
      type: array
      description: >-
        One preview-commit gain_impacts acknowledgement per imported
        acquisition the user accepted (T-126). A row whose current change set
        is missing or differs is held pending and listed in
        gain_review_row_ids; it is never skipped.
      items:
        $ref: "../../openapi.yaml#/components/schemas/ImportRowGainImpactAcknowledgement"
ImportRowGainImpactAcknowledgement:
  type: object
  required: [row_id, acknowledgement]
  properties:
    row_id:
      type: integer
      format: int64
    acknowledgement:
      type: string
CorrectTrading212BuyRequest:
  type: object
  required: [reason]
  properties:
    reason:
      type: string
      minLength: 1
    reconciliation_override:
      type: boolean
    gain_impact_acknowledgement:
      type: string
      description: >-
        The gain_impact.acknowledgement token from this command's
        reconciliation-impact preview, accepting the committed-disposal gain
        changes it disclosed (T-126). A non-empty change set without it is
        refused with INVESTMENT_GAIN_IMPACT_ACKNOWLEDGEMENT_REQUIRED, a token
        for any other set with INVESTMENT_GAIN_IMPACT_ACKNOWLEDGEMENT_STALE.

CommitImportBatchResponse:
  type: object
  required:
    - batch_id
    - status
    - total_rows
    - committed_count
    - skipped_count
    - failed_count
    - gain_review_row_ids
  properties:
    batch_id:
      type: integer
      format: int64
    status:
      $ref: "../../openapi.yaml#/components/schemas/ImportBatchStatus"
    total_rows:
      type: integer
    committed_count:
      type: integer
    skipped_count:
      type: integer
    failed_count:
      type: integer
    gain_review_row_ids:
      type: array
      description: >-
        Imported acquisitions held pending because their committed-disposal
        gain changes were not acknowledged as they stand now. The batch stays
        partially_committed; preview and commit again to review them.
      items:
        type: integer
        format: int64
ImportReconciliationIssue:
  type: object
  required:
    - row_index
    - checkpoint_ids
  properties:
    row_index:
      type: integer
    checkpoint_ids:
      type: array
      items:
        type: integer
        format: int64
ImportProfileResponse:
  type: object
  required: [id, name, adapter_kind, config, created_at, updated_at]
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
    adapter_kind:
      type: string
      enum: [csv]
    config:
      type: string
      description: JSON object string containing the adapter mapping.
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
ListImportProfilesResponse:
  type: object
  required: [profiles]
  properties:
    profiles:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/ImportProfileResponse"
CreateImportProfileRequest:
  type: object
  required: [name, adapter_kind, config]
  properties:
    name:
      type: string
    adapter_kind:
      type: string
      enum: [csv]
    config:
      type: string
      description: JSON object string containing header mappings and locale/sign rules.
UpdateImportProfileRequest:
  type: object
  minProperties: 1
  properties:
    name:
      type: string
    config:
      type: string
      description: JSON object string containing header mappings, matching hints, and locale/sign rules.
PreviewCommitResponse:
  type: object
  required:
    - includable_count
    - duplicate_count
    - reconciliation_issues
    - gain_impacts
  properties:
    gain_impacts:
      type: array
      description: >-
        Pending imported acquisitions whose rolled-back writer replay changes
        committed disposal gains against the current ledger (T-126). Rows
        commit chronologically, so an earlier row can change a later row's set;
        that row is then held for another review rather than committed.
      items:
        $ref: "../../openapi.yaml#/components/schemas/ImportRowGainImpact"
    includable_count:
      type: integer
    duplicate_count:
      type: integer
    reconciliation_issues:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/ImportReconciliationIssue"
ImportRowGainImpact:
  type: object
  required: [row_id, row_index, gain_impact]
  properties:
    row_id:
      type: integer
      format: int64
    row_index:
      type: integer
    gain_impact:
      $ref: "../../openapi.yaml#/components/schemas/GainImpact"

ImportLinkSplitRequest:
  type: object
  additionalProperties: false
  required: [operation_id]
  properties:
    operation_id:
      type: integer
      format: int64
      description: The recorded split operation this provider row evidences.

ImportSplitCandidate:
  type: object
  required: [operation_id, transaction_id, holding_account_id, effective_on, ratio_numerator, ratio_denominator, linked]
  properties:
    operation_id:
      type: integer
      format: int64
    transaction_id:
      type: integer
      format: int64
    holding_account_id:
      type: integer
      format: int64
    effective_on:
      type: string
      format: date
    ratio_numerator:
      type: integer
      format: int64
    ratio_denominator:
      type: integer
      format: int64
    linked:
      type: boolean
      description: Already evidenced by another source row; it cannot be linked again.

ImportSplitCandidatesResponse:
  type: object
  required: [candidates]
  properties:
    candidates:
      type: array
      items:
        $ref: "../schemas/imports.yaml#/ImportSplitCandidate"
