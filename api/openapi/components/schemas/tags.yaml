TagKind:
  type: string
  enum:
    - project
    - person
    - flag
    - place
    - custom
TagStatus:
  type: string
  enum:
    - active
    - archived
TagResponse:
  type: object
  required:
    - id
    - book_id
    - name
    - kind
    - status
    - metadata
    - created_at
    - updated_at
  properties:
    id:
      type: integer
      format: int64
    book_id:
      type: integer
      format: int64
      description: Current runtime always uses book id 1.
    name:
      type: string
      maxLength: 120
      description: User-entered tag label. Built-in translation is not applied to user tags.
    kind:
      $ref: "../../openapi.yaml#/components/schemas/TagKind"
      description: Tag kind is mutable; existing references keep pointing to the same tag and will see the new grouping.
    color:
      type: string
      pattern: "^#[0-9A-Fa-f]{6}$"
      description: Optional hex color token for tag UI.
    icon:
      type: string
      maxLength: 64
      pattern: "^[a-z][a-z0-9_-]*$"
      description: Optional stable icon token for tag UI.
    status:
      $ref: "../../openapi.yaml#/components/schemas/TagStatus"
    metadata:
      type: object
      additionalProperties: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
TagDirectoryResponse:
  type: object
  required: [tags, next_cursor]
  properties:
    tags:
      type: array
      items:
        type: object
        required: [id, name, kind, status, transaction_count]
        properties:
          id:
            type: integer
            format: int64
          name:
            type: string
          kind:
            $ref: "../../openapi.yaml#/components/schemas/TagKind"
          status:
            $ref: "../../openapi.yaml#/components/schemas/TagStatus"
          transaction_count:
            type: integer
            minimum: 0
            description: Non-deleted and non-draft transactions with the tag on the transaction or a current posting. Each transaction is counted once.
    next_cursor:
      type: [string, 'null']
TagsResponse:
  type: object
  required:
    - tags
  properties:
    tags:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/TagResponse"
TagRequest:
  type: object
  required:
    - name
  properties:
    name:
      type: string
      maxLength: 120
    kind:
      $ref: "../../openapi.yaml#/components/schemas/TagKind"
      description: Defaults to custom when omitted.
    color:
      type: string
      pattern: "^#[0-9A-Fa-f]{6}$"
    icon:
      type: string
      maxLength: 64
      pattern: "^[a-z][a-z0-9_-]*$"
    metadata:
      type: object
      additionalProperties: true
  additionalProperties: false
TagPatchRequest:
  type: object
  description: Omitted fields retain their stored values.
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 120
    kind:
      $ref: "../../openapi.yaml#/components/schemas/TagKind"
    color:
      type: string
      pattern: "^(#[0-9A-Fa-f]{6})?$"
      description: An empty string clears the color.
    icon:
      type: string
      maxLength: 64
      pattern: "^([a-z][a-z0-9_-]*)?$"
      description: An empty string clears the icon.
    metadata:
      type: object
      additionalProperties: true
      description: Send an empty object to clear metadata.
  additionalProperties: false
