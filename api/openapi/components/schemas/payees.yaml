PayeeStatus:
  type: string
  enum:
    - active
    - archived
PayeeResponse:
  type: object
  required:
    - id
    - book_id
    - status
    - name
    - metadata
    - effective_from
    - change_reason
    - created_at
    - updated_at
  properties:
    id:
      type: integer
      format: int64
    book_id:
      type: integer
      format: int64
    status:
      $ref: "../../openapi.yaml#/components/schemas/PayeeStatus"
    name:
      type: string
      maxLength: 200
    default_account_id:
      type: integer
      format: int64
    default_category_account_id:
      type: integer
      format: int64
    metadata:
      type: object
      additionalProperties: true
    effective_from:
      type: string
      format: date
    change_reason:
      type: string
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
PayeesResponse:
  type: object
  required:
    - payees
  properties:
    payees:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/PayeeResponse"
PayeeDirectoryResponse:
  type: object
  required: [payees]
  properties:
    payees:
      type: array
      items:
        type: object
        required: [id, name, status, transaction_count, last_used_on]
        properties:
          id:
            type: integer
            format: int64
          name:
            type: string
          status:
            $ref: "../../openapi.yaml#/components/schemas/PayeeStatus"
          transaction_count:
            type: integer
            format: int64
            minimum: 0
            description: Number of current, non-deleted transactions in the ordinary Transactions view linked to this payee.
          last_used_on:
            type: [string, 'null']
            format: date
            description: Latest transaction date among the counted transactions, or null when unused.
    next_cursor:
      type: string
PayeeRequest:
  type: object
  properties:
    name:
      type: string
      maxLength: 200
    default_account_id:
      type: integer
      format: int64
    clear_default_account:
      type: boolean
    default_category_account_id:
      type: integer
      format: int64
    clear_default_category:
      type: boolean
    metadata:
      type: object
      additionalProperties: true
    effective_from:
      type: string
      format: date
    change_reason:
      type: string
  additionalProperties: false
PayeeLifecycleRequest:
  type: object
  properties:
    effective_from:
      type: string
      format: date
    change_reason:
      type: string
  additionalProperties: false

PayeeSuggestionsResponse:
  type: object
  required: [payees]
  properties:
    payees:
      type: array
      maxItems: 5
      items:
        type: object
        required: [id, name, exact]
        properties:
          id:
            type: integer
            format: int64
          name:
            type: string
          exact:
            type: boolean
            description: Whether the full normalized name equals the query.
