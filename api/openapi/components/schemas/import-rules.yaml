ImportRuleMatchField:
  type: string
  enum: [payee, description]
ImportRuleResponse:
  type: object
  required: [id, name, priority, enabled, match_field, contains_text, tag_ids, created_at, updated_at]
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
    priority:
      type: integer
      minimum: 0
      maximum: 1000000
      description: Lower priorities run first; ties are resolved by rule ID.
    enabled:
      type: boolean
    match_field:
      $ref: "../../openapi.yaml#/components/schemas/ImportRuleMatchField"
    contains_text:
      type: string
      description: Case-insensitive literal substring; regular expressions are not supported.
    category_id:
      type: integer
      format: int64
    payee_id:
      type: integer
      format: int64
    tag_ids:
      type: array
      items:
        type: integer
        format: int64
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
ListImportRulesResponse:
  type: object
  required: [rules]
  properties:
    rules:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/ImportRuleResponse"
CreateImportRuleRequest:
  type: object
  required: [name, match_field, contains_text]
  properties:
    name:
      type: string
      maxLength: 200
    priority:
      type: integer
      minimum: 0
      maximum: 1000000
      default: 100
    enabled:
      type: boolean
      default: true
    match_field:
      $ref: "../../openapi.yaml#/components/schemas/ImportRuleMatchField"
    contains_text:
      type: string
      maxLength: 500
    category_id:
      type: integer
      format: int64
    payee_id:
      type: integer
      format: int64
    tag_ids:
      type: array
      items:
        type: integer
        format: int64
  additionalProperties: false
UpdateImportRuleRequest:
  type: object
  minProperties: 1
  properties:
    name:
      type: string
      maxLength: 200
    priority:
      type: integer
      minimum: 0
      maximum: 1000000
    enabled:
      type: boolean
    match_field:
      $ref: "../../openapi.yaml#/components/schemas/ImportRuleMatchField"
    contains_text:
      type: string
      maxLength: 500
    category_id:
      type: integer
      format: int64
    clear_category:
      type: boolean
    payee_id:
      type: integer
      format: int64
    clear_payee:
      type: boolean
    tag_ids:
      type: array
      items:
        type: integer
        format: int64
  additionalProperties: false
