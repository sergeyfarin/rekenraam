PriceObservationResponse:
  type: object
  required:
    - id
    - book_id
    - series_id
    - base_commodity_id
    - quote_commodity_id
    - quote_type
    - adjustment_basis
    - price_value
    - price_scale
    - base_quantity_value
    - base_quantity_scale
    - valuation_date
    - is_manual
    - is_derived
    - is_approximate
    - derivation
    - derivation_text
    - metadata
    - recorded_at
  properties:
    price_status:
      type: string
      enum: [usable, stale]
      description: Present on selected current rates. Stale is older than seven calendar days; the labelled rate remains visible.
    valuation_as_of: { type: string, format: date }
    knowledge_cutoff: { type: string, format: date-time }

    id:
      type: integer
      format: int64
    book_id:
      type: integer
      format: int64
      description: Current runtime always uses book id 1.
    series_id:
      type: integer
      format: int64
    base_commodity_id:
      type: integer
      format: int64
    quote_commodity_id:
      type: integer
      format: int64
    quote_type:
      type: string
    adjustment_basis:
      type: string
    price_value:
      type: string
      pattern: '^[1-9][0-9]*$'
      description: Exact positive int64 coefficient as a decimal string.
    price_scale:
      type: integer
    base_quantity_value:
      type: string
      pattern: '^[1-9][0-9]*$'
      description: Exact positive int64 base quantity coefficient as a decimal string.
    base_quantity_scale:
      type: integer
    valuation_date:
      type: string
      format: date
    observed_at:
      type: string
      format: date-time
    source_published_at:
      type: string
      format: date-time
    source_id:
      type: integer
      format: int64
    provider_observation_id:
      type: string
    is_manual:
      type: boolean
    is_derived:
      type: boolean
    is_approximate:
      type: boolean
    source_transaction_version_id:
      type: integer
      format: int64
    supersedes_observation_id:
      type: integer
      format: int64
    derivation:
      type: object
      additionalProperties: true
    derivation_text:
      type: string
      description: Original stored derivation JSON for lossless inspection of nested exact numeric evidence.
    metadata:
      type: object
      additionalProperties: true
    voided_at:
      type: string
      format: date-time
      description: >-
        Set when the observation has been retired. Voided observations are
        excluded from every valuation and from listings unless include_voided
        is requested.
    void_reason:
      type: string
      description: Why the observation was retired.
    recorded_at:
      type: string
      format: date-time

PriceObservationVoidRequest:
  type: object
  required:
    - void_reason
  properties:
    expected_impact:
      type: string
      minLength: 64
      maxLength: 64
      description: Optional legacy compatibility; the operator UI supplies a fresh impact token.
    void_reason:
      type: string
      minLength: 1
      maxLength: 500
      description: Why this observation must stop being used. Required.
    change_reason:
      type: string
  additionalProperties: false

PriceObservationVoidResponse:
  type: object
  required:
    - prices
  properties:
    prices:
      type: array
      description: >-
        The voided observation first, followed by every observation
        triangulated from it that the void also retired.
      items:
        $ref: "#/PriceObservationResponse"

PriceObservationsResponse:
  type: object
  required:
    - prices
  properties:
    prices:
      type: array
      items:
        $ref: "#/PriceObservationResponse"

MarketDataSourceResponse:
  type: object
  required:
    - id
    - code
    - name
    - kind
    - status
    - metadata
    - created_at
  properties:
    id:
      type: integer
      format: int64
    code:
      type: string
    name:
      type: string
    kind:
      type: string
      enum:
        - manual
        - provider
        - import
    provider_key:
      type: string
    base_url:
      type: string
    status:
      type: string
      enum:
        - active
        - disabled
    metadata:
      type: object
      additionalProperties: true
    created_at:
      type: string
      format: date-time

MarketDataSourcesResponse:
  type: object
  required:
    - sources
  properties:
    sources:
      type: array
      items:
        $ref: "#/MarketDataSourceResponse"

PricingPolicyResponse:
  type: object
  required:
    - id
    - book_id
    - refresh_enabled
    - refresh_hour_utc
    - refresh_minute_utc
    - refresh_hour_local
    - refresh_minute_local
    - max_backfill_days
    - staleness_max_days
    - triangulation_max_hops
    - rounding_mode
    - prefer_official_fx
    - weekend_policy
    - created_at
    - updated_at
  properties:
    id:
      type: integer
      format: int64
    book_id:
      type: integer
      format: int64
    base_commodity_id:
      type: integer
      format: int64
    default_source_id:
      type: integer
      format: int64
    refresh_enabled:
      type: boolean
    refresh_hour_utc:
      type: integer
      minimum: 0
      maximum: 23
    refresh_minute_utc:
      type: integer
      minimum: 0
      maximum: 59
    refresh_hour_local:
      type: integer
      minimum: 0
      maximum: 23
    refresh_minute_local:
      type: integer
      minimum: 0
      maximum: 59
    max_backfill_days:
      type: integer
      minimum: 1
    staleness_max_days:
      type: integer
      minimum: 1
    triangulation_max_hops:
      type: integer
      description: >-
        Intermediate currencies a derived FX rate may route through when no
        direct rate is available. 0 disables derivation entirely; 1 allows
        A->X->B; higher values allow longer chains. The shortest available
        chain is always used.
      minimum: 0
      maximum: 4
    rounding_mode:
      type: string
      enum:
        - half_up
        - half_even
        - down
        - up
    prefer_official_fx:
      type: boolean
    weekend_policy:
      type: string
      enum:
        - skip
        - fill_previous
        - download
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

PricingPolicyRequest:
  type: object
  properties:
    base_commodity_id:
      type: integer
      format: int64
    default_source_id:
      type: integer
      format: int64
    refresh_enabled:
      type: boolean
    refresh_hour_utc:
      type: integer
      minimum: 0
      maximum: 23
    refresh_minute_utc:
      type: integer
      minimum: 0
      maximum: 59
    refresh_hour_local:
      type: integer
      minimum: 0
      maximum: 23
    refresh_minute_local:
      type: integer
      minimum: 0
      maximum: 59
    max_backfill_days:
      type: integer
      minimum: 1
    staleness_max_days:
      type: integer
      minimum: 1
    triangulation_max_hops:
      type: integer
      description: >-
        Intermediate currencies a derived FX rate may route through when no
        direct rate is available. 0 disables derivation entirely; 1 allows
        A->X->B; higher values allow longer chains. The shortest available
        chain is always used.
      minimum: 0
      maximum: 4
    rounding_mode:
      type: string
    prefer_official_fx:
      type: boolean
    weekend_policy:
      type: string
    change_reason:
      type: string
  additionalProperties: false

