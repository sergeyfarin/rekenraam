PriceObservationResponse:
  type: object
  required:
    - id
    - book_id
    - series_id
    - base_commodity_id
    - quote_commodity_id
    - quote_type
    - adjustment_basis
    - price_value
    - price_scale
    - base_quantity_value
    - base_quantity_scale
    - valuation_date
    - is_manual
    - is_derived
    - derivation
    - metadata
    - recorded_at
  properties:
    id:
      type: integer
      format: int64
    book_id:
      type: integer
      format: int64
      description: Current runtime always uses book id 1.
    series_id:
      type: integer
      format: int64
    base_commodity_id:
      type: integer
      format: int64
    quote_commodity_id:
      type: integer
      format: int64
    quote_type:
      type: string
    adjustment_basis:
      type: string
    price_value:
      type: integer
      format: int64
      description: Exact quote amount integer.
    price_scale:
      type: integer
      description: Decimal scale for price_value.
    base_quantity_value:
      type: integer
      format: int64
      description: Exact base quantity integer for the observed price.
    base_quantity_scale:
      type: integer
      description: Decimal scale for base_quantity_value.
    valuation_date:
      type: string
      format: date
    observed_at:
      type: string
      format: date-time
    source_published_at:
      type: string
      format: date-time
    source_id:
      type: integer
      format: int64
    provider_observation_id:
      type: string
    is_manual:
      type: boolean
    is_derived:
      type: boolean
    supersedes_observation_id:
      type: integer
      format: int64
    derivation:
      type: object
      additionalProperties: true
    metadata:
      type: object
      additionalProperties: true
    recorded_at:
      type: string
      format: date-time

PriceObservationsResponse:
  type: object
  required:
    - prices
  properties:
    prices:
      type: array
      items:
        $ref: "#/PriceObservationResponse"

MarketDataSourceResponse:
  type: object
  required:
    - id
    - code
    - name
    - kind
    - status
    - metadata
    - created_at
  properties:
    id:
      type: integer
      format: int64
    code:
      type: string
    name:
      type: string
    kind:
      type: string
      enum:
        - manual
        - provider
        - import
    provider_key:
      type: string
    base_url:
      type: string
    status:
      type: string
      enum:
        - active
        - disabled
    metadata:
      type: object
      additionalProperties: true
    created_at:
      type: string
      format: date-time

MarketDataSourcesResponse:
  type: object
  required:
    - sources
  properties:
    sources:
      type: array
      items:
        $ref: "#/MarketDataSourceResponse"

PricingPolicyResponse:
  type: object
  required:
    - id
    - book_id
    - refresh_enabled
    - refresh_hour_utc
    - refresh_minute_utc
    - refresh_hour_local
    - refresh_minute_local
    - max_backfill_days
    - staleness_max_days
    - triangulation_max_hops
    - rounding_mode
    - prefer_official_fx
    - weekend_policy
    - created_at
    - updated_at
  properties:
    id:
      type: integer
      format: int64
    book_id:
      type: integer
      format: int64
    base_commodity_id:
      type: integer
      format: int64
    default_source_id:
      type: integer
      format: int64
    refresh_enabled:
      type: boolean
    refresh_hour_utc:
      type: integer
      minimum: 0
      maximum: 23
    refresh_minute_utc:
      type: integer
      minimum: 0
      maximum: 59
    refresh_hour_local:
      type: integer
      minimum: 0
      maximum: 23
    refresh_minute_local:
      type: integer
      minimum: 0
      maximum: 59
    max_backfill_days:
      type: integer
      minimum: 1
    staleness_max_days:
      type: integer
      minimum: 1
    triangulation_max_hops:
      type: integer
      minimum: 0
      maximum: 4
    rounding_mode:
      type: string
      enum:
        - half_up
        - half_even
        - down
        - up
    prefer_official_fx:
      type: boolean
    weekend_policy:
      type: string
      enum:
        - skip
        - fill_previous
        - download
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

PricingPolicyRequest:
  type: object
  properties:
    base_commodity_id:
      type: integer
      format: int64
    default_source_id:
      type: integer
      format: int64
    refresh_enabled:
      type: boolean
    refresh_hour_utc:
      type: integer
      minimum: 0
      maximum: 23
    refresh_minute_utc:
      type: integer
      minimum: 0
      maximum: 59
    refresh_hour_local:
      type: integer
      minimum: 0
      maximum: 23
    refresh_minute_local:
      type: integer
      minimum: 0
      maximum: 59
    max_backfill_days:
      type: integer
      minimum: 1
    staleness_max_days:
      type: integer
      minimum: 1
    triangulation_max_hops:
      type: integer
      minimum: 0
      maximum: 4
    rounding_mode:
      type: string
    prefer_official_fx:
      type: boolean
    weekend_policy:
      type: string
    change_reason:
      type: string
  additionalProperties: false

