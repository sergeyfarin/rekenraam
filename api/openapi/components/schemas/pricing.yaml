PricingRefreshRunResponse:
  type: object
  required:
    - id
    - book_id
    - source_id
    - trigger
    - status
    - started_at
    - items_total
    - items_succeeded
    - items_failed
  properties:
    id:
      type: integer
      format: int64
    book_id:
      type: integer
      format: int64
    source_id:
      type: integer
      format: int64
    trigger:
      type: string
      enum:
        - manual
        - scheduled
        - domain
        - recovery
        - import
    status:
      type: string
      enum:
        - running
        - succeeded
        - failed
        - partial
    started_at:
      type: string
      format: date-time
    finished_at:
      type: string
      format: date-time
    items_total:
      type: integer
    items_succeeded:
      type: integer
    items_failed:
      type: integer
    last_error:
      type: string

PricingRefreshRunsResponse:
  type: object
  required:
    - runs
    - has_more
  properties:
    runs:
      type: array
      items:
        $ref: "#/PricingRefreshRunResponse"
    has_more:
      type: boolean

PricingRefreshRunRequest:
  type: object
  properties:
    source_id:
      type: integer
      format: int64
    trigger:
      type: string
      enum:
        - manual
        - scheduled
        - import
  additionalProperties: false

PricingSourceHealthResponse:
  type: object
  required:
    - id
    - book_id
    - commodity_id
    - quote_commodity_id
    - source_id
    - updated_at
    - status
  properties:
    id:
      type: integer
      format: int64
    book_id:
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
    quote_commodity_id:
      type: integer
      format: int64
    source_id:
      type: integer
      format: int64
    last_success_date:
      type: string
      format: date
    last_attempt_at:
      type: string
      format: date-time
    last_error:
      type: string
    updated_at:
      type: string
      format: date-time
    status:
      type: string
      enum:
        - ok
        - error
        - never_run

PricingBackgroundWorkResponse:
  type: object
  description: >-
    A durable pricing background work item. Only items that exhausted their
    retry budget and moved to the failed status are surfaced; they stay queued
    until re-enqueued manually.
  required:
    - id
    - kind
    - attempts
    - created_at
    - updated_at
  properties:
    id:
      type: integer
      format: int64
    kind:
      type: string
      examples:
        - pricing.fx_coverage
    reason:
      type: string
      description: Why the work was originally enqueued.
    attempts:
      type: integer
      description: Attempts made before the item was given up on.
    last_error:
      type: string
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

PricingSourceHealthListResponse:
  type: object
  required:
    - sources
    - failed_background_work
  properties:
    sources:
      type: array
      items:
        $ref: "#/PricingSourceHealthResponse"
    failed_background_work:
      type: array
      description: Pricing background work that gave up after its maximum attempts.
      items:
        $ref: "#/PricingBackgroundWorkResponse"
