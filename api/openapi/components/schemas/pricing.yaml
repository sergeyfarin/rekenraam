      type: string
      enum:
        - ok
        - error
        - never_run

PricingBackgroundWorkResponse:
  type: object
  description: >-
    A durable pricing background work item. Only items that exhausted their
    retry budget and moved to the failed status are surfaced; they stay queued
    until re-enqueued manually.
  required:
    - id
    - kind
    - attempts
    - created_at
    - updated_at
  properties:
    id:
      type: integer
      format: int64
    kind:
      type: string
      examples:
        - pricing.fx_coverage
    reason:
      type: string
      description: Why the work was originally enqueued.
    attempts:
      type: integer
      description: Attempts made before the item was given up on.
    last_error:
      type: string
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

PricingSourceHealthListResponse:
  type: object
  required:
    - sources
    - failed_background_work
  properties:
    sources:
      type: array
      items:
        $ref: "#/PricingSourceHealthResponse"
    failed_background_work:
      type: array
      description: Pricing background work that gave up after its maximum attempts.
      items:
        $ref: "#/PricingBackgroundWorkResponse"

PricingCommodityResponse:
  type: object
  required:
  - id
  - code
  - name
  - kind
  - status
  properties:
    id:
      type: integer
      format: int64
      minimum: 1
    code:
      type: string
    name:
      type: string
    kind:
      type: string
    status:
      type: string
  additionalProperties: false
PricingCoverageResponse:
  type: object
  required:
  - base_commodity_id
  - quote_commodity_id
  - status
  properties:
    reason:
      type: string
      enum: [usable, future_only, incompatible_quote_basis, not_known_at_cutoff, no_observation_in_window, conflicting_splits]
      description: Why no compatible observation was selected, or why a recent one cannot value the pair (conflicting_splits); absent for a pair without any live evidence.

    base_commodity_id:
      type: integer
      format: int64
      minimum: 1
    quote_commodity_id:
      type: integer
      format: int64
      minimum: 1
    status:
      type: string
      enum:
      - usable
      - stale
      - missing
      description: stale when the observation is older than staleness_max_days or valuation_window_days; missing when there is none, or when valuation cannot use a recent one (reason says why, and observation stays present).
    age_days:
      type: integer
      minimum: 0
    observation:
      $ref: ../../openapi.yaml#/components/schemas/PriceObservationResponse
  additionalProperties: false
PricingWorkspaceResponse:
  type: object
  required:
  - as_of
  - staleness_max_days
  - valuation_window_days
  - commodities
  - sources
  - coverage
  properties:
    as_of:
      type: string
      format: date
    staleness_max_days:
      type: integer
      description: The pricing policy's out-of-date limit, as configured.
    valuation_window_days:
      type: integer
      description: The longest age at which reports, and so Home, value with a price. Coverage applies the smaller of the two limits.
    commodities:
      type: array
      items:
        $ref: ../../openapi.yaml#/components/schemas/PricingCommodityResponse
    sources:
      type: array
      items:
        $ref: ../../openapi.yaml#/components/schemas/MarketDataSourceResponse
    coverage:
      type: array
      items:
        $ref: ../../openapi.yaml#/components/schemas/PricingCoverageResponse
  additionalProperties: false
PriceHistoryResponse:
  type: object
  required:
  - prices
  properties:
    prices:
      type: array
      items:
        $ref: ../../openapi.yaml#/components/schemas/PriceObservationResponse
    next_cursor:
      type: string
  additionalProperties: false
ManualPriceRequest:
  type: object
  required:
  - base_commodity_id
  - quote_commodity_id
  - valuation_date
  - price_value
  - price_scale
  - base_quantity_value
  - base_quantity_scale
  - reason
  properties:
    base_commodity_id:
      type: integer
      format: int64
      minimum: 1
    quote_commodity_id:
      type: integer
      format: int64
      minimum: 1
    valuation_date:
      type: string
      format: date
    price_value:
      type: string
      pattern: ^[1-9][0-9]*$
      maxLength: 19
      description: Positive int64 coefficient, canonical decimal string. Maximum 9223372036854775807.
    price_scale:
      type: integer
      minimum: 0
      maximum: 18
    base_quantity_value:
      type: string
      pattern: ^[1-9][0-9]*$
      maxLength: 19
      description: Positive int64 coefficient, canonical decimal string. Maximum 9223372036854775807.
    base_quantity_scale:
      type: integer
      minimum: 0
      maximum: 18
    adjustment_basis:
      type: string
      enum:
      - raw
      - total_return
      default: raw
      description: raw values ledger units; total_return values only an R13 benchmark declared total-return and is refused for a currency base.
    observed_at:
      type: string
      format: date-time
    reference:
      type: string
      maxLength: 500
    reason:
      type: string
      minLength: 1
      maxLength: 500
  additionalProperties: false
CorrectPriceRequest:
  type: object
  required:
  - price_value
  - price_scale
  - base_quantity_value
  - base_quantity_scale
  - reason
  - expected_impact
  properties:
    price_value:
      type: string
      pattern: ^[1-9][0-9]*$
      maxLength: 19
      description: Positive int64 coefficient, canonical decimal string. Maximum 9223372036854775807.
    price_scale:
      type: integer
      minimum: 0
      maximum: 18
    base_quantity_value:
      type: string
      pattern: ^[1-9][0-9]*$
      maxLength: 19
      description: Positive int64 coefficient, canonical decimal string. Maximum 9223372036854775807.
    base_quantity_scale:
      type: integer
      minimum: 0
      maximum: 18
    adjustment_basis:
      type: string
      description: Optional. A correction keeps the replaced observation's basis; any other value is refused.
    observed_at:
      type: string
      format: date-time
    reference:
      type: string
      maxLength: 500
    reason:
      type: string
      minLength: 1
      maxLength: 500
    expected_impact:
      type: string
      minLength: 64
      maxLength: 64
  additionalProperties: false
PriceImpactResponse:
  type: object
  required:
  - prices
  - token
  properties:
    prices:
      type: array
      minItems: 1
      items:
        $ref: ../../openapi.yaml#/components/schemas/PriceObservationResponse
    token:
      type: string
      minLength: 64
      maxLength: 64
  additionalProperties: false
CorrectPriceResponse:
  type: object
  required:
  - replacement
  - retired
  properties:
    replacement:
      $ref: ../../openapi.yaml#/components/schemas/PriceObservationResponse
    retired:
      type: array
      items:
        $ref: ../../openapi.yaml#/components/schemas/PriceObservationResponse
  additionalProperties: false

PriceObservationRequest:
  type: object
  required:
    - quote_commodity_id
    - price_value
    - price_scale
    - derivation
    - series_metadata
    - metadata
  properties:
    base_commodity_id: &id001
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
      description: Legacy alias for base_commodity_id.
    quote_commodity_id: *id001
    quote_type:
      type: string
    adjustment_basis:
      type: string
    price_value:
      type: integer
      format: int64
      minimum: 1
      description: Legacy numeric coefficient. Browser entry uses /pricing/manual with exact strings.
    price_scale: &id002
      type: integer
      minimum: 0
      maximum: 18
    base_quantity_value:
      type: integer
      format: int64
      minimum: 0
      default: 1
    base_quantity_scale: *id002
    valuation_date:
      type: string
      format: date
    price_date:
      type: string
      format: date
      description: Legacy alias for valuation_date.
    observed_at:
      type: string
      format: date-time
    source_published_at:
      type: string
      format: date-time
    source_id:
      type:
        - integer
        - 'null'
      format: int64
    market_code:
      type: string
    provider_series_id:
      type: string
    provider_observation_id:
      type: string
    is_manual:
      type: boolean
    is_derived:
      type: boolean
    supersedes_observation_id:
      type:
        - integer
        - 'null'
      format: int64
      deprecated: true
      description: Non-null IDs are refused. Use the reviewed /pricing/prices/{price_id}/correct command.
    derivation:
      type: object
      additionalProperties: true
    series_metadata:
      type: object
      additionalProperties: true
    metadata:
      type: object
      additionalProperties: true
    change_reason:
      type: string
  additionalProperties: false

QuoteRefreshAccepted:
  type: object
  required: [queued_count]
  properties:
    queued_count:
      type: integer
      minimum: 0
