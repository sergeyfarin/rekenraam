PricingSourceAssignmentRequest:
  type: object
  required:
    - commodity_id
    - quote_commodity_id
    - source_id
  properties:
    commodity_id:
      type: integer
      format: int64
    quote_commodity_id:
      type: integer
      format: int64
    source_id:
      type: integer
      format: int64
    priority:
      type: integer
      minimum: 0
    status:
      type: string
      enum:
