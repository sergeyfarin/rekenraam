      type: string

PricingRefreshRunsResponse:
  type: object
  required:
    - runs
    - has_more
  properties:
    runs:
      type: array
      items:
        $ref: "#/PricingRefreshRunResponse"
    has_more:
      type: boolean

PricingRefreshRunRequest:
  type: object
  properties:
    source_id:
      type: integer
      format: int64
    trigger:
      type: string
      enum:
        - manual
        - scheduled
        - import
  additionalProperties: false

PricingSourceHealthResponse:
  type: object
  required:
    - id
    - book_id
    - commodity_id
    - quote_commodity_id
    - source_id
    - updated_at
    - status
  properties:
    id:
      type: integer
      format: int64
    book_id:
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
    quote_commodity_id:
      type: integer
      format: int64
    source_id:
      type: integer
      format: int64
    last_success_date:
      type: string
      format: date
    last_attempt_at:
      type: string
      format: date-time
    last_error:
      type: string
    updated_at:
      type: string
      format: date-time
