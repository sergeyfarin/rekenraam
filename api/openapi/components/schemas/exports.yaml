LedgerExportAttachments:
  type: object
  description: >
    Attachment coverage, declared empty rather than omitted. Attachments will
    live outside SQLite (R14a), so the export states from day one that it does
    not carry them; the field exists so coverage is never claimed and later
    walked back.
  required:
    - included
    - directory
    - reason
  properties:
    included:
      type: boolean
    directory:
      type: string
      nullable: true
    reason:
      type: string
LedgerExportTotals:
  type: object
  description: What the export would contain, counted from the same selection the download uses.
  required:
    - posting_count
    - journal_entry_count
    - transaction_count
    - account_count
    - commodity_count
  properties:
    posting_count:
      type: integer
      format: int64
      description: Rows the CSV will carry, excluding the header.
    journal_entry_count:
      type: integer
      format: int64
    transaction_count:
      type: integer
      format: int64
    account_count:
      type: integer
      format: int64
      description: Distinct accounts named by an exported posting, system accounts included.
    commodity_count:
      type: integer
      format: int64
    earliest_entry_date:
      type: string
      format: date
    latest_entry_date:
      type: string
      format: date
LedgerExportFilter:
  type: object
  description: >
    What the filter resolved to. Echoed so an archive can be reproduced from its
    own manifest rather than from whatever the caller remembers typing.
  required:
    - date_basis
    - account_ids
    - include_descendants
    - resolved_account_ids
    - commodity_ids
    - selection_unit
  properties:
    from:
      type: string
      format: date
    to:
      type: string
      format: date
    date_basis:
      type: string
      enum: [entry, transaction]
    account_ids:
      type: array
      items:
        type: integer
        format: int64
    include_descendants:
      type: boolean
    resolved_account_ids:
      type: array
      description: The account selection after descendant expansion — what the export actually matched on.
      items:
        type: integer
        format: int64
    commodity_ids:
      type: array
      items:
        type: integer
        format: int64
    selection_unit:
      type: string
      enum: [journal_entry]
    notes:
      type: array
      description: Plain-language consequences of this filter, such as that it also carries postings it did not name.
      items:
        type: string
QIFAccountStatus:
  type: object
  description: One account's QIF verdict — written, or named and skipped, never silently dropped.
  required:
    - account_id
    - account_path
    - supported
  properties:
    account_id:
      type: integer
      format: int64
    account_path:
      type: string
    qif_type:
      type: string
      description: The QIF account type this account is written as.
      enum: [Bank, Cash, CCard, "Oth A", "Oth L"]
    supported:
      type: boolean
    reason:
      type: string
      description: Why an unsupported account cannot be written.
      enum: [not_a_balance_account, investment_account, non_currency_commodity, no_single_commodity]
QIFExportPreview:
  type: object
  description: >
    What a QIF export of this selection would write and what it would omit. The
    screen confirms this list before offering the download, and the download
    honours the same list.
  required:
    - date_layout
    - supported_accounts
    - unsupported_accounts
  properties:
    date_layout:
      type: string
      enum: [mdy, dmy]
    supported_accounts:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/QIFAccountStatus"
    unsupported_accounts:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/QIFAccountStatus"
LedgerExportPreviewResponse:
  type: object
  required:
    - generated_at
    - selection_unit
    - record_policy
    - query
    - all_transactions_complete
    - incomplete_transaction_count
    - includes_system_accounts
    - columns
    - excluded
    - ledger
    - qif
    - attachments
  properties:
    generated_at:
      type: string
      format: date-time
    selection_unit:
      type: string
      description: >
        What a filter selects. Always journal_entry: selecting individual
        postings would drop counterpart legs and break the per-entry balance
        the export guarantees.
      enum: [journal_entry]
    record_policy:
      type: string
      description: Which ledger records leave through the export, in one sentence a manifest can carry verbatim.
    query:
      $ref: "../../openapi.yaml#/components/schemas/LedgerExportFilter"
    incomplete_transaction_count:
      type: integer
      format: int64
      description: How many exported transactions are missing at least one of their own entries. Zero unless a filter cut across one.
    all_transactions_complete:
      type: boolean
      description: >
        Archive-wide, not per transaction. True when every entry of every
        exported transaction is present — always true for the unfiltered flat
        CSV. The per-row transaction_complete column carries the same fact per
        transaction.
    includes_system_accounts:
      type: boolean
      description: >
        Always true. Reports exclude system accounts; an export that dropped
        them would emit transactions that do not balance.
    columns:
      type: array
      description: The stable ledger.csv schema, in order. Columns are appended, never reordered or renamed.
      items:
        type: string
    excluded:
      type: array
      description: Data a portable export deliberately leaves behind, named so nobody has to infer it.
      items:
        type: string
    ledger:
      $ref: "../../openapi.yaml#/components/schemas/LedgerExportTotals"
    qif:
      $ref: "../../openapi.yaml#/components/schemas/QIFExportPreview"
    attachments:
      $ref: "../../openapi.yaml#/components/schemas/LedgerExportAttachments"
