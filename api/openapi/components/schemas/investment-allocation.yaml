AllocationTarget:
  type: object
  required:
  - commodity_id
  - units
  properties:
    commodity_id:
      type: integer
      format: int64
      minimum: 0
      description: Zero is the combined Cash and deposits bucket; otherwise a registered
        instrument commodity ID.
    units:
      type: integer
      minimum: 0
      maximum: 1000000
      description: Exact target share in millionths. 1000000 = 100%; 1 = 0.0001 percentage
        points.
AllocationSaveRequest:
  type: object
  required:
  - expected_revision
  - account_ids
  - targets
  properties:
    expected_revision:
      type: integer
      format: int64
      minimum: 0
    account_ids:
      type: array
      items:
        type: integer
        format: int64
        minimum: 1
      maxItems: 10000
      uniqueItems: true
      description: Exact selected accounts; no implicit descendant expansion. An empty
        array deliberately selects no accounts.
    targets:
      type: array
      items:
        $ref: ../../openapi.yaml#/components/schemas/AllocationTarget
      maxItems: 2000
      description: Unique commodity IDs and an exact 1000000-unit total. Empty only
        before any target set has been saved.
AllocationRevision:
  type: object
  required:
  - id
  - saved_at
  - account_ids
  - targets
  properties:
    id:
      type: integer
      format: int64
      minimum: 0
    saved_at:
      type: string
    account_ids:
      type: array
      items:
        type: integer
        format: int64
        minimum: 0
    targets:
      type: array
      items:
        $ref: ../../openapi.yaml#/components/schemas/AllocationTarget
AllocationCommodity:
  type: object
  required:
  - id
  - code
  - name
  - kind
  - targetable
  properties:
    id:
      type: integer
      format: int64
      minimum: 0
    code:
      type: string
    name:
      type: string
    kind:
      type: string
    targetable:
      type: boolean
AllocationAccount:
  type: object
  required:
  - id
  - name
  - code
  - kind
  - status
  - included
  properties:
    id:
      type: integer
      format: int64
      minimum: 0
    name:
      type: string
    code:
      type: string
    kind:
      type: string
    status:
      type: string
    included:
      type: boolean
AllocationMoney:
  type: object
  required:
  - value
  - scale
  - commodity_id
  properties:
    value:
      type: string
      pattern: ^-?(0|[1-9][0-9]{0,37})$
    scale:
      type: integer
      minimum: 0
      maximum: 24
    commodity_id:
      type: integer
      format: int64
      minimum: 0
AllocationUnknown:
  type: object
  required:
  - account_id
  - commodity_id
  - value
  - scale
  properties:
    account_id:
      type: integer
      format: int64
      minimum: 0
    commodity_id:
      type: integer
      format: int64
      minimum: 0
    value:
      type: string
      pattern: ^-?(0|[1-9][0-9]{0,37})$
    scale:
      type: integer
      minimum: 0
      maximum: 24
AllocationRow:
  type: object
  required:
  - commodity_id
  - side
  - amount
  - weight
  - target_units
  - drift
  properties:
    commodity_id:
      type: integer
      format: int64
      minimum: 0
    side:
      type: string
      enum:
      - long
      - short
    amount:
      anyOf:
      - $ref: ../../openapi.yaml#/components/schemas/AllocationMoney
      - type: 'null'
    weight:
      type:
      - string
      - 'null'
    target_units:
      type:
      - integer
      - 'null'
      minimum: 0
      maximum: 1000000
    drift:
      type:
      - string
      - 'null'
AllocationPoint:
  type: object
  required:
  - date
  - total
  - reason
  - chart_reason
  - rows
  - unknown
  - negative_cash
  properties:
    date:
      type: string
      format: date
    total:
      anyOf:
      - $ref: ../../openapi.yaml#/components/schemas/AllocationMoney
      - type: 'null'
    reason:
      type: string
    chart_reason:
      type: string
    rows:
      type: array
      items:
        $ref: ../../openapi.yaml#/components/schemas/AllocationRow
    negative_cash:
      description: Negative account/currency cash balances in reporting currency, already included in net cash. Zero when none; null if required FX is missing. Never add again to total.
      anyOf:
      - $ref: ../../openapi.yaml#/components/schemas/AllocationMoney
      - type: 'null'
    unknown:
      type: array
      items:
        $ref: ../../openapi.yaml#/components/schemas/AllocationUnknown
AllocationResponse:
  type: object
  required:
  - policy
  - from
  - to
  - reporting_currency_id
  - knowledge_cutoff
  - time_zone
  - interval
  - current
  - accounts
  - commodities
  - revisions
  - points
  - valuation
  - currency_allocation
  properties:
    policy:
      type: string
      enum:
      - allocation_targets_v1
    from:
      type: string
      format: date
    to:
      type: string
      format: date
    reporting_currency_id:
      type: integer
      format: int64
      minimum: 0
    knowledge_cutoff:
      type: string
    time_zone:
      type: string
    interval:
      type: string
      enum:
      - day
      - week
      - month
    current:
      $ref: ../../openapi.yaml#/components/schemas/AllocationRevision
    accounts:
      type: array
      items:
        $ref: ../../openapi.yaml#/components/schemas/AllocationAccount
    commodities:
      type: array
      items:
        $ref: ../../openapi.yaml#/components/schemas/AllocationCommodity
    revisions:
      type: array
      items:
        $ref: ../../openapi.yaml#/components/schemas/AllocationRevision
    points:
      type: array
      items:
        $ref: ../../openapi.yaml#/components/schemas/AllocationPoint
    valuation:
      $ref: ../../openapi.yaml#/components/schemas/Valuation
    currency_allocation:
      $ref: ../../openapi.yaml#/components/schemas/ReturnsAllocation
