  required: [event_date, holding_account_id, commodity_id, cash_commodity_id, income_account_id, quantity_value, quantity_scale, amount_value, amount_scale]
  properties:
    event_date: { type: string, format: date }
    holding_account_id: { type: integer, format: int64 }
    commodity_id: { type: integer, format: int64 }
    cash_commodity_id: { type: integer, format: int64 }
    income_account_id: { type: integer, format: int64 }
    quantity_value: { type: string }
    quantity_scale: { type: integer }
    amount_value: { type: string }
    amount_scale: { type: integer }
    memo: { type: string }
    payee_id: { type: integer, format: int64 }

InvestmentSaleReversalRequest:
  type: object
  additionalProperties: false
  required:
    - reason
  properties:
    reason:
      type: string
      minLength: 1
      description: Why the posted manual long sale is being reversed.
    reconciliation_override:
      type: boolean
      description: Omit or set false to keep affected reconciliation checkpoints active.
    reconciliation_override_checkpoint_ids:
      $ref: "#/ReviewedCheckpointIds"
    gain_impact_acknowledgement:
      type: string
      description: >-
        The gain_impact.acknowledgement token from this command's
        reconciliation-impact preview, accepting the committed-disposal gain
        changes it disclosed (T-126). A non-empty change set without it is
        refused with INVESTMENT_GAIN_IMPACT_ACKNOWLEDGEMENT_REQUIRED, a token
        for any other set with INVESTMENT_GAIN_IMPACT_ACKNOWLEDGEMENT_STALE.

InvestmentSaleReversalResponse:
  type: object
