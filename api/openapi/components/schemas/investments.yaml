      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: >-
        Signed disposed amount in minor units at disposed_basis_scale: the
        negated cost basis for a long disposal, the allocated opening
        proceeds for a short cover.
    disposed_basis_scale:
      type: [integer, 'null']
    proceeds_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: >-
        Signed operational proceeds in minor units at proceeds_scale; a
        cover's is negative, the covering cost.
    proceeds_scale:
      type: integer
    realized_gain_value:
      type: [string, 'null']
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: >-
        proceeds_value + disposed_basis_value, in minor units at
        realized_gain_scale. Format it with realized_gain_scale, never with
        proceeds_scale.
    realized_gain_scale:
      type: [integer, 'null']
      description: >-
        Scale of realized_gain_value: the deeper of proceeds_scale and
        disposed_basis_scale, so the difference is exact. It is not always
        proceeds_scale — 11 EUR of proceeds entered at scale 0 against a
        10.99 EUR basis is a 0.01 EUR gain at scale 2.

UnrealizedGainEntry:
  type: object
  required:
    - account_id
    - commodity_id
    - cost_commodity_id
    - quantity_value
    - quantity_scale
    - remaining_cost_basis_value
    - remaining_cost_basis_scale
    - basis_knowledge
    - latest_price_approximate
    - position_side
  properties:
    price_status:
      type: string
      enum: [usable, stale, no_price, future_only, incompatible_quote_basis, not_known_at_cutoff, conflicting_splits]
      description: >-
        Stale means older than seven calendar days; live holdings retain the
        labelled value without an age rejection. conflicting_splits means
        holdings recorded different instrument split factors after
        latest_price_date and on or before valuation_as_of, or disagree on
        the factor still pending after the source trade of a trade-implied
        quote on latest_price_date. The quote's unit basis is then unknown
        and the position is not valued.
    valuation_as_of:
      type: string
      format: date
      description: Owner-local current date at read start; positions remain the current operational projection.
    knowledge_cutoff:
      type: string
      format: date-time
      description: Recorded-at observation admission boundary; current withdrawals still apply.

    position_side:
      type: string
      enum: [long, short]
      description: >-
        Short for owed units: market_value is the signed (negative) exposure
        and unrealized gain is remaining opening proceeds less the cost to cover.
    account_id:
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
    cost_commodity_id:
      type: integer
      format: int64
    quantity_value:
      type: string
      description: Remaining quantity as a base-10 integer string.
    quantity_scale:
      type: integer
    remaining_cost_basis_value:
      type: [string, 'null']
      description: Null when projected basis is unknown; known zero remains an explicit coefficient.
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
    remaining_cost_basis_scale:
      type: [integer, 'null']
    basis_knowledge:
      type: string
      enum: [known, unknown]
      description: Knowledge of remaining projected basis; any unknown lot makes the position basis unknown.
    latest_price_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: Omitted when no price observation exists.
    latest_price_scale:
      type: integer
      description: Omitted when no price observation exists.
    latest_price_date:
      type: string
      format: date
      description: Omitted when no price observation exists.
    latest_price_approximate:
      type: boolean
      description: True when the selected valuation quote was estimated from net-only trade cash.
    split_ratio_numerator:
      type: string
      description: >-
        Exact factor used to bring the quote's unit basis to valuation_as_of:
        each quoted unit corresponds to split_ratio_numerator /
        split_ratio_denominator units on valuation_as_of (in lowest terms, as
        decimal integer strings). It includes recorded splits after
        latest_price_date and on or before valuation_as_of. For a trade-implied
        quote it also includes splits on latest_price_date still pending after
        the source trade's replay slot, when every holding that recorded that
        day's splits agrees on the pending factor. Valuation divides the quote
        by this factor; latest_price_value stays the quote as observed.
    split_ratio_denominator: { type: string }
    market_value_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: >-
        Quantity valued at the selected quote, normalized to valuation_as_of
        units using any disclosed split factor; negated for a short position.
        Omitted when valuation_unavailable is present.
    market_value_scale:
      type: integer
      description: >-
        Scale of market_value_value. Reduced below the computed precision only
        when redundant trailing zeros would otherwise overflow int64.
    unrealized_gain_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: >-
        market_value − remaining_cost_basis for a long position; remaining
        opening proceeds + market_value (the cost to cover is negative) for a
        short. Omitted when valuation_unavailable is present.
    unrealized_gain_scale:
      type: integer
      description: Omitted when valuation_unavailable is present.
    valuation_unavailable:
      type: string
      enum: [no_price, unrepresentable, future_only, incompatible_quote_basis, not_known_at_cutoff, conflicting_splits]
      description: >-
        Present only when market value and unrealized gain are omitted, saying
        why. no_price means no price observation exists for the position;
        unrepresentable means one is priced but the value does not fit the
        response's int64 fields; conflicting_splits means holdings recorded
        different split factors after the latest price, or disagree on the
        factor still pending after a trade-implied quote's source trade on
        latest_price_date, so the quote's unit basis is unknown.
    gain_unavailable:
      type: string
      enum: [unknown_basis]
      description: Gain is omitted when basis is unknown; quantity and any available market value are retained.

RealizedGainTotal:
  type: object
  required:
    - basis_knowledge
    - unresolved_count
    - cost_commodity_id
    - total_gain_value
    - total_gain_scale
  properties:
    basis_knowledge:
      type: string
      enum: [known, unknown]
      description: >-
        Unknown when any entry in this currency is unresolved. The total is
        then null: a sum of only the known entries is not the total.
    unresolved_count:
      type: integer
      description: Number of entries in this currency whose gain is unresolved.
    cost_commodity_id:
      type: integer
      format: int64
    total_gain_value:
      type: [string, 'null']
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: >-
        Exact sum of realized_gain_value for every entry with this
        cost_commodity_id. One row per cost commodity: entries are summed
        across differing realized_gain_scale values, and total_gain_scale is
        the scale the sum needs.
    total_gain_scale:
      type: [integer, 'null']

InvestmentGainsResponse:
  type: object
  required:
    - currencies
    - realized
    - unrealized
    - realized_totals
    - capital_returns
    - profile
  properties:
    reporting:
      $ref: "#/GainsFXProjection"
    alternative:
      $ref: "#/AlternativeGainsProjection"
    profile:
      $ref: "#/GainsProfile"
    capital_returns:
      type: array
      description: Effective return-of-capital allocations at the latest whole-effect revision, filtered inclusively by payment date using from/to. Separate from realized gains and income.
      items:
        $ref: "#/CapitalReturnRead"
    currencies:
      type: array
      description: Currency labels and standard display scales; calculations retain their recorded precision.
      items:
        $ref: "../../openapi.yaml#/components/schemas/CurrencyResponse"
    realized:
      type: array
      items:
        $ref: "#/RealizedGainEntry"
    unrealized:
      type: array
      items:
        $ref: "#/UnrealizedGainEntry"
    realized_totals:
      type: array
      description: Pre-aggregated totals by cost commodity, suitable for display.
      items:
        $ref: "#/RealizedGainTotal"

GainsProfile:
  type: object
  description: >-
    The named read-only rules the unrealized projection ran under (R18,
    docs/plans/investment-reporting-plan.md). Figures compare only when their
    profiles match. Not a tax computation.
  required:
    - name
    - purpose
    - basis_method
    - valuation_as_of
    - knowledge_cutoff
    - ledger_knowledge
    - quote_policy
    - stale_after_days
    - fx_method
    - rounding
  properties:
    reporting_currency_id:
      type: integer
      format: int64
      description: Present on converted profiles only.
    fx_max_age_days:
      type: integer
      minimum: 1
      maximum: 365
      description: Inclusive on-or-before FX age window, in calendar days.
    name:
      type: string
      enum: [operational_v1, alternative_method_v1, person_pooled_average_v1]
    purpose:
      type: string
      enum: [operational, alternative_method]
    basis_method:
      type: string
      enum: [operational_elections, fifo, lifo, average_cost, person_pooled_average]
      description: Operational elections, or the selected alternative method applied to every disposal and transfer depletion.
    valuation_as_of:
      type: string
      format: date
      description: Date positions are replayed to and priced at.
    knowledge_cutoff:
      type: string
      format: date-time
      description: UTC instant limiting admitted price observations (read start).
    ledger_knowledge:
      type: string
      enum: [current_effective]
      description: Positions use today's effective history; a later correction restates an earlier valuation date.
    quote_policy:
      type: string
      enum: [live_raw_v1]
    stale_after_days:
      type: integer
      description: A selected price older than this many calendar days before valuation_as_of is retained and marked stale.
    fx_method:
      type: string
      enum: [none, valuation_date_all, historic_basis_valuation_close]
      description: Original profile is none; reporting profiles name the chosen FX rule.
    rounding:
      type: string
      enum: [exact_half_up, component_half_up_currency_scale]

    pool_scope:
      type: string
      enum: [owner_security_cost_currency_position_side]
      description: Person pooling includes all owner accounts, including archived accounts, but separates cost currencies and long/short sides. Unrealized rows retain account quantities with prorated pool basis, not operational carried basis.
    jurisdiction_note:
      type: string
      maxLength: 500
      description: Trimmed user-supplied context only, echoed for person pooling. No jurisdiction rules, same-day matching or 30-day matching are applied.
    structural_action_policy:
      type: string
      enum: [recorded_entitlements]
      description: Sourced structural-action lot entitlements stay fixed; a method that cannot satisfy them is refused with the operation named.
    specific_lot_fallback:
      type: string
      enum: [selected_method]
      description: Alternative profiles ignore specific-lot elections and apply basis_method.
    transfer_policy:
      type: string
      enum: [selected_method_fixed_link_quantities, internal_pool_neutral]
      description: Transfer link quantities, destination identities and acquisition-date evidence stay fixed; the selected method supplies hypothetical carried basis. internal_pool_neutral pools across owner accounts; an internal transfer changes no total quantity or basis.
    from:
      type: string
      format: date
      description: Inclusive realized period start, omitted when unbounded.
    to:
      type: string
      format: date
      description: Inclusive realized period end, omitted when unbounded; independent of valuation_as_of.

AlternativeGainsProjection:
  type: object
  description: Read-only alternative results beside the operational results, in original cost currencies. Capital-return cash/excess is not part of disposal gains.
  required: [profile, realized, unrealized, realized_totals]
  properties:
    profile:
      $ref: "#/GainsProfile"
    realized:
      type: array
      items:
        $ref: "#/RealizedGainEntry"
    unrealized:
      type: array
      items:
        $ref: "#/UnrealizedGainEntry"
    realized_totals:
      type: array
      items:
        $ref: "#/RealizedGainTotal"

InvestmentGainsStatementResponse:
  type: object
  description: >-
    Period gains statement (R18 slice 2, #231). One row per currency that has a
    position at either valuation date, a disposal in the period or investment
    income, unclassified imported dividend cash or return-of-capital receipt in the period. The total excludes return-of-capital excess and is not a comprehensive economic return or tax computation.
  required:
    - profile
    - from
    - to
    - currencies
    - rows
  properties:
    capital_returns:
      type: array
      description: Schema-2 payment-date receipt evidence. Absent only in saved schema-1 statements; absence is not zero receipts.
      items:
        $ref: '#/CapitalReturnRead'
    reporting:
      $ref: "#/GainsFXStatement"
    profile:
      $ref: "../../openapi.yaml#/components/schemas/GainsProfile"
    from:
      type: string
      format: date
    to:
      type: string
      format: date
    currencies:
      type: array
      description: Currency labels and standard display scales; figures retain their exact scale.
      items:
        $ref: "../../openapi.yaml#/components/schemas/CurrencyResponse"
    rows:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/GainsStatementRow"

GainsStatementRow:
  type: object
  description: >-
    One currency's statement. Every figure is exact in that currency. A null
    figure is absent (a missing price or unresolved basis), never zero; a
    currency with nothing held at a date has a known zero unrealized gain.
  required:
    - commodity_id
    - opening
    - closing
    - realized_gain_value
    - realized_gain_scale
    - disposal_count
    - realized_unresolved_count
    - income_value
    - income_scale
    - income_count
    - unrealized_change_value
    - unrealized_change_scale
    - total_value
    - total_scale
  properties:
    capital_return:
      $ref: '#/GainsStatementCapitalReturn'
    unclassified_dividends:
      $ref: '#/GainsStatementUnclassifiedDividends'
    commodity_id:
      type: integer
      format: int64
      description: The cost currency of positions and disposals; the cash currency of income.
    opening:
      $ref: "../../openapi.yaml#/components/schemas/GainsStatementValuation"
    closing:
      $ref: "../../openapi.yaml#/components/schemas/GainsStatementValuation"
    realized_gain_value:
      type: [string, 'null']
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: Exact sum of realized gains of disposals dated in the period; null when any of them is unresolved.
    realized_gain_scale:
      type: [integer, 'null']
    disposal_count:
      type: integer
      description: Disposals dated in the period in this currency.
    realized_unresolved_count:
      type: integer
      description: Disposals in the period whose basis, and so gain, is unresolved.
    income_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: >-
        Gross income of effective cash and reinvested dividends dated in the
        period (before withholding). Return of capital is not income: it
        reduces basis and shows in unrealized gain.
    income_scale:
      type: integer
    income_count:
      type: integer
      description: Effective dividend operations contributing to income_value.
    unrealized_change_value:
      type: [string, 'null']
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: Closing less opening unrealized gain; null when either is absent.
    unrealized_change_scale:
      type: [integer, 'null']
    total_value:
      type: [string, 'null']
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: Limited-scope realized gain plus income plus unrealized change, excluding capital-return excess; null when any part is absent. See capital_return beside this figure.
    total_scale:
      type: [integer, 'null']

GainsStatementValuation:
  type: object
  description: Unrealized gain of one currency's positions at a valuation date, with the price dates that produced it.
  required:
    - valuation_as_of
    - unrealized_gain_value
    - unrealized_gain_scale
    - position_count
    - unpriced_count
    - unresolved_count
    - stale_count
    - unavailable_reason
    - earliest_price_date
    - latest_price_date
  properties:
    valuation_as_of:
      type: string
      format: date
    unrealized_gain_value:
      type: [string, 'null']
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: Exact sum over positions held at the date; null when any position is unpriced or has unresolved basis.
    unrealized_gain_scale:
      type: [integer, 'null']
    position_count:
      type: integer
    unpriced_count:
      type: integer
      description: Positions with no usable price on or before the date.
    unresolved_count:
      type: integer
      description: Positions whose remaining basis is unresolved.
    stale_count:
      type: integer
      description: Positions valued with a price older than the profile's stale_after_days; retained, not a gate.
    unavailable_reason:
      type: [string, 'null']
      enum: [unpriced, unresolved_basis, unpriced_and_unresolved, null]
    earliest_price_date:
      type: [string, 'null']
      format: date
      description: Oldest price date used at this valuation date.
    latest_price_date:
      type: [string, 'null']
      format: date

GainImpact:
  type: object
  description: >-
    Replay gain disclosure (T-114). Lists every committed disposal whose
    effective operational basis, proceeds, gain, knowledge, date, position or
    method the command would change, compared inside the command's own
    rolled-back write transaction. Disposals the command itself creates under
    a new correction root are not listed. Re-selected allocations with
    identical totals are not a change. Present only for commands opted into
    disclosure; an omitted gain_impact is not a claim that no gain changes.
  required:
    - changes
    - acknowledgement
  properties:
    changes:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/GainImpactChange"
    acknowledgement:
      type: string
      description: >-
        Opaque token binding an acknowledgement to exactly this change set.
        Empty when changes is empty. Echo it as gain_impact_acknowledgement.
GainImpactChange:
  type: object
  required:
    - change_kind
    - root_operation_id
    - decision_seq
    - operation_kind
    - operation_id
    - decision_id
    - transaction_id
    - before
    - after
  properties:
    change_kind:
      type: string
      enum: [revised, replaced, removed]
      description: >-
        revised - the same decision gets a new effective result; replaced - a
        correction supersedes the decision; removed - a reversal leaves no
        effective decision.
    root_operation_id:
      type: integer
      format: int64
      description: Correction-root operation; with decision_seq, the stable identity.
    decision_seq:
      type: integer
    operation_kind:
      type: string
      description: >-
        The committed decision's operation kind (sell, write_off, cash_in_lieu,
        short_cover, cash_and_stock_merger), for labelling the change. It is not
        part of the acknowledgement digest.
    operation_id:
      type: integer
      format: int64
      description: Committed operation of the disclosed decision.
    decision_id:
      type: integer
      format: int64
      description: Committed disposal decision. Never a preview-only ID.
    transaction_id:
      type: integer
      format: int64
      description: Committed transaction linked to the disclosed decision.
    before:
      $ref: "../../openapi.yaml#/components/schemas/GainImpactState"
    after:
      description: Effective result after the command; null when removed. Carries no IDs.
      oneOf:
        - $ref: "../../openapi.yaml#/components/schemas/GainImpactState"
        - type: "null"
GainImpactState:
  type: object
  required:
    - account_id
    - commodity_id
    - cost_commodity_id
    - disposal_date
    - cost_basis_method
    - quantity_value
    - quantity_scale
    - basis_knowledge
    - disposed_basis_value
    - disposed_basis_scale
    - proceeds_value
    - proceeds_scale
    - realized_gain_value
    - realized_gain_scale
  properties:
    account_id:
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
    cost_commodity_id:
      type: integer
      format: int64
      description: Cost currency of basis, proceeds and gain.
    disposal_date:
      type: string
      format: date
    cost_basis_method:
      $ref: "#/CostBasisMethod"
    quantity_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,37})$'
    quantity_scale:
      type: integer
    basis_knowledge:
      type: string
      enum: [known, unknown]
    disposed_basis_value:
      type: [string, "null"]
      pattern: '^-?(0|[1-9][0-9]{0,37})$'
      description: Null when basis_knowledge is unknown; never a fabricated zero.
    disposed_basis_scale:
      type: [integer, "null"]
    proceeds_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,37})$'
      description: Signed operational proceeds; may be negative.
    proceeds_scale:
      type: integer
    realized_gain_value:
      type: [string, "null"]
      pattern: '^-?(0|[1-9][0-9]{0,37})$'
      description: proceeds minus disposed basis; null when basis is unknown.
    realized_gain_scale:
      type: [integer, "null"]

CapitalReturnEntitlement:
  type: object
  additionalProperties: false
  required: [lot_id, quantity_value, quantity_scale]
  properties:
    lot_id:
      type: integer
      format: int64
      minimum: 1
    quantity_value:
      type: string
      pattern: '^[1-9][0-9]{0,37}$'
    quantity_scale:
      type: integer
      minimum: 0
      maximum: 24

CapitalReturnReplacementRequest:
  type: object
  additionalProperties: false
  required: [reason, replacement]
  properties:
    reason:
      type: string
      minLength: 1
    replacement:
      $ref: '#/CapitalReturnRequest'
    source_evidence_edits:
      type: object
      additionalProperties: true
      description: >
        Top-level edits applied on the server to the recorded source evidence
        (#312): a key set to null is removed, any other value replaces that key
        exactly, and every key not named keeps its recorded JSON token (large
        integers, decimals and nested data included). Mutually exclusive with
        replacement.source_evidence, which replaces the evidence whole;
        omitting both keeps the recorded evidence.
    reconciliation_override:
      type: boolean
    reconciliation_override_checkpoint_ids:
      $ref: "#/ReviewedCheckpointIds"
    gain_impact_acknowledgement:
      type: string

CapitalReturnReplacementResponse:
  type: object
  required: [inverse, replacement, corrected_transaction_id]
  properties:
    inverse:
      $ref: "../schemas/transactions.yaml#/TransactionResponse"
    replacement:
      $ref: '#/CapitalReturnResponse'
    corrected_transaction_id:
      type: integer
      format: int64

CashInLieuReplacementRequest:
  type: object
  additionalProperties: false
  required: [reason, replacement]
  properties:
    reason:
      type: string
      minLength: 1
    replacement:
      $ref: '#/CashInLieuRequest'
    reconciliation_override:
      type: boolean
    reconciliation_override_checkpoint_ids:
      $ref: "#/ReviewedCheckpointIds"
    gain_impact_acknowledgement:
      type: string

CashInLieuLotsResponse:
  type: object
  required: [lots]
  properties:
    lots:
      type: array
      items:
        $ref: '#/InvestmentTradeCorrectionAvailableLotResponse'

DatedHoldingsResponse:
  type: object
  required: [as_of, holdings]
  properties:
    as_of:
      type: string
      format: date
    holdings:
      type: array
      items:
        $ref: '#/DatedHolding'

DatedHolding:
  type: object
  description: >-
    A long holding as an entry dated as_of would find it, after every
    effective event on or before that date (a new entry takes the last
    same-day slot). Holdings a later sale has closed are included. Discovery
    only: the command's writer rechecks availability at commit (#166).
  required: [account_id, commodity_id, cost_commodity_id, position_side, quantity_value, quantity_scale, transfer_basis_allocation, lots]
  properties:
    account_id: { type: integer, format: int64 }
    commodity_id: { type: integer, format: int64 }
    cost_commodity_id: { type: integer, format: int64 }
    position_side: { type: string, enum: [long] }
    quantity_value: { type: string, description: Units held at the slot. }
    quantity_scale: { type: integer }
    transfer_basis_allocation:
      type: string
      enum: [selected_lots, average_cost_pool]
      description: How an outbound transfer allocates basis at commit (the current method lock, else the default).
    lots:
      type: array
      items:
        $ref: '#/DatedHoldingLot'

DatedHoldingLot:
  type: object
  required: [lot_id, opened_on, quantity_value, quantity_scale, basis_knowledge, remaining_cost_basis_value, remaining_cost_basis_scale]
  properties:
    lot_id: { type: integer, format: int64 }
    opened_on: { type: string, format: date }
    quantity_value: { type: string, description: Remaining units at the slot. }
    quantity_scale: { type: integer }
    basis_knowledge: { type: string, enum: [known, unknown] }
    remaining_cost_basis_value:
      type: [string, 'null']
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: Remaining basis at the slot; null when unknown.
    remaining_cost_basis_scale: { type: [integer, 'null'] }

InvestmentBasisResolutionSourceDeclaration:
  description: >-
    Owner-supplied provenance for the resolved basis, separate from the change
    reason. The app records this declaration without verifying its truth.
    Extra metadata is retained as immutable evidence. Attachments are out of scope.
  oneOf:
    - type: object
      required: [kind, reference]
      properties:
        kind:
          type: string
          enum: [statement, provider]
        reference:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '\S'
          description: A nonblank statement or provider record reference, at most 500 Unicode characters after trimming.
      additionalProperties: true
    - type: object
      required: [kind, rationale, known_on]
      properties:
        kind:
          type: string
          const: owner_assertion
        rationale:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '\S'
          description: Why the owner asserts this basis, not merely why it changed; at most 500 Unicode characters after trimming.
        known_on:
          type: string
          format: date
          description: Calendar date on which the owner obtained this basis knowledge.
      additionalProperties: true

InvestmentBasisResolutionRequest:
  type: object
  additionalProperties: false
  required: [basis_value, basis_scale, source_evidence, reason]
  properties:
    preserve_source_metadata:
      type: boolean
      description: Defaults to false. On correction, retain additional existing metadata using exact server-side JSON; supplied fields override it. Declaration fields are replaced explicitly.
    expected_resolution_operation_id:
      type: integer
      format: int64
      minimum: 1
      description: Required for provenance-only corrections; identifies the resolution read by the caller.
    expected_provenance_revision:
      type: integer
      minimum: 0
      description: Required with the expected operation; 0 means original evidence. Stale corrections return conflict.
    basis_value:
      type: string
      pattern: '^(0|[1-9][0-9]{0,18})$'
      description: >-
        The transfer's total sourced basis in its own cost currency, never a
        conversion. A sourced known zero is journal-free: it records the fact
        without a bridge journal (#168). A replacement keeps the pinned
        transfer and currency. An exactly equal basis with changed evidence records
        a journal-free provenance revision (#197), requiring both expected fields.
        Repeating the effective evidence at the same basis is refused.
    basis_scale:
      type: integer
      minimum: 0
      maximum: 12
    source_evidence:
      $ref: '#/InvestmentBasisResolutionSourceDeclaration'
    reason:
      type: string
    reconciliation_override:
      type: boolean
    reconciliation_override_checkpoint_ids:
      $ref: "#/ReviewedCheckpointIds"
    gain_impact_acknowledgement:
      type: string

InvestmentBasisResolutionResponse:
  type: object
  required: [transaction, resolved_transaction_id]
  properties:
    transaction:
      description: The resolution's bridge journal; null for a journal-free known zero (#168).
      oneOf:
        - $ref: "../schemas/transactions.yaml#/TransactionResponse"
        - type: 'null'
    resolved_transaction_id:
      type: integer
      format: int64

InvestmentBasisResolutionReplacementResponse:
  type: object
  required: [inverse, replacement, transfer_transaction_id]
  properties:
    inverse:
      description: The inverse of the replaced bridge; null when the replaced resolution was a journal-free known zero or the correction changes provenance only.
      oneOf:
        - $ref: "../schemas/transactions.yaml#/TransactionResponse"
        - type: 'null'
    replacement:
      description: The successor's bridge journal; null when the successor is a journal-free known zero or the correction changes provenance only.
      oneOf:
        - $ref: "../schemas/transactions.yaml#/TransactionResponse"
        - type: 'null'
    transfer_transaction_id:
      type: integer
      format: int64

InvestmentCorrectionBasisResolutionTerms:
  type: object
  required: [operation_id, transaction_id, cost_commodity_id, basis_value, basis_scale, source_evidence, provenance_revision]
  properties:
    provenance_revision:
      type: integer
      minimum: 0
      description: Current evidence revision; 0 identifies the resolution's original declaration.
    operation_id:
      type: integer
      format: int64
      description: The effective basis_resolution operation.
    transaction_id:
      type: [integer, 'null']
      format: int64
      description: The effective resolution's bridge journal; null for a journal-free known zero.
    cost_commodity_id:
      type: integer
      format: int64
    basis_value:
      type: string
      pattern: '^(0|[1-9][0-9]{0,37})$'
    basis_scale:
      type: integer
    source_evidence:
      type: object
      additionalProperties: true

InvestmentBasisResolutionReversalResponse:
  type: object
  required: [transaction, transfer_transaction_id]
  properties:
    transaction:
      description: The inverse of the reversed bridge; null when the reversed resolution was a journal-free known zero.
      oneOf:
        - $ref: "../schemas/transactions.yaml#/TransactionResponse"
        - type: 'null'
    transfer_transaction_id:
      type: integer
      format: int64

InvestmentBasisResolutionHistoryEntry:
  type: object
  required: [operation_id, transaction_id, basis_value, basis_scale, source_evidence, source_evidence_json, reason, created_at, status, provenance_corrections]
  properties:
    source_evidence_json:
      type: string
      description: Exact saved JSON, including arbitrary numeric metadata that browser object parsing can round.
    provenance_corrections:
      type: array
      description: Immutable evidence revisions, oldest first. The last declaration is effective for this economic resolution.
      items:
        $ref: '#/InvestmentBasisProvenanceHistoryEntry'
    operation_id:
      type: integer
      format: int64
    transaction_id:
      type: [integer, 'null']
      format: int64
      description: The resolution's bridge journal; null for a journal-free known zero.
    basis_value:
      type: string
      pattern: '^(0|[1-9][0-9]{0,37})$'
    basis_scale:
      type: integer
    source_evidence:
      type: object
      additionalProperties: true
    correction_mode:
      type: string
      enum: [replace]
      description: Present when this resolution replaced an earlier one.
    reason:
      type: string
      description: Why this resolution was recorded or the earlier one replaced.
    created_at:
      type: string
      format: date-time
    status:
      type: string
      enum: [effective, superseded, reversed]
    reversal_reason:
      type: string
      description: Why a reversed resolution was withdrawn.


InvestmentSplitReversalResponse:
  type: object
  required: [transaction, corrected_transaction_id, corrected_operation_id]
  properties:
    transaction:
      oneOf:
        - $ref: "../schemas/transactions.yaml#/TransactionResponse"
        - type: "null"
    corrected_transaction_id:
      type: [integer, "null"]
      format: int64
    corrected_operation_id:
      type: integer
      format: int64

InvestmentSplitActivity:
  type: object
  required: [operation_id, transaction_id, correction_of_operation_id, successor_operation_id, holding_account_id, commodity_id, account_name, instrument_name, effective_on, ratio_numerator, ratio_denominator, source_evidence, memo, reason, created_at, standing, settled, quantity_delta_value, quantity_delta_scale]
  properties:
    operation_id: {type: integer, format: int64}
    transaction_id: {type: [integer, "null"], format: int64}
    correction_of_operation_id: {type: [integer, "null"], format: int64}
    successor_operation_id: {type: [integer, "null"], format: int64}
    holding_account_id: {type: integer, format: int64}
    commodity_id: {type: integer, format: int64}
    account_name: {type: string}
    instrument_name: {type: string}
    effective_on: {type: string, format: date}
    ratio_numerator: {type: integer, format: int64}
    ratio_denominator: {type: integer, format: int64}
    source_evidence: {type: object, additionalProperties: true}
    memo: {type: string}
    reason: {type: string}
    created_at: {type: string, format: date-time}
    standing: {type: string, enum: [effective, superseded, reversed]}
    settled: {type: boolean}
    quantity_delta_value: {type: string, pattern: "^-?(0|[1-9][0-9]*)$"}
    quantity_delta_scale: {type: integer}

InvestmentSplitActivityResponse:
  type: object
  required: [splits, next_cursor]
  properties:
    splits:
      type: array
      items: {$ref: "../schemas/investments.yaml#/InvestmentSplitActivity"}
    next_cursor: {type: [string, "null"]}

InvestmentBasisProvenanceHistoryEntry:
  type: object
  required: [id, revision_seq, source_evidence, source_evidence_json, audit_event_id, actor_user_id, request_id, created_at, reason]
  properties:
    source_evidence_json: {type: string, description: Exact saved evidence JSON.}
    id: {type: integer, format: int64}
    revision_seq: {type: integer, minimum: 1}
    source_evidence: {type: object, additionalProperties: true}
    audit_event_id: {type: integer, format: int64}
    actor_user_id: {type: integer, format: int64}
    request_id: {type: string}
    created_at: {type: string, format: date-time}
    reason: {type: string}

CapitalReturnRead:
  type: object
  description: >-
    One immutable whole allocation set. Original is revision 1 with null revision_id;
    effective is true only for the latest set of an effective operation. Excess has
    no tax or income classification. Reading never changes journals or projections.
    Total reduction/excess are null if any lot is unknown; independent known effects
    stay visible. Source JSON is exact saved text, including additional metadata.
  required: [operation_id, transaction_id, holding_account_id, commodity_id, currency_id,
    holding_name, instrument_name, currency_code, currency_scale, effective_on, payment_on,
    amount_value, amount_scale, entitlement_rule, source_evidence_json, revision_id,
    revision_seq, caused_by_operation_id, audit_event_id, created_at, effective, effects,
    reduction_value, reduction_scale, excess_value, excess_scale, unknown_lots, has_excess]
  properties:
    operation_id:
      type: integer
      format: int64
    transaction_id:
      type: integer
      format: int64
    holding_account_id:
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
    currency_id:
      type: integer
      format: int64
    audit_event_id:
      type: integer
      format: int64
    holding_name:
      type: string
    instrument_name:
      type: string
    currency_code:
      type: string
    entitlement_rule:
      type: string
    source_evidence_json:
      type: string
    currency_scale:
      type: integer
    amount_scale:
      type: integer
    revision_seq:
      type: integer
    unknown_lots:
      type: integer
    effective_on:
      type: string
      format: date
    payment_on:
      type: string
      format: date
    amount_value:
      type: string
    created_at:
      type: string
      format: date-time
    revision_id:
      type: [integer, "null"]
      format: int64
    caused_by_operation_id:
      type: [integer, "null"]
      format: int64
    effective:
      type: boolean
    has_excess:
      type: boolean
    reduction_value:
      type: [string, "null"]
    excess_value:
      type: [string, "null"]
    reduction_scale:
      type: [integer, "null"]
    excess_scale:
      type: [integer, "null"]
    effects:
      type: array
      items:
        $ref: "#/CapitalReturnEffect"

GainsFXAmount:
  type: object
  required: [value, scale]
  properties:
    value:
      type: string
      pattern: '^-?[0-9]+$'
    scale:
      type: integer

GainsFXComponent:
  type: object
  description: A signed contribution to the figure, with exact source and converted values. Same-currency amounts are exact no-ops, without an observation. Historic basis retains operational allocations and each lot's effective original acquisition date; an unknown date prevents foreign conversion.
  required: [role, commodity_id, source, requested_date, amount, rate, base_quantity, approximate, derived]
  properties:
    role:
      type: string
      enum: [basis, proceeds, market_value, income, capital_return_receipt, capital_return_reduction, capital_return_excess]
    lot_id:
      type: integer
      format: int64
    operation_id:
      type: integer
      format: int64
      description: Effective return-of-capital operation supplying this disclosure component.
    commodity_id:
      type: integer
      format: int64
    source:
      oneOf:
        - $ref: '#/GainsFXAmount'
        - type: 'null'
    requested_date:
      type: string
      description: Calendar date requested; empty only when original acquisition date is unknown.
    amount:
      oneOf:
        - $ref: '#/GainsFXAmount'
        - type: 'null'
    observation_id:
      type: integer
      format: int64
    observation_date:
      type: string
      format: date
    rate:
      oneOf:
        - $ref: '#/GainsFXAmount'
        - type: 'null'
    base_quantity:
      oneOf:
        - $ref: '#/GainsFXAmount'
        - type: 'null'
    approximate:
      type: boolean
    derived:
      type: boolean
    unavailable_reason:
      type: string
      enum: [unresolved_basis, unpriced, unknown_acquisition_date, no_observation_in_window, future_only, incompatible_quote_basis, not_known_at_cutoff]
    nearest_observation_date:
      type: string
      format: date

GainsFXFigure:
  type: object
  required: [amount, components]
  properties:
    amount:
      oneOf:
        - $ref: '#/GainsFXAmount'
        - type: 'null'
    components:
      type: array
      items:
        $ref: '#/GainsFXComponent'
    unavailable_reason:
      type: string
      enum: [incomplete_components]

GainsFXProjection:
  type: object
  description: Additive operational reporting figures. Arrays correspond by index to the original realized/unrealized arrays. A total is null if any contributing figure is incomplete. Alternative-method comparison stays in original currencies.
  required: [profile, realized, unrealized, realized_total, unrealized_total]
  properties:
    profile:
      $ref: '#/GainsProfile'
    realized:
      type: array
      items:
        $ref: '#/GainsFXFigure'
    unrealized:
      type: array
      items:
        $ref: '#/GainsFXFigure'
    realized_total:
      $ref: '#/GainsFXFigure'
    unrealized_total:
      $ref: '#/GainsFXFigure'

GainsFXStatement:
  type: object
  required: [profile, opening, realized, income, closing, unrealized_change, total]
  properties:
    capital_return_receipt:
      $ref: '#/GainsFXFigure'
    capital_return_reduction:
      $ref: '#/GainsFXFigure'
    capital_return_excess:
      $ref: '#/GainsFXFigure'
    profile:
      $ref: '#/GainsProfile'
    opening:
      $ref: '#/GainsFXFigure'
    realized:
      $ref: '#/GainsFXFigure'
    income:
      $ref: '#/GainsFXFigure'
    closing:
      $ref: '#/GainsFXFigure'
    unrealized_change:
      $ref: '#/GainsFXFigure'
    total:
      $ref: '#/GainsFXFigure'

GainsStatementUnclassifiedDividends:
  type: object
  description: >-
    Committed imported dividend payments dated (by payment) in the period whose
    gross and withholding are unresolved. This is net cash, not income: it is
    never added to income_value or total_value. Reviewing the imported dividend
    moves a payment into income. Present in live and schema-3 statements; absent
    in saved schema 1 and 2, where absence means disclosure unavailable, never zero.
  required: [payment_count, cash]
  properties:
    payment_count:
      type: integer
      minimum: 0
    cash:
      $ref: '#/GainsFXAmount'

GainsStatementCapitalReturn:
  type: object
  description: >-
    Payment-date receipt cohort, separate from the limited-scope gain total.
    Reduction is associated with these receipts, not total basis movement in this
    period. Basis changes at effective_on, which may fall outside the period.
    Unknown effects withhold the whole reduction and excess, never a partial sum.
    Present in live and schema-2 statements; absent in saved schema 1.
  required: [receipt, reduction, excess, receipt_count, unresolved_count, unknown_lots]
  properties:
    receipt:
      $ref: '#/GainsFXAmount'
    reduction:
      oneOf:
        - $ref: '#/GainsFXAmount'
        - type: 'null'
    excess:
      oneOf:
        - $ref: '#/GainsFXAmount'
        - type: 'null'
    receipt_count:
      type: integer
      minimum: 0
    unresolved_count:
      type: integer
      minimum: 0
      description: Receipts with any unknown reduction/excess effect.
    unknown_lots:
      type: integer
      minimum: 0
      description: Unknown lot effects across these receipts; independent known effects remain in capital_returns.
IncomeCoverageInstrument:
  type: object
  required: [commodity_id, cash_commodity_id, currency_code, income_state, withholding_state, gross, withholding, net_cash, dividend_count, withholding_payment_count, imported_unclassified_count, imported_unclassified_cash]
  description: One paying instrument's owner-confirmed income in one cash currency. Imported cash whose source names the instrument is disclosed separately and never added.
  properties:
    commodity_id: { type: integer, format: int64 }
    cash_commodity_id: { type: integer, format: int64 }
    currency_code: { type: string }
    income_state: { type: string, enum: [none, known], description: none means no recorded gross dividend income. }
    withholding_state: { type: string, enum: [none, known_zero, known] }
    gross:
      oneOf:
        - $ref: '../../openapi.yaml#/components/schemas/GainsFXAmount'
        - type: 'null'
    withholding:
      oneOf:
        - $ref: '../../openapi.yaml#/components/schemas/GainsFXAmount'
        - type: 'null'
    net_cash:
      oneOf:
        - $ref: '../../openapi.yaml#/components/schemas/GainsFXAmount'
        - type: 'null'
    dividend_count: { type: integer }
    withholding_payment_count: { type: integer }
    imported_unclassified_count: { type: integer }
    imported_unclassified_cash:
      oneOf:
        - $ref: '../../openapi.yaml#/components/schemas/GainsFXAmount'
        - type: 'null'
IncomeCoverageTotal:
  type: object
  required: [cash_commodity_id, currency_code, cash, item_count, payer_unassigned_count, economics_unresolved_count]
  description: Exact unassigned investment cash in one original currency; not gross income.
  properties:
    cash_commodity_id: { type: integer, format: int64 }
    currency_code: { type: string }
    cash: { $ref: '../../openapi.yaml#/components/schemas/GainsFXAmount' }
    item_count: { type: integer }
    payer_unassigned_count: { type: integer }
    economics_unresolved_count: { type: integer }
IncomeCoverageSource:
  type: object
  required: [batch_id, row_id, instrument, date, cash_amount, currency]
  description: Original import evidence, unchanged.
  properties:
    batch_id: { type: integer, format: int64 }
    row_id: { type: integer, format: int64 }
    instrument: { type: string }
    date: { type: string, format: date }
    cash_amount: { type: string }
    currency: { type: string }
IncomeCoverageItem:
  type: object
  required: [kind, transaction_id, date, cash_commodity_id, currency_code, cash, gross_state, gross, withholding_state, withholding, payer_state, source_payer_commodity_id, reasons, source]
  properties:
    kind: { type: string, enum: [named_unassigned, imported_cash] }
    transaction_id: { type: integer, format: int64 }
    date: { type: string, format: date }
    cash_commodity_id: { type: integer, format: int64 }
    currency_code: { type: string }
    cash: { $ref: '../../openapi.yaml#/components/schemas/GainsFXAmount' }
    gross_state: { type: string, enum: [none, known, unresolved] }
    gross:
      oneOf:
        - $ref: '../../openapi.yaml#/components/schemas/GainsFXAmount'
        - type: 'null'
    withholding_state: { type: string, enum: [known_zero, known, unresolved] }
    withholding:
      oneOf:
        - $ref: '../../openapi.yaml#/components/schemas/GainsFXAmount'
        - type: 'null'
    payer_state: { type: string, enum: [unassigned, source_identified] }
    source_payer_commodity_id: { type: [integer, 'null'], format: int64, description: Existing instrument the source's typed identifiers name; not a recorded payer. }
    reasons:
      type: array
      items: { type: string, enum: [payer_unassigned, payer_unlinked, gross_unresolved, withholding_unresolved] }
    source:
      oneOf:
        - $ref: '../../openapi.yaml#/components/schemas/IncomeCoverageSource'
        - type: 'null'
IncomeCoverageResponse:
  type: object
  required: [instruments, unassigned_totals, unassigned, next_cursor]
  properties:
    instruments:
      type: array
      items: { $ref: '../../openapi.yaml#/components/schemas/IncomeCoverageInstrument' }
    unassigned_totals:
      type: array
      items: { $ref: '../../openapi.yaml#/components/schemas/IncomeCoverageTotal' }
    unassigned:
      type: array
      items: { $ref: '../../openapi.yaml#/components/schemas/IncomeCoverageItem' }
    next_cursor: { type: [string, 'null'] }
ReviewedCheckpointIds:
  type: array
  items:
    type: integer
    format: int64
  description: >
    Required with reconciliation_override=true (#304): the checkpoint ids the
    owner reviewed, as this action's reconciliation-impact preview returned
    them. The write refuses with 409 RECONCILIATION_IMPACT_STALE, invalidating
    nothing, when the set it would invalidate now differs; that refusal's
    checkpoint_ids name the current set. An override without it is refused
    with 400 VALIDATION_FAILED.
