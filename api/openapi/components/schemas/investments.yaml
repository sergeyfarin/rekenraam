    realized and carried basis and cash share, with totals and result.
  properties:
    effective_on:
      type: string
      format: date
    payable_on:
      type: string
      format: date
    holding_account_id:
      type: integer
      format: int64
    destination_holding_account_id:
      type: integer
      format: int64
      description: Equal to holding_account_id when the new units went to the same holding.
    commodity_id:
      type: integer
      format: int64
      description: The old instrument.
    destination_commodity_id:
      type: integer
      format: int64
      description: The new instrument.
    cash_account_id:
      type: integer
      format: int64
    currency_id:
      type: integer
      format: int64
    cash_value:
      type: string
      description: The total cash, an exact coefficient.
    cash_scale:
      type: integer
    source_evidence:
      type: object
      additionalProperties: true
    plan:
      $ref: "../schemas/investments.yaml#/CashStockMergerPlan"

CashStockMergerReplacementRequest:
  type: object
  additionalProperties: false
  required: [reason, effective_on, payable_on, destination_commodity_id, ratio_numerator, ratio_denominator,
    cash_account_id, currency_id, cash_value, cash_scale, cash_basis_fraction_value, cash_basis_fraction_scale]
  description: >
    Corrected terms for a cash-and-stock merger (#184). The merged holding and
    old instrument stay those of the merger; the dates, ratio, election, cash,
    new instrument, receiving holding or source evidence must change. Omitted
    evidence keeps the recorded evidence.
  properties:
    reason:
      type: string
    effective_on:
      type: string
      format: date
    payable_on:
      type: string
      format: date
    destination_holding_account_id:
      type: integer
      format: int64
      description: Defaults to the merged holding.
    destination_commodity_id:
      type: integer
      format: int64
    ratio_numerator:
      type: integer
      format: int64
      minimum: 1
      maximum: 1000000000
    ratio_denominator:
      type: integer
      format: int64
      minimum: 1
      maximum: 1000000000
    cash_account_id:
      type: integer
      format: int64
    currency_id:
      type: integer
      format: int64
    cash_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
    cash_scale:
      type: integer
      minimum: 0
      maximum: 12
    cash_basis_fraction_value:
      type: string
      description: Coefficient of the corrected election, as for CashStockMergerRequest.
    cash_basis_fraction_scale:
      type: integer
      minimum: 0
    source_evidence:
      type: object
      additionalProperties: true
    source_evidence_edits:
      type: object
      additionalProperties: true
      description: >
        Top-level edits applied on the server to the recorded source evidence
        (#311): a key set to null is removed, any other value replaces that key
        exactly, and every key not named keeps its recorded JSON token (large
        integers, decimals and nested data included). Mutually exclusive with
        source_evidence, which replaces the evidence whole; omitting both keeps
        the recorded evidence.
    memo:
      type: string
    reconciliation_override:
      type: boolean
    reconciliation_override_checkpoint_ids:
      $ref: "#/ReviewedCheckpointIds"
    gain_impact_acknowledgement:
      type: string

CashStockMergerReplacementResponse:
  type: object
  required: [inverse, replacement, plan, corrected_transaction_id]
  properties:
    inverse:
      $ref: "../schemas/transactions.yaml#/TransactionResponse"
    replacement:
      $ref: "../schemas/transactions.yaml#/TransactionResponse"
    plan:
      $ref: "../schemas/investments.yaml#/CashStockMergerPlan"
    corrected_transaction_id:
      type: integer
      format: int64

ShareExchangeReplacementRequest:
  type: object
  additionalProperties: false
  required: [reason, effective_on, destination_commodity_id, ratio_numerator, ratio_denominator]
  description: >
    Corrected terms for a share exchange (#179). The exchanged holding and its
    old instrument stay those of the exchange; the date, ratio, new instrument,
    receiving holding or source evidence must change.
  properties:
    reason:
      type: string
    effective_on:
      type: string
      format: date
    destination_holding_account_id:
      type: integer
      format: int64
      description: Defaults to the exchanged holding.
    destination_commodity_id:
      type: integer
      format: int64
    ratio_numerator:
      type: integer
      format: int64
      minimum: 1
      maximum: 1000000000
    ratio_denominator:
      type: integer
      format: int64
      minimum: 1
      maximum: 1000000000
    source_evidence:
      type: object
      additionalProperties: true
    source_evidence_edits:
      type: object
      additionalProperties: true
      description: >
        Top-level edits applied on the server to the recorded source evidence
        (#311): a key set to null is removed, any other value replaces that key
        exactly, and every key not named keeps its recorded JSON token (large
        integers, decimals and nested data included). Mutually exclusive with
        source_evidence, which replaces the evidence whole; omitting both keeps
        the recorded evidence.
    memo:
      type: string
    reconciliation_override:
      type: boolean
    reconciliation_override_checkpoint_ids:
      $ref: "#/ReviewedCheckpointIds"
    gain_impact_acknowledgement:
      type: string

ShareExchangeReplacementResponse:
  type: object
  required: [inverse, replacement, plan, corrected_transaction_id]
  properties:
    inverse:
      $ref: "../schemas/transactions.yaml#/TransactionResponse"
    replacement:
      $ref: "../schemas/transactions.yaml#/TransactionResponse"
    plan:
      $ref: "../schemas/investments.yaml#/ShareExchangePlan"
    corrected_transaction_id:
      type: integer
      format: int64

InvestmentSplitReplacementRequest:
  type: object
  additionalProperties: false
  required: [reason, effective_on, ratio_numerator, ratio_denominator]
  description: Corrected terms for the same holding account and security (T-129).
  properties:
    reason:
      type: string
      minLength: 1
      description: Why the posted split is being corrected.
    effective_on:
      type: string
      format: date
    ratio_numerator:
      type: integer
      format: int64
      minimum: 1
      maximum: 1000000000
    ratio_denominator:
      type: integer
      format: int64
      minimum: 1
      maximum: 1000000000
    source_evidence:
      type: object
      additionalProperties: true
    source_evidence_edits:
      type: object
      additionalProperties: true
      description: >
        Top-level edits applied on the server to the recorded source evidence
        (#312): a key set to null is removed, any other value replaces that key
        exactly, and every key not named keeps its recorded JSON token (large
        integers, decimals and nested data included). Mutually exclusive with
        source_evidence, which replaces the evidence whole; omitting both keeps
        the recorded evidence. Unchanged date, ratio and effective evidence are
        refused as a no-op.
    memo:
      type: string
    reconciliation_override:
      type: boolean
    reconciliation_override_checkpoint_ids:
      $ref: "#/ReviewedCheckpointIds"
    gain_impact_acknowledgement:
      type: string
      description: Token from the preview's impact.gain_impact, accepting the committed-disposal gain changes it disclosed.

InvestmentSplitReplacementResponse:
  type: object
  required: [inverse, replacement, plan, corrected_transaction_id, corrected_operation_id, operation_id]
  properties:
    inverse:
      description: Null when the predecessor's current quantity delta is zero.
      oneOf:
        - $ref: "../schemas/transactions.yaml#/TransactionResponse"
        - type: "null"
    replacement:
      description: Null when no lots are entitled to the corrected split.
      oneOf:
        - $ref: "../schemas/transactions.yaml#/TransactionResponse"
        - type: "null"
    plan:
      $ref: "../schemas/investments.yaml#/InvestmentSplitPlan"
    corrected_transaction_id:
      type: [integer, "null"]
      format: int64
    corrected_operation_id:
      type: integer
      format: int64
    operation_id:
      type: integer
      format: int64

InvestmentCorrectionTransferTerms:
  type: object
  description: >-
    The effective transfer's committed terms, for pre-filling a replacement (T-119, outbound T-144).
    Selected-lot transfers list lot_allocations; pool transfers and external transfers in give quantity_value/scale.
    An outbound transfer has no destination account or lineage.
    An external transfer in has no source account or lineage and gives its carried basis and original date.
  required: [transfer_kind, effective_on, source_account_id, destination_account_id, commodity_id, cost_commodity_id,
    basis_allocation, destination_lineage, lot_allocations, quantity_value, quantity_scale,
    carried_basis_value, carried_basis_scale, basis_knowledge, original_acquired_on, source_evidence, memo]
  properties:
    basis_knowledge:
      type: string
      enum: [known, unknown]
      description: Unknown when a committed link carries unknown basis; carried_basis_value is then null.
    transfer_kind:
      type: string
      enum: [internal, external_in, external_out]
    effective_on:
      type: string
      format: date
    source_account_id:
      type: [integer, "null"]
      format: int64
    destination_account_id:
      type: [integer, "null"]
      format: int64
      description: Null for an outbound transfer.
    commodity_id:
      type: integer
      format: int64
    cost_commodity_id:
      type: integer
      format: int64
    basis_allocation:
      type: string
      enum: [selected_lots, average_cost_pool, ""]
      description: Empty for an external transfer in.
    destination_lineage:
      type: string
      enum: [source_lots, pooled_lot, ""]
      description: Empty for an external transfer in.
    lot_allocations:
      type: array
      items:
        $ref: "#/InvestmentLotAllocationRequest"
    quantity_value:
      type: [string, "null"]
      pattern: "^-?[0-9]+$"
    quantity_scale:
      type: [integer, "null"]
    carried_basis_value:
      type: [string, "null"]
      pattern: "^-?[0-9]+$"
      description: External transfer in with known basis only.
    carried_basis_scale:
      type: [integer, "null"]
    original_acquired_on:
      type: [string, "null"]
      format: date
      description: External transfer in only; null when the original date is unknown.
    source_evidence:
      type: object
      additionalProperties: true
    memo:
      type: string

InvestmentCorrectionSplitTerms:
  type: object
  description: The effective split's current terms, for pre-filling a replacement.
  required: [holding_account_id, commodity_id, effective_on, ratio_numerator, ratio_denominator, source_evidence]
  properties:
    holding_account_id:
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
    effective_on:
      type: string
      format: date
    ratio_numerator:
      type: integer
      format: int64
    ratio_denominator:
      type: integer
      format: int64
    source_evidence:
      type: object
      additionalProperties: true
      description: >
        The recorded source evidence, for pre-filling the fields a correction
        shows. A correction sends back only its edits as source_evidence_edits
        (#312), never this parsed object.

InvestmentCorrectionDividendTerms:
  type: object
  description: >-
    The effective cash dividend's posted facts, for pre-filling a replacement.
    A replacement may correct the date, cash account and currency (#395); the
    payment shape (withholding_only) is fixed.
  required: [attribution, source_differences, event_date, cash_account_id, cash_commodity_id, amount_value, amount_scale]
  properties:
    attribution:
      $ref: '#/InvestmentAttributionDiagnostic'
    source_differences:
      type: array
      description: >-
        Cash facts in which an imported lineage's effective payment differs
        from the payment its import produced. Empty for manual dividends and
        for imported ones that still match. Disclosure only; never a refusal.
      items:
        type: string
        enum: [date, cash_account, currency, amount, withholding]
    withholding_only:
      type: boolean
      description: Separate tax payment; amount is tax, no income leg, and withholding_account_id is required.
    commodity_id:
      type: integer
      format: int64
      description: Optional payer shared by gross income and withholding; absent when unassigned. Retained provider claims are diagnosed separately.
    ex_date:
      type: string
      format: date
      description: Recorded ex date the payment was made for; absent when none was recorded.
    event_date: { type: string, format: date }
    cash_account_id: { type: integer, format: int64 }
    cash_commodity_id: { type: integer, format: int64 }
    income_account_id: { type: integer, format: int64 }
    amount_value: { type: string, description: Gross dividend coefficient, or tax magnitude when withholding_only is true. }
    amount_scale: { type: integer }
    withholding_account_id: { type: integer, format: int64 }
    withholding_value: { type: string, description: Withheld amount coefficient. }
    withholding_scale: { type: integer }
    memo: { type: string }
    payee_id: { type: integer, format: int64 }

InvestmentCorrectionPaymentInLieuTerms:
  type: object
  description: >-
    The effective payment in lieu's posted facts, for pre-filling a
    replacement. Attribution is nullable and repairable; payment date, cash
    account and currency are correctable financial inputs (#395).
  required: [attribution, holding_account_id, commodity_id, ex_date, event_date, cash_account_id, cash_commodity_id, expense_account_id, amount_value, amount_scale]
  properties:
    attribution:
      $ref: '#/InvestmentAttributionDiagnostic'
    holding_account_id: { type: [integer, 'null'], format: int64 }
    commodity_id: { type: [integer, 'null'], format: int64 }
    ex_date: { type: [string, 'null'], format: date }
    event_date: { type: string, format: date }
    cash_account_id: { type: integer, format: int64 }
    cash_commodity_id: { type: integer, format: int64 }
    expense_account_id: { type: integer, format: int64 }
    amount_value: { type: string, description: Amount owed coefficient. }
    amount_scale: { type: integer }
    recovery_account_id: { type: integer, format: int64 }
    recovery_value: { type: string, description: Recovered amount coefficient. }
    recovery_scale: { type: integer }
    memo: { type: string }
    payee_id: { type: integer, format: int64 }

