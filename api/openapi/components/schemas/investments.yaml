    replacement:
      description: The full corrected write-off; its reason is why the holding is worthless.
      $ref: "#/InvestmentWriteOffRequest"

InvestmentSaleReplacementRequest:
  type: object
  additionalProperties: false
  required: [reason, replacement]
  properties:
    reason:
      type: string
      minLength: 1
      description: Why the posted manual long sale is being corrected.
    reconciliation_override:
      type: boolean
      description: Omit or set false to preserve affected reconciliation checkpoints.
    reconciliation_override_checkpoint_ids:
      $ref: "#/ReviewedCheckpointIds"
    gain_impact_acknowledgement:
      type: string
      description: >-
        The gain_impact.acknowledgement token from this command's
        reconciliation-impact preview, accepting the committed-disposal gain
        changes it disclosed (T-126). A non-empty change set without it is
