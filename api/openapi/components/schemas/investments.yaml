    - remaining_cost_basis_scale
    - basis_knowledge
    - opening_basis_knowledge
    - cost_commodity_id
    - metadata
    - created_at
    - updated_at
    - position_side
  properties:
    position_side:
      type: string
      enum: [long, short]
      description: >-
        Short for a lot of borrowed units (#173): its quantities stay positive
        and its basis amounts are the opening proceeds.
    id:
      type: integer
      format: int64
    book_id:
      type: integer
      format: int64
    account_id:
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
    opened_on:
      type: string
      format: date
    source_transaction_id:
      type: integer
      format: int64
    status:
      type: string
    quantity_value:
