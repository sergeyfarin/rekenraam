    country_code:
      type: string
    quote_commodity_id:
      type: integer
      format: int64
    trading_commodity_id:
      type: integer
      format: int64
    quantity_scale:
      type: integer
    price_scale:
      type: integer
    quote_identifiers:
      type: object
      additionalProperties: false
      description: Merge these provider identities on the server, preserving other identifiers as exact JSON. An empty string clears the named identity. Omitted identifiers and metadata are preserved on PATCH; explicit objects replace them. On a backdated PATCH, omitted identifiers/metadata keep the version in effect on that date, while quote_identifiers edits merge onto the current identifiers object.
      properties:
        coingecko_id: { type: string, maxLength: 128 }
        yahoo_symbol: { type: string, maxLength: 128 }
        twelve_data_symbol: { type: string, maxLength: 128 }
    identifiers:
      type: object
      additionalProperties: true
    metadata:
      type: object
      additionalProperties: true
    effective_from:
      type: string
      format: date
      description: >-
        Effective date for an instrument update. Ignored on create: instrument
        creation always dates the first version at the commodity genesis. A
        malformed or future value is still rejected with VALIDATION_FAILED.
