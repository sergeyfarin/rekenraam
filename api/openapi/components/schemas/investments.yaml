        $ref: "../schemas/investments.yaml#/CashStockMergerLink"
    source_quantity_value:
      type: string
    source_quantity_scale:
      type: integer
    destination_quantity_value:
      type: string
    destination_quantity_scale:
      type: integer
    totals:
      type: array
      items:
        $ref: "../schemas/investments.yaml#/CashStockMergerTotal"

CashStockMergerPreviewResponse:
  type: object
  required: [plan, impact]
  properties:
    plan:
      $ref: "../schemas/investments.yaml#/CashStockMergerPlan"
    impact:
      $ref: "../schemas/transactions.yaml#/ReconciliationImpactResponse"

CashStockMergerResponse:
  type: object
