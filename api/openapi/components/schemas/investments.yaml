    corrected_transaction_id:
      type: integer
      format: int64

InvestmentSplitRequest:
  type: object
  additionalProperties: false
  required: [effective_on, holding_account_id, commodity_id, ratio_numerator, ratio_denominator]
  properties:
    effective_on:
      type: string
      format: date
      description: Date on which entitled lots are split; lots opened later are not.
    holding_account_id:
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
    ratio_numerator:
      type: integer
      format: int64
      minimum: 1
      maximum: 1000000000
      description: New units received for ratio_denominator old units (3 for a 3-for-2 split; 1 for a 1-for-10 reverse split).
    ratio_denominator:
      type: integer
      format: int64
      minimum: 1
      maximum: 1000000000
      description: Old units surrendered. The ratio is stored in lowest terms and may not be 1:1.
    source_evidence:
      type: object
      additionalProperties: true
    memo:
      type: string
    change_reason:
      type: string
    reconciliation_override:
      type: boolean
    reconciliation_override_checkpoint_ids:
      $ref: "#/ReviewedCheckpointIds"
    gain_impact_acknowledgement:
      type: string
      description: Token from the preview's gain_impact, accepting the committed-disposal gain changes it disclosed.

InvestmentSplitLotEffect:
  type: object
  required: [lot_id, cost_commodity_id, quantity_before_value, quantity_before_scale, quantity_after_value, quantity_after_scale]
  properties:
    lot_id:
      type: integer
      format: int64
    cost_commodity_id:
      type: integer
      format: int64
    quantity_before_value:
      type: string
    quantity_before_scale:
      type: integer
    quantity_after_value:
      type: string
    quantity_after_scale:
      type: integer

InvestmentSplitPlan:
  type: object
  required: [ratio_numerator, ratio_denominator, effects, quantity_delta_value, quantity_delta_scale, replayed]
  properties:
    ratio_numerator:
      type: integer
      format: int64
    ratio_denominator:
      type: integer
      format: int64
    effects:
      type: array
      items:
        $ref: "../schemas/investments.yaml#/InvestmentSplitLotEffect"
    quantity_delta_value:
      type: string
      description: Signed holding change the journal posts; negative for a reverse split.
    quantity_delta_scale:
      type: integer
    replayed:
      type: boolean
      description: True when later disposals were replayed because the split is dated before them.

InvestmentSplitPreviewResponse:
  type: object
  required: [plan, impact]
  properties:
    plan:
      $ref: "../schemas/investments.yaml#/InvestmentSplitPlan"
    impact:
      $ref: "../schemas/transactions.yaml#/ReconciliationImpactResponse"

InvestmentSplitResponse:
  type: object
  required: [operation_id, transaction, plan]
  properties:
    operation_id:
      type: integer
      format: int64
      description: Durable split operation, including a journal-free zero-delta split.
    transaction:
      description: Null when no eligible lots exist; the sourced split records no zero journal.
      oneOf:
        - $ref: "../schemas/transactions.yaml#/TransactionResponse"
        - type: "null"
    plan:
      $ref: "../schemas/investments.yaml#/InvestmentSplitPlan"

ShareExchangeRequest:
  type: object
  additionalProperties: false
  required: [effective_on, holding_account_id, commodity_id, destination_commodity_id, ratio_numerator, ratio_denominator]
  description: >
    A share exchange (#177): an all-stock merger, fund merger or class
    conversion of the whole long holding of commodity_id in holding_account_id.
  properties:
    effective_on:
      type: string
      format: date
      description: Every long lot open on this date, at the operation's slot, is exchanged.
    holding_account_id:
      type: integer
      format: int64
    destination_holding_account_id:
      type: integer
      format: int64
      description: >
        Holding that receives the new instrument. Defaults to holding_account_id;
        a holding whose default instrument is the old one needs the new
        instrument's own holding.
    commodity_id:
      type: integer
      format: int64
      description: The old instrument.
    destination_commodity_id:
      type: integer
      format: int64
      description: The new instrument; must differ from commodity_id and not be a currency.
    ratio_numerator:
      type: integer
      format: int64
      minimum: 1
      maximum: 1000000000
      description: New units received for ratio_denominator old units. 1:1 is valid for a class change.
    ratio_denominator:
      type: integer
      format: int64
      minimum: 1
      maximum: 1000000000
      description: Old units surrendered. The ratio is stored in lowest terms.
    source_evidence:
      type: object
      additionalProperties: true
    memo:
      type: string
    change_reason:
      type: string
    reconciliation_override:
      type: boolean
    reconciliation_override_checkpoint_ids:
      $ref: "#/ReviewedCheckpointIds"
    gain_impact_acknowledgement:
      type: string
      description: >
        The preview's exact acknowledgement when a backdated exchange revises a
        committed disposal (#179); an in-order exchange changes none.

ShareExchangeLink:
  type: object
  required: [source_lot_id, destination_lot_id, cost_commodity_id, source_quantity_value, source_quantity_scale,
    destination_quantity_value, destination_quantity_scale, basis_knowledge, carried_basis_value,
    carried_basis_scale, original_date_knowledge, original_acquired_on]
  properties:
    source_lot_id:
      type: integer
      format: int64
    destination_lot_id:
      type: [integer, "null"]
      format: int64
      description: Null in a preview.
    cost_commodity_id:
      type: integer
      format: int64
    source_quantity_value:
      type: string
    source_quantity_scale:
      type: integer
    destination_quantity_value:
      type: string
      description: Source quantity times the ratio, exactly.
    destination_quantity_scale:
      type: integer
    basis_knowledge:
      type: string
      enum: [known, unknown]
    carried_basis_value:
      type: [string, "null"]
      description: The source lot's remaining basis, unchanged; null when unknown.
    carried_basis_scale:
      type: [integer, "null"]
    original_date_knowledge:
      type: string
      enum: [known, unknown]
    original_acquired_on:
      type: [string, "null"]
      format: date

ShareExchangePlan:
  type: object
  required: [ratio_numerator, ratio_denominator, links, source_quantity_value, source_quantity_scale,
    destination_quantity_value, destination_quantity_scale, basis_totals]
  properties:
    ratio_numerator:
      type: integer
      format: int64
    ratio_denominator:
      type: integer
      format: int64
    links:
      type: array
      items:
        $ref: "../schemas/investments.yaml#/ShareExchangeLink"
    source_quantity_value:
      type: string
      description: Old units the journal moves out of the holding.
    source_quantity_scale:
      type: integer
    destination_quantity_value:
      type: string
      description: New units the journal moves into the destination holding.
    destination_quantity_scale:
      type: integer
    basis_totals:
      type: array
      description: The units and basis carried in each cost currency, in link order (#178).
      items:
        $ref: "../schemas/investments.yaml#/ShareExchangeBasisTotal"

ShareExchangeBasisTotal:
  type: object
  required: [cost_commodity_id, source_quantity_value, source_quantity_scale, destination_quantity_value,
    destination_quantity_scale, basis_knowledge, carried_basis_value, carried_basis_scale, unknown_lots]
  properties:
    cost_commodity_id:
      type: integer
      format: int64
    source_quantity_value:
      type: string
    source_quantity_scale:
      type: integer
    destination_quantity_value:
      type: string
    destination_quantity_scale:
      type: integer
    basis_knowledge:
      type: string
      enum: [known, unknown]
      description: Unknown when any lot in this currency has unknown basis, as for a position.
    carried_basis_value:
      type: [string, "null"]
      description: Exact sum of the carried basis; null when unknown.
    carried_basis_scale:
      type: [integer, "null"]
    unknown_lots:
      type: integer
      description: Lots in this currency whose basis is unknown.

InvestmentCorrectionShareExchangeTerms:
  type: object
  required: [effective_on, holding_account_id, destination_holding_account_id, commodity_id,
    destination_commodity_id, source_evidence, plan]
  properties:
    effective_on:
      type: string
      format: date
    holding_account_id:
      type: integer
      format: int64
    destination_holding_account_id:
      type: integer
      format: int64
      description: Equal to holding_account_id when the new units stayed in the same holding.
    commodity_id:
      type: integer
      format: int64
      description: The old instrument.
    destination_commodity_id:
      type: integer
      format: int64
      description: The new instrument.
    source_evidence:
      type: object
      additionalProperties: true
    plan:
      $ref: "../schemas/investments.yaml#/ShareExchangePlan"

ShareExchangePreviewResponse:
  type: object
  required: [plan, impact]
  properties:
    plan:
      $ref: "../schemas/investments.yaml#/ShareExchangePlan"
    impact:
      $ref: "../schemas/transactions.yaml#/ReconciliationImpactResponse"

ShareExchangeResponse:
  type: object
  required: [transaction, plan]
  properties:
    transaction:
      $ref: "../schemas/transactions.yaml#/TransactionResponse"
    plan:
      $ref: "../schemas/investments.yaml#/ShareExchangePlan"

CashStockMergerRequest:
  type: object
  additionalProperties: false
  required: [effective_on, payable_on, holding_account_id, commodity_id, destination_commodity_id, ratio_numerator,
    ratio_denominator, cash_account_id, currency_id, cash_value, cash_scale, cash_basis_fraction_value,
    cash_basis_fraction_scale]
  description: >
    A cash-and-stock merger (#181): a share exchange of the whole long holding
    of commodity_id in holding_account_id that also pays cash, with an explicit
    election of the share of each lot's basis the cash recovers.
  properties:
    effective_on:
      type: string
      format: date
      description: Every long lot open on this date, at the operation's slot, is merged.
    payable_on:
      type: string
      format: date
      description: The date the cash is paid and posted; not before effective_on.
    holding_account_id:
      type: integer
      format: int64
    destination_holding_account_id:
      type: integer
      format: int64
      description: Holding that receives the new instrument. Defaults to holding_account_id.
    commodity_id:
      type: integer
      format: int64
      description: The old instrument.
    destination_commodity_id:
      type: integer
      format: int64
      description: The new instrument; must differ from commodity_id and not be a currency.
    ratio_numerator:
      type: integer
      format: int64
      minimum: 1
      maximum: 1000000000
    ratio_denominator:
      type: integer
      format: int64
      minimum: 1
      maximum: 1000000000
    cash_account_id:
      type: integer
      format: int64
      description: Settlement account that receives the cash.
    currency_id:
      type: integer
      format: int64
      description: The cash currency; must be every exchanged lot's cost currency.
    cash_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: The actual total cash, a positive exact coefficient. The issuer's per-share amount belongs in source_evidence.
    cash_scale:
      type: integer
      minimum: 0
      maximum: 12
    cash_basis_fraction_value:
      type: string
      description: >
        The election: the share of each lot's remaining basis the cash
        recovers, cash_basis_fraction_value/10^cash_basis_fraction_scale, from
        0 to 1 inclusive with at most 12 decimal places, stored in lowest terms.
        A relative-value method gives cash / (cash + value of the new shares).
        The app does not choose a jurisdiction's rule.
    cash_basis_fraction_scale:
      type: integer
      minimum: 0
    source_evidence:
      type: object
      additionalProperties: true
    memo:
      type: string
    change_reason:
      type: string
    reconciliation_override:
      type: boolean
    reconciliation_override_checkpoint_ids:
      $ref: "#/ReviewedCheckpointIds"
    gain_impact_acknowledgement:
      type: string
      description: The preview's acknowledgement of the later gains a backdated merger restates (#184); an in-order merger revises none.

CashStockMergerLink:
  allOf:
    - $ref: "../schemas/investments.yaml#/ShareExchangeLink"
    - type: object
      required: [realized_basis_value, realized_basis_scale, cash_value, cash_scale]
      description: carried_basis_value is the basis left after the cash, which opens the new lot.
      properties:
        realized_basis_value:
          type: [string, "null"]
          description: Remaining basis times the election, truncated; null when unknown.
        realized_basis_scale:
          type: [integer, "null"]
        cash_value:
          type: string
          description: This lot's share of the cash, by old units.
        cash_scale:
          type: integer

CashStockMergerTotal:
  allOf:
    - $ref: "../schemas/investments.yaml#/ShareExchangeBasisTotal"
    - type: object
      required: [cash_value, cash_scale, realized_basis_value, realized_basis_scale, result_value, result_scale]
      properties:
        cash_value:
          type: string
        cash_scale:
          type: integer
        realized_basis_value:
          type: [string, "null"]
          description: Null when any lot in this currency is unknown.
        realized_basis_scale:
          type: [integer, "null"]
        result_value:
          type: [string, "null"]
          description: Cash minus realized basis; null (unresolved) when any lot in this currency is unknown.
        result_scale:
          type: [integer, "null"]

CashStockMergerPlan:
  type: object
  required: [ratio_numerator, ratio_denominator, cash_basis_fraction_value, cash_basis_fraction_scale, links,
