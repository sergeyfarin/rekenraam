      $ref: "../schemas/investments.yaml#/ExternalTransferOutRequest"
      description: >-
        The full corrected outbound transfer. Date, source holding and lots or pooled quantity may change;
        commodity_id and cost_commodity_id must equal the transfer's. Its change_reason,
        reconciliation_override and gain_impact_acknowledgement are ignored.
    source_evidence_edits:
      type: object
      additionalProperties: true
      description: >
        Top-level edits applied on the server to the recorded source evidence
        (#312): a key set to null is removed, any other value replaces that key
        exactly, and every key not named keeps its recorded JSON token (large
        integers, decimals and nested data included). Mutually exclusive with
        replacement.source_evidence, which replaces the evidence whole;
        omitting both keeps the recorded evidence.

InvestmentTransferOutReplacementResponse:
  type: object
  required: [inverse, replacement, corrected_transaction_id]
  properties:
    inverse:
      $ref: "../schemas/transactions.yaml#/TransactionResponse"
    replacement:
      $ref: "../schemas/investments.yaml#/ExternalTransferOutResponse"
    corrected_transaction_id:
      type: integer
      format: int64

CashInLieuRequest:
  type: object
  additionalProperties: false
  required: [disposal_on, payment_on, quantity_value, quantity_scale, cash_account_id,
    currency_id, proceeds_value, proceeds_scale]
  oneOf:
    - required: [settled_transaction_id]
    - required: [settled_operation_id]
  properties:
    settled_operation_id:
      type: integer
      format: int64
      minimum: 1
      description: Original typed operation being settled, including historical actions and initially journal-free splits; supply this or settled_transaction_id. Current parent standing is advisory; actual dated disposal replay must succeed.

    settled_transaction_id:
      type: integer
      format: int64
      description: >-
        The original posted split, share exchange, cash-and-stock merger or spin-off selected as provenance, even after replacement or reversal.
        The holding and security are the split's own, or the other action's destination holding and new instrument.
    disposal_on:
      type: string
      format: date
    payment_on:
      type: string
      format: date
    quantity_value:
      type: string
      pattern: '^[1-9][0-9]{0,37}$'
      description: The fraction, below one share.
    quantity_scale:
      type: integer
      minimum: 0
      maximum: 24
    cash_account_id:
      type: integer
      format: int64
    currency_id:
      type: integer
      format: int64
    proceeds_value:
      type: string
      pattern: '^[1-9][0-9]{0,18}$'
    proceeds_scale:
      type: integer
      minimum: 0
      maximum: 12
    cost_basis_method:
      type: string
      enum: [fifo, lifo, average_cost, specific_lot]
    lot_allocations:
      type: array
      items:
        $ref: "../schemas/investments.yaml#/InvestmentLotAllocationRequest"
    memo:
      type: string
    change_reason:
      type: string
    reconciliation_override:
      type: boolean
    reconciliation_override_checkpoint_ids:
      $ref: "#/ReviewedCheckpointIds"
    gain_impact_acknowledgement:
      type: string

CashInLieuPreviewResponse:
  type: object
  required: [allocations, impact, disposed_basis_value, disposed_basis_scale, realized_gain_value, realized_gain_scale, cost_basis_method, basis_knowledge]
  properties:
    basis_knowledge:
      type: string
      enum: [known, unknown]
    disposed_basis_value:
      type: [string, "null"]
      description: Total exact basis of the fraction taken by the dated writer.
    disposed_basis_scale:
      type: [integer, "null"]
    realized_gain_value:
      type: [string, "null"]
      description: Signed proceeds minus disposed basis, computed on the server.
    realized_gain_scale:
      type: [integer, "null"]
    cost_basis_method:
      type: string
      enum: [fifo, lifo, average_cost, specific_lot]
    allocations:
      type: array
      items:
        $ref: "#/InvestmentLotDisposalResponse"
    impact:
      $ref: "../schemas/transactions.yaml#/ReconciliationImpactResponse"

CapitalReturnRequest:
  type: object
  additionalProperties: false
  required: [holding_account_id, commodity_id, cash_account_id, currency_id, effective_on, payment_on, amount_value, amount_scale]
  properties:
    holding_account_id:
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
    cash_account_id:
      type: integer
      format: int64
    currency_id:
      type: integer
      format: int64
      description: Receipt currency; must be the position's cost currency.
    effective_on:
      type: string
      format: date
      description: Basis action date; entitles every lot open then.
    payment_on:
      type: string
      format: date
      description: Cash receipt date, on or after effective_on.
    entitled_lot_ids:
      type: array
      items:
        type: integer
        format: int64
      description: >-
        Explicit entitlement (T-148): the lots the corporate action names, each entitled to its whole remaining
        quantity on the effective date. Omit to apply the per-share rule to every lot open then. A named lot that
        is not open in the holding on that date is refused.
    lot_entitlements:
      type: array
      minItems: 1
      items:
        $ref: '#/CapitalReturnEntitlement'
      description: >-
        Fixed lot/quantity entitlement from the corporate action. Quantities must be positive,
        distinct by lot, and no greater than that lot holds at the effective-date slot. Receipt
        allocation is per entitled unit; reduction is capped to the entitled units' proportional
        share of each lot's basis. Mutually exclusive with entitled_lot_ids. Replay follows
        corrected acquisition successors while keeping the named quantity fixed.
    amount_value:
      type: string
      pattern: '^[1-9][0-9]{0,37}$'
    amount_scale:
      type: integer
      minimum: 0
      maximum: 12
    source_evidence:
      type: object
      additionalProperties: true
    memo:
      type: string
    change_reason:
      type: string
    reconciliation_override:
      type: boolean
    reconciliation_override_checkpoint_ids:
      $ref: "#/ReviewedCheckpointIds"
    gain_impact_acknowledgement:
      type: string

CapitalReturnEffect:
  type: object
  required: [lot_id, entitled_quantity_value, entitled_quantity_scale, allocated_value, allocated_scale,
    reduction_value, reduction_scale, excess_value, excess_scale, basis_knowledge]
  properties:
    basis_knowledge:
      type: string
      enum: [known, unknown]
      description: Unknown leaves reduction and excess amount pairs null; entitlement and allocation remain exact.
    lot_id:
      type: integer
      format: int64
    entitled_quantity_value:
      type: string
    entitled_quantity_scale:
      type: integer
    allocated_value:
      type: string
      description: This lot's per-share share of the receipt; the last lot takes the exact remainder.
    allocated_scale:
      type: integer
    reduction_value:
      type: [string, "null"]
      description: Minimum of allocated cash and eligible basis (proportional to entitled quantity for explicit_quantities).
    reduction_scale:
      type: [integer, "null"]
    excess_value:
      type: [string, "null"]
      description: Unresolved amount beyond the lot's basis; never income or negative basis.
    excess_scale:
      type: [integer, "null"]

CapitalReturnResponse:
  type: object
  required: [transaction, effects]
  properties:
    transaction:
      $ref: "../schemas/transactions.yaml#/TransactionResponse"
    effects:
      type: array
      items:
        $ref: "../schemas/investments.yaml#/CapitalReturnEffect"

CapitalReturnPreviewResponse:
  type: object
  required: [effects, impact]
  properties:
    effects:
      type: array
      items:
        $ref: "../schemas/investments.yaml#/CapitalReturnEffect"
    impact:
      $ref: "../schemas/transactions.yaml#/ReconciliationImpactResponse"

InvestmentTransferInReplacementRequest:
  type: object
  additionalProperties: false
  required: [reason, replacement]
  properties:
    reason:
      type: string
      minLength: 1
      description: Why the posted external transfer in is being corrected.
    reconciliation_override:
      type: boolean
      description: Omit or set false to keep affected reconciliation checkpoints active.
    reconciliation_override_checkpoint_ids:
      $ref: "#/ReviewedCheckpointIds"
    gain_impact_acknowledgement:
