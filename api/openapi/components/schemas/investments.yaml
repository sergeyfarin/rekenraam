InvestmentPositionResponse:
  type: object
  required:
    - account_id
    - commodity_id
    - quantity_value
    - quantity_scale
    - remaining_cost_basis_value
    - remaining_cost_basis_scale
    - basis_knowledge
    - cost_commodity_id
    - latest_price_approximate
    - transfer_basis_allocation
    - position_side
  properties:
    price_status:
      type: string
      enum: [usable, stale, no_price, future_only, incompatible_quote_basis, not_known_at_cutoff, conflicting_splits]
      description: >-
        Stale means older than seven calendar days; live holdings retain the
        labelled value without an age rejection. conflicting_splits means
        holdings recorded different instrument split factors after
        latest_price_date and on or before valuation_as_of, or disagree on
        the factor still pending after the source trade of a trade-implied
        quote on latest_price_date. The quote's unit basis is then unknown
        and the position is not valued.
    valuation_as_of:
      type: string
      format: date
      description: Owner-local current date at read start; positions remain the current operational projection.
    knowledge_cutoff:
      type: string
      format: date-time
      description: Recorded-at observation admission boundary; current withdrawals still apply.

    position_side:
      type: string
      enum: [long, short]
      description: >-
        Short for owed units: quantity stays positive and the basis amounts
        are remaining opening proceeds. Each account, instrument, cost
        currency and side is its own row.
    transfer_basis_allocation:
      type: string
      enum: [selected_lots, average_cost_pool]
      description: >-
        How an internal transfer from this position allocates basis: the open
        position's method lock, else its resolved default method (T-123).
    account_id:
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
    quantity_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,37})$'
      description: Lossless exact integer coefficient normalized to quantity_scale.
    quantity_scale:
      type: integer
    remaining_cost_basis_value:
      type: [string, 'null']
      description: Null when projected basis is unknown; known zero remains an explicit coefficient.
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
    remaining_cost_basis_scale:
      type: [integer, 'null']
    basis_knowledge:
      type: string
      enum: [known, unknown]
      description: Knowledge of remaining projected basis; any unknown lot makes the position basis unknown.
    cost_commodity_id:
      type: integer
      format: int64
    latest_price_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
    latest_price_scale:
      type: integer
    latest_price_date:
      type: string
      format: date
    latest_price_approximate:
      type: boolean
      description: True when the selected valuation quote was estimated from net-only trade cash.
    split_ratio_numerator:
      type: string
      description: >-
        Exact factor used to bring the quote's unit basis to valuation_as_of:
        each quoted unit corresponds to split_ratio_numerator /
        split_ratio_denominator units on valuation_as_of (in lowest terms, as
        decimal integer strings). It includes recorded splits after
        latest_price_date and on or before valuation_as_of. For a trade-implied
        quote it also includes splits on latest_price_date still pending after
        the source trade's replay slot, when every holding that recorded that
        day's splits agrees on the pending factor. Valuation divides the quote
        by this factor; latest_price_value stays the quote as observed.
    split_ratio_denominator: { type: string }

