    lot_id:
      type: integer
      format: int64
    quantity_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,37})$'
      description: Lossless exact integer coefficient normalized to quantity_scale.
    quantity_scale:
      type: integer
    cost_basis_value:
      type: [string, 'null']
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
    cost_basis_scale:
      type: [integer, 'null']
    proceeds_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
    proceeds_scale:
      type: integer

InvestmentTradeResponse:
  type: object
  required:
    - transaction
    - allocations
  properties:
    transaction:
      $ref: "../schemas/transactions.yaml#/TransactionResponse"
    lot_id:
      type: integer
      format: int64
      description: Created lot ID for buy transactions.
    allocations:
      type: array
      items:
        $ref: "#/InvestmentLotDisposalResponse"
