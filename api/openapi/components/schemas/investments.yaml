      format: int64
      description: For an exchange, the old instrument; otherwise this lot's own.
    source_account_id:
      type: [integer, "null"]
      format: int64
      description: Null for an external transfer in.
    source_lot_id:
      type: [integer, "null"]
      format: int64
    ratio_numerator:
      type: [integer, "null"]
      format: int64
      description: New units per ratio_denominator old units; set for an exchange only.
    ratio_denominator:
      type: [integer, "null"]
      format: int64
    original_date_knowledge:
      type: string
      enum: [known, unknown]
    original_acquired_on:
