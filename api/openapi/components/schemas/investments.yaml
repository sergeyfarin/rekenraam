RealizedGainEntry:
  type: object
  required:
    - account_id
    - commodity_id
    - cost_commodity_id
    - disposal_date
    - quantity_value
    - quantity_scale
    - disposed_basis_value
    - disposed_basis_scale
    - proceeds_value
    - proceeds_scale
    - realized_gain_value
    - realized_gain_scale
  properties:
    account_id:
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
    cost_commodity_id:
      type: integer
      format: int64
    disposal_date:
      type: string
      format: date
    transaction_id:
      type: integer
      format: int64
      description: The sell transaction ID, if one exists.
    quantity_value:
      type: string
      description: Disposed quantity as a base-10 integer string.
    quantity_scale:
      type: integer
    disposed_basis_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: Disposed cost basis in minor units at disposed_basis_scale.
    disposed_basis_scale:
      type: integer
    proceeds_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: Cash proceeds in minor units at proceeds_scale.
    proceeds_scale:
      type: integer
    realized_gain_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: >-
        proceeds_value − disposed_basis, in minor units at realized_gain_scale.
        Format it with realized_gain_scale, never with proceeds_scale.
    realized_gain_scale:
      type: integer
      description: >-
        Scale of realized_gain_value: the deeper of proceeds_scale and
        disposed_basis_scale, so the difference is exact. It is not always
        proceeds_scale — 11 EUR of proceeds entered at scale 0 against a
        10.99 EUR basis is a 0.01 EUR gain at scale 2.

UnrealizedGainEntry:
  type: object
  required:
    - account_id
    - commodity_id
    - cost_commodity_id
    - quantity_value
    - quantity_scale
    - remaining_cost_basis_value
    - remaining_cost_basis_scale
    - basis_knowledge
    - latest_price_approximate
  properties:
    account_id:
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
    cost_commodity_id:
      type: integer
      format: int64
    quantity_value:
      type: string
      description: Remaining quantity as a base-10 integer string.
    quantity_scale:
      type: integer
    remaining_cost_basis_value:
      type: [string, 'null']
      description: Null when projected basis is unknown; known zero remains an explicit coefficient.
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
    remaining_cost_basis_scale:
      type: [integer, 'null']
    basis_knowledge:
      type: string
      enum: [known, unknown]
      description: Knowledge of remaining projected basis; any unknown lot makes the position basis unknown.
    latest_price_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: Omitted when no price observation exists.
    latest_price_scale:
      type: integer
      description: Omitted when no price observation exists.
    latest_price_date:
      type: string
      format: date
      description: Omitted when no price observation exists.
    latest_price_approximate:
      type: boolean
      description: True when the selected valuation quote was estimated from net-only trade cash.
    market_value_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: >-
        quantity × latest_price. Omitted when valuation_unavailable is present.
    market_value_scale:
      type: integer
      description: >-
        Scale of market_value_value. Reduced below the computed precision only
        when redundant trailing zeros would otherwise overflow int64.
    unrealized_gain_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: >-
        market_value − remaining_cost_basis. Omitted when valuation_unavailable
        is present.
    unrealized_gain_scale:
      type: integer
      description: Omitted when valuation_unavailable is present.
    valuation_unavailable:
      type: string
      enum: [no_price, unrepresentable]
      description: >-
        Present only when market value and unrealized gain are omitted, saying
        why. no_price means no price observation exists for the position;
        unrepresentable means one is priced but the value does not fit the
        response's int64 fields.
    gain_unavailable:
      type: string
      enum: [unknown_basis]
      description: Gain is omitted when basis is unknown; quantity and any available market value are retained.

RealizedGainTotal:
  type: object
  required:
    - cost_commodity_id
    - total_gain_value
    - total_gain_scale
  properties:
    cost_commodity_id:
      type: integer
      format: int64
    total_gain_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: >-
        Exact sum of realized_gain_value for every entry with this
        cost_commodity_id. One row per cost commodity: entries are summed
        across differing realized_gain_scale values, and total_gain_scale is
        the scale the sum needs.
    total_gain_scale:
      type: integer

InvestmentGainsResponse:
  type: object
  required:
    - currencies
    - realized
    - unrealized
    - realized_totals
  properties:
    currencies:
      type: array
      description: Currency labels and standard display scales; calculations retain their recorded precision.
      items:
        $ref: "../../openapi.yaml#/components/schemas/CurrencyResponse"
    realized:
      type: array
      items:
        $ref: "#/RealizedGainEntry"
    unrealized:
      type: array
      items:
        $ref: "#/UnrealizedGainEntry"
    realized_totals:
      type: array
      description: Pre-aggregated totals by cost commodity, suitable for display.
      items:
        $ref: "#/RealizedGainTotal"

GainImpact:
  type: object
  description: >-
    Replay gain disclosure (T-114). Lists every committed disposal whose
    effective operational basis, proceeds, gain, knowledge, date, position or
    method the command would change, compared inside the command's own
    rolled-back write transaction. Disposals the command itself creates under
    a new correction root are not listed. Re-selected allocations with
    identical totals are not a change. Present only for commands opted into
    disclosure; an omitted gain_impact is not a claim that no gain changes.
  required:
    - changes
    - acknowledgement
  properties:
    changes:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/GainImpactChange"
    acknowledgement:
      type: string
      description: >-
        Opaque token binding an acknowledgement to exactly this change set.
        Empty when changes is empty. Echo it as gain_impact_acknowledgement.
GainImpactChange:
  type: object
  required:
    - change_kind
    - root_operation_id
    - decision_seq
    - operation_id
    - decision_id
    - transaction_id
    - before
    - after
  properties:
    change_kind:
      type: string
      enum: [revised, replaced, removed]
      description: >-
        revised - the same decision gets a new effective result; replaced - a
        correction supersedes the decision; removed - a reversal leaves no
        effective decision.
    root_operation_id:
      type: integer
      format: int64
      description: Correction-root operation; with decision_seq, the stable identity.
    decision_seq:
      type: integer
    operation_id:
      type: integer
      format: int64
      description: Committed operation of the disclosed decision.
    decision_id:
      type: integer
      format: int64
      description: Committed disposal decision. Never a preview-only ID.
    transaction_id:
      type: integer
      format: int64
      description: Committed transaction linked to the disclosed decision.
    before:
      $ref: "../../openapi.yaml#/components/schemas/GainImpactState"
    after:
      description: Effective result after the command; null when removed. Carries no IDs.
      oneOf:
        - $ref: "../../openapi.yaml#/components/schemas/GainImpactState"
        - type: "null"
GainImpactState:
  type: object
  required:
    - account_id
    - commodity_id
    - cost_commodity_id
    - disposal_date
    - cost_basis_method
    - quantity_value
    - quantity_scale
    - basis_knowledge
    - disposed_basis_value
    - disposed_basis_scale
    - proceeds_value
    - proceeds_scale
    - realized_gain_value
    - realized_gain_scale
  properties:
    account_id:
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
    cost_commodity_id:
      type: integer
      format: int64
      description: Cost currency of basis, proceeds and gain.
    disposal_date:
      type: string
      format: date
    cost_basis_method:
      $ref: "#/CostBasisMethod"
    quantity_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,37})$'
    quantity_scale:
      type: integer
    basis_knowledge:
      type: string
      enum: [known, unknown]
    disposed_basis_value:
      type: [string, "null"]
      pattern: '^-?(0|[1-9][0-9]{0,37})$'
      description: Null when basis_knowledge is unknown; never a fabricated zero.
    disposed_basis_scale:
      type: [integer, "null"]
    proceeds_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,37})$'
      description: Signed operational proceeds; may be negative.
    proceeds_scale:
      type: integer
    realized_gain_value:
      type: [string, "null"]
      pattern: '^-?(0|[1-9][0-9]{0,37})$'
      description: proceeds minus disposed basis; null when basis is unknown.
    realized_gain_scale:
      type: [integer, "null"]
