InvestmentCorrectionChainResponse:
  type: object
  required: [root_operation_id, effective_transaction_id, can_reverse_manual_sale, can_reverse_manual_buy, can_reverse_sale, can_reverse_buy, can_correct_split, can_correct_dividend, can_correct_reinvested_dividend, can_reverse_return_of_capital, can_replace_return_of_capital, can_correct_write_off, can_correct_short_sale, can_correct_short_cover, can_correct_share_exchange, can_correct_cash_in_lieu, can_reverse_transfer, can_replace_transfer, can_resolve_basis, can_correct_basis_resolution, basis_resolutions, operations]
  properties:
    root_operation_id:
      type: integer
      format: int64
    effective_transaction_id:
      type: [integer, 'null']
      format: int64
      description: Null when the chain ends in a pure reversal.
    can_reverse_manual_sale:
      type: boolean
      description: Whether the effective operation is a posted manual long sale eligible for the native reversal command.
    can_reverse_manual_buy:
      type: boolean
      description: Whether the effective operation is a posted manual long buy eligible for a guarded reversal attempt. Dependent replay may still refuse the command.
    can_reverse_sale:
      type: boolean
      description: Whether the effective posted long sale can be reversed. Imported lineage requires a committed source identity.
    can_reverse_buy:
      type: boolean
      description: Whether the effective posted long buy can attempt reversal. Dependent replay may still refuse the command; imported lineage requires a committed source identity.
    can_correct_split:
      type: boolean
      description: Whether the effective posted split can be reversed or replaced (T-129). Dependent replay may still refuse the command.
    effective_split:
      $ref: '#/InvestmentCorrectionSplitTerms'
    can_correct_cash_in_lieu:
      type: boolean
      description: Effective cash in lieu may attempt native reversal or replacement; dependent replay remains guarded.
    can_correct_short_sale:
      type: boolean
      description: The effective operation is a named short sale that may be reversed or replaced (#175).
    can_correct_short_cover:
      type: boolean
      description: The effective operation is a short cover that may be reversed or replaced (#175).
    can_correct_share_exchange:
      type: boolean
      description: The effective operation is a share exchange that may be reversed or replaced (#179); effective_share_exchange carries its terms.
    can_correct_write_off:
      type: boolean
      description: Whether the effective posted write-off can be reversed or replaced (T-118). The trade correction context pre-fills the replacement; dependent replay may still refuse the command.
    can_reverse_transfer:
      type: boolean
      description: Whether the effective posted internal or external-in transfer can attempt reversal (T-119). A destination disposal or onward transfer of the removed units may still refuse the command.
    can_replace_transfer:
      type: boolean
      description: Whether the effective posted internal or external-in transfer can attempt replacement (T-119); internal ones use replace-transfer, external ones replace-transfer-in. False while an external transfer in has an effective sourced basis resolution; reversing the resolution (#168) makes it correctable again.
    can_resolve_basis:
      type: boolean
      description: Whether the effective external transfer in still carries unknown basis that resolve-basis can resolve (T-145).
    can_correct_basis_resolution:
      type: boolean
      description: Whether this external transfer in has an effective sourced resolution that replace-basis-resolution or reverse-basis-resolution can correct through the transfer (#168).
    effective_basis_resolution:
      $ref: '#/InvestmentCorrectionBasisResolutionTerms'
    basis_resolutions:
      type: array
      description: Every sourced resolution pinned to this external transfer in, oldest first, with its standing (#168). Empty for other operations.
      items:
        $ref: '#/InvestmentBasisResolutionHistoryEntry'
    effective_transfer:
      $ref: '#/InvestmentCorrectionTransferTerms'
    can_replace_return_of_capital:
      type: boolean
      description: Whether the effective posted return can be replaced atomically at its correction-root slot.
    effective_return_of_capital:
      $ref: '#/CapitalReturnRequest'
    can_reverse_return_of_capital:
      type: boolean
      description: The effective operation is a return of capital that can be reversed (T-148).
    can_correct_dividend:
      type: boolean
      description: Whether the effective posted cash dividend can be reversed or replaced (T-115). Imported lineage requires a committed source identity.
    effective_dividend:
      $ref: '#/InvestmentCorrectionDividendTerms'
    can_correct_reinvested_dividend:
      type: boolean
      description: Whether the effective posted reinvested dividend can be reversed or replaced (T-115). Dependent replay may still refuse the command.
    effective_reinvestment:
      $ref: '#/InvestmentCorrectionReinvestmentTerms'
    effective_share_exchange:
      $ref: '#/InvestmentCorrectionShareExchangeTerms'
      description: >-
        Present when the effective operation is a share exchange (#178): its
        instruments, holdings, ratio and each link's current carried basis.
        It is not yet correctable; reversal and replacement arrive with #179.
    effective_spin_off:
      $ref: '#/InvestmentCorrectionSpinOffTerms'
      description: >-
        Present when the effective operation is a spin-off (#180): its
        instruments, holdings, ratio, basis fraction and each link's current
        allocated basis. Its own correction arrives with #183.
    operations:
      type: array
      minItems: 1
      items:
        $ref: '#/InvestmentCorrectionNodeResponse'

InvestmentTradeCorrectionContextResponse:
  type: object
  description: Immutable buy or sale source facts for pre-filling a full replacement. The write command rechecks eligibility.
  required: [operation_id, transaction_id, operation_kind, event_date, holding_account_id,
    commodity_id, commodity_code, cost_commodity_id, quantity_value, quantity_scale,
    cost_basis_method, cash_account_id, net_value, net_scale, settlement_date, memo,
    imported, source_identity_id, source_kind, already_corrected, charges, elected_lots, can_replace_sale,
    available_lots, effective_elected_lots]
  properties:
    split_transaction_id:
      type: integer
      format: int64
      description: The fixed split link, present for cash-in-lieu correction context.

    operation_id: { type: integer, format: int64 }
    transaction_id: { type: integer, format: int64 }
    operation_kind: { type: string, enum: [buy, sell, write_off, cash_in_lieu, short_sale, short_cover] }
    event_date: { type: string, format: date }
    holding_account_id: { type: integer, format: int64 }
    commodity_id: { type: integer, format: int64 }
    commodity_code: { type: string }
    cost_commodity_id: { type: integer, format: int64 }
    quantity_value: { type: string }
    quantity_scale: { type: integer }
    cost_basis_method: { type: string, description: Empty for buys. }
    cash_account_id: { type: integer, format: int64 }
    net_value: { type: string, description: Signed owner-perspective primary settlement. }
    net_scale: { type: integer }
    settlement_date: { type: string, format: date }
    memo: { type: string }
    payee_id: { type: integer, format: int64 }
    gross_value: { type: string, description: Signed gross source amount when known. }
    gross_scale: { type: integer }
    imported: { type: boolean }
    source_identity_id: { type: integer, format: int64, description: Committed import source identity through immutable correction ancestry; zero for standalone manual or unlinked imported trades. }
    source_kind: { type: string, description: Stable import source kind; empty when no committed source identity exists. }
    already_corrected: { type: boolean }
    charges:
      type: array
      items:
        $ref: '#/InvestmentTradeCorrectionChargeResponse'
    elected_lots:
      type: array
      description: Original explicit specific-lot choices; empty for other methods.
      items:
        $ref: '#/InvestmentTradeCorrectionLotChoiceResponse'
    can_replace_sale:
      type: boolean
      description: Display hint for an effective sale or write-off eligible for correction, including imported fills with a committed source identity. The write rechecks its source and dependent replay.
    available_lots:
      type: array
      description: Effective long lots and quantities immediately before an uncorrected manual sale, including an older sale, from a rolled-back replay.
      items:
        $ref: '#/InvestmentTradeCorrectionAvailableLotResponse'
    effective_elected_lots:
      type: array
      description: Specific-lot elections mapped to effective acquisitions after earlier corrections.
      items:
        $ref: '#/InvestmentTradeCorrectionLotChoiceResponse'

InvestmentTradeCorrectionAvailableLotResponse:
  type: object
  required: [lot_id, opened_on, quantity_value, quantity_scale]
  properties:
    lot_id: { type: integer, format: int64 }
    opened_on: { type: string, format: date }
    quantity_value: { type: string }
    quantity_scale: { type: integer }

InvestmentTradeCorrectionLotChoiceResponse:
