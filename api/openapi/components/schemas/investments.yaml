GainImpact:
  type: object
  description: >-
    Replay gain disclosure (T-114). Lists every committed disposal whose
    effective operational basis, proceeds, gain, knowledge, date, position or
    method the command would change, compared inside the command's own
    rolled-back write transaction. Disposals the command itself creates under
    a new correction root are not listed. Re-selected allocations with
    identical totals are not a change. Present only for commands opted into
    disclosure; an omitted gain_impact is not a claim that no gain changes.
  required:
    - changes
    - acknowledgement
  properties:
    changes:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/GainImpactChange"
    acknowledgement:
      type: string
      description: >-
        Opaque token binding an acknowledgement to exactly this change set.
        Empty when changes is empty. Echo it as gain_impact_acknowledgement.
GainImpactChange:
  type: object
  required:
    - change_kind
    - root_operation_id
    - decision_seq
    - operation_id
    - decision_id
    - transaction_id
    - before
    - after
  properties:
    change_kind:
      type: string
      enum: [revised, replaced, removed]
      description: >-
        revised - the same decision gets a new effective result; replaced - a
        correction supersedes the decision; removed - a reversal leaves no
        effective decision.
    root_operation_id:
      type: integer
      format: int64
      description: Correction-root operation; with decision_seq, the stable identity.
    decision_seq:
      type: integer
    operation_id:
      type: integer
      format: int64
      description: Committed operation of the disclosed decision.
    decision_id:
      type: integer
      format: int64
      description: Committed disposal decision. Never a preview-only ID.
    transaction_id:
      type: integer
      format: int64
      description: Committed transaction linked to the disclosed decision.
    before:
      $ref: "../../openapi.yaml#/components/schemas/GainImpactState"
    after:
      description: Effective result after the command; null when removed. Carries no IDs.
      oneOf:
        - $ref: "../../openapi.yaml#/components/schemas/GainImpactState"
        - type: "null"
GainImpactState:
  type: object
  required:
    - account_id
    - commodity_id
    - cost_commodity_id
    - disposal_date
    - cost_basis_method
    - quantity_value
    - quantity_scale
    - basis_knowledge
    - disposed_basis_value
    - disposed_basis_scale
    - proceeds_value
    - proceeds_scale
    - realized_gain_value
    - realized_gain_scale
  properties:
    account_id:
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
    cost_commodity_id:
      type: integer
      format: int64
      description: Cost currency of basis, proceeds and gain.
    disposal_date:
      type: string
      format: date
    cost_basis_method:
      $ref: "#/CostBasisMethod"
    quantity_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,37})$'
    quantity_scale:
      type: integer
    basis_knowledge:
      type: string
      enum: [known, unknown]
    disposed_basis_value:
      type: [string, "null"]
      pattern: '^-?(0|[1-9][0-9]{0,37})$'
      description: Null when basis_knowledge is unknown; never a fabricated zero.
    disposed_basis_scale:
      type: [integer, "null"]
    proceeds_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,37})$'
      description: Signed operational proceeds; may be negative.
    proceeds_scale:
      type: integer
    realized_gain_value:
      type: [string, "null"]
      pattern: '^-?(0|[1-9][0-9]{0,37})$'
      description: proceeds minus disposed basis; null when basis is unknown.
    realized_gain_scale:
      type: [integer, "null"]

CapitalReturnEntitlement:
  type: object
  additionalProperties: false
  required: [lot_id, quantity_value, quantity_scale]
  properties:
    lot_id:
      type: integer
      format: int64
      minimum: 1
    quantity_value:
      type: string
      pattern: '^[1-9][0-9]{0,37}$'
    quantity_scale:
      type: integer
      minimum: 0
      maximum: 24

CapitalReturnReplacementRequest:
  type: object
  additionalProperties: false
  required: [reason, replacement]
  properties:
    reason:
      type: string
      minLength: 1
    replacement:
      $ref: '#/CapitalReturnRequest'
    reconciliation_override:
      type: boolean
    gain_impact_acknowledgement:
      type: string

CapitalReturnReplacementResponse:
  type: object
  required: [inverse, replacement, corrected_transaction_id]
  properties:
    inverse:
      $ref: "../schemas/transactions.yaml#/TransactionResponse"
    replacement:
      $ref: '#/CapitalReturnResponse'
    corrected_transaction_id:
      type: integer
      format: int64

CashInLieuReplacementRequest:
  type: object
  additionalProperties: false
  required: [reason, replacement]
  properties:
    reason:
      type: string
      minLength: 1
    replacement:
      $ref: '#/CashInLieuRequest'
    reconciliation_override:
      type: boolean
    gain_impact_acknowledgement:
      type: string

CashInLieuLotsResponse:
  type: object
  required: [lots]
  properties:
    lots:
      type: array
      items:
        $ref: '#/InvestmentTradeCorrectionAvailableLotResponse'

DatedHoldingsResponse:
  type: object
  required: [as_of, holdings]
  properties:
    as_of:
      type: string
      format: date
    holdings:
      type: array
      items:
        $ref: '#/DatedHolding'

DatedHolding:
  type: object
  description: >-
    A long holding as an entry dated as_of would find it, after every
    effective event on or before that date (a new entry takes the last
    same-day slot). Holdings a later sale has closed are included. Discovery
    only: the command's writer rechecks availability at commit (#166).
  required: [account_id, commodity_id, cost_commodity_id, position_side, quantity_value, quantity_scale, transfer_basis_allocation, lots]
  properties:
    account_id: { type: integer, format: int64 }
    commodity_id: { type: integer, format: int64 }
    cost_commodity_id: { type: integer, format: int64 }
    position_side: { type: string, enum: [long] }
    quantity_value: { type: string, description: Units held at the slot. }
    quantity_scale: { type: integer }
    transfer_basis_allocation:
      type: string
      enum: [selected_lots, average_cost_pool]
      description: How an outbound transfer allocates basis at commit (the current method lock, else the default).
    lots:
      type: array
      items:
        $ref: '#/DatedHoldingLot'

DatedHoldingLot:
  type: object
  required: [lot_id, opened_on, quantity_value, quantity_scale, basis_knowledge, remaining_cost_basis_value, remaining_cost_basis_scale]
  properties:
    lot_id: { type: integer, format: int64 }
    opened_on: { type: string, format: date }
    quantity_value: { type: string, description: Remaining units at the slot. }
    quantity_scale: { type: integer }
    basis_knowledge: { type: string, enum: [known, unknown] }
    remaining_cost_basis_value:
      type: [string, 'null']
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: Remaining basis at the slot; null when unknown.
    remaining_cost_basis_scale: { type: [integer, 'null'] }

InvestmentBasisResolutionRequest:
  type: object
  additionalProperties: false
  required: [basis_value, basis_scale, reason]
  properties:
    basis_value:
      type: string
      pattern: '^(0|[1-9][0-9]{0,18})$'
      description: >-
        The transfer's total sourced basis in its own cost currency, never a
        conversion. A sourced known zero is journal-free: it records the fact
        without a bridge journal (#168). A replacement keeps the pinned
        transfer and currency and must differ from the effective basis.
    basis_scale:
      type: integer
      minimum: 0
      maximum: 12
    source_evidence:
      type: object
      additionalProperties: true
      description: Where the basis comes from, such as a broker statement reference.
    reason:
      type: string
    reconciliation_override:
      type: boolean
    gain_impact_acknowledgement:
      type: string

InvestmentBasisResolutionResponse:
  type: object
  required: [transaction, resolved_transaction_id]
  properties:
    transaction:
      description: The resolution's bridge journal; null for a journal-free known zero (#168).
      oneOf:
        - $ref: "../schemas/transactions.yaml#/TransactionResponse"
        - type: 'null'
    resolved_transaction_id:
      type: integer
      format: int64

InvestmentBasisResolutionReplacementResponse:
  type: object
  required: [inverse, replacement, transfer_transaction_id]
  properties:
    inverse:
      description: The inverse of the replaced bridge; null when the replaced resolution was a journal-free known zero.
      oneOf:
        - $ref: "../schemas/transactions.yaml#/TransactionResponse"
        - type: 'null'
    replacement:
      description: The successor's bridge journal; null when the successor is a journal-free known zero.
      oneOf:
        - $ref: "../schemas/transactions.yaml#/TransactionResponse"
        - type: 'null'
    transfer_transaction_id:
      type: integer
      format: int64

InvestmentCorrectionBasisResolutionTerms:
  type: object
  required: [operation_id, transaction_id, cost_commodity_id, basis_value, basis_scale, source_evidence]
  properties:
    operation_id:
      type: integer
      format: int64
      description: The effective basis_resolution operation.
    transaction_id:
      type: [integer, 'null']
      format: int64
      description: The effective resolution's bridge journal; null for a journal-free known zero.
    cost_commodity_id:
      type: integer
      format: int64
    basis_value:
      type: string
      pattern: '^(0|[1-9][0-9]{0,37})$'
    basis_scale:
      type: integer
    source_evidence:
      type: object
      additionalProperties: true

InvestmentBasisResolutionReversalResponse:
  type: object
  required: [transaction, transfer_transaction_id]
  properties:
    transaction:
      description: The inverse of the reversed bridge; null when the reversed resolution was a journal-free known zero.
      oneOf:
        - $ref: "../schemas/transactions.yaml#/TransactionResponse"
        - type: 'null'
    transfer_transaction_id:
      type: integer
      format: int64

InvestmentBasisResolutionHistoryEntry:
  type: object
  required: [operation_id, transaction_id, basis_value, basis_scale, source_evidence, reason, created_at, status]
  properties:
    operation_id:
      type: integer
      format: int64
    transaction_id:
      type: [integer, 'null']
      format: int64
      description: The resolution's bridge journal; null for a journal-free known zero.
    basis_value:
      type: string
      pattern: '^(0|[1-9][0-9]{0,37})$'
    basis_scale:
      type: integer
    source_evidence:
      type: object
      additionalProperties: true
    correction_mode:
      type: string
      enum: [replace]
      description: Present when this resolution replaced an earlier one.
    reason:
      type: string
      description: Why this resolution was recorded or the earlier one replaced.
    created_at:
      type: string
      format: date-time
    status:
      type: string
      enum: [effective, superseded, reversed]
    reversal_reason:
      type: string
      description: Why a reversed resolution was withdrawn.
