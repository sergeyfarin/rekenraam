InvestmentLotAllocationRequest:
  type: object
  required:
    - lot_id
    - quantity_value
    - quantity_scale
  properties:
    lot_id:
      type: integer
      format: int64
    quantity_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,37})$'
      description: Lossless exact integer coefficient normalized to quantity_scale.
    quantity_scale:
      type: integer

InvestmentTradeRequest:
  type: object
  required:
    - transaction_date
    - commodity_id
    - holding_account_id
    - quantity_value
    - quantity_scale
    - cash_commodity_id
  properties:
    transaction_date:
      type: string
      format: date
    commodity_id:
      type: integer
      format: int64
    holding_account_id:
      type: integer
      format: int64
    cash_account_id:
      type: integer
      format: int64
    quantity_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,37})$'
      description: Lossless exact integer coefficient normalized to quantity_scale.
    quantity_scale:
      type: integer
    cash_amount_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
    cash_amount_scale:
      type: integer
    cash_commodity_id:
      type: integer
      format: int64
    gross_amount_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: Signed gross consideration; negative for buy, positive for sale. Omit for legacy net-only trades.
    gross_amount_scale:
      type: integer
    net_settlement_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: Signed net cash settlement in the trade quote currency. Required with gross.
    net_settlement_scale:
      type: integer
    settlement_date:
      type: string
      format: date
    charges:
      type: array
      items:
        $ref: '#/InvestmentTradeChargeRequest'
    memo:
      type: string
    payee_id:
      type: integer
      format: int64
    status:
      type: string
    lot_allocations:
      type: array
      items:
        $ref: "#/InvestmentLotAllocationRequest"
    change_reason:
      type: string
    cost_basis_method:
      $ref: "#/CostBasisMethod"
    reconciliation_override:
      type: boolean
      description: >-
        Allows a backdated trade to proceed into a reconciled period,
        invalidating the affected checkpoints. Without it such a trade is
        refused with a 409 CONFLICT.
    gain_impact_acknowledgement:
      type: string
      description: >-
        The gain_impact.acknowledgement token returned by this command's
        preview for the committed-disposal gain changes the user accepted.
        Honoured by buys (manual and imported); sells and write-offs do not
        replay committed disposals and ignore it. Commit recomputes the change set in its write
        transaction; a non-empty set without this token is refused with
        INVESTMENT_GAIN_IMPACT_ACKNOWLEDGEMENT_REQUIRED, and a token for any
        other set with INVESTMENT_GAIN_IMPACT_ACKNOWLEDGEMENT_STALE. An empty
        set needs no token and ignores one.

InvestmentTradeChargeRequest:
  type: object
  required: [kind, amount_value, amount_scale, commodity_id]
  properties:
    kind:
      type: string
      enum: [commission, transaction_tax, other_fee, rebate]
    amount_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: Signed amount; fees and taxes are negative, rebates positive.
    amount_scale:
      type: integer
    commodity_id:
      type: integer
      format: int64
    treatment:
      type: string
      enum: [clearing_included, separately_expensed]
    charge_account_id:
      type: integer
      format: int64
    cash_account_id:
      type: integer
      format: int64
    paid_on:
      type: string
      format: date
    source_evidence:
      type: object

InvestmentWriteOffRequest:
  type: object
  description: >-
    A zero-proceeds disposal. Deliberately has no cash account, cash commodity
    or amount — those fields are what make a sale a sale.
  required:
    - transaction_date
    - commodity_id
    - holding_account_id
    - quantity_value
    - quantity_scale
    - reason
  properties:
    transaction_date:
      type: string
      format: date
    commodity_id:
      type: integer
      format: int64
    holding_account_id:
      type: integer
      format: int64
    quantity_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,37})$'
      description: >-
        Lossless exact integer coefficient normalized to quantity_scale. Must
        be positive and no larger than the remaining holding.
    quantity_scale:
      type: integer
    reason:
      type: string
      minLength: 1
      description: >-
        Why the holding is worthless ("delisted", "fund closed", "issuer
        liquidated"). Required — a position declared worthless without a
        stated cause is not auditable.
    memo:
      type: string
      description: Defaults to the reason when omitted.
    payee_id:
      type: integer
      format: int64
    status:
      type: string
    lot_allocations:
      type: array
      items:
        $ref: "#/InvestmentLotAllocationRequest"
    change_reason:
      type: string
    cost_basis_method:
      $ref: "#/CostBasisMethod"
    reconciliation_override:
      type: boolean
      description: >-
        Allows a backdated write-off to proceed into a reconciled period,
        invalidating the affected checkpoints. Without it such a write-off is
        refused with a 409 CONFLICT.
    gain_impact_acknowledgement:
      type: string
      description: >-
        The gain_impact.acknowledgement token from this command's
        reconciliation-impact preview, required when an entry dated behind a
        later disposal revises committed gains (T-117).

InvestmentLotDisposalResponse:
  type: object
  required:
    - basis_knowledge
    - lot_id
    - quantity_value
    - quantity_scale
    - cost_basis_value
    - cost_basis_scale
    - proceeds_value
    - proceeds_scale
  properties:
    basis_knowledge:
      type: string
      enum: [known, unknown]
      description: >-
        Unknown when the disposal consumed basis that is not yet resolved.
        Basis and gain amounts are then null; quantity and proceeds stay exact.
    lot_id:
      type: integer
      format: int64
    quantity_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,37})$'
      description: Lossless exact integer coefficient normalized to quantity_scale.
    quantity_scale:
      type: integer
    cost_basis_value:
      type: [string, 'null']
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
    cost_basis_scale:
      type: [integer, 'null']
    proceeds_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
    proceeds_scale:
      type: integer

InvestmentTradeResponse:
  type: object
  required:
    - transaction
    - allocations
  properties:
    transaction:
      $ref: "../schemas/transactions.yaml#/TransactionResponse"
    lot_id:
      type: integer
      format: int64
      description: Created lot ID for buy transactions.
    allocations:
      type: array
      items:
        $ref: "#/InvestmentLotDisposalResponse"
    disposal_decision:
      $ref: "#/DisposalDecisionResponse"

ExternalTransferInRequest:
  type: object
  additionalProperties: false
  required:
    - effective_on
    - holding_account_id
    - commodity_id
    - quantity_value
    - quantity_scale
    - cost_commodity_id
  properties:
    effective_on:
      type: string
      format: date
      description: Account-entry and transfer effective date.
    holding_account_id:
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
    quantity_value:
      type: string
      pattern: '^[1-9][0-9]{0,37}$'
    quantity_scale:
      type: integer
      minimum: 0
      maximum: 24
    carried_basis_value:
      type: string
      pattern: '^(0|[1-9][0-9]{0,18})$'
      description: >-
        Known carried basis; zero is an explicit known-zero basis. Required
        unless basis_knowledge is unknown, when it must be omitted.
    carried_basis_scale:
      type: integer
      minimum: 0
      maximum: 12
    basis_knowledge:
      type: string
      enum: [known, unknown]
      description: >-
        Defaults to known. Unknown records the transfer with security legs
        only; its lot's basis and later gains stay unresolved. An omitted
        basis is refused rather than read as unknown.
    cost_commodity_id:
      type: integer
      format: int64
    original_acquired_on:
      type: string
      format: date
      description: Optional sourced original acquisition date. Omission is stored as unknown.
    source_evidence:
      type: object
      additionalProperties: true
    memo:
      type: string
    change_reason:
      type: string
    reconciliation_override:
      type: boolean
    gain_impact_acknowledgement:
      type: string
      description: >-
        The gain_impact.acknowledgement token from this command's
        reconciliation-impact preview, required when an entry dated behind a
        later disposal revises committed gains (T-117).

ExternalTransferInResponse:
  type: object
  required: [transaction, lot_id]
  properties:
    transaction:
      $ref: "../schemas/transactions.yaml#/TransactionResponse"
    lot_id:
      type: integer
      format: int64

InternalTransferRequest:
  type: object
  additionalProperties: false
  description: >-
    Send lot_allocations for an individual-lot source, or quantity_value and
    quantity_scale for an average-cost source (pooled allocation, T-123). The
    source position's method-family lock, or else its resolved default,
    decides which is accepted. A pooled quantity opens one pooled destination
    lot unless destination_lineage is source_lots (T-135).
  required: [effective_on, source_account_id, destination_account_id, commodity_id, cost_commodity_id]
  properties:
    effective_on:
      type: string
      format: date
      description: Account-entry and transfer effective date.
    source_account_id:
      type: integer
      format: int64
    destination_account_id:
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
    cost_commodity_id:
      type: integer
      format: int64
      description: All selected source lots must carry basis in this currency.
    lot_allocations:
      type: array
      items:
        $ref: "../schemas/investments.yaml#/InvestmentLotAllocationRequest"
    quantity_value:
      type: string
      pattern: '^[1-9][0-9]{0,37}$'
      description: Pooled transfer quantity coefficient; omit when lot_allocations are sent.
    quantity_scale:
      type: integer
      minimum: 0
      maximum: 24
    destination_lineage:
      type: string
      enum: [pooled_lot, source_lots]
      description: >-
        Pooled quantity only. pooled_lot (default) opens one destination lot at
        the pool's carried basis, dated by the latest original acquisition date
        among the units moved; replay may revise its basis and date. source_lots
        opens one lot per depleted source lot with its own date; a later change
        to which lots the pool depletes is then refused with the transfer named.
        Selected lots always carry source_lots.
    source_evidence:
      type: object
      additionalProperties: true
    memo:
      type: string
    change_reason:
      type: string
    reconciliation_override:
      type: boolean
    gain_impact_acknowledgement:
      type: string
      description: Echoes the preview gain-impact token when committed gains would change.

InternalTransferLink:
  type: object
  required: [source_lot_id, destination_lot_id, quantity_value, quantity_scale, carried_basis_value, carried_basis_scale, basis_knowledge, original_date_knowledge, original_acquired_on]
  properties:
    basis_knowledge:
      type: string
      enum: [known, unknown]
      description: Unknown when the moved units carry unknown basis; the carried amount is then null.
    source_lot_id:
      type: [integer, "null"]
      format: int64
      description: Null for a pooled destination lot, which is carried from the whole pool.
    destination_lot_id:
      type: [integer, "null"]
      format: int64
      description: Null in a preview, whose lots are never durable.
    quantity_value:
      type: string
    quantity_scale:
      type: integer
    carried_basis_value:
      type: [string, "null"]
      description: Basis carried from the source lot, or the pool for a pooled lot; pool rate for an average-cost source, exact remainder on the final touched lot. Null when unknown.
    carried_basis_scale:
      type: [integer, "null"]
    original_date_knowledge:
      type: string
      enum: [known, unknown]
    original_acquired_on:
      type: [string, "null"]
      format: date
      description: For a pooled lot, the latest original acquisition date among the units moved.

InternalTransferPlan:
  type: object
  required: [basis_allocation, destination_lineage, cost_basis_method, resolution_tier, links]
  properties:
    basis_allocation:
      type: string
      enum: [selected_lots, average_cost_pool]
    destination_lineage:
      type: string
      enum: [pooled_lot, source_lots]
    cost_basis_method:
      type: string
      enum: [fifo, lifo, average_cost, specific_lot]
    resolution_tier:
      type: string
      enum: [account, global, fallback, position_lock]
      description: position_lock means an open position's method family overrode the current default.
    links:
      type: array
      items:
        $ref: "../schemas/investments.yaml#/InternalTransferLink"

InternalTransferPreviewResponse:
  type: object
  required: [plan, impact]
  properties:
    plan:
      $ref: "../schemas/investments.yaml#/InternalTransferPlan"
    impact:
      $ref: "../schemas/transactions.yaml#/ReconciliationImpactResponse"

InternalTransferResponse:
  type: object
  required: [transaction, plan, destination_lot_ids]
  properties:
    transaction:
      $ref: "../schemas/transactions.yaml#/TransactionResponse"
    plan:
      $ref: "../schemas/investments.yaml#/InternalTransferPlan"
    destination_lot_ids:
      type: array
      items:
        type: integer
        format: int64

ExternalTransferOutRequest:
  type: object
  additionalProperties: false
  description: >-
    Send lot_allocations for an individual-lot source, or quantity_value and
    quantity_scale for an average-cost source (pooled allocation). The source
    position's method-family lock, or else its resolved default, decides which
    is accepted. The basis carried out is computed from the depletion, never
    supplied; source_evidence may record the broker's figure as evidence only.
  required: [effective_on, source_account_id, commodity_id, cost_commodity_id]
  properties:
    effective_on:
      type: string
      format: date
      description: Date the holding leaves the book.
    source_account_id:
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
    cost_commodity_id:
      type: integer
      format: int64
      description: All depleted source lots must carry basis in this currency.
    lot_allocations:
      type: array
      items:
        $ref: "../schemas/investments.yaml#/InvestmentLotAllocationRequest"
    quantity_value:
      type: string
      pattern: '^[1-9][0-9]{0,37}$'
      description: Pooled transfer quantity coefficient; omit when lot_allocations are sent.
    quantity_scale:
      type: integer
      minimum: 0
      maximum: 24
    source_evidence:
      type: object
      additionalProperties: true
    memo:
      type: string
    change_reason:
      type: string
    reconciliation_override:
      type: boolean
    gain_impact_acknowledgement:
      type: string

ExternalTransferOutLink:
  type: object
  required: [source_lot_id, quantity_value, quantity_scale, carried_basis_value, carried_basis_scale, basis_knowledge, original_date_knowledge, original_acquired_on]
  properties:
    basis_knowledge:
      type: string
      enum: [known, unknown]
      description: Unknown when the moved units carry unknown basis; the carried amount is then null.
    source_lot_id:
      type: integer
      format: int64
    quantity_value:
      type: string
    quantity_scale:
      type: integer
    carried_basis_value:
      type: [string, "null"]
      description: Basis taken from the source lot; pool rate for an average-cost source, exact remainder on the final touched lot. Null when unknown.
    carried_basis_scale:
      type: [integer, "null"]
    original_date_knowledge:
      type: string
      enum: [known, unknown]
    original_acquired_on:
      type: [string, "null"]
      format: date

ExternalTransferOutPlan:
  type: object
  required: [basis_allocation, cost_basis_method, resolution_tier, links, basis_value, basis_scale, basis_knowledge]
  properties:
    basis_allocation:
      type: string
      enum: [selected_lots, average_cost_pool]
    cost_basis_method:
      type: string
      enum: [fifo, lifo, average_cost, specific_lot]
    resolution_tier:
      type: string
      enum: [account, global, fallback, position_lock]
    links:
      type: array
      items:
        $ref: "../schemas/investments.yaml#/ExternalTransferOutLink"
    basis_value:
      type: [string, "null"]
      description: >-
        Exact total basis carried out of the book; the bridge journal's amount. Zero posts no bridge.
        Null when any link is unknown: no bridge posts until the basis is resolved.
    basis_scale:
      type: [integer, "null"]
    basis_knowledge:
      type: string
      enum: [known, unknown]

ExternalTransferOutPreviewResponse:
  type: object
  required: [plan, impact]
  properties:
    plan:
      $ref: "../schemas/investments.yaml#/ExternalTransferOutPlan"
    impact:
      $ref: "../schemas/transactions.yaml#/ReconciliationImpactResponse"

ExternalTransferOutResponse:
  type: object
  required: [transaction, plan]
  properties:
    transaction:
      $ref: "../schemas/transactions.yaml#/TransactionResponse"
    plan:
      $ref: "../schemas/investments.yaml#/ExternalTransferOutPlan"

InvestmentTransferReplacementRequest:
  type: object
  additionalProperties: false
  required: [reason, replacement]
  properties:
    reason:
      type: string
      minLength: 1
      description: Why the posted internal transfer is being corrected.
    reconciliation_override:
      type: boolean
      description: Omit or set false to keep affected reconciliation checkpoints active.
    gain_impact_acknowledgement:
      type: string
      description: >-
        The gain_impact.acknowledgement token from this command's preview, accepting exactly the committed
        disposal gain changes it disclosed (T-126).
    replacement:
      $ref: "../schemas/investments.yaml#/InternalTransferRequest"
      description: >-
        The full corrected internal transfer. Date, lots or pooled quantity, both holding accounts and
        destination lineage may change; commodity_id and cost_commodity_id must equal the transfer's. Its
        change_reason, reconciliation_override and gain_impact_acknowledgement are ignored.

InvestmentTransferReplacementResponse:
  type: object
  required: [inverse, replacement, corrected_transaction_id]
  properties:
    inverse:
      $ref: "../schemas/transactions.yaml#/TransactionResponse"
    replacement:
      $ref: "../schemas/investments.yaml#/InternalTransferResponse"
    corrected_transaction_id:
      type: integer
      format: int64

InvestmentTransferOutReplacementRequest:
  type: object
  additionalProperties: false
  required: [reason, replacement]
  properties:
    reason:
      type: string
      minLength: 1
      description: Why the posted outbound transfer is being corrected.
    reconciliation_override:
      type: boolean
      description: Omit or set false to keep affected reconciliation checkpoints active.
    gain_impact_acknowledgement:
      type: string
      description: The gain_impact.acknowledgement token from this command's preview.
    replacement:
      $ref: "../schemas/investments.yaml#/ExternalTransferOutRequest"
      description: >-
        The full corrected outbound transfer. Date, source holding and lots or pooled quantity may change;
        commodity_id and cost_commodity_id must equal the transfer's. Its change_reason,
        reconciliation_override and gain_impact_acknowledgement are ignored.

InvestmentTransferOutReplacementResponse:
  type: object
  required: [inverse, replacement, corrected_transaction_id]
  properties:
    inverse:
      $ref: "../schemas/transactions.yaml#/TransactionResponse"
    replacement:
      $ref: "../schemas/investments.yaml#/ExternalTransferOutResponse"
    corrected_transaction_id:
      type: integer
      format: int64

CashInLieuRequest:
  type: object
  additionalProperties: false
  required: [split_transaction_id, disposal_on, payment_on, quantity_value, quantity_scale, cash_account_id,
    currency_id, proceeds_value, proceeds_scale]
  properties:
    split_transaction_id:
      type: integer
      format: int64
      description: The posted split this fraction comes from; the holding and security are its own.
    disposal_on:
      type: string
      format: date
    payment_on:
      type: string
      format: date
    quantity_value:
      type: string
      pattern: '^[1-9][0-9]{0,37}$'
      description: The fraction, below one share.
    quantity_scale:
      type: integer
      minimum: 0
      maximum: 24
    cash_account_id:
      type: integer
      format: int64
    currency_id:
      type: integer
      format: int64
    proceeds_value:
      type: string
      pattern: '^[1-9][0-9]{0,18}$'
    proceeds_scale:
      type: integer
      minimum: 0
      maximum: 12
    cost_basis_method:
      type: string
      enum: [fifo, lifo, average_cost, specific_lot]
    lot_allocations:
      type: array
      items:
        $ref: "../schemas/investments.yaml#/InvestmentLotAllocationRequest"
    memo:
      type: string
    change_reason:
      type: string
    reconciliation_override:
      type: boolean
    gain_impact_acknowledgement:
      type: string

CashInLieuPreviewResponse:
  type: object
  required: [allocations, impact, disposed_basis_value, disposed_basis_scale, realized_gain_value, realized_gain_scale, cost_basis_method]
  properties:
    disposed_basis_value:
      type: string
      description: Total exact basis of the fraction taken by the dated writer.
    disposed_basis_scale:
      type: integer
    realized_gain_value:
      type: string
      description: Signed proceeds minus disposed basis, computed on the server.
    realized_gain_scale:
      type: integer
    cost_basis_method:
      type: string
      enum: [fifo, lifo, average_cost, specific_lot]
    allocations:
      type: array
      items:
        $ref: "#/InvestmentLotDisposalResponse"
    impact:
      $ref: "../schemas/transactions.yaml#/ReconciliationImpactResponse"

CapitalReturnRequest:
  type: object
  additionalProperties: false
  required: [holding_account_id, commodity_id, cash_account_id, currency_id, effective_on, payment_on, amount_value, amount_scale]
  properties:
    holding_account_id:
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
    cash_account_id:
      type: integer
      format: int64
    currency_id:
      type: integer
      format: int64
      description: Receipt currency; must be the position's cost currency.
    effective_on:
      type: string
      format: date
      description: Basis action date; entitles every lot open then.
    payment_on:
      type: string
      format: date
      description: Cash receipt date, on or after effective_on.
    entitled_lot_ids:
      type: array
      items:
        type: integer
        format: int64
      description: >-
        Explicit entitlement (T-148): the lots the corporate action names, each entitled to its whole remaining
        quantity on the effective date. Omit to apply the per-share rule to every lot open then. A named lot that
        is not open in the holding on that date is refused.
    lot_entitlements:
      type: array
      minItems: 1
      items:
        $ref: '#/CapitalReturnEntitlement'
      description: >-
        Fixed lot/quantity entitlement from the corporate action. Quantities must be positive,
        distinct by lot, and no greater than that lot holds at the effective-date slot. Receipt
        allocation is per entitled unit; reduction is capped to the entitled units' proportional
        share of each lot's basis. Mutually exclusive with entitled_lot_ids. Replay follows
        corrected acquisition successors while keeping the named quantity fixed.
    amount_value:
      type: string
      pattern: '^[1-9][0-9]{0,37}$'
    amount_scale:
      type: integer
      minimum: 0
      maximum: 12
    source_evidence:
      type: object
      additionalProperties: true
    memo:
      type: string
    change_reason:
      type: string
    reconciliation_override:
      type: boolean
    gain_impact_acknowledgement:
      type: string

CapitalReturnEffect:
  type: object
  required: [lot_id, entitled_quantity_value, entitled_quantity_scale, allocated_value, allocated_scale,
    reduction_value, reduction_scale, excess_value, excess_scale]
  properties:
    lot_id:
      type: integer
      format: int64
    entitled_quantity_value:
      type: string
    entitled_quantity_scale:
      type: integer
    allocated_value:
      type: string
      description: This lot's per-share share of the receipt; the last lot takes the exact remainder.
    allocated_scale:
      type: integer
    reduction_value:
      type: string
      description: Minimum of allocated cash and eligible basis (proportional to entitled quantity for explicit_quantities).
    reduction_scale:
      type: integer
    excess_value:
      type: string
      description: Unresolved amount beyond the lot's basis; never income or negative basis.
    excess_scale:
      type: integer

CapitalReturnResponse:
  type: object
  required: [transaction, effects]
  properties:
    transaction:
      $ref: "../schemas/transactions.yaml#/TransactionResponse"
    effects:
      type: array
      items:
        $ref: "../schemas/investments.yaml#/CapitalReturnEffect"

CapitalReturnPreviewResponse:
  type: object
  required: [effects, impact]
  properties:
    effects:
      type: array
      items:
        $ref: "../schemas/investments.yaml#/CapitalReturnEffect"
    impact:
      $ref: "../schemas/transactions.yaml#/ReconciliationImpactResponse"

InvestmentTransferInReplacementRequest:
  type: object
  additionalProperties: false
  required: [reason, replacement]
  properties:
    reason:
      type: string
      minLength: 1
      description: Why the posted external transfer in is being corrected.
    reconciliation_override:
      type: boolean
      description: Omit or set false to keep affected reconciliation checkpoints active.
    gain_impact_acknowledgement:
      type: string
      description: >-
        The gain_impact.acknowledgement token from this command's preview, accepting exactly the committed
        disposal gain changes it disclosed (T-126).
    replacement:
      $ref: "../schemas/investments.yaml#/ExternalTransferInRequest"
      description: >-
        The full corrected transfer in. Date, holding account, quantity, carried basis, original acquisition
        date and evidence may change; commodity_id and cost_commodity_id must equal the transfer's. Its
        change_reason, reconciliation_override and gain_impact_acknowledgement are ignored.

InvestmentTransferInReplacementResponse:
  type: object
  required: [inverse, replacement, corrected_transaction_id]
  properties:
    inverse:
      $ref: "../schemas/transactions.yaml#/TransactionResponse"
    replacement:
      $ref: "../schemas/investments.yaml#/ExternalTransferInResponse"
    corrected_transaction_id:
      type: integer
      format: int64

InvestmentSplitRequest:
  type: object
  additionalProperties: false
  required: [effective_on, holding_account_id, commodity_id, ratio_numerator, ratio_denominator]
  properties:
    effective_on:
      type: string
      format: date
      description: Date on which entitled lots are split; lots opened later are not.
    holding_account_id:
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
    ratio_numerator:
      type: integer
      format: int64
      minimum: 1
      maximum: 1000000000
      description: New units received for ratio_denominator old units (3 for a 3-for-2 split; 1 for a 1-for-10 reverse split).
    ratio_denominator:
      type: integer
      format: int64
      minimum: 1
      maximum: 1000000000
      description: Old units surrendered. The ratio is stored in lowest terms and may not be 1:1.
    source_evidence:
      type: object
      additionalProperties: true
    memo:
      type: string
    change_reason:
      type: string
    reconciliation_override:
      type: boolean
    gain_impact_acknowledgement:
      type: string
      description: Token from the preview's gain_impact, accepting the committed-disposal gain changes it disclosed.

InvestmentSplitLotEffect:
  type: object
  required: [lot_id, cost_commodity_id, quantity_before_value, quantity_before_scale, quantity_after_value, quantity_after_scale]
  properties:
    lot_id:
      type: integer
      format: int64
    cost_commodity_id:
      type: integer
      format: int64
    quantity_before_value:
      type: string
    quantity_before_scale:
      type: integer
    quantity_after_value:
      type: string
    quantity_after_scale:
      type: integer

InvestmentSplitPlan:
  type: object
  required: [ratio_numerator, ratio_denominator, effects, quantity_delta_value, quantity_delta_scale, replayed]
  properties:
    ratio_numerator:
      type: integer
      format: int64
    ratio_denominator:
      type: integer
      format: int64
    effects:
      type: array
      items:
        $ref: "../schemas/investments.yaml#/InvestmentSplitLotEffect"
    quantity_delta_value:
      type: string
      description: Signed holding change the journal posts; negative for a reverse split.
    quantity_delta_scale:
      type: integer
    replayed:
      type: boolean
      description: True when later disposals were replayed because the split is dated before them.

InvestmentSplitPreviewResponse:
  type: object
  required: [plan, impact]
  properties:
    plan:
      $ref: "../schemas/investments.yaml#/InvestmentSplitPlan"
    impact:
      $ref: "../schemas/transactions.yaml#/ReconciliationImpactResponse"

InvestmentSplitResponse:
  type: object
  required: [transaction, plan]
  properties:
    transaction:
      $ref: "../schemas/transactions.yaml#/TransactionResponse"
    plan:
      $ref: "../schemas/investments.yaml#/InvestmentSplitPlan"

ShareExchangeRequest:
  type: object
  additionalProperties: false
  required: [effective_on, holding_account_id, commodity_id, destination_commodity_id, ratio_numerator, ratio_denominator]
  description: >
    A share exchange (#177): an all-stock merger, fund merger or class
    conversion of the whole long holding of commodity_id in holding_account_id.
  properties:
    effective_on:
      type: string
      format: date
      description: Every long lot open on this date, at the operation's slot, is exchanged.
    holding_account_id:
      type: integer
      format: int64
    destination_holding_account_id:
      type: integer
      format: int64
      description: >
        Holding that receives the new instrument. Defaults to holding_account_id;
        a holding whose default instrument is the old one needs the new
        instrument's own holding.
    commodity_id:
      type: integer
      format: int64
      description: The old instrument.
    destination_commodity_id:
      type: integer
      format: int64
      description: The new instrument; must differ from commodity_id and not be a currency.
    ratio_numerator:
      type: integer
      format: int64
      minimum: 1
      maximum: 1000000000
      description: New units received for ratio_denominator old units. 1:1 is valid for a class change.
    ratio_denominator:
      type: integer
      format: int64
      minimum: 1
      maximum: 1000000000
      description: Old units surrendered. The ratio is stored in lowest terms.
    source_evidence:
      type: object
      additionalProperties: true
    memo:
      type: string
    change_reason:
      type: string
    reconciliation_override:
      type: boolean
    gain_impact_acknowledgement:
      type: string
      description: >
        The preview's exact acknowledgement when a backdated exchange revises a
        committed disposal (#179); an in-order exchange changes none.

ShareExchangeLink:
  type: object
  required: [source_lot_id, destination_lot_id, cost_commodity_id, source_quantity_value, source_quantity_scale,
    destination_quantity_value, destination_quantity_scale, basis_knowledge, carried_basis_value,
    carried_basis_scale, original_date_knowledge, original_acquired_on]
  properties:
    source_lot_id:
      type: integer
      format: int64
    destination_lot_id:
      type: [integer, "null"]
      format: int64
      description: Null in a preview.
    cost_commodity_id:
      type: integer
      format: int64
    source_quantity_value:
      type: string
    source_quantity_scale:
      type: integer
    destination_quantity_value:
      type: string
      description: Source quantity times the ratio, exactly.
    destination_quantity_scale:
      type: integer
    basis_knowledge:
      type: string
      enum: [known, unknown]
    carried_basis_value:
      type: [string, "null"]
      description: The source lot's remaining basis, unchanged; null when unknown.
    carried_basis_scale:
      type: [integer, "null"]
    original_date_knowledge:
      type: string
      enum: [known, unknown]
    original_acquired_on:
      type: [string, "null"]
      format: date

ShareExchangePlan:
  type: object
  required: [ratio_numerator, ratio_denominator, links, source_quantity_value, source_quantity_scale,
    destination_quantity_value, destination_quantity_scale, basis_totals]
  properties:
    ratio_numerator:
      type: integer
      format: int64
    ratio_denominator:
      type: integer
      format: int64
    links:
      type: array
      items:
        $ref: "../schemas/investments.yaml#/ShareExchangeLink"
    source_quantity_value:
      type: string
      description: Old units the journal moves out of the holding.
    source_quantity_scale:
      type: integer
    destination_quantity_value:
      type: string
      description: New units the journal moves into the destination holding.
    destination_quantity_scale:
      type: integer
    basis_totals:
      type: array
      description: The units and basis carried in each cost currency, in link order (#178).
      items:
        $ref: "../schemas/investments.yaml#/ShareExchangeBasisTotal"

ShareExchangeBasisTotal:
  type: object
  required: [cost_commodity_id, source_quantity_value, source_quantity_scale, destination_quantity_value,
    destination_quantity_scale, basis_knowledge, carried_basis_value, carried_basis_scale, unknown_lots]
  properties:
    cost_commodity_id:
      type: integer
      format: int64
    source_quantity_value:
      type: string
    source_quantity_scale:
      type: integer
    destination_quantity_value:
      type: string
    destination_quantity_scale:
      type: integer
    basis_knowledge:
      type: string
      enum: [known, unknown]
      description: Unknown when any lot in this currency has unknown basis, as for a position.
    carried_basis_value:
      type: [string, "null"]
      description: Exact sum of the carried basis; null when unknown.
    carried_basis_scale:
      type: [integer, "null"]
    unknown_lots:
      type: integer
      description: Lots in this currency whose basis is unknown.

InvestmentCorrectionShareExchangeTerms:
  type: object
  required: [effective_on, holding_account_id, destination_holding_account_id, commodity_id,
    destination_commodity_id, source_evidence, plan]
  properties:
    effective_on:
      type: string
      format: date
    holding_account_id:
      type: integer
      format: int64
    destination_holding_account_id:
      type: integer
      format: int64
      description: Equal to holding_account_id when the new units stayed in the same holding.
    commodity_id:
      type: integer
      format: int64
      description: The old instrument.
    destination_commodity_id:
      type: integer
      format: int64
      description: The new instrument.
    source_evidence:
      type: object
      additionalProperties: true
    plan:
      $ref: "../schemas/investments.yaml#/ShareExchangePlan"

ShareExchangePreviewResponse:
  type: object
  required: [plan, impact]
  properties:
    plan:
      $ref: "../schemas/investments.yaml#/ShareExchangePlan"
    impact:
      $ref: "../schemas/transactions.yaml#/ReconciliationImpactResponse"

ShareExchangeResponse:
  type: object
  required: [transaction, plan]
  properties:
    transaction:
      $ref: "../schemas/transactions.yaml#/TransactionResponse"
    plan:
      $ref: "../schemas/investments.yaml#/ShareExchangePlan"

SpinOffRequest:
  type: object
  additionalProperties: false
  required: [effective_on, holding_account_id, commodity_id, destination_commodity_id, ratio_numerator,
    ratio_denominator, basis_fraction_value, basis_fraction_scale]
  description: >
    A spin-off or demerger (#180): every long lot of commodity_id in
    holding_account_id keeps its units and moves basis_fraction of its
    remaining basis to a new lot of destination_commodity_id.
  properties:
    effective_on:
      type: string
      format: date
      description: >
        The distribution date. Every long lot open on this date, at the
        operation's slot, is entitled. Ex and record dates belong in
        source_evidence.
    holding_account_id:
      type: integer
      format: int64
    destination_holding_account_id:
      type: integer
      format: int64
      description: >
        Holding that receives the new instrument. Defaults to holding_account_id;
        a holding whose default instrument is the parent needs the new
        instrument's own holding.
    commodity_id:
      type: integer
      format: int64
      description: The parent instrument.
    destination_commodity_id:
      type: integer
      format: int64
      description: The distributed instrument; must differ from commodity_id and not be a currency.
    ratio_numerator:
      type: integer
      format: int64
      minimum: 1
      maximum: 1000000000
      description: New units distributed for ratio_denominator parent units.
    ratio_denominator:
      type: integer
      format: int64
      minimum: 1
      maximum: 1000000000
      description: Parent units entitling ratio_numerator new units. The ratio is stored in lowest terms.
    basis_fraction_value:
      type: string
      description: >
        Coefficient of the share of each parent lot's basis that moves:
        basis_fraction_value / 10^basis_fraction_scale, strictly between 0 and 1
        (0.141 for an issuer's 14.1 % allocation is "141" at scale 3). Stored in
        lowest decimal terms, at most 12 decimal places.
    basis_fraction_scale:
      type: integer
      minimum: 0
      maximum: 24
    source_evidence:
      type: object
      additionalProperties: true
    memo:
      type: string
    change_reason:
      type: string
    reconciliation_override:
      type: boolean

SpinOffLink:
  type: object
  required: [source_lot_id, destination_lot_id, cost_commodity_id, source_quantity_value, source_quantity_scale,
    destination_quantity_value, destination_quantity_scale, basis_knowledge, allocated_basis_value,
    allocated_basis_scale, remaining_basis_value, remaining_basis_scale, original_date_knowledge, original_acquired_on]
  properties:
    source_lot_id:
      type: integer
      format: int64
      description: The parent lot, which stays open with its units.
    destination_lot_id:
      type: [integer, "null"]
      format: int64
      description: Null in a preview.
    cost_commodity_id:
      type: integer
      format: int64
    source_quantity_value:
      type: string
      description: The parent lot's units that entitle it.
    source_quantity_scale:
      type: integer
    destination_quantity_value:
      type: string
      description: Parent units times the ratio, exactly.
    destination_quantity_scale:
      type: integer
    basis_knowledge:
      type: string
      enum: [known, unknown]
    allocated_basis_value:
      type: [string, "null"]
      description: >
        The parent's remaining basis times the fraction, truncated at the
        position's allocation scale; the new lot's opening basis and the
        parent's reduction. Null when unknown.
    allocated_basis_scale:
      type: [integer, "null"]
    remaining_basis_value:
      type: [string, "null"]
      description: The parent lot's basis after the spin-off; null when unknown and in the correction chain.
    remaining_basis_scale:
      type: [integer, "null"]
    original_date_knowledge:
      type: string
      enum: [known, unknown]
    original_acquired_on:
      type: [string, "null"]
      format: date

SpinOffPlan:
  type: object
  required: [ratio_numerator, ratio_denominator, basis_fraction_value, basis_fraction_scale, links,
    destination_quantity_value, destination_quantity_scale, basis_totals]
  properties:
    ratio_numerator:
      type: integer
      format: int64
    ratio_denominator:
      type: integer
      format: int64
    basis_fraction_value:
      type: string
    basis_fraction_scale:
      type: integer
    links:
      type: array
      items:
        $ref: "../schemas/investments.yaml#/SpinOffLink"
    destination_quantity_value:
      type: string
      description: New units the journal moves into the destination holding.
    destination_quantity_scale:
      type: integer
    basis_totals:
      type: array
      description: What the spin-off divides in each cost currency, in link order.
      items:
        $ref: "../schemas/investments.yaml#/SpinOffBasisTotal"

SpinOffBasisTotal:
  type: object
  required: [cost_commodity_id, source_quantity_value, source_quantity_scale, destination_quantity_value,
    destination_quantity_scale, basis_knowledge, allocated_basis_value, allocated_basis_scale,
    remaining_basis_value, remaining_basis_scale, unknown_lots]
  properties:
    cost_commodity_id:
      type: integer
      format: int64
    source_quantity_value:
      type: string
    source_quantity_scale:
      type: integer
    destination_quantity_value:
      type: string
    destination_quantity_scale:
      type: integer
    basis_knowledge:
      type: string
      enum: [known, unknown]
      description: Unknown when any lot in this currency has unknown basis, as for a position.
    allocated_basis_value:
      type: [string, "null"]
      description: Exact sum of the allocated basis; null when unknown.
    allocated_basis_scale:
      type: [integer, "null"]
    remaining_basis_value:
      type: [string, "null"]
      description: Exact sum of the parent's remaining basis; null when unknown and in the correction chain.
    remaining_basis_scale:
      type: [integer, "null"]
    unknown_lots:
      type: integer

InvestmentCorrectionSpinOffTerms:
  type: object
  required: [effective_on, holding_account_id, destination_holding_account_id, commodity_id,
    destination_commodity_id, source_evidence, plan]
  properties:
    effective_on:
      type: string
      format: date
    holding_account_id:
      type: integer
      format: int64
    destination_holding_account_id:
      type: integer
      format: int64
      description: Equal to holding_account_id when the new units went to the same holding.
    commodity_id:
      type: integer
      format: int64
      description: The parent instrument.
    destination_commodity_id:
      type: integer
      format: int64
      description: The distributed instrument.
    source_evidence:
      type: object
      additionalProperties: true
    plan:
      $ref: "../schemas/investments.yaml#/SpinOffPlan"

SpinOffPreviewResponse:
  type: object
  required: [plan, impact]
  properties:
    plan:
      $ref: "../schemas/investments.yaml#/SpinOffPlan"
    impact:
      $ref: "../schemas/transactions.yaml#/ReconciliationImpactResponse"

SpinOffResponse:
  type: object
  required: [transaction, plan]
  properties:
    transaction:
      $ref: "../schemas/transactions.yaml#/TransactionResponse"
    plan:
      $ref: "../schemas/investments.yaml#/SpinOffPlan"

ShareExchangeReplacementRequest:
  type: object
  additionalProperties: false
  required: [reason, effective_on, destination_commodity_id, ratio_numerator, ratio_denominator]
  description: >
    Corrected terms for a share exchange (#179). The exchanged holding and its
    old instrument stay those of the exchange; the date, ratio, new instrument,
    receiving holding or source evidence must change.
  properties:
    reason:
      type: string
    effective_on:
      type: string
      format: date
    destination_holding_account_id:
      type: integer
      format: int64
      description: Defaults to the exchanged holding.
    destination_commodity_id:
      type: integer
      format: int64
    ratio_numerator:
      type: integer
      format: int64
      minimum: 1
