      type: integer
      format: int64
    transaction_id:
      type: integer
      format: int64
    operation_kind:
      type: string
    event_date:
      type: string
      format: date
    correction_of_operation_id:
      type: integer
      format: int64
    correction_mode:
      type: string
      enum: [replace, reverse]
    correction_reason:
      type: string
    created_at:
      type: string
      format: date-time
    audit_event_id:
      type: integer
      format: int64
    imported:
      type: boolean
    effective:
      type: boolean

DisposalDecisionResponse:
  type: object
  required:
    - basis_knowledge
    - cost_basis_method
    - resolution_tier
    - quantity_value
    - quantity_scale
    - disposed_basis_value
    - disposed_basis_scale
    - proceeds_value
    - proceeds_scale
    - cost_commodity_id
    - allocations
  properties:
    basis_knowledge:
      type: string
      enum: [known, unknown]
      description: >-
        Unknown when the disposal consumed basis that is not yet resolved.
        Basis and gain amounts are then null; quantity and proceeds stay exact.
    id:
      type: integer
      format: int64
    transaction_id:
      type: integer
      format: int64
    transaction_version_id:
      type: integer
      format: int64
    cost_basis_method:
      $ref: "#/CostBasisMethod"
    resolution_tier:
      type: string
      enum: [transaction, account, global, fallback]
    account_version_id:
      type: integer
      format: int64
    profile_id:
      type: integer
      format: int64
    profile_version_id:
      type: integer
      format: int64
    source_effective_from:
      type: string
      format: date
    source_recorded_at:
      type: string
      format: date-time
    quantity_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,37})$'
    quantity_scale:
      type: integer
    disposed_basis_value:
      type: [string, 'null']
      pattern: '^-?(0|[1-9][0-9]{0,37})$'
    disposed_basis_scale:
      type: [integer, 'null']
    proceeds_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
    proceeds_scale:
      type: integer
    cost_commodity_id:
      type: integer
      format: int64
    audit_event_id:
      type: integer
      format: int64
    allocations:
      type: array
      items:
        $ref: "#/InvestmentLotDisposalResponse"

SellPreviewResponse:
  type: object
  required:
    - basis_knowledge
    - cost_basis_method
    - disposal_decision
    - allocations
    - realized_gain
    - realized_gain_scale
    - cash_amount_value
    - cash_amount_scale
    - gross_amount_scale
    - net_settlement_value
    - net_settlement_scale
    - settlement_date
    - charges
  properties:
    basis_knowledge:
      type: string
      enum: [known, unknown]
      description: >-
        Unknown when the disposal consumed basis that is not yet resolved.
        Basis and gain amounts are then null; quantity and proceeds stay exact.
    cost_basis_method:
      $ref: "#/CostBasisMethod"
    disposal_decision:
      $ref: "#/DisposalDecisionResponse"
    allocations:
      type: array
      items:
        $ref: "#/InvestmentLotDisposalResponse"
    realized_gain:
      type: [string, 'null']
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: Realized gain coefficient in the cost commodity (cash proceeds minus disposed cost basis), at realized_gain_scale.
    realized_gain_scale:
      type: [integer, 'null']
      description: Decimal scale for realized_gain. May differ from cash_amount_scale when disposed lots carry a finer cost-basis scale.
    cash_amount_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
    cash_amount_scale:
      type: integer
    gross_amount_value:
      type: string
    gross_amount_scale:
      type: integer
    net_settlement_value:
      type: string
    net_settlement_scale:
      type: integer
    settlement_date:
      type: string
      format: date
    charges:
      type: array
      items:
        $ref: '#/InvestmentTradeChargeRequest'

DividendRequest:
  type: object
  required:
    - transaction_date
    - cash_account_id
    - cash_commodity_id
    - amount_value
    - amount_scale
  properties:
    withholding_only:
      type: boolean
      default: false
      description: >-
        Record a separate withholding-tax payment using amount_value/amount_scale
        as the positive tax magnitude. Requires withholding_account_id; payer is optional.
        income_account_id, withholding_value and withholding_scale must be absent.
        The operation has no gross income or security quantity posting.
    transaction_date:
      type: string
      format: date
    commodity_id:
      type: [integer, 'null']
      format: int64
      description: Optional payer attribution. Entry omission/null is unassigned; replacement omission preserves, null clears and a value assigns. No historical holding is required.
    ex_date:
      type: [string, 'null']
      format: date
      description: >-
        Optional ex date the payment (or separate withholding) was made for; it may
        follow transaction_date. Net worth and returns recognise the payment on it
        (an unsettled receivable, or early cash, until the payment date), and
        entitlement is decided at the end of the previous day. Entry omission/null
        records none; replacement omission preserves, null clears and a value replaces.
    cash_account_id:
      type: integer
      format: int64
    cash_commodity_id:
      type: integer
      format: int64
    income_account_id:
      type: integer
      format: int64
    amount_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
    amount_scale:
      type: integer
    withholding_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
    withholding_scale:
      type: integer
    withholding_account_id:
      type: integer
      format: int64
    memo:
      type: string
    payee_id:
      type: integer
      format: int64
    status:
      type: string
    change_reason:
      type: string
    reconciliation_override:
      type: boolean
      description: >-
        Allows a backdated trade to proceed into a reconciled period,
        invalidating the affected checkpoints. Without it such a trade is
        refused with a 409 CONFLICT.
    reconciliation_override_checkpoint_ids:
      $ref: "#/ReviewedCheckpointIds"

PaymentInLieuRequest:
  type: object
  description: >-
    A payment in lieu of a dividend owed by a short holder (#255). Posts cash
    −amount against the expense account, and optionally cash +recovery against
    the recovery account. It never touches the short lot or its opening
    proceeds. Holding, instrument and ex-date are optional owner attribution,
    diagnosed independently of cash authorization. Entry omission/null leaves
    attribution unassigned. In replacement, omission preserves, null clears
    and a value replaces. A holding without an instrument stays partial.
  required: [transaction_date, cash_account_id, cash_commodity_id, expense_account_id, amount_value, amount_scale]
  properties:
    holding_account_id: { type: [integer, 'null'], format: int64, minimum: 1 }
    commodity_id: { type: [integer, 'null'], format: int64, minimum: 1 }
    ex_date: { type: [string, 'null'], format: date }
    transaction_date:
      type: string
      format: date
      description: Recorded cash payment date; ex-date chronology is advisory.
    cash_account_id: { type: integer, format: int64 }
    cash_commodity_id: { type: integer, format: int64 }
    expense_account_id: { type: integer, format: int64 }
    amount_value:
      type: string
      pattern: '^(0|[1-9][0-9]{0,18})$'
      description: Amount owed coefficient (positive).
    amount_scale: { type: integer }
    recovery_value:
      type: string
      pattern: '^(0|[1-9][0-9]{0,18})$'
      description: Amount credited back, less than the amount owed.
    recovery_scale: { type: integer }
    recovery_account_id: { type: integer, format: int64 }
    memo: { type: string }
    payee_id: { type: integer, format: int64 }
    change_reason: { type: string }
    reconciliation_override:
      type: boolean
      description: Allows a backdated payment to invalidate the checkpoints it lands behind.
    reconciliation_override_checkpoint_ids:
      $ref: "#/ReviewedCheckpointIds"

InvestmentPaymentInLieuReplacementRequest:
  type: object
  additionalProperties: false
  required: [reason, replacement]
  properties:
    reason:
      type: string
      minLength: 1
      description: Why the posted payment in lieu is being corrected.
    reconciliation_override:
      type: boolean
    reconciliation_override_checkpoint_ids:
      $ref: "#/ReviewedCheckpointIds"
    replacement:
      $ref: "#/PaymentInLieuRequest"

ReinvestedDividendRequest:
  type: object
  required:
    - transaction_date
    - commodity_id
    - holding_account_id
    - quantity_value
    - quantity_scale
    - amount_value
    - amount_scale
    - cash_commodity_id
  properties:
    transaction_date:
      type: string
      format: date
    commodity_id:
      type: integer
      format: int64
    holding_account_id:
      type: integer
      format: int64
    income_account_id:
      type: integer
      format: int64
    quantity_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,37})$'
      description: Lossless exact integer coefficient normalized to quantity_scale.
    quantity_scale:
      type: integer
    amount_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
    amount_scale:
      type: integer
    cash_commodity_id:
      type: integer
      format: int64
    memo:
      type: string
    payee_id:
      type: integer
      format: int64
    status:
      type: string
    change_reason:
      type: string
    reconciliation_override:
      type: boolean
      description: >-
        Allows a backdated trade to proceed into a reconciled period,
        invalidating the affected checkpoints. Without it such a trade is
        refused with a 409 CONFLICT.
    reconciliation_override_checkpoint_ids:
      $ref: "#/ReviewedCheckpointIds"
    gain_impact_acknowledgement:
      type: string
      description: >-
        The gain_impact.acknowledgement token from this command's
        reconciliation-impact preview, accepting the committed-disposal gain
        changes it disclosed (T-126). A non-empty change set without it is
        refused with INVESTMENT_GAIN_IMPACT_ACKNOWLEDGEMENT_REQUIRED, a token
        for any other set with INVESTMENT_GAIN_IMPACT_ACKNOWLEDGEMENT_STALE.

InvestmentLotResponse:
  type: object
