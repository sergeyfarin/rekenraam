InvestmentLotAllocationRequest:
  type: object
  required:
    - lot_id
    - quantity_value
    - quantity_scale
  properties:
    lot_id:
      type: integer
      format: int64
    quantity_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,37})$'
      description: Lossless exact integer coefficient normalized to quantity_scale.
    quantity_scale:
      type: integer

InvestmentTradeRequest:
  type: object
  required:
    - transaction_date
    - commodity_id
    - holding_account_id
    - quantity_value
    - quantity_scale
    - cash_commodity_id
  properties:
    transaction_date:
      type: string
      format: date
    commodity_id:
      type: integer
      format: int64
    holding_account_id:
      type: integer
      format: int64
    cash_account_id:
      type: integer
      format: int64
    quantity_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,37})$'
      description: Lossless exact integer coefficient normalized to quantity_scale.
    quantity_scale:
      type: integer
    cash_amount_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
    cash_amount_scale:
      type: integer
    cash_commodity_id:
      type: integer
      format: int64
    gross_amount_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: Signed gross consideration; negative for buy, positive for sale. Omit for legacy net-only trades.
    gross_amount_scale:
      type: integer
    net_settlement_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: Signed net cash settlement in the trade quote currency. Required with gross.
    net_settlement_scale:
      type: integer
    settlement_date:
      type: string
      format: date
    charges:
      type: array
      items:
        $ref: '#/InvestmentTradeChargeRequest'
    memo:
      type: string
    payee_id:
      type: integer
      format: int64
    status:
      type: string
    lot_allocations:
      type: array
      items:
        $ref: "#/InvestmentLotAllocationRequest"
    change_reason:
      type: string
    cost_basis_method:
      $ref: "#/CostBasisMethod"
    reconciliation_override:
      type: boolean
      description: >-
        Allows a backdated trade to proceed into a reconciled period,
        invalidating the affected checkpoints. Without it such a trade is
        refused with a 409 CONFLICT.
    reconciliation_override_checkpoint_ids:
      $ref: "#/ReviewedCheckpointIds"
    gain_impact_acknowledgement:
      type: string
      description: >-
        The gain_impact.acknowledgement token returned by this command's
        preview for the committed-disposal gain changes the user accepted.
        Honoured by buys (manual and imported); sells and write-offs do not
        replay committed disposals and ignore it. Commit recomputes the change set in its write
        transaction; a non-empty set without this token is refused with
        INVESTMENT_GAIN_IMPACT_ACKNOWLEDGEMENT_REQUIRED, and a token for any
        other set with INVESTMENT_GAIN_IMPACT_ACKNOWLEDGEMENT_STALE. An empty
        set needs no token and ignores one.

InvestmentTradeChargeRequest:
  type: object
  required: [kind, amount_value, amount_scale, commodity_id]
  properties:
    kind:
      type: string
      enum: [commission, transaction_tax, other_fee, rebate]
    amount_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: Signed amount; fees and taxes are negative, rebates positive.
    amount_scale:
      type: integer
    commodity_id:
      type: integer
      format: int64
    treatment:
      type: string
      enum: [clearing_included, separately_expensed]
    charge_account_id:
      type: integer
      format: int64
    cash_account_id:
      type: integer
      format: int64
    paid_on:
      type: string
      format: date
    source_evidence:
      type: object

InvestmentWriteOffRequest:
  type: object
  description: >-
    A zero-proceeds disposal. Deliberately has no cash account, cash commodity
    or amount — those fields are what make a sale a sale.
  required:
    - transaction_date
    - commodity_id
    - holding_account_id
    - quantity_value
    - quantity_scale
    - reason
  properties:
    transaction_date:
      type: string
      format: date
    commodity_id:
      type: integer
      format: int64
    holding_account_id:
      type: integer
      format: int64
    cost_commodity_id:
      type: integer
      format: int64
      minimum: 1
      description: >-
        Optional cost currency of the long position to consume. Filters every
        cost-basis method and specific-lot election to this currency; creates no
        cash leg. Omission infers a single currency and refuses ambiguous
        mixed-currency holdings. Replacement in the same holding/instrument
        retains the recorded currency when omitted; an explicit selector may
        change it, subject to replay and gain acknowledgement.
    quantity_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,37})$'
      description: >-
        Lossless exact integer coefficient normalized to quantity_scale. Must
        be positive and no larger than the remaining holding.
    quantity_scale:
      type: integer
    reason:
      type: string
      minLength: 1
      description: >-
        Why the holding is worthless ("delisted", "fund closed", "issuer
        liquidated"). Required — a position declared worthless without a
        stated cause is not auditable.
    memo:
      type: string
      description: Defaults to the reason when omitted.
    payee_id:
      type: integer
      format: int64
    status:
      type: string
    lot_allocations:
      type: array
      items:
        $ref: "#/InvestmentLotAllocationRequest"
    change_reason:
      type: string
    cost_basis_method:
      $ref: "#/CostBasisMethod"
    reconciliation_override:
      type: boolean
      description: >-
        Allows a backdated write-off to proceed into a reconciled period,
        invalidating the affected checkpoints. Without it such a write-off is
        refused with a 409 CONFLICT.
    reconciliation_override_checkpoint_ids:
      $ref: "#/ReviewedCheckpointIds"
    gain_impact_acknowledgement:
      type: string
      description: >-
        The gain_impact.acknowledgement token from this command's
        reconciliation-impact preview, required when an entry dated behind a
        later disposal revises committed gains (T-117).

InvestmentLotDisposalResponse:
  type: object
  required:
    - basis_knowledge
    - lot_id
    - quantity_value
    - quantity_scale
    - cost_basis_value
    - cost_basis_scale
    - proceeds_value
    - proceeds_scale
