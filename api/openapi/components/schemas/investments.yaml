      $ref: "#/DisposalDecisionResponse"

ExternalTransferInRequest:
  type: object
  additionalProperties: false
  required:
    - effective_on
    - holding_account_id
    - commodity_id
    - quantity_value
    - quantity_scale
    - cost_commodity_id
  properties:
    effective_on:
      type: string
      format: date
      description: Account-entry and transfer effective date.
    holding_account_id:
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
    quantity_value:
      type: string
      pattern: '^[1-9][0-9]{0,37}$'
    quantity_scale:
      type: integer
      minimum: 0
      maximum: 24
    carried_basis_value:
      type: string
      pattern: '^(0|[1-9][0-9]{0,18})$'
      description: >-
        Known carried basis; zero is an explicit known-zero basis. Required
        unless basis_knowledge is unknown, when it must be omitted.
    carried_basis_scale:
      type: integer
      minimum: 0
      maximum: 12
    basis_knowledge:
      type: string
      enum: [known, unknown]
      description: >-
        Defaults to known. Unknown records the transfer with security legs
        only; its lot's basis and later gains stay unresolved. An omitted
        basis is refused rather than read as unknown.
    cost_commodity_id:
      type: integer
      format: int64
    original_acquired_on:
      type: string
      format: date
      description: Optional sourced original acquisition date. Omission is stored as unknown.
    source_evidence:
      type: object
      additionalProperties: true
    memo:
      type: string
    change_reason:
      type: string
    reconciliation_override:
      type: boolean
    reconciliation_override_checkpoint_ids:
      $ref: "#/ReviewedCheckpointIds"
    gain_impact_acknowledgement:
      type: string
      description: >-
        The gain_impact.acknowledgement token from this command's
        reconciliation-impact preview, required when an entry dated behind a
        later disposal revises committed gains (T-117).

ExternalTransferInResponse:
  type: object
  required: [transaction, lot_id]
  properties:
    transaction:
      $ref: "../schemas/transactions.yaml#/TransactionResponse"
    lot_id:
      type: integer
      format: int64

InternalTransferRequest:
  type: object
  additionalProperties: false
  description: >-
    Send lot_allocations for an individual-lot source, or quantity_value and
    quantity_scale for an average-cost source (pooled allocation, T-123). The
    source position's method-family lock, or else its resolved default,
    decides which is accepted. A pooled quantity opens one pooled destination
    lot unless destination_lineage is source_lots (T-135).
  required: [effective_on, source_account_id, destination_account_id, commodity_id, cost_commodity_id]
  properties:
    effective_on:
      type: string
      format: date
      description: Account-entry and transfer effective date.
    source_account_id:
      type: integer
      format: int64
    destination_account_id:
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
    cost_commodity_id:
      type: integer
      format: int64
      description: All selected source lots must carry basis in this currency.
    lot_allocations:
      type: array
      items:
        $ref: "../schemas/investments.yaml#/InvestmentLotAllocationRequest"
    quantity_value:
      type: string
      pattern: '^[1-9][0-9]{0,37}$'
      description: Pooled transfer quantity coefficient; omit when lot_allocations are sent.
    quantity_scale:
      type: integer
      minimum: 0
      maximum: 24
    destination_lineage:
      type: string
      enum: [pooled_lot, source_lots]
      description: >-
        Pooled quantity only. pooled_lot (default) opens one destination lot at
        the pool's carried basis, dated by the latest original acquisition date
        among the units moved; replay may revise its basis and date. source_lots
        opens one lot per depleted source lot with its own date; a later change
        to which lots the pool depletes is then refused with the transfer named.
        Selected lots always carry source_lots.
    source_evidence:
      type: object
      additionalProperties: true
    memo:
      type: string
    change_reason:
      type: string
    reconciliation_override:
      type: boolean
    reconciliation_override_checkpoint_ids:
      $ref: "#/ReviewedCheckpointIds"
    gain_impact_acknowledgement:
      type: string
      description: Echoes the preview gain-impact token when committed gains would change.

InternalTransferLink:
  type: object
  required: [source_lot_id, destination_lot_id, quantity_value, quantity_scale, carried_basis_value, carried_basis_scale, basis_knowledge, original_date_knowledge, original_acquired_on]
  properties:
    basis_knowledge:
      type: string
      enum: [known, unknown]
      description: Unknown when the moved units carry unknown basis; the carried amount is then null.
    source_lot_id:
      type: [integer, "null"]
      format: int64
      description: Null for a pooled destination lot, which is carried from the whole pool.
    destination_lot_id:
      type: [integer, "null"]
      format: int64
      description: Null in a preview, whose lots are never durable.
    quantity_value:
      type: string
    quantity_scale:
      type: integer
    carried_basis_value:
      type: [string, "null"]
      description: Basis carried from the source lot, or the pool for a pooled lot; pool rate for an average-cost source, exact remainder on the final touched lot. Null when unknown.
    carried_basis_scale:
      type: [integer, "null"]
    original_date_knowledge:
      type: string
      enum: [known, unknown]
    original_acquired_on:
      type: [string, "null"]
      format: date
      description: For a pooled lot, the latest original acquisition date among the units moved.

InternalTransferPlan:
  type: object
  required: [basis_allocation, destination_lineage, cost_basis_method, resolution_tier, links]
  properties:
    basis_allocation:
      type: string
      enum: [selected_lots, average_cost_pool]
    destination_lineage:
      type: string
      enum: [pooled_lot, source_lots]
    cost_basis_method:
      type: string
      enum: [fifo, lifo, average_cost, specific_lot]
    resolution_tier:
      type: string
      enum: [account, global, fallback, position_lock]
      description: position_lock means an open position's method family overrode the current default.
    links:
      type: array
      items:
        $ref: "../schemas/investments.yaml#/InternalTransferLink"

InternalTransferPreviewResponse:
  type: object
  required: [plan, impact]
  properties:
    plan:
      $ref: "../schemas/investments.yaml#/InternalTransferPlan"
    impact:
      $ref: "../schemas/transactions.yaml#/ReconciliationImpactResponse"

InternalTransferResponse:
  type: object
  required: [transaction, plan, destination_lot_ids]
  properties:
    transaction:
      $ref: "../schemas/transactions.yaml#/TransactionResponse"
    plan:
      $ref: "../schemas/investments.yaml#/InternalTransferPlan"
    destination_lot_ids:
      type: array
      items:
        type: integer
        format: int64

ExternalTransferOutRequest:
  type: object
  additionalProperties: false
  description: >-
    Send lot_allocations for an individual-lot source, or quantity_value and
    quantity_scale for an average-cost source (pooled allocation). The source
    position's method-family lock, or else its resolved default, decides which
    is accepted. The basis carried out is computed from the depletion, never
    supplied; source_evidence may record the broker's figure as evidence only.
  required: [effective_on, source_account_id, commodity_id, cost_commodity_id]
  properties:
    effective_on:
      type: string
      format: date
      description: Date the holding leaves the book.
    source_account_id:
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
    cost_commodity_id:
      type: integer
      format: int64
      description: All depleted source lots must carry basis in this currency.
    lot_allocations:
      type: array
      items:
        $ref: "../schemas/investments.yaml#/InvestmentLotAllocationRequest"
    quantity_value:
      type: string
      pattern: '^[1-9][0-9]{0,37}$'
      description: Pooled transfer quantity coefficient; omit when lot_allocations are sent.
    quantity_scale:
      type: integer
      minimum: 0
      maximum: 24
    source_evidence:
      type: object
      additionalProperties: true
    memo:
      type: string
    change_reason:
      type: string
    reconciliation_override:
      type: boolean
    reconciliation_override_checkpoint_ids:
      $ref: "#/ReviewedCheckpointIds"
    gain_impact_acknowledgement:
      type: string

ExternalTransferOutLink:
  type: object
  required: [source_lot_id, quantity_value, quantity_scale, carried_basis_value, carried_basis_scale, basis_knowledge, original_date_knowledge, original_acquired_on]
  properties:
    basis_knowledge:
      type: string
      enum: [known, unknown]
      description: Unknown when the moved units carry unknown basis; the carried amount is then null.
    source_lot_id:
      type: integer
      format: int64
    quantity_value:
      type: string
    quantity_scale:
      type: integer
    carried_basis_value:
      type: [string, "null"]
      description: Basis taken from the source lot; pool rate for an average-cost source, exact remainder on the final touched lot. Null when unknown.
    carried_basis_scale:
      type: [integer, "null"]
    original_date_knowledge:
      type: string
      enum: [known, unknown]
    original_acquired_on:
      type: [string, "null"]
      format: date

ExternalTransferOutPlan:
  type: object
  required: [basis_allocation, cost_basis_method, resolution_tier, links, basis_value, basis_scale, basis_knowledge]
  properties:
    basis_allocation:
      type: string
      enum: [selected_lots, average_cost_pool]
    cost_basis_method:
      type: string
      enum: [fifo, lifo, average_cost, specific_lot]
    resolution_tier:
      type: string
      enum: [account, global, fallback, position_lock]
    links:
      type: array
      items:
        $ref: "../schemas/investments.yaml#/ExternalTransferOutLink"
    basis_value:
      type: [string, "null"]
      description: >-
        Exact total basis carried out of the book; the bridge journal's amount. Zero posts no bridge.
        Null when any link is unknown: no bridge posts until the basis is resolved.
    basis_scale:
      type: [integer, "null"]
    basis_knowledge:
      type: string
      enum: [known, unknown]

ExternalTransferOutPreviewResponse:
  type: object
  required: [plan, impact]
  properties:
    plan:
      $ref: "../schemas/investments.yaml#/ExternalTransferOutPlan"
    impact:
      $ref: "../schemas/transactions.yaml#/ReconciliationImpactResponse"

ExternalTransferOutResponse:
  type: object
  required: [transaction, plan]
  properties:
    transaction:
      $ref: "../schemas/transactions.yaml#/TransactionResponse"
    plan:
      $ref: "../schemas/investments.yaml#/ExternalTransferOutPlan"

InvestmentTransferReplacementRequest:
  type: object
  additionalProperties: false
  required: [reason, replacement]
  properties:
    reason:
      type: string
      minLength: 1
      description: Why the posted internal transfer is being corrected.
    reconciliation_override:
      type: boolean
      description: Omit or set false to keep affected reconciliation checkpoints active.
    reconciliation_override_checkpoint_ids:
      $ref: "#/ReviewedCheckpointIds"
    gain_impact_acknowledgement:
      type: string
      description: >-
        The gain_impact.acknowledgement token from this command's preview, accepting exactly the committed
        disposal gain changes it disclosed (T-126).
    replacement:
      $ref: "../schemas/investments.yaml#/InternalTransferRequest"
      description: >-
        The full corrected internal transfer. Date, lots or pooled quantity, both holding accounts and
        destination lineage may change; commodity_id and cost_commodity_id must equal the transfer's. Its
        change_reason, reconciliation_override and gain_impact_acknowledgement are ignored.
    source_evidence_edits:
      type: object
      additionalProperties: true
      description: >
        Top-level edits applied on the server to the recorded source evidence
        (#312): a key set to null is removed, any other value replaces that key
        exactly, and every key not named keeps its recorded JSON token (large
        integers, decimals and nested data included). Mutually exclusive with
        replacement.source_evidence, which replaces the evidence whole;
        omitting both keeps the recorded evidence.

InvestmentTransferReplacementResponse:
  type: object
  required: [inverse, replacement, corrected_transaction_id]
  properties:
    inverse:
      $ref: "../schemas/transactions.yaml#/TransactionResponse"
    replacement:
      $ref: "../schemas/investments.yaml#/InternalTransferResponse"
    corrected_transaction_id:
      type: integer
      format: int64

InvestmentTransferOutReplacementRequest:
  type: object
  additionalProperties: false
  required: [reason, replacement]
  properties:
    reason:
      type: string
      minLength: 1
      description: Why the posted outbound transfer is being corrected.
    reconciliation_override:
      type: boolean
      description: Omit or set false to keep affected reconciliation checkpoints active.
    reconciliation_override_checkpoint_ids:
      $ref: "#/ReviewedCheckpointIds"
    gain_impact_acknowledgement:
      type: string
      description: The gain_impact.acknowledgement token from this command's preview.
