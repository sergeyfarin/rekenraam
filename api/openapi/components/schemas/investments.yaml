    - specific_lot

InstrumentType:
  type: string
  description: >-
    Accepted instrument types, matching `cleanInvestmentInstrumentSpec` in
    `app/investments.go`. Until 2026-08-06 this enum advertised `equity` and
    `crypto` — which the backend rejects — and omitted `stock`, `option` and
    `future`, which it accepts. `crypto` is planned for R17.
  default: stock
  enum:
    - stock
    - etf
    - fund
    - bond
    - option
    - future
    - other

