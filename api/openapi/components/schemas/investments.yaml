  properties:
    reason:
      type: string
      minLength: 1
      description: Why the posted manual long sale is being reversed.
    reconciliation_override:
      type: boolean
      description: Omit or set false to keep affected reconciliation checkpoints active.
    gain_impact_acknowledgement:
      type: string
      description: >-
        The gain_impact.acknowledgement token from this command's
        reconciliation-impact preview, accepting the committed-disposal gain
