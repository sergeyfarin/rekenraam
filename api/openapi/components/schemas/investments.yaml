RealizedGainEntry:
  type: object
  required:
    - basis_knowledge
    - position_side
    - account_id
    - commodity_id
    - cost_commodity_id
    - disposal_date
    - quantity_value
    - quantity_scale
    - disposed_basis_value
    - disposed_basis_scale
    - proceeds_value
    - proceeds_scale
    - realized_gain_value
    - realized_gain_scale
  properties:
    basis_knowledge:
      type: string
      enum: [known, unknown]
      description: >-
        Unknown when the disposal consumed basis that is not yet resolved.
        Basis and gain amounts are then null; quantity and proceeds stay exact.
    account_id:
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
    cost_commodity_id:
      type: integer
      format: int64
    disposal_date:
      type: string
      format: date
    transaction_id:
      type: integer
      format: int64
      description: The sell transaction ID, if one exists.
    quantity_value:
      type: string
      description: Disposed quantity as a base-10 integer string.
    quantity_scale:
      type: integer
    position_side:
      type: string
      enum: [long, short]
      description: >-
        Long for a sale or write-off; short for a short cover, whose
        disposed_basis_value is the positive allocated opening proceeds.
    disposed_basis_value:
      type: [string, 'null']
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: >-
        Signed disposed amount in minor units at disposed_basis_scale: the
        negated cost basis for a long disposal, the allocated opening
        proceeds for a short cover.
    disposed_basis_scale:
      type: [integer, 'null']
    proceeds_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: >-
        Signed operational proceeds in minor units at proceeds_scale; a
        cover's is negative, the covering cost.
    proceeds_scale:
      type: integer
    realized_gain_value:
      type: [string, 'null']
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: >-
        proceeds_value + disposed_basis_value, in minor units at
        realized_gain_scale. Format it with realized_gain_scale, never with
        proceeds_scale.
    realized_gain_scale:
      type: [integer, 'null']
      description: >-
        Scale of realized_gain_value: the deeper of proceeds_scale and
        disposed_basis_scale, so the difference is exact. It is not always
        proceeds_scale — 11 EUR of proceeds entered at scale 0 against a
        10.99 EUR basis is a 0.01 EUR gain at scale 2.

UnrealizedGainEntry:
  type: object
  required:
    - account_id
    - commodity_id
    - cost_commodity_id
    - quantity_value
    - quantity_scale
    - remaining_cost_basis_value
    - remaining_cost_basis_scale
    - basis_knowledge
    - latest_price_approximate
    - position_side
  properties:
    position_side:
      type: string
      enum: [long, short]
      description: >-
        Short for owed units: market_value is the signed (negative) exposure
        and unrealized gain is remaining opening proceeds less the cost to cover.
    account_id:
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
    cost_commodity_id:
      type: integer
      format: int64
    quantity_value:
      type: string
      description: Remaining quantity as a base-10 integer string.
    quantity_scale:
      type: integer
    remaining_cost_basis_value:
      type: [string, 'null']
      description: Null when projected basis is unknown; known zero remains an explicit coefficient.
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
    remaining_cost_basis_scale:
      type: [integer, 'null']
    basis_knowledge:
      type: string
      enum: [known, unknown]
      description: Knowledge of remaining projected basis; any unknown lot makes the position basis unknown.
    latest_price_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: Omitted when no price observation exists.
    latest_price_scale:
      type: integer
      description: Omitted when no price observation exists.
    latest_price_date:
      type: string
      format: date
      description: Omitted when no price observation exists.
    latest_price_approximate:
      type: boolean
      description: True when the selected valuation quote was estimated from net-only trade cash.
    market_value_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: >-
        quantity × latest_price, negated for a short position. Omitted when
        valuation_unavailable is present.
    market_value_scale:
      type: integer
      description: >-
        Scale of market_value_value. Reduced below the computed precision only
        when redundant trailing zeros would otherwise overflow int64.
    unrealized_gain_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: >-
        market_value − remaining_cost_basis for a long position; remaining
        opening proceeds + market_value (the cost to cover is negative) for a
        short. Omitted when valuation_unavailable is present.
    unrealized_gain_scale:
      type: integer
      description: Omitted when valuation_unavailable is present.
    valuation_unavailable:
      type: string
      enum: [no_price, unrepresentable]
      description: >-
        Present only when market value and unrealized gain are omitted, saying
        why. no_price means no price observation exists for the position;
        unrepresentable means one is priced but the value does not fit the
        response's int64 fields.
    gain_unavailable:
      type: string
      enum: [unknown_basis]
      description: Gain is omitted when basis is unknown; quantity and any available market value are retained.

RealizedGainTotal:
  type: object
  required:
    - basis_knowledge
