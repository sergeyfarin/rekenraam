    amount_scale: { type: integer }
    commodity_id: { type: integer, format: int64 }
    treatment: { type: string, enum: [clearing_included, separately_expensed] }
    charge_account_id: { type: integer, format: int64 }
    cash_account_id: { type: integer, format: int64 }
    paid_on: { type: string, format: date }

InvestmentCorrectionNodeResponse:
  type: object
  required: [operation_id, operation_kind, event_date, created_at, audit_event_id, imported, effective]
  properties:
    operation_id:
      type: integer
      format: int64
    transaction_id:
      type: integer
      format: int64
    operation_kind:
      type: string
    event_date:
      type: string
      format: date
    correction_of_operation_id:
      type: integer
      format: int64
    correction_mode:
      type: string
      enum: [replace, reverse]
    correction_reason:
      type: string
    created_at:
      type: string
      format: date-time
    audit_event_id:
      type: integer
      format: int64
    imported:
      type: boolean
    effective:
      type: boolean

DisposalDecisionResponse:
  type: object
  required:
    - basis_knowledge
    - cost_basis_method
    - resolution_tier
    - quantity_value
    - quantity_scale
    - disposed_basis_value
    - disposed_basis_scale
    - proceeds_value
    - proceeds_scale
    - cost_commodity_id
    - allocations
  properties:
    basis_knowledge:
      type: string
      enum: [known, unknown]
      description: >-
        Unknown when the disposal consumed basis that is not yet resolved.
        Basis and gain amounts are then null; quantity and proceeds stay exact.
    id:
      type: integer
      format: int64
    transaction_id:
      type: integer
      format: int64
    transaction_version_id:
      type: integer
      format: int64
    cost_basis_method:
      $ref: "#/CostBasisMethod"
    resolution_tier:
      type: string
      enum: [transaction, account, global, fallback]
    account_version_id:
      type: integer
      format: int64
    profile_id:
      type: integer
      format: int64
    profile_version_id:
      type: integer
      format: int64
    source_effective_from:
      type: string
      format: date
    source_recorded_at:
      type: string
      format: date-time
    quantity_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,37})$'
    quantity_scale:
      type: integer
    disposed_basis_value:
      type: [string, 'null']
      pattern: '^-?(0|[1-9][0-9]{0,37})$'
    disposed_basis_scale:
      type: [integer, 'null']
    proceeds_value:
      type: string
