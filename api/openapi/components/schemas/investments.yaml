InvestmentCorrectionTransferTerms:
  type: object
  description: >-
    The effective transfer's committed terms, for pre-filling a replacement (T-119, outbound T-144).
    Selected-lot transfers list lot_allocations; pool transfers and external transfers in give quantity_value/scale.
    An outbound transfer has no destination account or lineage.
    An external transfer in has no source account or lineage and gives its carried basis and original date.
  required: [transfer_kind, effective_on, source_account_id, destination_account_id, commodity_id, cost_commodity_id,
    basis_allocation, destination_lineage, lot_allocations, quantity_value, quantity_scale,
    carried_basis_value, carried_basis_scale, basis_knowledge, original_acquired_on, source_evidence, memo]
  properties:
    basis_knowledge:
      type: string
      enum: [known, unknown]
      description: Unknown when a committed link carries unknown basis; carried_basis_value is then null.
    transfer_kind:
      type: string
      enum: [internal, external_in, external_out]
    effective_on:
      type: string
      format: date
    source_account_id:
      type: [integer, "null"]
      format: int64
    destination_account_id:
      type: [integer, "null"]
      format: int64
      description: Null for an outbound transfer.
    commodity_id:
      type: integer
      format: int64
    cost_commodity_id:
      type: integer
      format: int64
    basis_allocation:
      type: string
      enum: [selected_lots, average_cost_pool, ""]
      description: Empty for an external transfer in.
    destination_lineage:
      type: string
      enum: [source_lots, pooled_lot, ""]
      description: Empty for an external transfer in.
    lot_allocations:
      type: array
      items:
        $ref: "#/InvestmentLotAllocationRequest"
    quantity_value:
      type: [string, "null"]
      pattern: "^-?[0-9]+$"
    quantity_scale:
      type: [integer, "null"]
    carried_basis_value:
      type: [string, "null"]
      pattern: "^-?[0-9]+$"
      description: External transfer in with known basis only.
    carried_basis_scale:
      type: [integer, "null"]
    original_acquired_on:
      type: [string, "null"]
      format: date
      description: External transfer in only; null when the original date is unknown.
    source_evidence:
      type: object
      additionalProperties: true
    memo:
      type: string

InvestmentCorrectionSplitTerms:
  type: object
  description: The effective split's current terms, for pre-filling a replacement.
  required: [holding_account_id, commodity_id, effective_on, ratio_numerator, ratio_denominator]
  properties:
    holding_account_id:
      type: integer
      format: int64
    commodity_id:
