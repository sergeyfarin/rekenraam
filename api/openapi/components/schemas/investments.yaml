InvestmentAttributionDiagnostic:
  type: object
  description: Read-only historical support using the same evaluator as investment_attribution. Never authorizes a write or verifies the amount.
  required: [status, reasons, unavailable]
  properties:
    unavailable:
      type: boolean
      description: Missing context is disclosed even alongside a chronology warning.
    status:
      type: string
      enum: [passed, warning, incomplete]
    reasons:
      type: array
      items:
        type: string
        enum: [no_short_at_entitlement_close, ex_date_after_payment, provider_attribution_mismatch, cash_in_lieu_parent_unresolved, cash_in_lieu_parent_mismatch]

CostBasisMethod:
  type: string
  enum:
    - fifo
    - lifo
    - average_cost
    - specific_lot

InstrumentType:
  type: string
  description: Crypto instruments use crypto commodities and permit quantity scales through 24; other instruments permit 12.
  default: stock
  enum:
    - stock
    - etf
    - fund
    - bond
    - option
    - future
    - other
    - crypto

