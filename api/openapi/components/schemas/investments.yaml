        reconciliation-impact preview, accepting the committed-disposal gain
        changes it disclosed (T-126). A non-empty change set without it is
        refused with INVESTMENT_GAIN_IMPACT_ACKNOWLEDGEMENT_REQUIRED, a token
        for any other set with INVESTMENT_GAIN_IMPACT_ACKNOWLEDGEMENT_STALE.
    replacement:
      $ref: "#/InvestmentSaleReplacementTradeRequest"

InvestmentSaleReplacementTradeRequest:
  description: >-
    Full corrected sale. The cost-basis election and each charge treatment
    must be explicit so changed defaults cannot alter corrected economics.
  allOf:
    - $ref: "#/InvestmentTradeRequest"
    - type: object
      required: [cost_basis_method]
      properties:
        cost_basis_method:
          $ref: "#/CostBasisMethod"
        charges:
          type: array
          items:
            allOf:
              - $ref: "#/InvestmentTradeChargeRequest"
              - type: object
                required: [treatment]
                properties:
                  treatment:
                    type: string
                    enum: [clearing_included, separately_expensed]

InvestmentSaleReplacementResponse:
  type: object
  required: [inverse_transaction, replacement, corrected_transaction_id]
  properties:
    inverse_transaction:
      $ref: "../schemas/transactions.yaml#/TransactionResponse"
    replacement:
      $ref: "#/InvestmentTradeResponse"
    corrected_transaction_id:
      type: integer
      format: int64

InvestmentBuyReplacementRequest:
  type: object
  additionalProperties: false
  required: [reason, replacement]
  properties:
    reason:
      type: string
      minLength: 1
      description: Why the posted manual long buy is being corrected.
    reconciliation_override:
      type: boolean
      description: Omit or set false to preserve affected reconciliation checkpoints.
    gain_impact_acknowledgement:
      type: string
      description: >-
        The gain_impact.acknowledgement token from this command's
        reconciliation-impact preview, accepting the committed-disposal gain
        changes it disclosed (T-126). A non-empty change set without it is
        refused with INVESTMENT_GAIN_IMPACT_ACKNOWLEDGEMENT_REQUIRED, a token
        for any other set with INVESTMENT_GAIN_IMPACT_ACKNOWLEDGEMENT_STALE.
    replacement:
      $ref: "#/InvestmentBuyReplacementTradeRequest"

InvestmentBuyReplacementTradeRequest:
  description: >-
    Full corrected buy. Every charge treatment must be explicit so changed
    defaults cannot alter corrected economics.
  allOf:
    - $ref: "#/InvestmentTradeRequest"
    - type: object
      properties:
        charges:
          type: array
          items:
            allOf:
              - $ref: "#/InvestmentTradeChargeRequest"
              - type: object
                required: [treatment]
                properties:
                  treatment:
                    type: string
                    enum: [clearing_included, separately_expensed]

InvestmentBuyReplacementResponse:
  type: object
  required: [inverse_transaction, replacement, corrected_transaction_id]
  properties:
