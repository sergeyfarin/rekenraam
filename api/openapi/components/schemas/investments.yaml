ExternalTransferInRequest:
  type: object
  additionalProperties: false
  required:
    - effective_on
    - holding_account_id
    - commodity_id
    - quantity_value
    - quantity_scale
    - carried_basis_value
    - carried_basis_scale
    - cost_commodity_id
  properties:
    effective_on:
      type: string
      format: date
      description: Account-entry and transfer effective date.
    holding_account_id:
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
    quantity_value:
      type: string
      pattern: '^[1-9][0-9]{0,37}$'
    quantity_scale:
      type: integer
      minimum: 0
      maximum: 24
    carried_basis_value:
      type: string
      pattern: '^(0|[1-9][0-9]{0,18})$'
      description: Known carried basis; zero is an explicit known-zero basis. Unknown basis is not yet accepted.
    carried_basis_scale:
      type: integer
      minimum: 0
      maximum: 12
    cost_commodity_id:
      type: integer
      format: int64
    original_acquired_on:
      type: string
      format: date
      description: Optional sourced original acquisition date. Omission is stored as unknown.
    source_evidence:
      type: object
      additionalProperties: true
    memo:
      type: string
    change_reason:
      type: string
    reconciliation_override:
      type: boolean
    gain_impact_acknowledgement:
      type: string
      description: >-
        The gain_impact.acknowledgement token from this command's
        reconciliation-impact preview, required when an entry dated behind a
        later disposal revises committed gains (T-117).

ExternalTransferInResponse:
  type: object
  required: [transaction, lot_id]
  properties:
    transaction:
      $ref: "../schemas/transactions.yaml#/TransactionResponse"
    lot_id:
      type: integer
      format: int64

InternalTransferRequest:
  type: object
  additionalProperties: false
  description: >-
    Send lot_allocations for an individual-lot source, or quantity_value and
    quantity_scale for an average-cost source (pooled allocation, T-123). The
    source position's method-family lock, or else its resolved default,
    decides which is accepted.
  required: [effective_on, source_account_id, destination_account_id, commodity_id, cost_commodity_id]
  properties:
    effective_on:
      type: string
      format: date
      description: Account-entry and transfer effective date.
    source_account_id:
      type: integer
      format: int64
    destination_account_id:
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
    cost_commodity_id:
      type: integer
      format: int64
      description: All selected source lots must carry basis in this currency.
    lot_allocations:
      type: array
      items:
        $ref: "../schemas/investments.yaml#/InvestmentLotAllocationRequest"
    quantity_value:
      type: string
      pattern: '^[1-9][0-9]{0,37}$'
      description: Pooled transfer quantity coefficient; omit when lot_allocations are sent.
    quantity_scale:
      type: integer
      minimum: 0
      maximum: 24
    source_evidence:
      type: object
      additionalProperties: true
    memo:
      type: string
    change_reason:
      type: string
    reconciliation_override:
      type: boolean
    gain_impact_acknowledgement:
      type: string
      description: Echoes the preview gain-impact token when committed gains would change.

InternalTransferLink:
  type: object
  required: [source_lot_id, destination_lot_id, quantity_value, quantity_scale, carried_basis_value, carried_basis_scale, original_date_knowledge, original_acquired_on]
  properties:
    source_lot_id:
      type: integer
      format: int64
    destination_lot_id:
      type: [integer, "null"]
      format: int64
      description: Null in a preview, whose lots are never durable.
    quantity_value:
      type: string
    quantity_scale:
      type: integer
    carried_basis_value:
      type: string
      description: Basis carried from the source lot; pool rate for an average-cost source, exact remainder on the final touched lot.
    carried_basis_scale:
      type: integer
    original_date_knowledge:
      type: string
      enum: [known, unknown]
    original_acquired_on:
      type: [string, "null"]
      format: date

InternalTransferPlan:
  type: object
  required: [basis_allocation, cost_basis_method, resolution_tier, links]
  properties:
    basis_allocation:
      type: string
      enum: [selected_lots, average_cost_pool]
    cost_basis_method:
      type: string
      enum: [fifo, lifo, average_cost, specific_lot]
    resolution_tier:
      type: string
      enum: [account, global, fallback, position_lock]
      description: position_lock means an open position's method family overrode the current default.
    links:
      type: array
      items:
        $ref: "../schemas/investments.yaml#/InternalTransferLink"

InternalTransferPreviewResponse:
  type: object
  required: [plan, impact]
  properties:
    plan:
      $ref: "../schemas/investments.yaml#/InternalTransferPlan"
    impact:
      $ref: "../schemas/transactions.yaml#/ReconciliationImpactResponse"

InternalTransferResponse:
  type: object
  required: [transaction, plan, destination_lot_ids]
  properties:
    transaction:
      $ref: "../schemas/transactions.yaml#/TransactionResponse"
    plan:
      $ref: "../schemas/investments.yaml#/InternalTransferPlan"
    destination_lot_ids:
      type: array
      items:
        type: integer
        format: int64

InvestmentSplitRequest:
  type: object
  additionalProperties: false
  required: [effective_on, holding_account_id, commodity_id, ratio_numerator, ratio_denominator]
  properties:
    effective_on:
      type: string
      format: date
      description: Date on which entitled lots are split; lots opened later are not.
    holding_account_id:
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
    ratio_numerator:
      type: integer
      format: int64
      minimum: 1
      maximum: 1000000000
      description: New units received for ratio_denominator old units (3 for a 3-for-2 split; 1 for a 1-for-10 reverse split).
    ratio_denominator:
      type: integer
      format: int64
      minimum: 1
      maximum: 1000000000
      description: Old units surrendered. The ratio is stored in lowest terms and may not be 1:1.
    source_evidence:
      type: object
      additionalProperties: true
    memo:
      type: string
    change_reason:
      type: string
    reconciliation_override:
      type: boolean
    gain_impact_acknowledgement:
      type: string
      description: Token from the preview's gain_impact, accepting the committed-disposal gain changes it disclosed.

InvestmentSplitLotEffect:
  type: object
  required: [lot_id, cost_commodity_id, quantity_before_value, quantity_before_scale, quantity_after_value, quantity_after_scale]
  properties:
    lot_id:
      type: integer
      format: int64
    cost_commodity_id:
      type: integer
      format: int64
    quantity_before_value:
      type: string
    quantity_before_scale:
      type: integer
    quantity_after_value:
      type: string
    quantity_after_scale:
      type: integer

InvestmentSplitPlan:
  type: object
  required: [ratio_numerator, ratio_denominator, effects, quantity_delta_value, quantity_delta_scale, replayed]
  properties:
    ratio_numerator:
      type: integer
      format: int64
    ratio_denominator:
      type: integer
      format: int64
    effects:
      type: array
      items:
        $ref: "../schemas/investments.yaml#/InvestmentSplitLotEffect"
    quantity_delta_value:
      type: string
      description: Signed holding change the journal posts; negative for a reverse split.
    quantity_delta_scale:
      type: integer
    replayed:
      type: boolean
      description: True when later disposals were replayed because the split is dated before them.

InvestmentSplitPreviewResponse:
  type: object
  required: [plan, impact]
  properties:
    plan:
      $ref: "../schemas/investments.yaml#/InvestmentSplitPlan"
    impact:
      $ref: "../schemas/transactions.yaml#/ReconciliationImpactResponse"

InvestmentSplitResponse:
  type: object
  required: [transaction, plan]
  properties:
    transaction:
      $ref: "../schemas/transactions.yaml#/TransactionResponse"
    plan:
      $ref: "../schemas/investments.yaml#/InvestmentSplitPlan"

