LedgerImportSource:
  type: object
  required:
  - kind
  - name
  properties:
    kind:
      type: string
      enum:
      - file
      - profile
      - online
    name:
      type: string
LedgerPosition:
  type: object
  required:
  - holding_account_id
  - commodity_id
  - quantity
  - value
  properties:
    holding_account_id:
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
    quantity:
      $ref: ../../openapi.yaml#/components/schemas/BalanceQuantity
    value:
      oneOf:
      - $ref: ../../openapi.yaml#/components/schemas/BalanceQuantity
      - type: 'null'
LedgerAccount:
  type: object
  required:
  - account
  - balances
  - cash
  - unsettled
  - positions
  - value
  - valuation
  - unclassified_short
  - sources
  - cash_accounts
  - other_accounts
  - holding_accounts
  - reconciliation
  - folded_reconciliations
  properties:
    account:
      $ref: ../../openapi.yaml#/components/schemas/AccountResponse
    balances:
      type: array
      items:
        $ref: ../../openapi.yaml#/components/schemas/BalanceQuantity
    cash:
      description: Currency held by a brokerage or cash-kind row itself and by its cash-kind children. Empty for other rows; holdings and other accounts are never cash.
      type: array
      items:
        $ref: ../../openapi.yaml#/components/schemas/BalanceQuantity
    unsettled:
      type: array
      items:
        $ref: ../../openapi.yaml#/components/schemas/BalanceQuantity
    positions:
      type: array
      items:
        $ref: ../../openapi.yaml#/components/schemas/LedgerPosition
    value:
      oneOf:
      - $ref: ../../openapi.yaml#/components/schemas/BalanceQuantity
      - type: 'null'
    valuation:
      oneOf:
      - $ref: ../../openapi.yaml#/components/schemas/Valuation
      - type: 'null'
    unclassified_short:
      type: boolean
    sources:
      type: array
      items:
        $ref: ../../openapi.yaml#/components/schemas/LedgerImportSource
    cash_accounts:
      description: Cash-kind child registers (cash, checking, savings, brokerage cash) whose currency balances make up `cash`.
      type: array
      items:
        $ref: ../../openapi.yaml#/components/schemas/AccountResponse
    other_accounts:
      description: Other ordinary child accounts counted in this row's value but not presented as cash.
      type: array
      items:
        $ref: ../../openapi.yaml#/components/schemas/AccountResponse
    reconciliation:
      description: >-
        The row account's own reconciliation age on owner-local today, whatever
        as_of asks (#482). Null when the account cannot be reconciled: not an
        active posting asset or liability, or an investment holding.
      oneOf:
      - $ref: ../../openapi.yaml#/components/schemas/AccountReconciliation
      - type: 'null'
    folded_reconciliations:
      description: Reconciliation ages of the accounts folded into this row (cash_accounts and other_accounts that can be reconciled), weakest first, so a brokerage's cash account is judged in the list too.
      type: array
      items:
        $ref: ../../openapi.yaml#/components/schemas/FoldedAccountReconciliation
    holding_accounts:
      description: Hidden holding accounts in this row's scope, whatever their status. They are never index rows; clients use them for holding register links and archive/delete dependency checks.
      type: array
      items:
        $ref: ../../openapi.yaml#/components/schemas/AccountResponse
LedgerOverviewResponse:
  type: object
  required:
  - as_of
  - accounts
  - institutions
  - commodities
  - next_cursor
  - reconciliation_out_of_date_after_days
  properties:
    as_of:
      type: string
      format: date
    accounts:
      type: array
      items:
        $ref: ../../openapi.yaml#/components/schemas/LedgerAccount
    institutions:
      type: array
      items:
        $ref: ../../openapi.yaml#/components/schemas/InstitutionResponse
    commodities:
      type: array
      items:
        $ref: ../../openapi.yaml#/components/schemas/HomeReportingCurrency
    next_cursor:
      type:
      - string
      - 'null'
    reconciliation_out_of_date_after_days:
      type: integer
      minimum: 1
      description: The reconciliation window every row was judged against (#482).
