UserPreferencesResponse:
  type: object
  required:
    - id
    - user_id
    - time_zone
    - created_at
    - updated_at
  properties:
    id:
      type: integer
      format: int64
    user_id:
      type: integer
      format: int64
    time_zone:
      type: string
      description: IANA time zone used for user-facing local times.
      examples:
        - Europe/Amsterdam
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

UserPreferencesRequest:
  type: object
  required:
    - time_zone
  properties:
    time_zone:
      type: string
      description: IANA time zone used for user-facing local times.
      examples:
        - Europe/Amsterdam
    change_reason:
      type: string
      maxLength: 500
  additionalProperties: false
