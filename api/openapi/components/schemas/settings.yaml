UserPreferencesResponse:
  type: object
  required:
    - id
    - user_id
    - time_zone
    - created_at
    - updated_at
  properties:
    id:
      type: integer
      format: int64
    user_id:
      type: integer
      format: int64
    time_zone:
      type: string
      description: IANA time zone used for user-facing local times.
      examples:
        - Europe/Amsterdam
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

UserPreferencesRequest:
  type: object
  required:
    - time_zone
  properties:
    time_zone:
      type: string
      description: IANA time zone used for user-facing local times.
      examples:
        - Europe/Amsterdam
    change_reason:
      type: string
      maxLength: 500
  additionalProperties: false

CurrencySettingsPageResponse:
  type: object
  required:
    - book
    - preferences
    - currencies
    - sources
    - policy
    - assignments
    - refresh_runs
    - refresh_runs_has_more
    - source_health
    - latest_rates
  properties:
    book:
      $ref: "../../openapi.yaml#/components/schemas/BookResponse"
    preferences:
      $ref: "../../openapi.yaml#/components/schemas/UserPreferencesResponse"
    currencies:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/CurrencyResponse"
    sources:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/MarketDataSourceResponse"
    policy:
      $ref: "../../openapi.yaml#/components/schemas/PricingPolicyResponse"
    assignments:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/PricingSourceAssignmentResponse"
    refresh_runs:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/PricingRefreshRunResponse"
    refresh_runs_has_more:
      type: boolean
    source_health:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/PricingSourceHealthResponse"
    latest_rates:
      type: array
      description: Latest known observations for active currency/default-currency pairs in both directions.
      items:
        $ref: "../../openapi.yaml#/components/schemas/PriceObservationResponse"
