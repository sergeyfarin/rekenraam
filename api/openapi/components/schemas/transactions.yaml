TransactionStatus:
  type: string
  enum:
    - draft
    - posted
    - voided
TransactionNeedsReview:
  type: boolean
  description: True when the transaction came from an import or external source and has not yet been reviewed by the user. Always false for manually entered transactions.
TransactionKind:
  type: string
  enum:
    - ordinary
    - transfer
    - investment
    - opening_balance
    - adjustment
JournalEntryKind:
  type: string
  enum:
    - ordinary
    - transfer_leg
    - exchange
    - investment
    - opening_balance
    - adjustment
ReconciliationStatus:
  type: string
  enum:
    - uncleared
    - cleared
    - reconciled
PostingResponse:
  type: object
  required:
    - id
    - posting_line_id
    - line_key
    - line_seq
    - account_id
    - account_class
    - commodity_id
    - commodity_code
    - quantity_value
    - quantity_scale
    - memo
    - reconciliation_status
    - metadata
    - tag_ids
  properties:
    id:
      type: integer
      format: int64
    posting_line_id:
      type: integer
      format: int64
    line_key:
      type: string
    line_seq:
      type: integer
      format: int64
    account_id:
      type: integer
      format: int64
    account_day_sequence:
      type: integer
      format: int64
      description: Same-day position within (account_id, entry_date). Used for ordering and period-scoped reconciliation boundary.
    account_name:
      type: string
      nullable: true
      description: "User-visible account name. Null for system accounts with no user-visible name (use account_system_role instead)."
    account_code:
      type: string
      nullable: true
      description: "Account code. Null when not set."
    account_system_role:
      type: string
      nullable: true
      description: "Non-null for system accounts (e.g. transfer_clearing). Use as the display label for system postings."
    account_builtin_key:
      type: string
      nullable: true
      description: "Non-null for built-in/starter category accounts. Localise via Paraglide on the client."
    account_class:
      $ref: "../../openapi.yaml#/components/schemas/AccountClass"
      description: "Account class (asset | liability | income | expense | equity). Always present."
    commodity_id:
      type: integer
      format: int64
    commodity_code:
      type: string
      description: "e.g. USD, EUR, AAPL. Always present."
    commodity_symbol:
      type: string
      nullable: true
      description: "e.g. $, €. Null when not set."
    quantity_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,37})$'
    quantity_scale:
      type: integer
      minimum: 0
      maximum: 24
    memo:
      type: string
    reconciliation_status:
      $ref: "../../openapi.yaml#/components/schemas/ReconciliationStatus"
    cleared_on:
      type: string
      format: date
    metadata:
      type: object
      additionalProperties: true
    tag_ids:
      type: array
      items:
        type: integer
        format: int64
JournalEntryResponse:
  type: object
  required:
    - id
    - entry_seq
    - entry_date
    - entry_kind
    - memo
    - metadata
    - postings
  properties:
    id:
      type: integer
      format: int64
    entry_seq:
      type: integer
      format: int64
    entry_date:
      type: string
      format: date
    entry_kind:
      $ref: "../../openapi.yaml#/components/schemas/JournalEntryKind"
    memo:
      type: string
    metadata:
      type: object
      additionalProperties: true
    postings:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/PostingResponse"
TransactionResponse:
  type: object
  required:
    - id
    - book_id
    - status
    - transaction_kind
    - transaction_date
    - description
    - note_markdown
    - metadata
    - needs_review
    - version_id
    - version_seq
    - tag_ids
    - journal_entries
    - created_at
    - updated_at
    - change_reason
    - invalidated_checkpoint_ids
  properties:
    id:
      type: integer
      format: int64
    book_id:
      type: integer
      format: int64
    correction_of_transaction_id:
      type: integer
      format: int64
    status:
      $ref: "../../openapi.yaml#/components/schemas/TransactionStatus"
    transaction_kind:
      $ref: "../../openapi.yaml#/components/schemas/TransactionKind"
    transaction_date:
      type: string
      format: date
      description: User-facing register display date.
    transaction_day_sequence:
      type: integer
      format: int64
      description: Same-day position within (book_id, transaction_date). Used for ordering and 3-tuple cursor.
    payee_id:
      type: integer
      format: int64
    payee_name:
      type: string
    description:
      type: string
    external_ref_hint:
      type: string
    note_markdown:
      type: string
    metadata:
      type: object
      additionalProperties: true
    needs_review:
      $ref: "../../openapi.yaml#/components/schemas/TransactionNeedsReview"
    version_id:
      type: integer
      format: int64
    version_seq:
      type: integer
      format: int64
    supersedes_version_id:
      type: integer
      format: int64
    tag_ids:
      type: array
      items:
        type: integer
        format: int64
    journal_entries:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/JournalEntryResponse"
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    deleted_at:
      type: string
      format: date-time
      description: Present only while the transaction is soft-deleted.
    change_reason:
      type: string
    system_label:
      type: string
      enum: [split_adjustment, transfer_bridge]
      description: Stable code for a journal the system posted without user text (T-136); the client localizes it. Absent for ordinary journals.
    invalidated_checkpoint_ids:
      type: array
      items:
        type: integer
        format: int64
TransactionsResponse:
  type: object
  required:
    - transactions
    - next_cursor
  properties:
    transactions:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/TransactionResponse"
    next_cursor:
      type:
        - string
        - "null"
AccountRegisterEntryResponse:
  type: object
  required:
    - transaction_id
    - book_id
    - status
    - transaction_kind
    - transaction_date
    - description
    - needs_review
    - version_id
    - version_seq
    - transaction_tag_ids
    - journal_entry_id
    - entry_seq
    - entry_date
    - entry_kind
    - entry_memo
    - posting
    - running_balance
    - created_at
    - updated_at
    - change_reason
  properties:
    transaction_id:
      type: integer
      format: int64
    book_id:
      type: integer
      format: int64
    correction_of_transaction_id:
      type: integer
      format: int64
    status:
      $ref: "../../openapi.yaml#/components/schemas/TransactionStatus"
    transaction_kind:
      $ref: "../../openapi.yaml#/components/schemas/TransactionKind"
    transaction_date:
      type: string
      format: date
      description: User-facing register display date for the parent transaction.
    payee_id:
      type: integer
      format: int64
    payee_name:
      type: string
    description:
      type: string
    external_ref_hint:
      type: string
    needs_review:
      $ref: "../../openapi.yaml#/components/schemas/TransactionNeedsReview"
    version_id:
      type: integer
      format: int64
    version_seq:
      type: integer
      format: int64
    supersedes_version_id:
      type: integer
      format: int64
    transaction_tag_ids:
      type: array
      items:
        type: integer
        format: int64
    journal_entry_id:
      type: integer
      format: int64
    entry_seq:
      type: integer
      format: int64
    entry_date:
      type: string
      format: date
      description: Accounting effective date for this register posting.
    entry_kind:
      $ref: "../../openapi.yaml#/components/schemas/JournalEntryKind"
    entry_memo:
      type: string
    posting:
      $ref: "../../openapi.yaml#/components/schemas/PostingResponse"
    running_balance:
      $ref: "../../openapi.yaml#/components/schemas/BalanceQuantity"
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    change_reason:
      type: string
    system_label:
      type: string
      enum: [split_adjustment, transfer_bridge]
      description: Stable code for a journal the system posted without user text (T-136); the client localizes it. Absent for ordinary journals.
    correction_chain:
      $ref: "../../openapi.yaml#/components/schemas/RegisterCorrectionChain"
RegisterCorrectionChain:
  type: object
  description: >-
    Present when the row's transaction belongs to a correction chain of more
    than one transaction (T-120). The original, reversal and replacement stay
    separate posted rows, so the running balance counts each posting once;
    every row carries the whole chain, so members on other register pages are
    still named.
  required:
    - root_transaction_id
    - role
    - effective_transaction_id
    - net_effect
    - members
  properties:
    root_transaction_id:
      type: integer
      format: int64
    role:
      $ref: "../../openapi.yaml#/components/schemas/RegisterCorrectionRole"
    effective_transaction_id:
      type:
        - integer
        - "null"
      format: int64
      description: The chain's current effective transaction; null when the chain ends in a pure reversal.
    net_effect:
      $ref: "../../openapi.yaml#/components/schemas/RegisterCorrectionAmount"
    members:
      type: array
      description: Every chain transaction in creation order.
      items:
        $ref: "../../openapi.yaml#/components/schemas/RegisterCorrectionMember"
RegisterCorrectionRole:
  type: string
  enum: [original, reversal, replacement]
RegisterCorrectionMember:
  type: object
  required:
    - transaction_id
    - correction_of_transaction_id
    - role
    - transaction_date
    - status
    - deleted
    - reason
    - amount
  properties:
    transaction_id:
      type: integer
      format: int64
    correction_of_transaction_id:
      type:
        - integer
        - "null"
      format: int64
    role:
      $ref: "../../openapi.yaml#/components/schemas/RegisterCorrectionRole"
    transaction_date:
      type: string
      format: date
    status:
      $ref: "../../openapi.yaml#/components/schemas/TransactionStatus"
    deleted:
      type: boolean
    reason:
      type: string
      description: The correcting operation's reason; empty for the original.
    amount:
      description: The member's net in this row's account and commodity; null when it posts nothing here.
      oneOf:
        - $ref: "../../openapi.yaml#/components/schemas/RegisterCorrectionAmount"
        - type: "null"
RegisterCorrectionAmount:
  type: object
  description: Debit-positive exact amount in the row's account and commodity.
  required:
    - quantity_value
    - quantity_scale
  properties:
    quantity_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,37})$'
    quantity_scale:
      type: integer
      minimum: 0
      maximum: 24
AccountRegisterResponse:
  type: object
  required:
    - entries
    - next_cursor
  properties:
    entries:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/AccountRegisterEntryResponse"
    next_cursor:
      type:
        - string
        - "null"
PostingRequest:
  type: object
  required:
    - account_id
    - quantity_value
    - quantity_scale
    - commodity_id
  properties:
    line_key:
      type: string
      description: Server-generated line key from a previous response. Omit for new lines.
    account_id:
      type: integer
      format: int64
    quantity_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,37})$'
    quantity_scale:
      type: integer
      minimum: 0
      maximum: 24
    commodity_id:
      type: integer
      format: int64
    memo:
      type: string
    metadata:
      type: object
      additionalProperties: true
    tag_ids:
      type: array
      items:
        type: integer
        format: int64
  additionalProperties: false
JournalEntryRequest:
  type: object
  properties:
    entry_date:
      type: string
      format: date
      description: Accounting effective date for this balanced journal entry.
    entry_kind:
      $ref: "../../openapi.yaml#/components/schemas/JournalEntryKind"
    memo:
      type: string
    metadata:
      type: object
      additionalProperties: true
    postings:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/PostingRequest"
  additionalProperties: false
TransactionRequest:
  type: object
  properties:
    status:
      $ref: "../../openapi.yaml#/components/schemas/TransactionStatus"
    transaction_kind:
      $ref: "../../openapi.yaml#/components/schemas/TransactionKind"
    transaction_date:
      type: string
      format: date
      description: User-facing register display date.
    payee_id:
      type: integer
      format: int64
    payee_name:
      type: string
    description:
      type: string
    external_ref_hint:
      type: string
    note_markdown:
      type: string
    metadata:
      type: object
      additionalProperties: true
    needs_review:
      $ref: "../../openapi.yaml#/components/schemas/TransactionNeedsReview"
    tag_ids:
      type: array
      items:
        type: integer
        format: int64
    journal_entries:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/JournalEntryRequest"
    change_reason:
      type: string
    reconciliation_override:
      type: boolean
      description: Required when editing reconciled account-side posting facts and accepting checkpoint invalidation.
  additionalProperties: false
TransactionLifecycleRequest:
  type: object
  properties:
    change_reason:
      type: string
    reconciliation_override:
      type: boolean
  additionalProperties: false
MoveRequest:
  type: object
  required:
    - direction
  properties:
    direction:
      type: string
      enum:
        - earlier
        - later
      description: Semantic direction independent of visual sort order.
    reconciliation_override:
      type: boolean
      description: Required when the move would cross an active reconciliation checkpoint boundary; accepts checkpoint invalidation.
  additionalProperties: false
ReconciliationImpactResponse:
  type: object
  required:
    - affected_checkpoints
  properties:
    affected_checkpoints:
      type: array
      description: >
        Complete active checkpoint set the proposed operation would invalidate,
        including later checkpoints, once per checkpoint. Statement fields belong
        to each named checkpoint; entry_date names a triggering posting date.
        Empty when no reconciliation guard applies. Commit rechecks the set against
        current state; a preview is not an override.
      items:
        type: object
        required:
          - checkpoint_id
          - account_id
          - account_label
          - commodity_id
          - commodity_code
          - statement_date
          - statement_account_sequence
          - entry_date
        properties:
          checkpoint_id:
            type: integer
            format: int64
          account_id:
            type: integer
            format: int64
          account_label:
            type: string
            description: Display label for the account (system_role, builtin_key, name, or code — first non-empty in that order). Localise system_role and builtin_key values client-side via Paraglide.
          commodity_id:
            type: integer
            format: int64
          commodity_code:
            type: string
            description: ISO commodity code (e.g. "USD", "EUR", "AAPL").
          statement_date:
            type: string
            format: date
            description: The reconciled-through date of this checkpoint.
          statement_account_sequence:
            type: integer
            format: int64
            description: Inclusive account-register lock boundary on statement_date. A posting on statement_date is inside the reconciled period when its account_day_sequence <= this value.
          entry_date:
            type: string
            format: date
            description: The affected posting's entry date that falls within this checkpoint's reconciled period.
    gain_impact:
      $ref: "../../openapi.yaml#/components/schemas/GainImpact"
DeletedTransactionResponse:
  allOf:
    - $ref: "../../openapi.yaml#/components/schemas/TransactionResponse"
    - type: object
      required:
        - delete_reason
        - restore_blocked_by_reconciliation
      properties:
        delete_reason:
          type: string
          description: Reason recorded at soft-delete time.
        restore_blocked_by_reconciliation:
          type: boolean
          description: True when restoring this posted transaction would cross a reconciliation boundary. Always false for voided transactions.
DeletedTransactionsResponse:
  type: object
  required:
    - transactions
    - next_cursor
  properties:
    transactions:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/DeletedTransactionResponse"
    next_cursor:
      type:
        - string
        - "null"
      description: Opaque deletion-time cursor for the next page (deleted_at DESC, id DESC).
