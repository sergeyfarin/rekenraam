InstitutionKind:
  type: string
  enum:
    - bank
    - credit_union
    - brokerage
    - card_issuer
    - lender
    - insurance
    - employer
    - rewards_program
    - government
    - other
InstitutionResponse:
  type: object
  required:
    - id
    - book_id
    - status
    - name
    - kind
    - address
    - comment_markdown
    - metadata
    - effective_from
    - change_reason
    - created_at
    - updated_at
  properties:
    id:
      type: integer
      format: int64
    book_id:
      type: integer
      format: int64
      description: Current runtime always uses book id 1.
    status:
      type: string
      enum:
        - active
        - archived
    name:
      type: string
      description: User-entered institution name.
      maxLength: 200
    kind:
      $ref: "../../openapi.yaml#/components/schemas/InstitutionKind"
    country_code:
      type: string
      minLength: 2
      maxLength: 2
      description: Optional ISO 3166-1 alpha-2 country code.
    website:
      type: string
      format: uri
      maxLength: 500
    address:
      type: object
      additionalProperties: true
      description: Reserved structured address object. Defaults to {}.
    comment_markdown:
      type: string
      description: User-entered institution notes.
      maxLength: 5000
    metadata:
      type: object
      additionalProperties: true
      description: Reserved structured metadata object. Defaults to {}.
    effective_from:
      type: string
      format: date
      description: Calendar date when this institution version became effective.
    change_reason:
      type: string
      maxLength: 500
      description: Audit reason recorded for this institution version.
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
InstitutionsResponse:
  type: object
  required:
    - institutions
  properties:
    institutions:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/InstitutionResponse"
InstitutionRequest:
  type: object
  required:
    - name
  properties:
    name:
      type: string
      maxLength: 200
    kind:
      $ref: "../../openapi.yaml#/components/schemas/InstitutionKind"
    country_code:
      type: string
      minLength: 2
      maxLength: 2
    website:
      type: string
      format: uri
      maxLength: 500
    address:
      type: object
      additionalProperties: true
      description: Reserved structured address object. Omit for {}.
    comment_markdown:
      type: string
      maxLength: 5000
    metadata:
      type: object
      additionalProperties: true
      description: Reserved structured metadata object. Omit for {}.
    effective_from:
      type: string
      format: date
      description: Omit to use today's date. Future dates are rejected.
    change_reason:
      type: string
      maxLength: 500
      description: Omit to use the default reason for the operation.
  additionalProperties: false
InstitutionUpdateRequest:
  type: object
  description: >-
    Partial update. An omitted field keeps the value of the version in effect
    on effective_from, so an earlier-dated correction changes only the fields
    it sends. To clear an optional field, send an empty string for
    country_code, website or comment_markdown, or {} for address or
    metadata. name and kind cannot be cleared.
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
    kind:
      $ref: "../../openapi.yaml#/components/schemas/InstitutionKind"
    country_code:
      type: string
      maxLength: 2
      description: Two letters, or empty to clear.
    website:
      type: string
      maxLength: 500
      description: An http(s) URL, or empty to clear.
    address:
      type: object
      additionalProperties: true
      description: Reserved structured address object; {} clears it.
    comment_markdown:
      type: string
      maxLength: 5000
      description: Markdown text, or empty to clear.
    metadata:
      type: object
      additionalProperties: true
      description: Reserved structured metadata object; {} clears it.
    effective_from:
      type: string
      format: date
      description: Omit to use today's date. Future dates are rejected.
    change_reason:
      type: string
      maxLength: 500
      description: Omit to use the default reason for the operation.
  additionalProperties: false
InstitutionLifecycleRequest:
  type: object
  properties:
    effective_from:
      type: string
      format: date
      description: Omit to use today's date. Future dates are rejected.
    change_reason:
      type: string
      maxLength: 500
      description: Omit to use the default reason for the lifecycle transition.
  additionalProperties: false
