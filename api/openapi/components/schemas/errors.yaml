ErrorBody:
  type: object
  required:
    - code
    - message
  properties:
    code:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - CSRF_INVALID
        - RATE_LIMITED
        - RESOURCE_BUSY
        - LEDGER_OVERFLOW
        - INVESTMENT_WORKFLOW_REQUIRED
        - RECURRING_TEMPLATE_UNBALANCED
        - RECURRING_SCHEDULE_INVALID
        - RECURRING_TEMPLATE_ARCHIVED
        - SETUP_REQUIRED
        - SETUP_ALREADY_COMPLETE
        - CONFIG_REQUIRED
        - PROVIDER_ERROR
        - EXPORT_SCOPE_UNSUPPORTED
        - QIF_ACCOUNT_UNSUPPORTED
        - INTERNAL_ERROR
    message:
      type: string
ErrorResponse:
  type: object
  required:
    - error
  properties:
    error:
      $ref: "../../openapi.yaml#/components/schemas/ErrorBody"
