ErrorBody:
  type: object
  required:
    - code
    - message
  properties:
    code:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - CSRF_INVALID
        - RATE_LIMITED
        - RESOURCE_BUSY
        - LEDGER_OVERFLOW
        - FORECAST_TOO_LARGE
        - FORECAST_BASIS_CHANGED
        - INVESTMENT_WORKFLOW_REQUIRED
        - INVESTMENT_EVENT_OUT_OF_ORDER
        - TRANSACTION_DRAFT_NOT_USER_CREATABLE
        - TRANSACTION_VERSION_STALE
        - POSTING_ACCOUNT_VERSION_STALE
        - RECURRING_TEMPLATE_UNBALANCED
        - RECURRING_SCHEDULE_INVALID
        - RECURRING_TEMPLATE_ARCHIVED
        - RECURRING_OCCURRENCE_ALREADY_MATERIALIZED
        - SETUP_REQUIRED
        - SETUP_ALREADY_COMPLETE
        - CONFIG_REQUIRED
        - PROVIDER_ERROR
        - EXPORT_SCOPE_UNSUPPORTED
        - QIF_ACCOUNT_UNSUPPORTED
        - INTERNAL_ERROR
    message:
      type: string
ErrorResponse:
  type: object
  required:
    - error
  properties:
    error:
      $ref: "../../openapi.yaml#/components/schemas/ErrorBody"
