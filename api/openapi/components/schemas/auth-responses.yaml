AuthSessionResponse:
  type: object
  required:
    - authenticated
  properties:
    authenticated:
      type: boolean
    user:
      $ref: "../../openapi.yaml#/components/schemas/OwnerResponse"
    csrf_token:
      type: string
      description: Session-bound CSRF token for authenticated mutating requests.
LoginResponse:
  type: object
  description: >-
    Either a completed login (user present) or the instruction to present a
    second factor (mfa_required true). Clients must branch on mfa_required
    rather than assuming a session cookie was set.
  properties:
    user:
      $ref: "../../openapi.yaml#/components/schemas/OwnerResponse"
    mfa_required:
      type: boolean
      description: >-
        True when the password verified but multi-factor authentication is
        still owed. No session cookie is set; a short-lived HttpOnly challenge
        cookie is, and POST /api/v1/auth/login/mfa completes the login.
MFAStatusResponse:
  type: object
  required:
    - status
    - recovery_codes_remaining
    - configured
  properties:
    status:
      type: string
      enum:
        - disabled
        - pending
        - active
      description: >-
        pending means a secret was issued but never confirmed by a code; only
        active gates a login.
    activated_at:
      type: string
      format: date-time
    recovery_codes_remaining:
      type: integer
      description: Unused single-use recovery codes.
    configured:
      type: boolean
      description: >-
        False when REKENRAAM_SECRET_KEY is not set on the server, in which case
        enrollment is refused rather than storing the shared secret in the clear.
MFAEnrollResponse:
  type: object
  required:
    - secret
    - otpauth_uri
  properties:
    secret:
      type: string
      description: Base32 TOTP shared secret, for manual entry. Shown once.
    otpauth_uri:
      type: string
      description: otpauth:// URI for an authenticator app. Shown once.
MFARecoveryCodesResponse:
  type: object
  required:
    - recovery_codes
  properties:
    recovery_codes:
      type: array
      description: >-
        The full replacement set of single-use recovery codes. Displayed once
        and never retrievable again; regenerating invalidates every earlier code.
      items:
        type: string
CreateOwnerResponse:
  type: object
  required:
    - owner
    - setup
  properties:
    owner:
      $ref: "../../openapi.yaml#/components/schemas/OwnerResponse"
    setup:
      $ref: "../../openapi.yaml#/components/schemas/SetupStatusResponse"
AuthenticationEventResponse:
  type: object
  description: >-
    One recorded authentication attempt or session end. Never contains
    password material or session tokens.
  required:
    - id
    - occurred_at
    - event_type
    - outcome
  properties:
    id:
      type: integer
      format: int64
    occurred_at:
      type: string
      format: date-time
    event_type:
      type: string
      enum:
        - login_succeeded
        - login_failed
        - login_blocked
        - logout
    outcome:
      type: string
      enum:
        - success
        - failure
    username:
      type: string
      description: The username that was attempted.
    user_id:
      type: integer
      format: int64
      description: Set when the attempt named an existing user.
    auth_session_id:
      type: integer
      format: int64
      description: >-
        The session created or ended by this event. Becomes absent once the
        session row is cleaned up.
    client_ip:
      type: string
      description: Proxy-aware client address as resolved by the API layer.
    failure_reason:
      type: string
      enum:
        - unknown_user
        - invalid_credentials
        - rate_limited
    request_id:
      type: string
AuthenticationEventsResponse:
  type: object
  required:
    - events
    - has_more
    - failed_last_24h
  properties:
    events:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/AuthenticationEventResponse"
    has_more:
      type: boolean
    failed_last_24h:
      type: integer
      description: >-
        Failed attempts in the last 24 hours. A spike here is the signal an
        operator is looking for, without scanning the list.
TrustedDeviceResponse:
  type: object
  description: >-
    A device holding a login-throttle bypass. The approval token itself is
    never returned; only its hash is stored server-side.
  required:
    - id
    - created_at
    - last_used_at
    - expires_at
    - current
  properties:
    id:
      type: integer
      format: int64
    created_at:
      type: string
      format: date-time
    last_used_at:
      type: string
      format: date-time
    expires_at:
      type: string
      format: date-time
      description: Slides forward on every successful login from this device.
    created_client_ip:
      type: string
      description: Proxy-aware client address the device was approved from.
    current:
      type: boolean
      description: >-
        True for the device making this request, so it is not revoked by
        accident.
TrustedDevicesResponse:
  type: object
  required:
    - devices
  properties:
    devices:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/TrustedDeviceResponse"
