SearchCatalogItem:
  type: object
  required: [kind, id, name, code, builtin_key, starter_key, currency_code, status, account_kind]
  properties:
    kind:
      type: string
      enum: [account, category, instrument, payee]
    id:
      type: integer
      format: int64
      description: Account, category or payee ID, or instrument commodity ID (its page identity).
    name:
      type: string
    code:
      type: string
    builtin_key:
      type: string
      description: Resolve seeded category labels in the active frontend locale.
    starter_key:
      type: [string, 'null']
      description: The starter account key from an account's metadata. Null for other kinds.
    currency_code:
      type: [string, 'null']
      description: The currency code from the starter account's metadata.
    status:
      type: string
      enum: [active, closed, archived]
    account_kind:
      type: string
SearchCatalogResponse:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '../../openapi.yaml#/components/schemas/SearchCatalogItem'
    next_cursor:
      type: string
