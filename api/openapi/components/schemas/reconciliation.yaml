ReconciliationSessionStatus:
  type: string
  enum:
    - open
    - finished
    - voided
ReconciliationCheckpointStatus:
  type: string
  enum:
    - active
    - invalidated
    - voided
ReconciliationSourceKind:
  type: string
  enum:
    - statement
    - online_balance
    - manual_cash_count
    - asset_valuation
    - other
ReconciliationPostingResponse:
  type: object
  required:
    - posting_id
    - transaction_id
    - transaction_version_id
    - posting_line_id
    - account_id
    - commodity_id
    - entry_date
    - quantity_value
    - quantity_scale
    - reconciliation_status
    - selected
  properties:
    posting_id:
      type: integer
      format: int64
    transaction_id:
      type: integer
      format: int64
    transaction_version_id:
      type: integer
      format: int64
    posting_line_id:
      type: integer
      format: int64
    account_id:
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
    entry_date:
      type: string
      format: date
    quantity_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,37})$'
    quantity_scale:
      type: integer
      minimum: 0
      maximum: 24
    reconciliation_status:
      $ref: "../../openapi.yaml#/components/schemas/ReconciliationStatus"
    payee_name:
      type: string
    description:
      type: string
    selected:
      type: boolean
ReconciliationSessionResponse:
  type: object
  required:
    - id
    - book_id
    - account_id
    - commodity_id
    - status
    - source_kind
    - statement_date
    - statement_balance
    - starting_balance
    - selected_balance
    - difference
    - metadata
    - created_at
    - updated_at
    - change_reason
    - candidates
    - selected_postings
  properties:
    id:
      type: integer
      format: int64
    book_id:
      type: integer
      format: int64
    account_id:
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
    status:
      $ref: "../../openapi.yaml#/components/schemas/ReconciliationSessionStatus"
    source_kind:
      $ref: "../../openapi.yaml#/components/schemas/ReconciliationSourceKind"
    statement_date:
      type: string
      format: date
    statement_balance:
      $ref: "../../openapi.yaml#/components/schemas/BalanceQuantity"
    starting_checkpoint_id:
      type: integer
      format: int64
    starting_balance:
      $ref: "../../openapi.yaml#/components/schemas/BalanceQuantity"
    selected_balance:
      $ref: "../../openapi.yaml#/components/schemas/BalanceQuantity"
    difference:
      $ref: "../../openapi.yaml#/components/schemas/BalanceQuantity"
    metadata:
      type: object
      additionalProperties: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    finished_at:
      type: string
      format: date-time
    voided_at:
      type: string
      format: date-time
    change_reason:
      type: string
    candidates:
      type: array
      description: >-
        Posted postings dated on or before the statement date that no covering
        checkpoint links (an active checkpoint or one on an active
        checkpoint's previous-checkpoint chain). A candidate whose
        reconciliation_status is still reconciled was verified by a checkpoint
        that has since been invalidated or voided and needs re-verification;
        it starts selected, like a cleared posting.
      items:
        $ref: "../../openapi.yaml#/components/schemas/ReconciliationPostingResponse"
    selected_postings:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/ReconciliationPostingResponse"
ReconciliationCheckpointResponse:
  type: object
  required:
    - id
    - book_id
    - account_id
    - commodity_id
    - status
    - statement_date
    - statement_balance
    - created_at
  properties:
    id:
      type: integer
      format: int64
    book_id:
      type: integer
      format: int64
    account_id:
      type: integer
      format: int64
    commodity_id:
      type: integer
      format: int64
    session_id:
      type: integer
      format: int64
    previous_checkpoint_id:
      type: integer
      format: int64
    status:
      $ref: "../../openapi.yaml#/components/schemas/ReconciliationCheckpointStatus"
    statement_date:
      type: string
      format: date
    statement_account_sequence:
      type: integer
      format: int64
      description: Inclusive account-register lock boundary on statement_date. A posting on statement_date is inside the reconciled period when its account_day_sequence <= this value.
    statement_balance:
      $ref: "../../openapi.yaml#/components/schemas/BalanceQuantity"
    created_at:
      type: string
      format: date-time
    invalidated_at:
      type: string
      format: date-time
    invalidation_reason:
      type: string
    voided_at:
      type: string
      format: date-time
    void_reason:
      type: string
ReconciliationCheckpointsResponse:
  type: object
  required:
    - checkpoints
  properties:
    checkpoints:
      type: array
      items:
        $ref: "../../openapi.yaml#/components/schemas/ReconciliationCheckpointResponse"
StartReconciliationRequest:
  type: object
  required:
    - commodity_id
    - statement_date
    - statement_balance_value
    - statement_balance_scale
  properties:
    commodity_id:
      type: integer
      format: int64
    source_kind:
      $ref: "../../openapi.yaml#/components/schemas/ReconciliationSourceKind"
    statement_date:
      type: string
      format: date
    statement_balance_value:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,37})$'
    statement_balance_scale:
      type: integer
      minimum: 0
      maximum: 24
    metadata:
      type: object
      additionalProperties: true
    change_reason:
      type: string
  additionalProperties: false
ReconciliationSelectionRequest:
  type: object
  properties:
    posting_version_ids:
      type: array
      items:
        type: integer
        format: int64
    change_reason:
      type: string
  additionalProperties: false
PostingReconciliationStatusRequest:
  type: object
  required:
    - posting_version_ids
    - status
  properties:
    posting_version_ids:
      type: array
      items:
        type: integer
        format: int64
    status:
      type: string
      enum:
        - cleared
        - uncleared
    cleared_on:
      type: string
      format: date
    change_reason:
      type: string
  additionalProperties: false
ReconciliationPolicyResponse:
  type: object
  required: [out_of_date_after_days, updated_at]
  properties:
    out_of_date_after_days:
      type: integer
      minimum: 1
      maximum: 3650
      description: A reconciliation whose statement date is more than this many days before owner-local today is out of date. Default 60.
    updated_at:
      type: [string, 'null']
      format: date-time
      description: Null while the book uses the default it never saved.
ReconciliationPolicyRequest:
  type: object
  required: [out_of_date_after_days]
  additionalProperties: false
  properties:
    out_of_date_after_days:
      type: integer
      minimum: 1
      maximum: 3650
AccountReconciliationState:
  type: string
  enum: [reconciled, out_of_date, never_reconciled, nothing_to_reconcile]
  description: >-
    A reconciliation age on owner-local today (#482), judged per commodity
    because a checkpoint covers one. reconciled: the latest active checkpoint
    dated on or before today is within the window (the boundary day counts as
    within); a statement dated after today never counts. out_of_date: it is
    older. never_reconciled: posted activity dated on or before today but no
    such checkpoint. nothing_to_reconcile: neither, which is never called out
    of date. An account takes its weakest commodity's state (never reconciled,
    then out of date, then reconciled), so one reconciled currency never
    vouches for another.
AccountReconciliation:
  type: object
  required: [state, last_statement_date, commodities]
  properties:
    state:
      $ref: "../../openapi.yaml#/components/schemas/AccountReconciliationState"
    last_statement_date:
      type: [string, 'null']
      format: date
      description: The oldest statement date among the commodities in this state (how far the weakest coverage reaches); null for never_reconciled and nothing_to_reconcile.
    commodities:
      type: array
      description: Per-commodity judgements, weakest first. Empty for nothing_to_reconcile.
      items:
        $ref: "../../openapi.yaml#/components/schemas/CommodityReconciliation"
CommodityReconciliation:
  type: object
  required: [commodity_id, commodity_code, state, last_statement_date]
  properties:
    commodity_id: { type: integer, format: int64 }
    commodity_code: { type: string }
    state:
      $ref: "../../openapi.yaml#/components/schemas/AccountReconciliationState"
    last_statement_date:
      type: [string, 'null']
      format: date
      description: Latest active checkpoint for this commodity dated on or before today; null when there is none.
FoldedAccountReconciliation:
  description: A folded account's judgement (a brokerage's cash or other child, which has no row of its own).
  allOf:
    - $ref: "../../openapi.yaml#/components/schemas/AccountReconciliation"
    - type: object
      required: [account_id]
      properties:
        account_id: { type: integer, format: int64 }
