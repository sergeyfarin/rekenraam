openapi: 3.1.0
info:
  title: Rekenraam API
  version: 0.0.0
paths:
  /api/v1/health:
    get:
      summary: Health check
      responses:
        "200":
          description: Health response
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/auth/session:
    get:
      summary: Read the current browser auth session
      responses:
        "200":
          description: Current session status
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "500":
          description: Internal server error
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/login:
    post:
      summary: Create a browser session for the owner account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Owner logged in
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            Set-Cookie:
              schema:
                type: string
              description: Browser session cookie for the authenticated owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid request body or validation failure
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid username or password
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Origin validation failed
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Owner setup is required before login
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many failed login attempts
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/logout:
    post:
      summary: Revoke the current browser session
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
          description: Session-bound CSRF token for authenticated mutating requests.
      responses:
        "204":
          description: Session revoked
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            Set-Cookie:
              schema:
                type: string
              description: Clearing browser session cookie.
        "401":
          description: Authentication is required
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Origin or CSRF validation failed
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/setup/status:
    get:
      summary: Read coarse setup progress
      responses:
        "200":
          description: Setup progress
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatusResponse"
        "500":
          description: Internal server error
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/setup/owner:
    post:
      summary: Create the single owner account during first-run setup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOwnerRequest"
      responses:
        "201":
          description: Owner created and setup advanced to the next step
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            Set-Cookie:
              schema:
                type: string
              description: Browser session cookie for the newly created owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOwnerResponse"
        "400":
          description: Invalid request body or validation failure
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Origin validation failed
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Owner setup is already complete
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/setup/book:
    post:
      summary: Create the single owner book during setup
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
          description: Session-bound CSRF token for authenticated mutating requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookRequest"
      responses:
        "201":
          description: Book created and setup advanced to the next step
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateBookResponse"
        "400":
          description: Invalid request body or validation failure
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication is required
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Origin or CSRF validation failed
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Book already exists
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/books/current:
    get:
      summary: Read the current single owner book
      responses:
        "200":
          description: Current book
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"
        "401":
          description: Authentication is required
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Book not found
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/currencies/catalog:
    get:
      summary: Read the embedded setup currency catalog
      responses:
        "200":
          description: Embedded catalog currencies
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrencyCatalogResponse"
        "401":
          description: Authentication is required
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/currencies:
    get:
      summary: List current currency commodities
      responses:
        "200":
          description: Current currencies
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrenciesResponse"
        "401":
          description: Authentication is required
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Add a catalog currency to the current book
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
          description: Session-bound CSRF token for authenticated mutating requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCurrencyRequest"
      responses:
        "201":
          description: Currency created
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrencyResponse"
        "400":
          description: Invalid request body or validation failure
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication is required
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Origin or CSRF validation failed
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Catalog currency not found
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Currency already exists
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/currencies/{commodity_id}/default:
    post:
      summary: Set the book default currency preference
      parameters:
        - in: path
          name: commodity_id
          required: true
          schema:
            type: integer
            format: int64
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
          description: Session-bound CSRF token for authenticated mutating requests.
      responses:
        "200":
          description: Default currency updated
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetDefaultCurrencyResponse"
        "400":
          description: Invalid request
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication is required
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Origin or CSRF validation failed
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Currency not found
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/setup/currencies:
    post:
      summary: Create setup currencies and choose the book default currency
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
          description: Session-bound CSRF token for authenticated mutating requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteCurrencySetupRequest"
      responses:
        "201":
          description: Currencies created and setup advanced to the next step
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteCurrencySetupResponse"
        "400":
          description: Invalid request body or validation failure
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication is required
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Origin or CSRF validation failed
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Currency or book not found
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Currency setup is already complete
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  headers:
    XRequestID:
      description: Server-generated request identifier for this response.
      schema:
        type: string
        format: uuid
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: Username for the single owner account.
          maxLength: 64
        password:
          type: string
          description: Password for the single owner account.
          maxLength: 1024
      additionalProperties: false
    SetupStep:
      type: object
      required:
        - key
        - status
      properties:
        key:
          type: string
          enum:
            - owner
            - book
            - currencies
            - system_accounts
            - categories
        status:
          type: string
          enum:
            - pending
            - completed
    SetupStatusResponse:
      type: object
      required:
        - completed
        - install_state
        - implemented_steps
        - steps
      properties:
        completed:
          type: boolean
        current_step:
          type: string
          enum:
            - owner
            - book
            - currencies
            - system_accounts
            - categories
        install_state:
          type: string
          enum:
            - fresh
            - configured
            - recovery_required
        implemented_steps:
          type: array
          items:
            type: string
            enum:
              - owner
              - book
              - currencies
        blocking_step:
          type: string
          enum:
            - owner
        steps:
          type: array
          items:
            $ref: "#/components/schemas/SetupStep"
    CreateOwnerRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: Username for the single owner account. Must be 1–64 bytes, no control characters.
          maxLength: 64
        password:
          type: string
          description: Password for the single owner account. Minimum 12 Unicode characters, maximum 1024 bytes.
          minLength: 12
          maxLength: 1024
      additionalProperties: false
    OwnerResponse:
      type: object
      required:
        - id
        - username
      properties:
        id:
          type: integer
        username:
          type: string
    BookResponse:
      type: object
      required:
        - id
        - owner_user_id
        - code
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          description: Current runtime always uses book id 1.
        owner_user_id:
          type: integer
          format: int64
        code:
          type: string
          description: Stable internal code for the single owner book.
          maxLength: 64
        name:
          type: string
          description: User-visible book name.
          maxLength: 200
        default_currency_commodity_id:
          type: integer
          format: int64
          nullable: true
          description: Default currency preference for new currency-sensitive UI and accounts. It is not a reporting/base currency.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateBookRequest:
      type: object
      required:
        - name
      properties:
        code:
          type: string
          description: Optional stable code. Defaults to personal. Lowercase letters, numbers, underscores, and hyphens only.
          maxLength: 64
        name:
          type: string
          description: User-visible book name.
          maxLength: 200
      additionalProperties: false
    CreateBookResponse:
      type: object
      required:
        - book
        - setup
      properties:
        book:
          $ref: "#/components/schemas/BookResponse"
        setup:
          $ref: "#/components/schemas/SetupStatusResponse"
    CurrencyCatalogEntry:
      type: object
      required:
        - code
        - symbol
        - english_name
        - standard_scale
        - max_quantity_scale
      properties:
        code:
          type: string
          minLength: 3
          maxLength: 3
        symbol:
          type: string
        english_name:
          type: string
          description: English fallback from the embedded catalog. Frontend locale formatting should provide the displayed translated name.
        standard_scale:
          type: integer
          minimum: 0
          maximum: 12
        max_quantity_scale:
          type: integer
          minimum: 0
          maximum: 12
    CurrencyCatalogResponse:
      type: object
      required:
        - currencies
      properties:
        currencies:
          type: array
          items:
            $ref: "#/components/schemas/CurrencyCatalogEntry"
    CurrencyResponse:
      type: object
      required:
        - id
        - book_id
        - code
        - name
        - symbol
        - display_symbol
        - status
        - standard_scale
        - max_quantity_scale
        - is_builtin
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        book_id:
          type: integer
          format: int64
          description: Current runtime always uses book id 1.
        code:
          type: string
          minLength: 3
          maxLength: 3
        name:
          type: string
          description: Stored display name snapshot supplied by the frontend locale or catalog fallback.
          maxLength: 200
        symbol:
          type: string
        display_symbol:
          type: string
        status:
          type: string
          enum:
            - active
            - archived
        standard_scale:
          type: integer
          minimum: 0
          maximum: 12
        max_quantity_scale:
          type: integer
          minimum: 0
          maximum: 12
        is_builtin:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CurrenciesResponse:
      type: object
      required:
        - currencies
      properties:
        currencies:
          type: array
          items:
            $ref: "#/components/schemas/CurrencyResponse"
    CreateCurrencyRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          minLength: 3
          maxLength: 3
        name:
          type: string
          description: Display name snapshot supplied by the frontend locale. Falls back to catalog English if omitted.
          maxLength: 200
      additionalProperties: false
    CurrencySetupSelection:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          minLength: 3
          maxLength: 3
        name:
          type: string
          description: Display name snapshot supplied by the frontend locale. Falls back to catalog English if omitted.
          maxLength: 200
      additionalProperties: false
    CompleteCurrencySetupRequest:
      type: object
      required:
        - default_currency_code
        - currencies
      properties:
        default_currency_code:
          type: string
          minLength: 3
          maxLength: 3
          description: Default currency preference for new currency-sensitive UI and accounts. It is not a reporting/base currency.
        currencies:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CurrencySetupSelection"
      additionalProperties: false
    CompleteCurrencySetupResponse:
      type: object
      required:
        - currencies
        - default_currency
        - setup
      properties:
        currencies:
          type: array
          items:
            $ref: "#/components/schemas/CurrencyResponse"
        default_currency:
          $ref: "#/components/schemas/CurrencyResponse"
        setup:
          $ref: "#/components/schemas/SetupStatusResponse"
    SetDefaultCurrencyResponse:
      type: object
      required:
        - default_currency
      properties:
        default_currency:
          $ref: "#/components/schemas/CurrencyResponse"
    AuthSessionResponse:
      type: object
      required:
        - authenticated
      properties:
        authenticated:
          type: boolean
        user:
          $ref: "#/components/schemas/OwnerResponse"
        csrf_token:
          type: string
          description: Session-bound CSRF token for authenticated mutating requests.
    LoginResponse:
      type: object
      required:
        - user
      properties:
        user:
          $ref: "#/components/schemas/OwnerResponse"
    CreateOwnerResponse:
      type: object
      required:
        - owner
        - setup
      properties:
        owner:
          $ref: "#/components/schemas/OwnerResponse"
        setup:
          $ref: "#/components/schemas/SetupStatusResponse"
    ErrorBody:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - CSRF_INVALID
            - RATE_LIMITED
            - RESOURCE_BUSY
            - SETUP_REQUIRED
            - SETUP_ALREADY_COMPLETE
            - INTERNAL_ERROR
        message:
          type: string
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
