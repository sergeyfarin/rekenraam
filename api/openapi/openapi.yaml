components:
  responses:
    JSONBodyTooLarge:
      description: >-
        REQUEST_TOO_LARGE — the JSON request body exceeds 1 MiB (1,048,576 bytes),
        including trailing whitespace. No application mutation is performed.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/XRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: REQUEST_TOO_LARGE
              message: request body must not exceed 1 MB
  securitySchemes:
    CookieSession:
      type: apiKey
      in: cookie
      name: __Host-rekenraam_session
      description: Owner browser session; loopback HTTP uses rekenraam_session. Mutations require Origin and X-CSRF-Token.
    PersonalAccessToken:
      type: http
      scheme: bearer
      bearerFormat: rr_pat_ followed by 43 base64url characters
      description: >-
        Read-only scoped owner API credential. Supported operations declare
        x-personal-access-token-scope. All other routes refuse Bearer access,
        including token management. Any Authorization header selects this
        authentication method without cookie fallback. Invalid/expired/revoked
        tokens return 401; missing scope returns 403. See
        docs/plans/personal-access-tokens-plan.md for the exact allowlist.
  headers:
    XRequestID:
      description: Server-generated request identifier for this response.
      schema:
        type: string
        format: uuid
  parameters:
