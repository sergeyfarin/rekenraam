name: Operational Self-Hosting

on:
  push:
    paths:
      - ".github/workflows/operational-self-hosting.yml"
      - "apps/api/**"
      - "src/**"
      - "docker/**"
      - "scripts/**"
      - "compose.yaml"
      - "compose.public.yaml"
      - "compose.proxy.yaml"
      - "Dockerfile.app"
      - "Makefile"
      - "package*.json"
  pull_request:
    paths:
      - ".github/workflows/operational-self-hosting.yml"
      - "apps/api/**"
      - "src/**"
      - "docker/**"
      - "scripts/**"
      - "compose.yaml"
      - "compose.public.yaml"
      - "compose.proxy.yaml"
      - "Dockerfile.app"
      - "Makefile"
      - "package*.json"

jobs:
  deployment-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Frontend install
        run: make web-install

      - name: Frontend check
        run: make web-check

      - name: Frontend build
        run: make web-build

      - name: Operational smoke
        run: make operational-self-hosting-smoke
