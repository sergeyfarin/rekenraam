name: API Tests

on:
  push:
    paths:
      - ".github/workflows/api-tests.yml"
      - "apps/api/**"
      - "compose.test.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
  pull_request:
    paths:
      - ".github/workflows/api-tests.yml"
      - "apps/api/**"
      - "compose.test.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"

# Toolchain pins live in pyproject.toml / uv.lock. This workflow installs from
# the lockfile so what runs in CI matches what runs locally via `uv sync`.

jobs:
  api-tests:
    name: compile, lint, typecheck, pytest coverage
    runs-on: ubuntu-latest

    env:
      # V1 ships and gates on the single-container SQLite path. Postgres
      # remains available behind explicit post-v1 compatibility targets.
      REPOSITORY_DB_BACKENDS: sqlite
      API_E2E_DB_BACKEND: sqlite

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python and project dependencies
        run: uv sync --frozen

      - name: Expose venv on PATH
        run: echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"

      - name: Compile check
        run: make api-check

      - name: Ruff check
        run: make api-lint

      - name: Ruff format check
        run: make api-format-check

      - name: Pyright (strict)
        run: make api-typecheck

      # Phase 2 step 9 (2026-05-09) cleared the deselect list: 6 tests were
      # fixed, 2 were marked @pytest.mark.skip(reason=...) in source with a
      # forward-pointer to where the work resumes. CI now runs the full suite
      # with no quarantine flags. Any new failure is a real regression.
      - name: Pytest with coverage
        run: make api-test-coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: |
            apps/api/coverage.xml
            apps/api/.coverage_html/
          retention-days: 14
