name: API Tests

on:
  push:
    paths:
      - ".github/workflows/api-tests.yml"
      - "apps/api/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
  pull_request:
    paths:
      - ".github/workflows/api-tests.yml"
      - "apps/api/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"

# Toolchain pins live in pyproject.toml / uv.lock. This workflow installs from
# the lockfile so what runs in CI matches what runs locally via `uv sync`.

jobs:
  api-tests:
    name: lint, typecheck, pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rekenraam
          POSTGRES_USER: rekenraam
          POSTGRES_PASSWORD: rekenraam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rekenraam -d rekenraam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # The repository tests + e2e tests pick up Postgres credentials from
      # these TEST_POSTGRES_* env vars; the existing `make api-test-postgres`
      # uses the same convention.
      TEST_POSTGRES_HOST: 127.0.0.1
      TEST_POSTGRES_PORT: 5432
      TEST_POSTGRES_USER: rekenraam
      TEST_POSTGRES_PASSWORD: rekenraam
      TEST_POSTGRES_ADMIN_DB: rekenraam

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python and project dependencies
        run: uv sync --frozen

      - name: Expose venv on PATH
        run: echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"

      - name: Ruff check
        run: make api-lint

      # ruff format is intentionally NOT enforced yet: 70+ existing files would
      # need reformatting and that bulk change should land as a single
      # focused PR. Tracked in TODO.md.

      - name: Pyright (strict)
        run: make api-typecheck

      # Phase 2 step 9 (2026-05-09) cleared the deselect list: 6 tests were
      # fixed, 2 were marked @pytest.mark.skip(reason=...) in source with a
      # forward-pointer to where the work resumes. CI now runs the full suite
      # with no quarantine flags. Any new failure is a real regression.
      - name: Pytest
        working-directory: apps/api
        run: pytest -q
