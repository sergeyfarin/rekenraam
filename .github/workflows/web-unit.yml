name: Web Unit Tests

on:
  push:
    paths:
      - ".github/workflows/web-unit.yml"
      - "src/**"
      - "static/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "svelte.config.*"
      - "vitest.config.*"
      - "tsconfig.json"
      - "components.json"
  pull_request:
    paths:
      - ".github/workflows/web-unit.yml"
      - "src/**"
      - "static/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "svelte.config.*"
      - "vitest.config.*"
      - "tsconfig.json"
      - "components.json"

# Web-unit is the gating job for FE PRs. Cheap (~30s) and runs on every PR.
# E2E (Playwright + compose stack) lives in web-e2e.yml and is label-gated;
# see docs/product/phase-3-plan.md §A3 for the split rationale.

jobs:
  web-unit:
    name: typecheck + vitest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: svelte-check
        run: npm run check

      - name: vitest
        run: npm test
