name: CodeQL

# Replaces GitHub's default code-scanning setup. Default setup gives no
# control over the toolchain: it builds Go with whatever version the runner
# preinstalls under GOTOOLCHAIN=local, so the Go 1.27 bump in backend/go.mod
# broke extraction ("go.mod requires go >= 1.27.0, running go 1.26.6"). Pinning
# the toolchain here with go-version-file keeps this workflow following
# backend/go.mod the way ci.yml and govulncheck.yml already do.
#
# The Go entry is nonetheless paused right now — see the matrix note below.
# The setup-go step is kept so restoring it is a two-line uncomment.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          # DISABLED 2026-08-23 — CodeQL's Go extractor is itself built with
          # Go 1.26 and cannot parse a 1.27 module: every backend package fails
          # with "package requires newer Go version go1.27 (application built
          # with go1.26)", yielding a partial database and a red job. Go has no
          # build-mode: none to fall back on, and 2.26.3 is the newest bundle.
          # govulncheck.yml still covers known CVEs in dependencies meanwhile.
          # RESTORE these two lines once a CodeQL release extracts Go 1.27.
          # - language: go
          #   build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      # Go only. Must precede init: the extractor runs during analyze and
      # needs the go.mod toolchain already on PATH.
      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version-file: backend/go.mod

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
