name: CI

# One full run per validation context (#383): pushes to main, pull requests
# (GitHub's merge ref against the base) and manual dispatch. Other branch pushes
# do not run on their own; open a pull request or dispatch the workflow on the
# branch. Event-level filters only: a path filter or job `if:` would leave the
# required checks pending. scripts/test-ci-events.py pins this policy.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer run in the same context cancels the in-flight one: the next main push,
# the next push to a pull request's head (refs/pull/N/merge) or the next
# dispatch on the same branch. Contexts never cancel one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The shared wrappers enable FTS5/netgo/osusergo and check the runner C compiler.
env:
  CGO_ENABLED: "1"

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-cache
        id: go-cache
        with:
          workload: race
      - name: Check Go cache configuration
        run: python3 scripts/test-ci-go-cache.py
      - name: Check CI event policy
        run: python3 scripts/test-ci-events.py
      - name: Check release artifact contract
        run: python3 scripts/test-release-artifacts.py
      - name: Run backend tests
        # Shared local/CI gate: race detector, parallel tests inside each
        # package, two packages concurrently, 5m per package (ADR 0016, #164).
        run: ./scripts/test-backend.sh
      - name: Save refreshed Go cache
        if: steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.go-cache.outputs.key }}
          path: |
            ${{ steps.go-cache.outputs.gocache }}
            ${{ steps.go-cache.outputs.gomodcache }}

  backend-coverage:
    name: Backend Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-cache
        id: go-cache
        with:
          workload: coverage
      - name: Run backend tests with coverage
        # pipefail: without it, tee's exit status would hide a failing suite.
        run: |
          set -o pipefail
          COVERAGE=1 ./scripts/test-backend.sh | tee coverage-summary.txt
      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-profile
          path: backend/coverage.out
      - name: Report and enforce the coverage floor
        run: ./scripts/check-coverage-floor.sh coverage-summary.txt
      - name: Save refreshed Go cache
        if: steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.go-cache.outputs.key }}
          path: |
            ${{ steps.go-cache.outputs.gocache }}
            ${{ steps.go-cache.outputs.gomodcache }}

  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - uses: pnpm/action-setup@v6.1.1
        with:
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend check
        run: ./scripts/test-frontend.sh
      - name: Check and build public website
        run: pnpm website:check && pnpm website:build

  e2e-smoke:
    name: E2E Smoke (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [app, audits]
    env:
      E2E_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-cache
        id: go-cache
        with:
          workload: e2e-${{ matrix.suite }}
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - uses: pnpm/action-setup@v6.1.1
        with:
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        # Each phase has a deadline and one retry (#415); this is the backstop.
        timeout-minutes: 15
        run: ./scripts/ci-install-chromium.sh
      # The suite builds the single binary once and boots one instance per
      # worker, each against its own throwaway SQLite file; see
      # e2e/playwright/support/fixtures.ts. release-preflight stays out of this
      # job and runs before a release.
      - name: Run browser smoke journeys
        run: ./scripts/test-e2e-smoke.sh
      - name: Save refreshed Go cache
        if: steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.go-cache.outputs.key }}
          path: |
            ${{ steps.go-cache.outputs.gocache }}
            ${{ steps.go-cache.outputs.gomodcache }}
      - name: Upload browser timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-timings-${{ matrix.suite }}
          path: e2e/timing-results/
          retention-days: 7
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.suite }}
          path: |
            e2e/playwright-report
            e2e/test-results
            backend/var/e2e/*/app.log
          retention-days: 7

  app-build:
    name: Integrated Build
    runs-on: ubuntu-latest
    # Independent validation: building need not wait for other checks.
    # Every CI job remains required for the overall workflow to pass.
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go-cache
        id: go-cache
        with:
          workload: build
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - uses: pnpm/action-setup@v6.1.1
        with:
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build single binary
        run: pnpm build
      - name: Save refreshed Go cache
        if: steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.go-cache.outputs.key }}
          path: |
            ${{ steps.go-cache.outputs.gocache }}
            ${{ steps.go-cache.outputs.gomodcache }}
