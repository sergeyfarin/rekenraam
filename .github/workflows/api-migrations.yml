name: API Migrations

on:
  push:
    paths:
      - ".github/workflows/api-migrations.yml"
      - "apps/api/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
  pull_request:
    paths:
      - ".github/workflows/api-migrations.yml"
      - "apps/api/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  migration-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python and project dependencies
        run: uv sync --frozen

      - name: Run SQLite migration smoke
        run: make api-migrate-smoke
