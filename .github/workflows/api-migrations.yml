name: API Migrations

on:
  push:
    paths:
      - ".github/workflows/api-migrations.yml"
      - "apps/api/**"
      - "compose.yaml"
      - "compose.dev.yaml"
      - "compose.test.yaml"
      - "Makefile"
  pull_request:
    paths:
      - ".github/workflows/api-migrations.yml"
      - "apps/api/**"
      - "compose.yaml"
      - "compose.dev.yaml"
      - "compose.test.yaml"
      - "Makefile"

jobs:
  migration-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run SQLite migration smoke
        run: make api-migrate-smoke
