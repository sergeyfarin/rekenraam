name: Release Preflight

# The serial release-preflight journeys stay out of push CI (see the E2E Smoke
# job in ci.yml), but unrun they drifted for months behind a stale selector
# (#306). Weekly keeps them honest before a release needs them.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-preflight:
    name: Release Preflight Journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - uses: pnpm/action-setup@v6.1.0
        with:
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        # Each phase has a deadline and one retry (#415); this is the backstop.
        timeout-minutes: 15
        run: ./scripts/ci-install-chromium.sh
      - name: Run release preflight journeys
        run: ./scripts/test-release-preflight.sh
      - name: Upload browser timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-preflight-timings
          path: e2e/timing-results/
          retention-days: 7
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-preflight-report
          path: |
            e2e/playwright-report
            e2e/test-results
            backend/var/e2e/*/app.log
          retention-days: 7
