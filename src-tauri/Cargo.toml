[package]
name = "rekenraam"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rekenraam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
tauri = { version = "2.11.0", features = [] }
dirs-next = "2"
# Use rfd for native file/folder dialogs
rfd = "0.17.2"
# used for debounced sleep in background task
tokio = { version = "1.52.1", features = ["time", "macros", "rt"] }
tauri-plugin-opener = "2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.39.0", features = ["bundled", "functions"] }
csv = "1.3"
sha2 = "0.11.0"
reqwest = { version = "0.13.3", features = ["json", "rustls"] }
async-trait = "0.1"
chrono = { version = "0.4.44" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2.5"
calamine = "0.34.0"

[dev-dependencies]
rust_xlsxwriter = "0.94.0"

