packages:
  - frontend
  - e2e

minimumReleaseAgeExclude:
  - '@inlang/sdk@3.0.1'
  - '@lix-js/sdk-darwin-arm64@0.12.2'
  - '@lix-js/sdk-linux-arm64@0.12.2'
  - '@lix-js/sdk-linux-x64@0.12.2'
  - '@lix-js/sdk-win32-x64@0.12.2'
  - '@lix-js/sdk@0.12.2'
  - '@lucide/svelte@1.44.0'
  - vite@8.3.0

overrides:
  # Security pin — holds a transitive dep above a vulnerable range.
  # Verify with `pnpm audit` before removing: dropping it regresses.
  # cookie 2.x renames parse/serialize to parseCookie/stringifySetCookie, which
  # the SvelteKit runtime still imports under the old names — hold at 1.x.
  cookie: 1.1.1 # GHSA-pxg6-pf52-xh8x; without this, 0.6.0 resolves
